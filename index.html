{id:"CC49",s:"chem",u:8,q:"Il numero di gruppi carbossilici liberi nel dipeptide Glu-Gly è ……",c:["2","due"],n:2,e:"Un carbossile della catena laterale del Glu più il carbossile C-terminale della Gly; il carbossile α del Glu è impegnato nel legame peptidico."},
{id:"CC50",s:"chem",u:8,q:"La forma ciclica a sei termini del glucosio si chiama glucopiranosio; quella a cinque termini del fruttosio si chiama fruttofuranosio. In entrambi i casi l'anello si forma per reazione intramolecolare di tipo ……",c:["emiacetalico","emichetalico","emiacetale","emichetale","emiacetalica","emichetalica"],e:"Il glucosio (aldoso) forma un emiacetale, il fruttosio (chetoso) un emichetale."}
);

// CHIMICA — espansione 1 (unità 1-5) — domande originali
BANK.push(
{id:"C205",s:"chem",u:1,q:"Una sostanza pura che non può essere scomposta in sostanze più semplici con metodi chimici è:",o:["un elemento","un composto","una miscela omogenea","una soluzione","un colloide"],e:"Un composto può essere scomposto chimicamente negli elementi che lo formano; le miscele si separano con metodi fisici."},
{id:"C206",s:"chem",u:1,q:"Due atomi isobari hanno:",o:["lo stesso numero di massa ma diverso numero atomico","lo stesso numero atomico ma diverso numero di massa","lo stesso numero di neutroni ma diverso numero atomico","lo stesso numero atomico e lo stesso numero di massa","la stessa configurazione elettronica esterna"],e:"Esempio: ¹⁴C e ¹⁴N. Gli isotopi hanno invece lo stesso Z; gli isotoni lo stesso numero di neutroni."},
{id:"C207",s:"chem",u:1,q:"Lo ione K⁺ (Z = 19) possiede:",o:["19 protoni e 18 elettroni, come l'argon","19 protoni e 20 elettroni, come il calcio","18 protoni e 18 elettroni, come l'argon","19 protoni e 18 elettroni, come il neon","20 protoni e 19 elettroni, come il potassio"],e:"Perdendo l'elettrone 4s il potassio raggiunge la configurazione del gas nobile precedente: 1s² 2s² 2p⁶ 3s² 3p⁶."},
{id:"C208",s:"chem",u:1,q:"La massa atomica relativa di un elemento riportata nella tavola periodica è:",o:["la media delle masse dei suoi isotopi, pesata sulle abbondanze","la media aritmetica delle masse dei suoi isotopi naturali","la massa del suo isotopo più abbondante, arrotondata","la somma delle masse di protoni ed elettroni","il numero di massa del suo isotopo più pesante"],e:"Per questo il cloro ha massa atomica 35,45 (circa 75% di ³⁵Cl e 25% di ³⁷Cl)."},
{id:"C209",s:"chem",u:1,q:"Quale combinazione di numeri quantici (n, l, mₗ) NON è possibile?",o:["n = 2, l = 2, mₗ = 0","n = 3, l = 2, mₗ = −2","n = 2, l = 1, mₗ = 1","n = 1, l = 0, mₗ = 0","n = 4, l = 3, mₗ = 3"],e:"l può assumere valori da 0 a n − 1: con n = 2, l può essere solo 0 o 1."},
{id:"C210",s:"chem",u:1,q:"Gli orbitali degeneri sono orbitali che:",o:["hanno la stessa energia","hanno forme diverse e energie diverse","contengono elettroni con lo stesso spin","appartengono ad atomi diversi","sono vuoti"],e:"Ad esempio i tre orbitali 2p di un atomo isolato hanno la stessa energia."},
{id:"C211",s:"chem",u:1,q:"Un elemento con configurazione esterna 3s² 3p⁴ appartiene:",o:["al gruppo 16, terzo periodo (è lo zolfo)","al gruppo 14, terzo periodo (è il silicio)","al gruppo 16, secondo periodo (è l'ossigeno)","al gruppo 4, terzo periodo (è il titanio)","al gruppo 18, terzo periodo (è l'argon)"],e:"Sei elettroni di valenza → gruppo 16 (calcogeni); il numero quantico principale 3 indica il terzo periodo."},
{id:"C212",s:"chem",u:1,q:"Gli elementi del blocco f della tavola periodica sono:",o:["i lantanidi e gli attinidi","i metalli alcalini","i gas nobili","gli alogeni","i metalli di transizione del quarto periodo"],e:"Il blocco s comprende i gruppi 1-2, il blocco p i gruppi 13-18, il blocco d i metalli di transizione."},
{id:"C213",s:"chem",u:1,q:"Tra i seguenti elementi, quello con la più alta energia di prima ionizzazione è:",o:["l'elio","il litio","il sodio","l'ossigeno","il cesio"],e:"L'energia di ionizzazione cresce lungo il periodo e diminuisce lungo il gruppo: i gas nobili, e l'elio in particolare, hanno i valori più alti."},
{id:"C214",s:"chem",u:1,q:"Tra i metalli alcalini, la reattività con l'acqua:",o:["aumenta scendendo lungo il gruppo","diminuisce scendendo lungo il gruppo","è uguale per tutti","è nulla","è massima per il litio"],e:"Scendendo nel gruppo l'elettrone di valenza è sempre più lontano dal nucleo e si perde più facilmente."},
{id:"C215",s:"chem",u:1,q:"Quale proprietà NON è tipica dei composti ionici?",o:["Conducono la corrente elettrica allo stato solido","Hanno punti di fusione generalmente elevati","Sono duri ma fragili se sottoposti a urti","Conducono la corrente elettrica allo stato fuso","Sono spesso solubili in solventi polari come l'acqua"],e:"Nel solido gli ioni sono bloccati nel reticolo; conducono solo quando gli ioni sono liberi di muoversi (fusi o in soluzione)."},
{id:"C216",s:"chem",u:1,q:"Le forze di dispersione di London sono le uniche forze intermolecolari presenti tra:",o:["molecole di I₂","molecole di H₂O","molecole di NH₃","molecole di HF","ioni Na⁺ e Cl⁻"],e:"Le molecole apolari interagiscono solo tramite dipoli istantanei indotti; queste forze aumentano con la massa e la polarizzabilità della molecola."},
{id:"C217",s:"chem",u:1,q:"Il punto di ebollizione dell'acqua (100 °C) è molto più alto di quello di H₂S (−60 °C) perché:",o:["tra le molecole d'acqua si formano legami a idrogeno","l'acqua ha massa molare maggiore di quella di H₂S","H₂S è una molecola apolare con legami ionici","tra le molecole di H₂S si formano legami a idrogeno più deboli","l'acqua ha una geometria lineare, H₂S angolare"],e:"Lo zolfo è poco elettronegativo e non forma legami a idrogeno significativi, anche se H₂S ha massa molare maggiore."},
{id:"C218",s:"chem",u:1,q:"Una sostanza che si scioglie in esano ma non in acqua è:",o:["apolare","ionica","fortemente polare","un acido forte","un sale"],e:"Il simile scioglie il simile: l'esano è un solvente apolare."},
{id:"C219",s:"chem",u:1,q:"La lunghezza dei legami carbonio-carbonio segue l'ordine:",o:["triplo < doppio < semplice","semplice < doppio < triplo","doppio < semplice < triplo","sono tutti uguali","triplo < semplice < doppio"],e:"Più coppie elettroniche condivise avvicinano di più i nuclei: il legame triplo è il più corto e il più forte."},
{id:"C220",s:"chem",u:1,q:"Nella molecola di N₂ i due atomi sono uniti da:",o:["un legame triplo (un legame σ e due π)","un legame triplo (tre legami σ)","un legame doppio (un legame σ e un π)","un legame triplo (due legami σ e un π)","un legame doppio (due legami π)"],e:"Ogni azoto ha 5 elettroni di valenza: condividendone 3 raggiunge l'ottetto. Il triplo legame spiega la scarsa reattività dell'N₂."},
{id:"C221",s:"chem",u:1,q:"Secondo la teoria VSEPR, la molecola di NH₃ ha geometria:",o:["piramidale trigonale","trigonale planare","tetraedrica con quattro atomi legati","lineare","angolare"],e:"Tre coppie di legame e una coppia solitaria hanno disposizione tetraedrica; la forma della molecola è una piramide con angoli di circa 107°."},
{id:"C222",s:"chem",u:1,q:"La molecola di BF₃ ha geometria:",o:["trigonale planare con angoli di 120°","piramidale con angoli di circa 107°","tetraedrica con angoli di 109,5°","trigonale planare con angoli di 109,5°","a T con angoli di circa 90°"],e:"Il boro ha tre coppie di legame e nessuna coppia solitaria (ibridazione sp²). Avendo l'ottetto incompleto, BF₃ è un acido di Lewis."},
{id:"C223",s:"chem",u:1,q:"Nella molecola di etino (C₂H₂) il numero totale di legami σ e π è:",o:["3 σ e 2 π","5 σ","2 σ e 3 π","4 σ e 1 π","1 σ e 2 π"],e:"Due legami C−H σ, più il triplo legame C≡C formato da 1 σ e 2 π."},
{id:"C224",s:"chem",u:1,q:"Il nome tradizionale di HNO₂ è:",o:["acido nitroso","acido nitrico","nitrito di idrogeno idrato","acido iponitroso","ammoniaca"],e:"HNO₃ è l'acido nitrico (N +5), HNO₂ l'acido nitroso (N +3); i loro sali sono nitrati e nitriti."},
{id:"C225",s:"chem",u:1,q:"La formula del fosfato di calcio è:",o:["Ca₃(PO₄)₂","CaPO₄","Ca₂(PO₄)₃","Ca(PO₄)₂","Ca₃PO₄"],e:"Servono 3 Ca²⁺ (+6) per bilanciare 2 PO₄³⁻ (−6). È il principale componente minerale delle ossa (come idrossiapatite)."},
{id:"C226",s:"chem",u:1,q:"Il nome IUPAC di Fe₂O₃ è:",o:["triossido di diferro","ossido ferroso","diossido di ferro","ossido di diferro(II)","triossido di ferro"],e:"In nomenclatura tradizionale è l'ossido ferrico; in nomenclatura di Stock è l'ossido di ferro(III)."},
{id:"C227",s:"chem",u:1,q:"Il numero di ossidazione dell'ossigeno nel perossido di idrogeno H₂O₂ è:",o:["−1","−2","0","+1","+2"],e:"Nei perossidi c'è un legame O−O: 2(+1) + 2x = 0 → x = −1."},
{id:"C228",s:"chem",u:1,q:"Nella molecola NH₃ la massa dei neutroni è circa (massa del neutrone ≈ 1 u; ¹⁴N ha 7 neutroni, ¹H nessuno):",o:["7 u","10 u","17 u","14 u","3 u"],e:"L'idrogeno ¹H non ha neutroni; l'azoto-14 ne ha 7."},
{id:"C229",s:"chem",u:1,q:"Il modello atomico di Dalton considera l'atomo:",o:["una particella indivisibile, uguale per tutti gli atomi di un elemento","un nucleo positivo con elettroni su orbite circolari","una sfera di carica positiva con elettroni immersi","un nucleo con elettroni su orbite a energia quantizzata","una particella indivisibile, diversa per ogni atomo di un elemento"],e:"Il modello 'a panettone' è di Thomson, quello planetario di Rutherford, le orbite quantizzate di Bohr, gli orbitali della meccanica quantistica."},
{id:"C230",s:"chem",u:1,q:"Il principio di indeterminazione di Heisenberg afferma che:",o:["non si possono conoscere insieme con precisione posizione e quantità di moto","gli elettroni percorrono orbite definite a energia quantizzata","due elettroni dello stesso atomo non hanno gli stessi numeri quantici","si possono conoscere insieme con precisione posizione ed energia","gli elettroni occupano prima orbitali singoli con spin parallelo"],e:"Per questo si parla di orbitali, cioè di regioni di probabilità, e non di traiettorie."},

{id:"C231",s:"chem",u:2,q:"Una reazione è spontanea ed esotermica a qualsiasi temperatura. Si può dedurre che:",o:["ΔH < 0 e ΔS > 0","ΔH > 0 e ΔS > 0","ΔH < 0 e ΔS < 0","ΔH > 0 e ΔS < 0","ΔH = 0 e ΔS = 0"],e:"Con ΔH < 0 e ΔS > 0 si ha ΔG = ΔH − TΔS < 0 per ogni T."},
{id:"C232",s:"chem",u:2,q:"Una reazione con ΔH < 0 e ΔS < 0 è spontanea:",o:["solo a temperature sufficientemente basse","a tutte le temperature","solo a temperature sufficientemente alte","a nessuna temperatura","solo alla temperatura in cui ΔH = ΔS"],e:"ΔG < 0 finché |ΔH| > T·|ΔS|, cioè sotto una temperatura limite T = ΔH/ΔS."},
{id:"C233",s:"chem",u:2,q:"La fusione del ghiaccio a pressione atmosferica è spontanea sopra 0 °C perché:",o:["è endotermica ma con ΔS > 0, e sopra 0 °C prevale TΔS","è esotermica e con ΔS > 0, quindi sempre spontanea","è endotermica con ΔS < 0, e sopra 0 °C prevale ΔH","è esotermica con ΔS < 0, e sopra 0 °C prevale ΔH","ha ΔH = 0 e ΔS > 0 a qualsiasi temperatura"],e:"A 0 °C ΔG = 0 (equilibrio solido-liquido); sopra prevale TΔS e ΔG diventa negativo."},
{id:"C234",s:"chem",u:2,q:"Secondo la legge di Charles (o prima legge di Gay-Lussac), a pressione costante il volume di un gas ideale è:",o:["direttamente proporzionale alla temperatura assoluta","inversamente proporzionale alla temperatura assoluta","direttamente proporzionale alla temperatura in °C","inversamente proporzionale alla pressione","proporzionale al quadrato della temperatura"],e:"V/T = costante, con T in kelvin."},
{id:"C235",s:"chem",u:2,q:"Un gas occupa 10 L a 27 °C. Mantenendo costante la pressione e scaldandolo a 327 °C occupa:",o:["20 L","121 L","5 L","12 L","10 L"],e:"T passa da 300 K a 600 K (raddoppia), quindi anche V raddoppia."},
{id:"C236",s:"chem",u:2,q:"Secondo il principio di Avogadro, volumi uguali di gas diversi, alla stessa temperatura e pressione, contengono:",o:["lo stesso numero di molecole","la stessa massa","lo stesso numero di atomi","la stessa densità","lo stesso numero di elettroni"],e:"Per questo, in condizioni normali, una mole di qualsiasi gas ideale occupa circa 22,4 L."},
{id:"C237",s:"chem",u:2,q:"Quante moli di gas ideale sono contenute in 44,8 L in condizioni normali (0 °C, 1 atm)?",o:["2","1","0,5","44,8","4"],e:"44,8 / 22,4 = 2 mol."},
{id:"C238",s:"chem",u:2,q:"Secondo la distribuzione di Maxwell-Boltzmann, all'aumentare della temperatura:",o:["più molecole hanno energia elevata e la curva si allarga","tutte le molecole acquistano la stessa velocità","la curva si sposta verso velocità minori e si stringe","la curva diventa più stretta e più alta","la frazione di molecole veloci resta la stessa"],e:"È il motivo per cui la velocità di reazione cresce con la temperatura: più molecole superano l'energia di attivazione."},
{id:"C239",s:"chem",u:2,q:"La viscosità di un liquido, all'aumentare della temperatura, generalmente:",o:["diminuisce","aumenta","resta costante","diventa infinita","si annulla"],e:"Le molecole più agitate vincono più facilmente le forze intermolecolari che si oppongono allo scorrimento."},
{id:"C240",s:"chem",u:2,q:"Il punto triplo di una sostanza è:",o:["la condizione (T, P) in cui coesistono solido, liquido e vapore","la temperatura di ebollizione alla pressione di 1 atm","la temperatura oltre la quale il gas non può essere liquefatto","la condizione (T, P) in cui coesistono solo liquido e vapore","la pressione a cui il solido sublima a qualsiasi temperatura"],e:"Al punto triplo le tre fasi sono in equilibrio. La temperatura oltre la quale un gas non si liquefa per compressione è invece la temperatura critica."},
{id:"C241",s:"chem",u:2,q:"In una pentola a pressione l'acqua bolle a una temperatura superiore a 100 °C perché:",o:["la pressione esterna supera 1 atm, quindi serve una tensione di vapore maggiore","la pressione esterna è minore di 1 atm, quindi l'acqua evapora prima del normale","l'acqua diventa più densa e il suo calore specifico diminuisce","il calore latente di evaporazione si annulla sotto pressione","il vapore che si forma è più leggero e sale più rapidamente"],e:"In alta montagna, dove la pressione è minore, l'acqua bolle invece sotto i 100 °C."},
{id:"C242",s:"chem",u:2,q:"Il primo principio della termodinamica, applicato a una reazione a pressione costante, permette di identificare il calore scambiato con:",o:["la variazione di entalpia ΔH","la variazione di entropia","la variazione di energia libera","il lavoro di volume","l'energia di attivazione"],e:"A pressione costante qp = ΔH; a volume costante qv = ΔU."},
{id:"C243",s:"chem",u:2,q:"I solidi metallici conducono bene l'elettricità perché:",o:["gli elettroni di valenza sono delocalizzati su tutto il reticolo","contengono ioni positivi e negativi liberi di muoversi","hanno legami covalenti direzionali molto polarizzati","gli elettroni interni sono liberi di passare tra i nuclei","gli ioni positivi del reticolo migrano verso il polo negativo"],e:"È il modello del 'mare di elettroni' che spiega anche la duttilità e la malleabilità dei metalli."},

{id:"C244",s:"chem",u:3,q:"Quante moli di ioni si ottengono sciogliendo completamente 1 mol di Al₂(SO₄)₃ in acqua?",o:["5","2","3","1","17"],e:"Al₂(SO₄)₃ → 2 Al³⁺ + 3 SO₄²⁻: in totale 5 mol di ioni (fattore i = 5)."},
{id:"C245",s:"chem",u:3,q:"A quale volume finale bisogna diluire 25 mL di NaOH 2 M per ottenere una soluzione 0,5 M?",o:["100 mL","50 mL","200 mL","12,5 mL","75 mL"],e:"M₁V₁ = M₂V₂ → V₂ = 2 × 25/0,5 = 100 mL (aggiungendo 75 mL di acqua)."},
{id:"C246",s:"chem",u:3,q:"Si sciolgono 360 g di fruttosio (M = 180 g/mol) in acqua fino a 4 L di soluzione. La molarità è:",o:["0,5 M","2 M","90 M","0,25 M","1 M"],e:"n = 360/180 = 2 mol; M = 2/4 = 0,5 mol/L."},
{id:"C247",s:"chem",u:3,q:"Si mescolano 200 mL di NaCl 1 M e 300 mL di NaCl 2 M. La concentrazione finale è:",o:["1,6 M","1,5 M","3 M","1,2 M","2,5 M"],e:"Moli totali = 0,2 + 0,6 = 0,8 mol in 0,5 L → 1,6 M."},
{id:"C248",s:"chem",u:3,q:"Quanti grammi di NaCl (M = 58,5 g/mol) servono per preparare 2 L di soluzione 0,1 M?",o:["11,7 g","5,85 g","117 g","1,17 g","58,5 g"],e:"n = 0,1 × 2 = 0,2 mol; m = 0,2 × 58,5 = 11,7 g."},
{id:"C249",s:"chem",u:3,q:"Una soluzione contiene 20 g di soluto in 80 g di acqua. La sua concentrazione percentuale in massa (p/p) è:",o:["20%","25%","80%","16%","2%"],e:"% p/p = massa soluto / massa soluzione × 100 = 20/100 × 100."},
{id:"C250",s:"chem",u:3,q:"Una soluzione 1 M di H₂SO₄ (acido diprotico) corrisponde a una concentrazione di:",o:["2 equivalenti/L (2 N)","1 equivalente/L (1 N)","0,5 equivalenti/L (0,5 N)","4 equivalenti/L (4 N)","2 moli/L (2 M)"],e:"Ogni mole di H₂SO₄ può cedere 2 moli di H⁺: normalità = 2 × molarità."},
{id:"C251",s:"chem",u:3,q:"La soluzione glucosata al 5% p/v è circa isotonica con il plasma. La sua osmolarità è circa (glucosio M = 180 g/mol):",o:["0,28 osmol/L","0,05 osmol/L","5 osmol/L","0,56 osmol/L","0,14 osmol/L"],e:"50 g/L ÷ 180 g/mol ≈ 0,28 mol/L; il glucosio non si dissocia (i = 1)."},
{id:"C252",s:"chem",u:3,q:"Tra le seguenti soluzioni acquose 0,1 M, quella con la temperatura di ebollizione più alta è:",o:["Na₂SO₄","NaCl","glucosio","saccarosio","urea"],e:"Na₂SO₄ dà 3 particelle per unità formula (i = 3), più di NaCl (i = 2) e dei non elettroliti (i = 1)."},
{id:"C253",s:"chem",u:3,q:"Una soluzione acquosa conduce bene la corrente elettrica se contiene:",o:["un elettrolita forte, come NaCl","un non elettrolita, come il glucosio","un elettrolita debole, come l'acido acetico, molto diluito","un composto molecolare polare, come l'urea","un composto molecolare polare, come l'etanolo"],e:"La conduzione nelle soluzioni è dovuta al movimento degli ioni."},
{id:"C254",s:"chem",u:3,q:"La solubilità della CO₂ nelle bibite gassate diminuisce quando:",o:["si apre la bottiglia, perché cala la pressione parziale della CO₂","si raffredda la bibita, perché i gas sono meno solubili a bassa T","si apre la bottiglia, perché aumenta la pressione parziale della CO₂","si agita la bottiglia chiusa, perché aumenta la pressione totale","si aggiunge zucchero, perché aumenta la tensione di vapore"],e:"Legge di Henry: con meno pressione parziale si scioglie meno gas, che si libera in bolle. Anche il riscaldamento ne riduce la solubilità."},
{id:"C255",s:"chem",u:3,q:"L'aria espirata, rispetto all'aria inspirata, contiene:",o:["meno O₂, più CO₂ e più vapore acqueo","più O₂, meno CO₂ e più vapore acqueo","meno O₂, più CO₂ e meno vapore acqueo","meno O₂, meno CO₂ e più azoto","la stessa quantità di O₂ ma più CO₂"],e:"In media l'aria espirata contiene circa 16% di O₂ e 4% di CO₂, contro circa 21% e 0,04% dell'aria inspirata."},
{id:"C256",s:"chem",u:3,q:"Un colloide si distingue da una soluzione vera perché:",o:["ha particelle di 1-1000 nm che diffondono la luce (effetto Tyndall)","ha particelle più piccole di 1 nm che non diffondono la luce","ha particelle di 1-1000 nm che sedimentano subito per gravità","ha particelle superiori a 1 mm visibili a occhio nudo","contiene solo ioni idratati che diffondono la luce"],e:"Esempi di colloidi: latte, nebbia, gelatina. Le sospensioni hanno particelle ancora più grandi che sedimentano."},
{id:"C257",s:"chem",u:3,q:"Un aerosol è una dispersione colloidale di:",o:["particelle solide o liquide in un gas","bolle di gas disperse in un liquido","goccioline di liquido disperse in un altro liquido","particelle solide disperse in un liquido","bolle di gas disperse in un solido"],e:"Esempi: nebbia (liquido in gas), fumo (solido in gas), farmaci inalatori."},
{id:"C258",s:"chem",u:3,q:"Nell'emodialisi, il passaggio delle piccole molecole (urea, creatinina) dal sangue al liquido di dialisi avviene per:",o:["diffusione attraverso una membrana semipermeabile, secondo gradiente","osmosi inversa contro gradiente di concentrazione","filtrazione delle cellule del sangue attraverso la membrana","trasporto attivo mediato da pompe della membrana di dialisi","diffusione attraverso la membrana, contro gradiente di concentrazione"],e:"Il liquido di dialisi non contiene urea; contiene invece elettroliti in concentrazioni fisiologiche per evitarne la perdita."},
{id:"C259",s:"chem",u:3,q:"La pressione osmotica di una soluzione 0,1 M di glucosio a 27 °C è circa (R = 0,082 L·atm/(mol·K)):",o:["2,46 atm","0,22 atm","24,6 atm","0,1 atm","221 atm"],e:"π = M·R·T = 0,1 × 0,082 × 300 = 2,46 atm."},

{id:"C260",s:"chem",u:4,q:"Nella reazione N₂ + 3 H₂ → 2 NH₃, quante moli di NH₃ si ottengono da 6 mol di H₂ con N₂ in eccesso?",o:["4","2","6","3","12"],e:"Il rapporto H₂:NH₃ è 3:2: 6 × 2/3 = 4 mol."},
{id:"C261",s:"chem",u:4,q:"Quanti grammi di CO₂ (M = 44 g/mol) si formano dalla combustione completa di 16 g di metano (M = 16 g/mol)? CH₄ + 2 O₂ → CO₂ + 2 H₂O",o:["44 g","16 g","22 g","88 g","32 g"],e:"1 mol di CH₄ produce 1 mol di CO₂, cioè 44 g."},
{id:"C262",s:"chem",u:4,q:"Si fanno reagire 4 mol di H₂ e 1 mol di O₂ secondo 2 H₂ + O₂ → 2 H₂O. Il reagente limitante è:",o:["l'ossigeno","l'idrogeno","nessuno dei due","l'acqua","entrambi in parti uguali"],e:"1 mol di O₂ consuma solo 2 mol di H₂: l'O₂ si esaurisce per primo, si formano 2 mol di H₂O e restano 2 mol di H₂ in eccesso."},
{id:"C263",s:"chem",u:4,q:"Nelle reazioni a più stadi, lo stadio che determina la velocità complessiva è:",o:["lo stadio più lento, con l'energia di attivazione più alta","lo stadio più veloce, con l'energia di attivazione più bassa","sempre il primo stadio, qualunque sia la sua velocità","lo stadio più esotermico, con il ΔH più negativo","sempre l'ultimo stadio, che forma i prodotti"],e:"È lo 'stadio cineticamente determinante', come il collo di bottiglia di un imbuto."},
{id:"C264",s:"chem",u:4,q:"La molecolarità di uno stadio elementare indica:",o:["il numero di molecole che partecipano all'urto in quello stadio","l'ordine globale della reazione, determinato sperimentalmente","il numero di molecole di prodotto formate in quello stadio","la somma dei coefficienti stechiometrici della reazione globale","il numero di stadi elementari del meccanismo"],e:"Per uno stadio elementare l'ordine coincide con la molecolarità; per una reazione complessa l'ordine si determina sperimentalmente."},
{id:"C265",s:"chem",u:4,q:"Per una reazione di ordine zero rispetto al reagente A, la velocità:",o:["è costante e non dipende da [A]","raddoppia raddoppiando [A]","quadruplica raddoppiando [A]","si dimezza raddoppiando [A]","aumenta di √2 raddoppiando [A]"],e:"Un esempio è l'ossidazione dell'etanolo nel fegato quando l'enzima è saturo: la velocità di smaltimento è circa costante."},
{id:"C266",s:"chem",u:4,q:"Un catalizzatore eterogeneo è:",o:["in una fase diversa da quella dei reagenti, come un metallo solido","nella stessa fase dei reagenti, come un acido in soluzione","in una fase diversa, ma viene consumato durante la reazione","nella stessa fase dei reagenti e sempre di natura proteica","un inibitore che rallenta la reazione in fase gassosa"],e:"Esempio: la marmitta catalitica con platino e rodio. Gli enzimi in soluzione si comportano invece come catalizzatori omogenei."},
{id:"C267",s:"chem",u:4,q:"Per l'equilibrio CO(g) + 2 H₂(g) ⇌ CH₃OH(g), sottraendo CH₃OH dal sistema l'equilibrio:",o:["si sposta verso destra","si sposta verso sinistra","non si sposta","si blocca","cambia il valore di K"],e:"Il sistema reagisce riformando il prodotto sottratto (principio di Le Châtelier); K resta invariata."},
{id:"C268",s:"chem",u:4,q:"Per l'equilibrio H₂(g) + I₂(g) ⇌ 2 HI(g), un aumento di pressione per riduzione del volume:",o:["non sposta l'equilibrio","sposta l'equilibrio verso destra","sposta l'equilibrio verso sinistra","fa aumentare K","fa diminuire K"],e:"Le moli di gas sono uguali ai due lati (2 e 2)."},
{id:"C269",s:"chem",u:4,q:"Per un equilibrio con K = 10⁻⁸ a una data temperatura, all'equilibrio:",o:["prevalgono nettamente i reagenti","prevalgono nettamente i prodotti","reagenti e prodotti sono in uguale quantità","la reazione non avviene affatto","K non fornisce informazioni"],e:"Una K molto piccola indica che l'equilibrio è spostato verso i reagenti; K > 10³ indica una reazione praticamente completa."},
{id:"C270",s:"chem",u:4,q:"Se la costante di equilibrio della reazione A ⇌ B è K, la costante della reazione inversa B ⇌ A è:",o:["1/K","K","−K","K²","1/K²"],e:"Invertendo la reazione si invertono numeratore e denominatore. Moltiplicando i coefficienti per 2 la costante andrebbe invece elevata al quadrato."},
{id:"C271",s:"chem",u:4,q:"Il prodotto di solubilità di CaF₂ è espresso da:",o:["Ks = [Ca²⁺][F⁻]²","Ks = [Ca²⁺][F⁻]","Ks = [Ca²⁺]²[F⁻]","Ks = [CaF₂]/([Ca²⁺][F⁻]²)","Ks = 2[Ca²⁺][F⁻]"],e:"CaF₂(s) ⇌ Ca²⁺ + 2 F⁻; il solido non compare. Con solubilità s: Ks = s·(2s)² = 4s³."},
{id:"C272",s:"chem",u:4,q:"Si forma un precipitato quando, mescolando due soluzioni, il prodotto ionico Q:",o:["supera il prodotto di solubilità Ks","è minore di Ks","è uguale a zero","è uguale alla costante di dissociazione dell'acqua","non dipende dalle concentrazioni"],e:"Con Q > Ks la soluzione è sovrasatura e il sale precipita finché Q = Ks."},
{id:"C273",s:"chem",u:4,q:"I calcoli renali di ossalato di calcio si formano più facilmente quando:",o:["il prodotto ionico di Ca²⁺ e ossalato nelle urine supera il Ks","il prodotto ionico di Ca²⁺ e ossalato nelle urine è inferiore al Ks","l'urina è molto diluita per un'abbondante assunzione d'acqua","il Ks del sale aumenta per effetto dello ione comune","la concentrazione di Ca²⁺ nelle urine è molto bassa"],e:"Si consiglia un'abbondante assunzione di acqua per mantenere il prodotto ionico sotto Ks."},
{id:"C274",s:"chem",u:4,q:"In una reazione di neutralizzazione tra un acido forte e una base forte si forma:",o:["un sale e acqua","un estere","un ossido","solo idrogeno gassoso","un precipitato sempre"],e:"La reazione netta è H⁺ + OH⁻ → H₂O."},
{id:"C275",s:"chem",u:4,q:"Quale delle seguenti NON è una reazione di ossidoriduzione?",o:["HCl + NaOH → NaCl + H₂O","2 H₂ + O₂ → 2 H₂O","Zn + 2 HCl → ZnCl₂ + H₂","CH₄ + 2 O₂ → CO₂ + 2 H₂O","2 Na + Cl₂ → 2 NaCl"],e:"Nella neutralizzazione nessun elemento cambia numero di ossidazione."},

{id:"C276",s:"chem",u:5,q:"Quale delle seguenti sostanze è anfotera (può comportarsi sia da acido sia da base di Brønsted)?",o:["HCO₃⁻","Cl⁻","NH₄⁺","CO₃²⁻","Na⁺"],e:"HCO₃⁻ può cedere un H⁺ (diventando CO₃²⁻) o acquistarlo (diventando H₂CO₃). Anche l'acqua è anfotera."},
{id:"C277",s:"chem",u:5,q:"Un esempio di ossido anfotero è:",o:["Al₂O₃","Na₂O","SO₃","CaO","P₂O₅"],e:"L'ossido di alluminio reagisce sia con gli acidi sia con le basi forti. Na₂O e CaO sono basici, SO₃ e CO₂ acidi."},
{id:"C278",s:"chem",u:5,q:"Ordinate per forza acida decrescente: HClO₄, HClO₃, HClO.",o:["HClO₄ > HClO₃ > HClO","HClO > HClO₃ > HClO₄","HClO₃ > HClO₄ > HClO","hanno tutti la stessa forza","HClO > HClO₄ > HClO₃"],e:"Negli ossiacidi dello stesso elemento la forza aumenta con il numero di atomi di ossigeno, che stabilizzano la base coniugata."},
{id:"C279",s:"chem",u:5,q:"Tra gli acidi alogenidrici, il più debole in acqua è:",o:["HF","HCl","HBr","HI","sono tutti ugualmente forti"],e:"Il legame H−F è molto forte e corto: HF è un acido debole (Ka ≈ 7·10⁻⁴), mentre HCl, HBr e HI sono acidi forti."},
{id:"C280",s:"chem",u:5,q:"Tra i seguenti acidi deboli, il più forte è quello con:",o:["Ka = 1,8·10⁻⁴","Ka = 1,8·10⁻⁵","Ka = 6·10⁻¹⁰","Ka = 4·10⁻⁷","Ka = 1·10⁻¹²"],e:"Ka maggiore significa maggiore dissociazione e pKa minore."},
{id:"C281",s:"chem",u:5,q:"Quale tra le seguenti specie è un acido di Lewis ma non un acido di Brønsted?",o:["BF₃","HCl","NH₄⁺","H₂O","CH₃COOH"],e:"BF₃ non ha protoni da cedere, ma accetta un doppietto elettronico. Anche i cationi metallici come Zn²⁺ e Fe³⁺ sono acidi di Lewis."},
{id:"C282",s:"chem",u:5,q:"L'acido fosforico H₃PO₄ è:",o:["un acido triprotico debole","un acido monoprotico forte","una base","un acido diprotico forte","un sale"],e:"Ha tre costanti di dissociazione successive (pKa circa 2,1; 7,2; 12,3), ciascuna molto più piccola della precedente."},
{id:"C283",s:"chem",u:5,q:"Il grado di dissociazione α di un acido debole HA:",o:["aumenta diluendo la soluzione","diminuisce diluendo la soluzione","non dipende dalla concentrazione","è sempre uguale a 1","è sempre uguale a 0,5"],e:"Per la legge di diluizione di Ostwald α ≈ √(Ka/C): diminuendo C, α aumenta."},
{id:"C284",s:"chem",u:5,q:"Per neutralizzare completamente 100 mL di NaOH 0,2 M servono di HCl 0,1 M:",o:["200 mL","100 mL","50 mL","20 mL","400 mL"],e:"Moli di OH⁻ = 0,02; servono 0,02 mol di H⁺, cioè 0,02/0,1 = 0,2 L."},
{id:"C285",s:"chem",u:5,q:"Si mescolano 50 mL di HCl 0,2 M e 50 mL di NaOH 0,1 M. Il pH della soluzione finale è circa:",o:["1,3","1","7","2","1,7"],e:"H⁺ in eccesso = 0,01 − 0,005 = 0,005 mol in 0,1 L → 0,05 M; pH = −log 0,05 ≈ 1,3."},
{id:"C286",s:"chem",u:5,q:"Una soluzione ha pH 3. Una seconda soluzione ha pH 6. La concentrazione di H₃O⁺ della prima rispetto alla seconda è:",o:["1000 volte maggiore","2 volte maggiore","3 volte maggiore","1000 volte minore","100 volte maggiore"],e:"Ogni unità di pH corrisponde a un fattore 10: 10⁶⁻³ = 10³."},
{id:"C287",s:"chem",u:5,q:"Il cloruro di ammonio (NH₄Cl) sciolto in acqua dà una soluzione acida perché:",o:["NH₄⁺, acido coniugato della base debole NH₃, cede un protone all'acqua","Cl⁻, base coniugata di un acido forte, acquista un protone dall'acqua","NH₄⁺, base coniugata dell'acido debole NH₃, acquista un protone","NH₄Cl è un acido forte che si dissocia completamente in H⁺","Cl⁻ si idrolizza producendo HCl e ioni OH⁻"],e:"Cl⁻ è la base coniugata di un acido forte e non si idrolizza in modo apprezzabile."},
{id:"C288",s:"chem",u:5,q:"Un tampone ammoniaca/ammonio (pKa di NH₄⁺ = 9,25) è efficace intorno a pH:",o:["9,25","4,75","7","14","2"],e:"Un tampone funziona bene entro circa ±1 unità dal pKa del suo acido debole."},
{id:"C289",s:"chem",u:5,q:"Se in un campione di sangue il rapporto [HCO₃⁻]/[CO₂ disciolta] diminuisce (es. per ipoventilazione con accumulo di CO₂), il pH:",o:["diminuisce (acidosi respiratoria)","aumenta (alcalosi respiratoria)","diminuisce (acidosi metabolica)","aumenta (alcalosi metabolica)","resta invariato grazie al tampone"],e:"pH = 6,1 + log([HCO₃⁻]/[CO₂]): un aumento di CO₂ abbassa il rapporto e quindi il pH."},
{id:"C290",s:"chem",u:5,q:"L'iperventilazione (es. in un attacco di panico) tende a provocare:",o:["alcalosi respiratoria, per eccessiva eliminazione di CO₂","acidosi respiratoria, per eccessiva eliminazione di CO₂","alcalosi metabolica, per perdita di HCO₃⁻ con le urine","acidosi respiratoria, per accumulo di CO₂ nel sangue","alcalosi respiratoria, per accumulo di HCO₃⁻ nel sangue"],e:"Meno CO₂ significa meno acido carbonico e pH più alto."},
{id:"C291",s:"chem",u:5,q:"Quanti elettroni acquista il cromo quando lo ione cromato CrO₄²⁻ si trasforma in Cr³⁺?",o:["3","6","2","1","4"],e:"Nel cromato il cromo ha n.o. +6 (x − 8 = −2); passando a +3 acquista 3 elettroni."},
{id:"C292",s:"chem",u:5,q:"Nella semireazione MnO₄⁻ + 8 H⁺ + 5 e⁻ → Mn²⁺ + 4 H₂O il manganese:",o:["si riduce da +7 a +2","si ossida da +2 a +7","si riduce da +4 a +2","non cambia numero di ossidazione","si ossida da +7 a +8"],e:"Acquistando 5 elettroni il permanganato si comporta da ossidante forte (in ambiente acido)."},
{id:"C293",s:"chem",u:5,q:"Quale delle seguenti specie può comportarsi sia da ossidante sia da riducente?",o:["H₂O₂","F₂","Na","MnO₄⁻","Li"],e:"Nel perossido l'ossigeno ha n.o. −1, intermedio: può ridursi a −2 (H₂O) od ossidarsi a 0 (O₂)."},
{id:"C294",s:"chem",u:5,q:"Dati E°(Cu²⁺/Cu) = +0,34 V ed E°(Zn²⁺/Zn) = −0,76 V, la forza elettromotrice standard della pila Daniell è:",o:["1,10 V","0,42 V","−1,10 V","0,34 V","0,76 V"],e:"ΔE° = E°catodo − E°anodo = 0,34 − (−0,76) = 1,10 V."},
{id:"C295",s:"chem",u:5,q:"Tra le seguenti specie, il riducente più forte è quella con:",o:["il potenziale standard di riduzione più negativo","il potenziale standard di riduzione più positivo","potenziale uguale a zero","la massa molare maggiore","il numero di ossidazione più alto"],e:"Un E° molto negativo (es. Li⁺/Li = −3,04 V) indica che la forma ridotta cede elettroni con grande facilità."},
{id:"C296",s:"chem",u:5,q:"Nell'elettrolisi, rispetto a una pila:",o:["si usa energia elettrica esterna per una redox non spontanea","si produce energia elettrica da una reazione redox spontanea","si usa energia elettrica esterna per una redox spontanea","l'ossidazione avviene al catodo e la riduzione all'anodo","non avviene alcuna redox, ma solo migrazione di ioni"],e:"In entrambi i dispositivi l'ossidazione avviene all'anodo e la riduzione al catodo; nella cella elettrolitica, però, l'anodo è il polo positivo."},
{id:"C297",s:"chem",u:5,q:"I conduttori di seconda specie (elettroliti) conducono la corrente grazie al movimento di:",o:["ioni","elettroni liberi","protoni nel vuoto","neutroni","fotoni"],e:"I metalli sono conduttori di prima specie, in cui si muovono gli elettroni."},
{id:"C298",s:"chem",u:5,q:"Lo stress ossidativo è causato da un eccesso di specie reattive dell'ossigeno (ROS), come:",o:["lo ione superossido O₂⁻ e il radicale ossidrile ·OH","l'acqua e l'ossigeno molecolare O₂ disciolto","l'anidride carbonica e lo ione bicarbonato HCO₃⁻","l'ozono stratosferico e l'azoto molecolare","il glutatione ridotto e la vitamina E"],e:"I sistemi antiossidanti includono enzimi (superossido dismutasi, catalasi, glutatione perossidasi) e molecole come le vitamine C ed E."}
);

// CHIMICA — espansione 2 (unità 6-8) + completamento — domande originali
BANK.push(
{id:"C301",s:"chem",u:6,q:"Quanti atomi di idrogeno possiede l'1,3-eptadiene?",o:["12","14","16","10","7"],e:"Eptadiene: 7 carboni e due doppi legami. Formula CₙH₂ₙ₋₂ = C₇H₁₂."},
{id:"C302",s:"chem",u:6,q:"La formula molecolare del cicloesano è:",o:["C₆H₁₂","C₆H₆","C₆H₁₄","C₆H₁₀","C₆H₈"],e:"I cicloalcani hanno formula CₙH₂ₙ, la stessa degli alcheni con cui sono isomeri."},
{id:"C303",s:"chem",u:6,q:"All'aumentare della lunghezza della catena negli alcani lineari, il punto di ebollizione:",o:["aumenta","diminuisce","resta costante","diventa negativo","non dipende dalla catena"],e:"Molecole più grandi hanno forze di London più intense. A parità di atomi di carbonio, le ramificazioni abbassano invece il punto di ebollizione."},
{id:"C304",s:"chem",u:6,q:"L'isoottano (2,2,4-trimetilpentano) è:",o:["insolubile in acqua, perché apolare","molto solubile in acqua, perché ramificato","insolubile in acqua, perché ionico","un composto aromatico ramificato","un alchene a otto atomi di carbonio"],e:"Gli idrocarburi saturi sono apolari e si sciolgono solo in solventi apolari."},
{id:"C305",s:"chem",u:6,q:"Quale dei seguenti composti NON è un alchene?",o:["Acetilene (etino)","Etilene (etene)","Propene","1-butene","Cicloesene"],e:"L'acetilene ha un triplo legame: è un alchino (CₙH₂ₙ₋₂)."},
{id:"C306",s:"chem",u:6,q:"Nel cicloesano la conformazione a sedia è più stabile di quella a barca perché:",o:["tutti i legami C−H adiacenti sono sfalsati, senza interazioni 'a pennone'","tutti i legami C−H adiacenti sono eclissati, con interazioni 'a pennone'","ha angoli di legame di 120°, ideali per carboni sp²","è planare e quindi priva di tensione torsionale","contiene doppi legami coniugati che la stabilizzano"],e:"Nella barca alcuni legami sono eclissati e due idrogeni sono molto vicini (interazione a pennone)."},
{id:"C307",s:"chem",u:6,q:"L'addizione di Br₂ a un alchene (prova dell'acqua di bromo) produce:",o:["un dibromuro vicinale, con scomparsa del colore del bromo","un dibromuro geminale, con comparsa del colore del bromo","un bromoalcano per sostituzione radicalica, senza decolorazione","un alcol per addizione di acqua, senza decolorazione","un alchino per eliminazione di HBr"],e:"La decolorazione dell'acqua di bromo è un test classico per riconoscere i doppi legami C=C."},
{id:"C308",s:"chem",u:6,q:"L'idratazione del propene in ambiente acido produce principalmente:",o:["2-propanolo","1-propanolo","propanale","acetone","acido propanoico"],e:"Segue la regola di Markovnikov: l'OH si lega al carbonio più sostituito, attraverso il carbocatione secondario."},
{id:"C309",s:"chem",u:6,q:"L'idrogenazione catalitica di un alchene (H₂ con Pt, Pd o Ni) produce:",o:["l'alcano corrispondente","l'alchino corrispondente","l'alcol corrispondente","un diene coniugato","un composto aromatico"],e:"È il processo usato per indurire gli oli vegetali; può produrre come sottoprodotti gli acidi grassi trans."},
{id:"C310",s:"chem",u:6,q:"Il butadiene (CH₂=CH−CH=CH₂) è un esempio di:",o:["diene coniugato, con doppi legami alternati a un legame semplice","diene cumulato, con due doppi legami sullo stesso carbonio","diene isolato, con doppi legami separati da più legami semplici","alchino con un triplo legame centrale","composto aromatico a quattro carboni"],e:"Nei dieni coniugati gli elettroni π sono delocalizzati su tutti e quattro i carboni, il che conferisce stabilità extra."},
{id:"C311",s:"chem",u:6,q:"Un alogenuro alchilico secondario è un composto in cui il carbonio legato all'alogeno è legato:",o:["ad altri due atomi di carbonio","a un solo atomo di carbonio","a tre atomi di carbonio","a nessun atomo di carbonio","a due atomi di alogeno"],e:"Primario: un carbonio legato; terziario: tre carboni legati."},
{id:"C312",s:"chem",u:6,q:"Un alogenuro terziario trattato con una base forte e ingombrante, a caldo, dà soprattutto:",o:["un alchene per eliminazione","un alcol per SN2","un alcol per SN1","un etere per SN2","un alcano per riduzione"],e:"L'ingombro sterico impedisce l'attacco SN2; la base strappa un idrogeno in β ed elimina HX."},
{id:"C313",s:"chem",u:6,q:"Nella sostituzione elettrofila aromatica l'intermedio di reazione è:",o:["un carbocatione stabilizzato per risonanza (ione arenio)","un carbanione stabilizzato per risonanza (ione arenuro)","un radicale libero stabilizzato per risonanza","un carbocatione aromatico non stabilizzato","un intermedio a quattro centri senza carica"],e:"Nello stadio successivo la perdita di un H⁺ ripristina l'aromaticità."},
{id:"C314",s:"chem",u:6,q:"Nel benzene ogni atomo di carbonio ha ibridazione:",o:["sp²","sp³","sp","sp³d","non ibridato"],e:"Ogni carbonio forma tre legami σ (angoli di 120°) e mette un orbitale p nella nuvola π delocalizzata."},
{id:"C315",s:"chem",u:6,q:"Il toluene è:",o:["il metilbenzene","il benzene con un gruppo −OH","il benzene con un gruppo −NH₂","un cicloalcano","un alchene lineare"],e:"Il fenolo ha un −OH legato all'anello, l'anilina un −NH₂."},
{id:"C316",s:"chem",u:6,q:"Il gruppo −OH legato all'anello benzenico nella sostituzione elettrofila aromatica è:",o:["attivante e orto/para orientante","disattivante e meta orientante","disattivante e orto/para orientante","attivante e meta orientante","senza effetto"],e:"I doppietti dell'ossigeno si delocalizzano sull'anello aumentando la densità elettronica nelle posizioni orto e para."},
{id:"C317",s:"chem",u:6,q:"I composti eterociclici aromatici come la piridina e il pirrolo:",o:["contengono nell'anello almeno un atomo diverso dal carbonio","contengono nell'anello solo atomi di carbonio e idrogeno","non sono mai aromatici perché l'eteroatomo rompe la coniugazione","sono cicloalcani saturi con un atomo di azoto","contengono un eteroatomo solo fuori dall'anello"],e:"Anelli eterociclici azotati sono presenti nelle basi azotate, nell'istidina, nel triptofano e nel gruppo eme."},
{id:"C318",s:"chem",u:6,q:"Gli idrocarburi policiclici aromatici (IPA) come il benzo[a]pirene, presenti nel fumo di sigaretta, sono pericolosi perché:",o:["dopo attivazione metabolica si legano al DNA (sono cancerogeni)","sono acidi forti che corrodono le vie respiratorie e i polmoni","sono gas asfissianti che spostano l'ossigeno","sono radioattivi a causa del carbonio-14 del tabacco","si legano all'emoglobina con più affinità del CO"],e:"Gli enzimi del citocromo P450 li trasformano in epossidi reattivi che formano addotti con le basi del DNA."},
{id:"C319",s:"chem",u:6,q:"Il gruppo −CH₃ ha, rispetto all'anello o a un carbocatione a cui è legato, un effetto:",o:["elettron-donatore (induttivo +I)","elettron-attrattore (induttivo −I)","elettron-attrattore per risonanza (−M)","nullo, perché C e H hanno uguale elettronegatività","elettron-attrattore (induttivo −I) e +M"],e:"I gruppi alchilici donano densità elettronica: per questo i carbocationi più sostituiti sono più stabili."},

{id:"C320",s:"chem",u:7,q:"Il gruppo acile è:",o:["un gruppo R−C=O, da un acido carbossilico senza l'OH","un gruppo R−O−, da un alcol senza l'idrogeno","un gruppo R−C=O−OH, cioè un carbossile intero","un gruppo R−NH−, da un'ammina senza un idrogeno","un gruppo R−CH₂−, da un alcano senza un idrogeno"],e:"Il gruppo acetile CH₃CO− è un acile; le reazioni di acilazione trasferiscono gruppi acilici (es. acetil-CoA)."},
{id:"C321",s:"chem",u:7,q:"Il nome IUPAC di CH₃−CO−CH₃ è:",o:["propanone","propanale","acido propanoico","2-propanolo","propene"],e:"È l'acetone, il chetone più semplice. Il suffisso -one indica i chetoni, -ale le aldeidi, -olo gli alcoli."},
{id:"C322",s:"chem",u:7,q:"Il nome IUPAC di CH₃−CH₂−CHO è:",o:["propanale","propanone","propanolo","acido propanoico","etanale"],e:"Il carbonio del gruppo aldeidico è sempre il C1 della catena."},
{id:"C323",s:"chem",u:7,q:"Un alcol terziario, come il 2-metil-2-propanolo, trattato con un ossidante blando:",o:["non si ossida: il carbonio con l'OH non ha idrogeni","si ossida a chetone perdendo due idrogeni","si ossida ad aldeide e poi ad acido carbossilico","si ossida a chetone rompendo un legame C−C","si riduce ad alcano perdendo l'ossidrile"],e:"L'ossidazione richiede un H sul carbonio carbinolico."},
{id:"C324",s:"chem",u:7,q:"La disidratazione di un alcol in ambiente acido a caldo produce:",o:["un alchene","un'aldeide","un acido carbossilico","un'ammina","un alogenuro"],e:"È una reazione di eliminazione (il contrario dell'idratazione degli alcheni). A temperatura più bassa due alcoli possono invece formare un etere."},
{id:"C325",s:"chem",u:7,q:"Gli eteri, rispetto agli alcoli di massa molare simile, hanno punti di ebollizione:",o:["più bassi, perché non formano legami a idrogeno tra loro","più alti, perché sono più polari degli alcoli","più alti, perché formano legami a idrogeno più forti","uguali, perché hanno la stessa massa molare","più bassi, perché hanno massa molare minore"],e:"Esempio: dimetiletere (−24 °C) ed etanolo (78 °C), entrambi C₂H₆O e quindi isomeri."},
{id:"C326",s:"chem",u:7,q:"L'ossidazione di due tioli (−SH) porta alla formazione di:",o:["un disolfuro (−S−S−)","un tioestere (−CO−S−)","un solfato (−O−SO₃⁻)","un tioetere (−S−)","un solfonato (−SO₃⁻)"],e:"È la reazione che forma i ponti disolfuro tra cisteine; il glutatione ridotto/ossidato sfrutta lo stesso equilibrio."},
{id:"C327",s:"chem",u:7,q:"Gli epossidi sono:",o:["eteri ciclici a tre termini, reattivi per la tensione d'anello","eteri ciclici a sei termini, stabili e poco reattivi","esteri ciclici a tre termini, reattivi per la tensione d'anello","alcoli con due ossidrili su carboni adiacenti","chetoni ciclici a tre termini molto reattivi"],e:"La loro reattività verso i nucleofili (es. il DNA) spiega la tossicità di alcuni metaboliti."},
{id:"C328",s:"chem",u:7,q:"La riduzione di un chetone (es. con NaBH₄) produce:",o:["un alcol secondario","un alcol primario","un'aldeide","un acido carbossilico","un alcano"],e:"La riduzione di un'aldeide dà invece un alcol primario."},
{id:"C329",s:"chem",u:7,q:"Il carbonio del gruppo carbonilico (C=O) è attaccato preferenzialmente da:",o:["nucleofili, perché porta una parziale carica positiva","elettrofili, perché porta una parziale carica negativa","nucleofili, perché porta una parziale carica negativa","elettrofili, perché è ibridato sp²","radicali, perché il doppio legame si rompe in modo omolitico"],e:"L'ossigeno, più elettronegativo, polarizza il doppio legame: per questo aldeidi e chetoni danno addizioni nucleofile."},
{id:"C330",s:"chem",u:7,q:"Gli idrogeni in posizione α rispetto a un gruppo carbonilico sono debolmente acidi perché:",o:["la base coniugata (enolato) è stabilizzata per risonanza","sono legati direttamente all'ossigeno del carbonile","sono legati a un carbonio ibridato sp","il carbonio α porta una carica positiva formale","formano legami a idrogeno intramolecolari con il carbonile"],e:"È la base della tautomeria cheto-enolica e della condensazione aldolica."},
{id:"C331",s:"chem",u:7,q:"La condensazione di Claisen avviene tra:",o:["due esteri, e forma un β-chetoestere","due aldeidi, e forma un β-idrossialdeide","due esteri, e forma un α-chetoestere","un estere e un'ammina, e forma un'ammide","due chetoni, e forma un diene coniugato"],e:"L'enolato di un estere attacca il carbonile di un secondo estere. Nella cellula una reazione analoga (con tioesteri) avvia la sintesi dei corpi chetonici e degli steroli."},
{id:"C332",s:"chem",u:7,q:"L'acido acetico è un acido più forte dell'etanolo perché:",o:["l'anione acetato è stabilizzato per risonanza tra i due ossigeni","l'anione etossido è stabilizzato per risonanza con il metile","l'acido acetico è un acido forte completamente dissociato","l'anione acetato ha la carica negativa localizzata sul carbonio","l'acido acetico ha più idrogeni acidi dell'etanolo"],e:"pKa dell'acido acetico ≈ 4,76; pKa dell'etanolo ≈ 16."},
{id:"C333",s:"chem",u:7,q:"L'acido tricloroacetico è più forte dell'acido acetico perché:",o:["i cloro, elettron-attrattori, stabilizzano l'anione per effetto induttivo","i cloro, elettron-donatori, stabilizzano l'anione per risonanza","ha tre idrogeni acidi in più legati al carbonio α","i cloro formano legami a idrogeno intramolecolari con il carbossilato","i cloro destabilizzano l'acido indissociato per risonanza"],e:"Il suo pKa è circa 0,7. Più vicini sono i sostituenti elettron-attrattori al carbossile, maggiore è l'effetto."},
{id:"C334",s:"chem",u:7,q:"La reazione di un acido carbossilico con NaOH produce:",o:["un sale (carbossilato di sodio) e acqua","un estere sodico e idrogeno gassoso","un'ammide e acqua","un'aldeide e idrossido di sodio","un alcol e carbonato di sodio"],e:"È una salificazione: i saponi sono sali di sodio o potassio di acidi grassi."},
{id:"C335",s:"chem",u:7,q:"Una reazione di transesterificazione consiste:",o:["nello scambio del gruppo alcolico di un estere con un altro alcol","nello scambio del gruppo acilico di un'ammide con un estere","nell'idrolisi completa di un estere ad acido e alcol","nella riduzione di un estere a due alcoli","nella condensazione di due alcoli a formare un etere"],e:"È ad esempio il processo industriale per produrre il biodiesel dai trigliceridi."},
{id:"C336",s:"chem",u:7,q:"Le nitrosammine, potenzialmente cancerogene, si possono formare dalla reazione tra:",o:["ammine secondarie e nitriti in ambiente acido","ammine terziarie e nitrati in ambiente basico","alcoli e nitriti in ambiente basico","ammidi e acido nitrico concentrato","aldeidi e ammoniaca in ambiente neutro"],e:"Può avvenire nello stomaco a partire dai nitriti usati come conservanti nelle carni lavorate."},
{id:"C337",s:"chem",u:7,q:"La colina è:",o:["un sale di ammonio quaternario, precursore dell'acetilcolina","un'ammina primaria aromatica, precursore della dopamina","un amminoacido essenziale con catena laterale carica","un'ammina terziaria neutra, precursore della serotonina","un sale di ammonio primario, componente della sfingomielina"],e:"L'azoto è legato a quattro gruppi carboniosi (tre metili e un idrossietile) e porta una carica positiva permanente."},
{id:"C338",s:"chem",u:7,q:"L'idrolisi di un'ammide in ambiente acido produce:",o:["un acido carbossilico e uno ione ammonio (o ammonio sostituito)","un estere e uno ione ammonio","un alcol e un'ammina primaria","un'aldeide e ammoniaca libera","un carbossilato e ammoniaca libera, come in ambiente basico"],e:"Il legame ammidico è molto stabile: in assenza di catalizzatori l'idrolisi richiede condizioni drastiche; nelle cellule la catalizzano le proteasi."},
{id:"C339",s:"chem",u:7,q:"Gli acil-fosfati (come l'1,3-bisfosfoglicerato) sono importanti in biochimica perché:",o:["hanno un'alta energia di idrolisi e cedono un fosfato all'ADP","hanno una bassa energia di idrolisi e accettano un fosfato dall'ATP","sono acidi forti che regolano il pH del citosol","sono componenti strutturali delle membrane","sono coenzimi vitaminici della catena respiratoria"],e:"È la fosforilazione a livello del substrato nella glicolisi."},
{id:"C340",s:"chem",u:7,q:"Gli isomeri costituzionali (strutturali) differiscono per:",o:["l'ordine con cui gli atomi sono legati tra loro","la sola disposizione spaziale attorno a un carbonio chirale","la rotazione attorno a un legame semplice","il segno del potere rotatorio","la formula molecolare"],e:"Esempio: etanolo e dimetiletere (C₂H₆O). Gli stereoisomeri hanno invece la stessa connettività."},
{id:"C341",s:"chem",u:7,q:"Gli isomeri conformazionali:",o:["si interconvertono ruotando attorno a legami semplici","si interconvertono solo rompendo e riformando legami covalenti","sono enantiomeri separabili a temperatura ambiente","differiscono per la posizione di un doppio legame","hanno formule molecolari diverse"],e:"Esempi: conformazioni sfalsata ed eclissata dell'etano, sedia e barca del cicloesano."},
{id:"C342",s:"chem",u:7,q:"Gli enantiomeri hanno:",o:["le stesse proprietà fisiche ma potere rotatorio opposto","proprietà fisiche diverse e potere rotatorio opposto","le stesse proprietà fisiche e lo stesso potere rotatorio","sempre lo stesso effetto biologico, ma solubilità diversa","formule di struttura diverse ma stesso potere rotatorio"],e:"Interagiscono in modo diverso con ambienti chirali come enzimi e recettori: il caso della talidomide è un esempio drammatico."},
{id:"C343",s:"chem",u:7,q:"La convenzione E/Z si usa per:",o:["la configurazione dei sostituenti attorno a un doppio legame","la configurazione di un carbonio chirale ibridato sp³ (centro stereogenico)","il segno del potere rotatorio di un enantiomero","la posizione di un gruppo funzionale nella catena","la conformazione sfalsata o eclissata di un alcano"],e:"Z (zusammen) = gruppi a priorità maggiore dallo stesso lato; E (entgegen) = da lati opposti. Per i centri chirali si usa R/S."},
{id:"C344",s:"chem",u:7,q:"Nella convenzione R/S, per assegnare la configurazione di un carbonio chirale:",o:["si allontana il gruppo a priorità più bassa e si segue 1→2→3","si avvicina il gruppo a priorità più bassa e si segue 1→2→3","si allontana il gruppo a priorità più alta e si segue 4→3→2","si guarda solo il segno (+) o (−) del potere rotatorio","si confronta la struttura con la D-gliceraldeide"],e:"Senso orario = R, antiorario = S. Il segno (+)/(−) del potere rotatorio non è legato alla configurazione R/S."},
{id:"C345",s:"chem",u:7,q:"Due diastereoisomeri:",o:["sono stereoisomeri non speculari con proprietà fisiche diverse","sono immagini speculari non sovrapponibili con proprietà uguali","sono stereoisomeri non speculari con proprietà fisiche identiche","sono isomeri costituzionali con diversa connettività","sono conformeri che si interconvertono per rotazione"],e:"Gli isomeri cis/trans e gli epimeri sono esempi di diastereoisomeri."},
{id:"C346",s:"chem",u:7,q:"La gliceraldeide è usata come riferimento nella convenzione:",o:["D/L di Fischer","E/Z","cis/trans","R/S di Cahn-Ingold-Prelog","orto/meta/para"],e:"Gli zuccheri D hanno l'OH del carbonio chirale più lontano dal carbonile a destra nella proiezione di Fischer, come la D-gliceraldeide."},

{id:"C347",s:"chem",u:8,q:"Quale dei seguenti amminoacidi contiene zolfo nella catena laterale?",o:["Metionina","Serina","Treonina","Istidina","Prolina"],e:"Gli amminoacidi solforati sono metionina e cisteina."},
{id:"C348",s:"chem",u:8,q:"L'amminoacido con una catena laterale che forma un anello chiuso con l'azoto α, che ostacola la formazione delle α-eliche, è:",o:["la prolina","la glicina","il triptofano","l'istidina","la tirosina"],e:"La prolina è un imminoacido; insieme alla glicina è abbondante nel collagene."},
{id:"C349",s:"chem",u:8,q:"Quale dei seguenti amminoacidi ha una catena laterale aromatica?",o:["Fenilalanina","Leucina","Alanina","Serina","Acido aspartico"],e:"Gli amminoacidi aromatici sono fenilalanina, tirosina e triptofano (che assorbono a 280 nm)."},
{id:"C350",s:"chem",u:8,q:"Il punto isoelettrico di un amminoacido con pKa₁ = 2,3 e pKa₂ = 9,7 (catena laterale non ionizzabile) è:",o:["6,0","12,0","7,4","3,7","2,3"],e:"pI = (2,3 + 9,7)/2 = 6,0."},
{id:"C351",s:"chem",u:8,q:"A un pH inferiore al suo punto isoelettrico, una proteina ha carica netta:",o:["positiva","negativa","nulla","variabile in modo casuale","sempre −1"],e:"Con molti H⁺ disponibili i gruppi amminici sono protonati e i carbossilici in parte neutri: in elettroforesi la proteina migra verso il catodo."},
{id:"C352",s:"chem",u:8,q:"La denaturazione di una proteina comporta:",o:["perdita delle strutture secondaria, terziaria e quaternaria","rottura dei legami peptidici e perdita della struttura primaria","perdita delle sole strutture terziaria e quaternaria","rottura dei legami peptidici, con conservazione delle eliche","formazione di nuovi legami peptidici tra catene vicine"],e:"Calore, pH estremi, urea o detergenti rompono le interazioni deboli (e a volte i ponti disolfuro), non i legami peptidici."},
{id:"C353",s:"chem",u:8,q:"Il fruttosio è:",o:["un chetoesoso","un aldoesoso","un aldopentoso","un disaccaride","un polisaccaride"],e:"Ha sei carboni e il gruppo carbonilico in posizione 2; il glucosio è invece un aldoesoso."},
{id:"C354",s:"chem",u:8,q:"Il ribosio è:",o:["un aldopentoso","un chetoesoso","un aldoesoso","un disaccaride","un chetopentoso"],e:"Il ribosio (5 C, gruppo aldeidico) è lo zucchero dell'RNA e dell'ATP."},
{id:"C355",s:"chem",u:8,q:"Un aldoesoso come il glucosio ha nella forma aperta:",o:["4 carboni chirali, quindi 16 stereoisomeri","4 carboni chirali, quindi 8 stereoisomeri","5 carboni chirali, quindi 32 stereoisomeri","3 carboni chirali, quindi 8 stereoisomeri","2 carboni chirali, quindi 4 stereoisomeri"],e:"C2, C3, C4 e C5 sono stereocentri: 2⁴ = 16 stereoisomeri (8 della serie D e 8 della serie L)."},
{id:"C356",s:"chem",u:8,q:"Uno zucchero riducente:",o:["ha un carbonio anomerico libero che può riaprirsi in forma aldeidica","ha il carbonio anomerico impegnato in un legame glicosidico con un altro zucchero","è un disaccaride con i due carboni anomerici legati tra loro","non può ossidarsi perché non ha gruppi carbonilici","contiene un gruppo amminico al posto dell'ossidrile in C2"],e:"Glucosio, fruttosio, lattosio e maltosio sono riducenti (danno positivi i saggi di Fehling e Benedict); il saccarosio no."},
{id:"C357",s:"chem",u:8,q:"La glucosammina è:",o:["un amminozucchero con −NH₂ al posto dell'−OH in C2","un amminozucchero con −NH₂ al posto dell'−OH in C6","un amminoacido con una catena laterale glucidica","un nucleoside formato da glucosio e adenina","un disaccaride di glucosio e N-acetilglucosammina"],e:"Le sue forme acetilate sono componenti di chitina, acido ialuronico e altri glicosamminoglicani."},
{id:"C358",s:"chem",u:8,q:"L'acido oleico è:",o:["un acido grasso monoinsaturo a 18 C con doppio legame cis (ω-9)","un acido grasso monoinsaturo a 18 C con doppio legame trans (ω-9)","un acido grasso polinsaturo a 18 C con tre doppi legami (ω-3)","un acido grasso saturo a 16 C (palmitico)","un acido grasso monoinsaturo a 16 C con doppio legame cis (ω-7)"],e:"È il principale acido grasso dell'olio d'oliva e può essere sintetizzato dall'organismo."},
{id:"C359",s:"chem",u:8,q:"Gli acidi grassi trans, rispetto ai cis con lo stesso numero di carboni, hanno:",o:["catene più lineari e punto di fusione più alto","catene più piegate e punto di fusione più basso","catene più lineari e punto di fusione più basso","più doppi legami e catene ramificate","catene più piegate e punto di fusione più alto"],e:"Si formano nell'idrogenazione parziale degli oli; il loro consumo è associato a un aumento del rischio cardiovascolare."},
{id:"C360",s:"chem",u:8,q:"Gli sfingolipidi hanno come scheletro:",o:["la sfingosina, un amminoalcol a lunga catena","il glicerolo, un trialcol a tre carboni","il colesterolo, uno sterolo a quattro anelli","l'inositolo, un polialcol ciclico","la colina, un ammonio quaternario"],e:"Esempi sono la sfingomielina (nella mielina), i cerebrosidi e i gangliosidi; difetti nella loro degradazione causano malattie lisosomiali come Tay-Sachs e Gaucher."},
{id:"C361",s:"chem",u:8,q:"Gli acidi biliari derivano da:",o:["colesterolo","acidi grassi saturi","amminoacidi aromatici","glicerolo","nucleotidi"],e:"Prodotti dal fegato e coniugati con glicina o taurina, emulsionano i grassi nell'intestino."},
{id:"C362",s:"chem",u:8,q:"Un nucleoside è formato da:",o:["una base azotata legata a un pentoso con legame N-glicosidico","una base azotata legata a un pentoso con legame O-glicosidico","una base azotata legata a un fosfato con legame estere","una base, un pentoso e un fosfato legati in serie","un pentoso legato a tre gruppi fosfato"],e:"Esempi: adenosina, guanosina, citidina, uridina, timidina. Con uno o più fosfati si ha un nucleotide."},
{id:"C363",s:"chem",u:8,q:"Nell'ATP i tre gruppi fosfato sono uniti tra loro da:",o:["legami fosfoanidridici","legami fosfodiesterici","legami glicosidici","legami peptidici","legami a idrogeno"],e:"Il fosfato α è legato al ribosio con un legame fosfoestere; tra α e β e tra β e γ ci sono legami fosfoanidridici."},
{id:"C364",s:"chem",u:8,q:"Il cAMP (AMP ciclico) contiene:",o:["un fosfato legato insieme al 3' e al 5' del ribosio","un fosfato legato insieme al 2' e al 3' del ribosio","due fosfati legati al 5' del ribosio in forma ciclica","tre fosfati legati al 5' del desossiribosio","un fosfato legato al 5' del desossiribosio"],e:"È prodotto dall'ATP dall'adenilato ciclasi ed è un secondo messaggero."},
{id:"C365",s:"chem",u:8,q:"Il NAD⁺ e il FAD sono:",o:["coenzimi nucleotidici che trasportano elettroni nelle redox","coenzimi nucleotidici che trasferiscono gruppi fosfato","coenzimi non nucleotidici che trasportano gruppi acilici","basi azotate libere che accettano protoni","enzimi proteici della catena respiratoria"],e:"Le loro forme ridotte, NADH e FADH₂, cedono gli elettroni alla catena respiratoria."},
{id:"C366",s:"chem",u:8,q:"L'emoglobina glicata (HbA1c) si forma per:",o:["reazione non enzimatica tra glucosio e gruppi amminici dell'emoglobina","reazione enzimatica tra glucosio e gruppi amminici dell'emoglobina","legame del glucosio al ferro dell'eme al posto dell'O₂","ossidazione del ferro dell'eme a Fe³⁺ da parte del glucosio","fosforilazione enzimatica dell'emoglobina da parte dell'insulina"],e:"Riflette la glicemia media degli ultimi 2-3 mesi (la vita media dei globuli rossi)."}
);

{id:"CC133",s:"chem",u:5,q:"Il setto poroso o tubo con soluzione elettrolitica che chiude il circuito interno di una pila si chiama ponte ……",c:["salino"],e:"Mantiene l'elettroneutralità delle due semicelle."},

{id:"C405",s:"chem",u:1,q:"Nell'idruro di litio (LiH) il numero di ossidazione dell'idrogeno è:",o:["−1","+1","0","+2","−2"],e:"Negli idruri metallici l'idrogeno, più elettronegativo del metallo, assume n.o. −1."},
{id:"C406",s:"chem",u:7,q:"Quanti isomeri costituzionali corrispondono alla formula C₄H₁₀O?",o:["7","4","3","2","5"],e:"Quattro alcoli (1-butanolo, 2-butanolo, 2-metil-1-propanolo, 2-metil-2-propanolo) e tre eteri (dietiletere, metil propil etere, metil isopropil etere)."},
{id:"C407",s:"chem",u:4,q:"La legge di Proust (delle proporzioni definite) afferma che:",o:["in un composto gli elementi stanno in rapporti di massa costanti","in una reazione chimica la massa totale si conserva","volumi uguali di gas contengono lo stesso numero di molecole","se due elementi formano più composti, le masse stanno in rapporti semplici","in un composto gli elementi stanno in rapporti di volume costanti"],e:"La conservazione della massa è la legge di Lavoisier; il principio sui volumi gassosi è di Avogadro."},
{id:"C408",s:"chem",u:1,q:"Il numero di atomi di idrogeno contenuti in una mole di H₂O è circa:",o:["1,2·10²⁴","6,02·10²³","3,01·10²³","2","18"],e:"Ogni molecola contiene 2 atomi di H: 2 × 6,02·10²³ ≈ 1,2·10²⁴."},
{id:"C409",s:"chem",u:1,q:"Il prozio, il deuterio e il trizio sono:",o:["isotopi dell'idrogeno con 0, 1 e 2 neutroni","isotopi dell'idrogeno con 1, 2 e 3 neutroni","isotopi dell'idrogeno con 1, 2 e 3 protoni","isobari dell'elio con diverso numero atomico","allotropi dell'idrogeno con diversa struttura"],e:"Il trizio (³H) è radioattivo (decade β⁻ in ³He)."},
{id:"C410",s:"chem",u:4,q:"Quanti grammi di CO₂ (M = 44 g/mol) si ottengono dalla decomposizione completa di 200 g di CaCO₃ (M = 100 g/mol)? CaCO₃ → CaO + CO₂",o:["88 g","44 g","200 g","112 g","22 g"],e:"200 g = 2 mol di CaCO₃ → 2 mol di CO₂ = 88 g."},
{id:"C411",s:"chem",u:1,q:"Gli elementi di uno stesso gruppo della tavola periodica hanno proprietà chimiche simili perché:",o:["hanno la stessa configurazione elettronica esterna","hanno lo stesso numero di livelli elettronici occupati","hanno lo stesso numero di neutroni nel nucleo","hanno numeri atomici consecutivi","hanno la stessa elettronegatività"],e:"Il comportamento chimico dipende soprattutto dagli elettroni di valenza."},
{id:"C412",s:"chem",u:1,q:"Le anidridi (ossidi acidi) sono composti binari formati da:",o:["un non metallo e l'ossigeno","un metallo e l'ossigeno","un metallo e l'idrogeno","un non metallo e l'idrogeno","due metalli"],e:"Con l'acqua danno ossiacidi: SO₃ + H₂O → H₂SO₄."},
{id:"C413",s:"chem",u:1,q:"Un ossido basico reagendo con un acido produce:",o:["un sale e acqua","un ossiacido","un idrossido e idrogeno","un'anidride","un idruro"],e:"Esempio: CaO + 2 HCl → CaCl₂ + H₂O."},

{id:"B401",s:"bio",u:3,q:"Lo snRNA che si appaia con il punto di ramificazione (adenosina) dell'introne durante lo splicing è:",o:["U2","U1","U6 soltanto","il tRNA iniziatore","l'rRNA 5S"],e:"U1 riconosce il sito di splicing al 5'; U2 il punto di ramificazione; U6 e U2 formano poi il centro catalitico."},
{id:"B402",s:"bio",u:3,q:"Gli introni dei gruppi I e II sono considerati veri ribozimi perché:",o:["possono rimuovere sé stessi (autosplicing) senza spliceosoma","codificano le proteine dello spliceosoma che li rimuovono","vengono rimossi dallo spliceosoma grazie agli snRNA U1 e U2","restano negli mRNA maturi e catalizzano la traduzione","sono tradotti in enzimi che tagliano il pre-mRNA"],e:"Si trovano ad esempio in alcuni geni di rRNA, mitocondriali e batterici; gli introni dei pre-mRNA nucleari richiedono invece lo spliceosoma."},
{id:"B403",s:"bio",u:3,q:"Gli mRNA degli istoni, che non hanno coda di poli(A), sono stabilizzati da:",o:["una struttura a forcina (stem-loop) all'estremità 3'","una coda di poli(U) aggiunta al 3' nel nucleo","una struttura a forcina all'estremità 5', prima del cap","un introne non rimosso nella regione 3' non tradotta","una seconda struttura cap legata all'estremità 3'"],e:"La proteina SLBP lega la forcina e regola la stabilità di questi mRNA, prodotti soprattutto in fase S."},
{id:"B404",s:"bio",u:3,q:"Se si sintetizza in vitro un mRNA usando solo nucleotidi con adenina e uracile, quanti codoni diversi possono essere presenti?",o:["8","4","16","64","2"],e:"Due basi in tre posizioni: 2³ = 8 codoni (tra cui il codone di stop UAA)."},
{id:"B405",s:"bio",u:4,q:"Il carattere 'occhio a barra' della Drosophila è dominante e legato all'X. Incrociando un maschio con occhio a barra con una femmina normale si ottengono:",o:["tutte le femmine con occhio a barra e tutti i maschi normali","tutti i maschi con occhio a barra e tutte le femmine normali","metà delle femmine e metà dei maschi con occhio a barra","tutti i figli, maschi e femmine, con occhio a barra","tutte le femmine portatrici sane e tutti i maschi normali"],e:"Il padre trasmette la sua X a tutte le figlie e la Y a tutti i figli."},
{id:"B406",s:"bio",u:4,q:"Una persona di gruppo sanguigno 0 Rh⁺ può ricevere globuli rossi, in condizioni normali, solo da donatori di gruppo:",o:["0 (Rh⁺ o Rh⁻)","0 o AB, purché Rh⁺","0 Rh⁺ soltanto, mai Rh⁻","qualsiasi gruppo, purché Rh⁺","A o B, purché Rh⁺"],e:"I soggetti di gruppo 0 hanno nel plasma anticorpi anti-A e anti-B. Sono donatori universali di globuli rossi, ma possono riceverli solo da gruppo 0."},
{id:"B407",s:"bio",u:4,q:"Una donna daltonica (recessivo legato all'X) e un uomo con visione normale avranno:",o:["tutti i figli maschi daltonici e tutte le figlie portatrici","tutte le figlie daltoniche e tutti i figli maschi portatori","metà dei figli maschi daltonici e metà delle figlie portatrici","tutti i figli maschi sani e tutte le figlie daltoniche","tutti i figli, maschi e femmine, con visione normale"],e:"La madre è omozigote XᵈXᵈ: ogni figlio maschio riceve una Xᵈ; le figlie ricevono anche la X normale del padre."},
{id:"B408",s:"bio",u:5,q:"I filamenti intermedi hanno un diametro di circa:",o:["10 nm","25 nm","7 nm","100 nm","1 μm"],e:"Valori tipici: microfilamenti circa 7 nm, filamenti intermedi circa 10 nm, microtubuli circa 25 nm."},
{id:"B409",s:"bio",u:5,q:"O₂ e CO₂ attraversano la membrana dei globuli rossi per:",o:["diffusione semplice attraverso il doppio strato lipidico","diffusione facilitata tramite il trasportatore GLUT1","trasporto attivo primario mediato da pompe ATP-dipendenti","cotrasporto con lo scambiatore Cl⁻/HCO₃⁻ (banda 3)","endocitosi in fase fluida seguita da esocitosi"],e:"Sono molecole piccole e apolari che diffondono liberamente secondo gradiente di pressione parziale."},
{id:"B410",s:"bio",u:5,q:"Il blocco della catena respiratoria (es. da cianuro, che inibisce il complesso IV) ha come effetto immediato:",o:["l'arresto della sintesi mitocondriale di ATP","l'aumento del consumo di ossigeno e della sintesi di ATP","l'arresto immediato della glicolisi in tutte le cellule","l'aumento del gradiente protonico e della sintesi di ATP","il riflusso di protoni verso lo spazio intermembrana"],e:"Senza flusso di elettroni non si pompano protoni; la cellula può contare solo sull'ATP della glicolisi."},
{id:"B411",s:"bio",u:5,q:"Nel citoplasma, l'idrolisi del GTP legato a Ran è stimolata da:",o:["Ran-GAP","Ran-GEF (RCC1)","importina β","NTF2","le nucleoporine FG"],e:"Ran-GAP è citoplasmatica e mantiene basso il Ran-GTP nel citosol; Ran-GEF è legata alla cromatina nel nucleo."},
{id:"B412",s:"bio",u:1,q:"Il DNA ricombinante è:",o:["DNA ottenuto in laboratorio unendo frammenti di origine diversa","il DNA che si forma per crossing over tra cromatidi non fratelli","il DNA prodotto dalla trascrittasi inversa di un retrovirus","il DNA riparato per ricombinazione omologa dopo i raggi UV","DNA ottenuto copiando in vitro un unico gene"],e:"Si ottiene tagliando il DNA con enzimi di restrizione e unendo i frammenti con la DNA ligasi, ad esempio per inserire un gene in un plasmide."},
{id:"B413",s:"bio",u:7,q:"Il numero di cromosomi si conta più facilmente in:",o:["metafase, quando i cromosomi sono massimamente condensati","profase, quando i cromosomi iniziano a condensarsi","anafase, quando i cromatidi si separano verso i poli","interfase, quando i cromosomi sono decondensati","telofase, quando si riformano i due nuclei"],e:"Per il cariotipo si bloccano le cellule in metafase (es. con colchicina)."},
{id:"B414",s:"bio",u:7,q:"La teoria che per prima ha spiegato il ruolo del gene RB nei tumori è:",o:["l'ipotesi dei 'due colpi' di Knudson","l'ipotesi del singolo colpo dominante","la teoria dell'oncogene virale di Bishop e Varmus","l'ipotesi un gene-un enzima di Beadle e Tatum","la teoria della selezione clonale"],e:"Nel retinoblastoma ereditario il primo 'colpo' è ereditato in tutte le cellule; basta una seconda mutazione somatica per perdere entrambe le copie."},
{id:"B415",s:"bio",u:1,q:"Un organismo eterotrofo:",o:["ricava energia e carbonio da molecole organiche di altri organismi","sintetizza molecole organiche da CO₂ usando la luce","ricava energia da composti inorganici e carbonio dalla CO₂ (chemiosintesi)","ricava carbonio dalla CO₂ ed energia da molecole organiche","è sempre un batterio che vive a spese di un ospite"],e:"Gli autotrofi (piante, alghe, cianobatteri) sintetizzano molecole organiche da CO₂ con la fotosintesi o la chemiosintesi."},

{id:"F401",s:"fis",u:2,q:"Una palla lasciata cadere da un'altezza H impiega un tempo T per arrivare al suolo. Da un'altezza H/4 impiegherebbe (senza attrito):",o:["T/2","T/4","T/16","2T","T"],e:"h = ½·g·t², quindi t ∝ √h: √(1/4) = 1/2."},
{id:"F402",s:"fis",u:2,q:"Per stimare l'altezza di una scogliera si lascia cadere un sasso e lo si sente toccare l'acqua dopo 3 s. Trascurando il tempo del suono e l'attrito (g = 10 m/s²), l'altezza è circa:",o:["45 m","30 m","90 m","15 m","9 m"],e:"h = ½ × 10 × 9 = 45 m. Considerando il tempo impiegato dal suono per risalire, l'altezza reale è un po' minore."},
{id:"F403",s:"fis",u:2,q:"Un satellite in orbita circolare attorno alla Terra a velocità costante in modulo:",o:["è soggetto a una forza gravitazionale che fa da forza centripeta","non è soggetto ad alcuna forza","ha accelerazione nulla","è in equilibrio perché la forza centrifuga è reale e bilancia la gravità in un sistema inerziale","si muove di moto rettilineo uniforme"],e:"La gravità è sempre perpendicolare alla velocità e la curva continuamente: G·M·m/R² = m·v²/R."},
{id:"F404",s:"fis",u:2,q:"Una macchina assorbe 70 kW per 2 ore. L'energia consumata è:",o:["140 kWh","35 kWh","70 kWh","140 kW","8400 kWh"],e:"E = P·t = 70 kW × 2 h = 140 kWh (circa 5·10⁸ J)."},
{id:"F405",s:"fis",u:1,q:"Un farmaco occupa 75 mL in un flacone e ha una massa di 150 g. La sua densità è:",o:["2 g/mL","0,5 g/mL","2 kg/m³","11 250 g/mL","1 g/mL"],e:"ρ = m/V = 150/75 = 2 g/mL = 2000 kg/m³."},
{id:"F406",s:"fis",u:1,q:"Dividendo una pressione per una forza si ottiene una grandezza che si misura in:",o:["m⁻² (l'inverso di un'area)","m² (un'area)","N·m (un lavoro)","m⁻¹ (l'inverso di una lunghezza)","kg/m³ (una densità)"],e:"P/F = (F/A)/F = 1/A."},
{id:"F408",s:"fis",u:3,q:"Per misurare la densità del sangue si fanno cadere gocce in miscele di liquidi di densità nota. Una goccia che resta sospesa a metà del liquido indica che:",o:["la densità del sangue è uguale a quella della miscela","il sangue è più denso della miscela","il sangue è meno denso della miscela","la spinta di Archimede sulla goccia è nulla","la goccia è sostenuta dalla sola tensione superficiale"],e:"In equilibrio indifferente il peso della goccia è bilanciato esattamente dalla spinta: densità uguali."},
{id:"F409",s:"fis",u:3,q:"Un pezzo di sughero e un pezzo di ferro di uguale volume sono completamente immersi in acqua. Le spinte di Archimede su di essi sono:",o:["uguali","maggiore sul ferro","maggiore sul sughero","nulla sul sughero","nulla sul ferro"],e:"La spinta dipende solo dal volume immerso e dalla densità del fluido. Una volta liberati, il sughero sale e il ferro affonda per la differenza di peso."},
{id:"F410",s:"fis",u:6,q:"Due condensatori da 12 pF e 4 pF in serie equivalgono a un condensatore di:",o:["3 pF","16 pF","8 pF","48 pF","0,33 pF"],e:"1/C = 1/12 + 1/4 = 4/12 → C = 3 pF."},
{id:"F411",s:"fis",u:6,q:"Due lampadine sono collegate in parallelo a una tensione costante. Se il filamento di una si interrompe, l'altra:",o:["resta accesa con la stessa luminosità","si spegne","diventa più luminosa","diventa meno luminosa","resta accesa ma con corrente doppia"],e:"In parallelo ogni ramo ha la stessa tensione indipendentemente dagli altri. In serie, invece, l'interruzione spegnerebbe entrambe."},
{id:"F412",s:"fis",u:6,q:"Quattro cariche di uguale modulo sono poste ai vertici di un quadrato, con le due positive su vertici opposti e le due negative sugli altri due. Al centro del quadrato il campo elettrico è:",o:["nullo","diretto verso una carica positiva","diretto verso una carica negativa","massimo","diretto perpendicolarmente al piano"],e:"Le due cariche positive, opposte e alla stessa distanza dal centro, producono campi uguali e opposti; lo stesso vale per le due negative."},
{id:"F413",s:"fis",u:6,q:"Una dinamo di bicicletta accende la lampadina solo mentre la ruota gira perché:",o:["il magnete che ruota fa variare il flusso nella bobina, inducendo una f.e.m.","il magnete fermo produce un flusso costante che induce una f.e.m. continua","la ruota carica una batteria interna che si scarica quando si ferma","l'attrito tra dinamo e ruota produce cariche elettrostatiche","la bobina che ruota fa variare la sua resistenza e produce corrente"],e:"Senza variazione di flusso (ruota ferma) non c'è induzione: è la legge di Faraday-Neumann-Lenz."},
{id:"F414",s:"fis",u:6,q:"Una persona a contatto con il suolo che tocca un filo dell'impianto domestico prende la scossa se tocca:",o:["il filo di fase","il filo di terra","il filo neutro in condizioni normali","nessuno dei tre","solo il neutro e la terra insieme"],e:"Tra fase e terra c'è una differenza di potenziale di circa 230 V; neutro e terra sono normalmente a potenziale vicino a zero."},
{id:"F415",s:"fis",u:7,q:"Il cielo appare azzurro perché:",o:["l'aria diffonde molto di più le lunghezze d'onda brevi (Rayleigh, ∝ 1/λ⁴)","l'aria diffonde molto di più le lunghezze d'onda lunghe (Rayleigh, ∝ λ⁴)","l'aria assorbe le lunghezze d'onda rosse e lascia passare le blu","il Sole emette soprattutto luce blu e l'atmosfera la trasmette","l'acqua degli oceani riflette il suo colore sull'atmosfera"],e:"Per lo stesso motivo al tramonto, quando la luce attraversa più atmosfera, prevalgono i colori rossi."},
{id:"F416",s:"fis",u:1,q:"Una gocciolina d'olio di 1 mm³ si allarga sull'acqua fino a formare uno strato di 1 m². Lo spessore dello strato (circa uno strato di molecole) è:",o:["1 nm","1 μm","1 mm","0,1 mm","1 pm"],e:"Spessore = V/A = 10⁻⁹ m³ / 1 m² = 10⁻⁹ m. Con esperimenti di questo tipo si stimarono le dimensioni delle molecole."},
{id:"F417",s:"fis",u:2,q:"Un pendolo semplice oscilla senza attrito. Nel punto più basso della traiettoria:",o:["la velocità è massima e l'energia potenziale è minima","la velocità è nulla e l'energia potenziale è massima","la velocità è massima e l'accelerazione è nulla","la velocità è massima e la tensione è uguale al peso","l'energia cinetica è minima e l'accelerazione massima"],e:"Nel punto più basso c'è comunque un'accelerazione centripeta, quindi la tensione supera il peso: T = m·g + m·v²/L."},
{id:"F418",s:"fis",u:2,q:"Un oggetto con energia cinetica E scivola senza attrito su un piano orizzontale e poi sale su un piano inclinato liscio. L'altezza massima raggiunta:",o:["dipende da E e dalla massa, non dall'inclinazione","dipende da E e dall'inclinazione, non dalla massa","dipende solo dall'inclinazione del piano","dipende solo da E, non dalla massa","dipende dalla massa e dall'inclinazione, non da E"],e:"Per la conservazione dell'energia: m·g·h = E → h = E/(m·g)."}
);

{id:"XC01",s:"chem",u:5,q:"Il pH di una soluzione di HCl 1·10⁻² M è ……",c:["2","due"],n:2,e:"Acido forte: pH = −log 10⁻²."},
{id:"XC02",s:"chem",u:7,q:"Il numero di isomeri costituzionali alcolici con formula C₄H₁₀O è ……",c:["4","quattro"],n:4,e:"1-butanolo, 2-butanolo, 2-metil-1-propanolo, 2-metil-2-propanolo."},
{id:"XC03",s:"chem",u:4,q:"La legge secondo cui in una reazione chimica la massa totale dei reagenti è uguale a quella dei prodotti porta il nome di ……",c:["lavoisier"],e:"Nulla si crea, nulla si distrugge, tutto si trasforma."},
{id:"XB01",s:"bio",u:3,q:"Con due soli tipi di nucleotidi si possono formare …… codoni diversi.",c:["8","otto"],n:8,e:"2³ = 8."},
{id:"XB02",s:"bio",u:4,q:"Una persona di gruppo AB può ricevere globuli rossi di qualsiasi gruppo AB0: per questo è detta ricevente ……",c:["universale"],e:"Il suo plasma non contiene né anti-A né anti-B."},
{id:"XB03",s:"bio",u:5,q:"Il diametro dei microtubuli è di circa …… nm",c:["25","24"],n:25,tol:0.05,e:"Microfilamenti circa 7 nm, filamenti intermedi circa 10 nm."},
{id:"XF01",s:"fis",u:6,q:"Due condensatori da 6 μF e 3 μF collegati in parallelo hanno una capacità equivalente di …… μF",c:["9","nove"],n:9,e:"In parallelo le capacità si sommano."},
{id:"XF02",s:"fis",u:2,q:"Un sasso cade da fermo per 2 s (g = 10 m/s², senza attrito). Lo spazio percorso è …… m",c:["20","venti"],n:20,e:"½ × 10 × 4 = 20 m."},
{id:"XF03",s:"fis",u:7,q:"La diffusione della luce da parte delle molecole dell'aria, più intensa per le lunghezze d'onda brevi, si chiama diffusione di ……",c:["rayleigh"],e:"È proporzionale a 1/λ⁴."}
