BANK.push(
{id:"C080",s:"chem",u:6,q:"Nel propene (CH₂=CH−CH₃) gli atomi di carbonio hanno ibridazione, nell'ordine:",o:["sp², sp², sp³","sp³, sp³, sp³","sp, sp, sp³","sp², sp³, sp³","sp, sp², sp³"],e:"I due carboni del doppio legame sono sp²; il metile è sp³."},
{id:"C081",s:"chem",u:6,q:"La formula molecolare generale degli alcani aciclici è:",o:["CₙH₂ₙ₊₂","CₙH₂ₙ","CₙH₂ₙ₋₂","CₙHₙ","CₙH₂ₙ₊₁OH"],e:"CₙH₂ₙ è la formula di alcheni e cicloalcani; CₙH₂ₙ₋₂ quella degli alchini e dei dieni."},
{id:"C082",s:"chem",u:6,q:"Il nome IUPAC del composto CH₃−CH(CH₃)−CH₂−CH₃ è:",o:["2-metilbutano","3-metilbutano","isopentano normale","2-etilpropano","pentano"],e:"La catena più lunga ha 4 carboni (butano), con un metile sul C2: la numerazione va scelta in modo da dare ai sostituenti il numero più basso."},
{id:"C083",s:"chem",u:6,q:"La reazione tipica degli alcani con il cloro in presenza di luce UV è:",o:["sostituzione radicalica","addizione elettrofila","sostituzione nucleofila","eliminazione","sostituzione elettrofila aromatica"],e:"La luce rompe omoliticamente Cl₂; i radicali Cl· sottraggono un H all'alcano in una reazione a catena."},
{id:"C084",s:"chem",u:6,q:"L'addizione di HBr al propene, secondo la regola di Markovnikov, dà come prodotto principale:",o:["2-bromopropano","1-bromopropano","1,2-dibromopropano","propano","bromuro di allile"],e:"L'H⁺ si lega al carbonio che ha più idrogeni, formando il carbocatione secondario, più stabile; Br⁻ si lega poi al C2."},
{id:"C085",s:"chem",u:6,q:"L'ordine di stabilità dei carbocationi è:",o:["terziario > secondario > primario > metilico","metilico > primario > secondario > terziario","primario > secondario > terziario","secondario > terziario > primario","tutti hanno la stessa stabilità"],e:"I gruppi alchilici donano densità elettronica (effetto induttivo e iperconiugazione) e stabilizzano la carica positiva."},
{id:"C086",s:"chem",u:6,q:"Una reazione SN2:",o:["avviene in un solo stadio con inversione di configurazione","avviene in un solo stadio con ritenzione di configurazione","passa attraverso un carbocatione e porta a racemizzazione","è favorita sui substrati terziari e nei solventi protici","ha velocità che dipende solo dalla concentrazione del substrato"],e:"Il nucleofilo attacca dal lato opposto al gruppo uscente (inversione di Walden); v = k[substrato][nucleofilo]; è favorita sui substrati metilici e primari."},
{id:"C087",s:"chem",u:6,q:"Una reazione SN1 è favorita da:",o:["substrati terziari e solventi polari protici","substrati primari e solventi polari aprotici","nucleofili forti in alta concentrazione","substrati metilici e solventi apolari","substrati terziari e solventi apolari"],e:"Lo stadio lento è la formazione del carbocatione, stabilizzato dalla sostituzione e dal solvente polare protico; v = k[substrato]."},
{id:"C088",s:"chem",u:6,q:"Secondo la regola di Hückel, un composto ciclico planare e completamente coniugato è aromatico se possiede:",o:["4n + 2 elettroni π","4n elettroni π","un numero dispari di atomi di carbonio","solo legami semplici","almeno un eteroatomo"],e:"Il benzene ha 6 elettroni π (n = 1). I sistemi con 4n elettroni π sono antiaromatici."},
{id:"C089",s:"chem",u:6,q:"La reazione tipica del benzene è:",o:["la sostituzione elettrofila aromatica","l'addizione elettrofila al doppio legame","la sostituzione nucleofila aromatica","l'addizione nucleofila all'anello","la sostituzione radicalica sull'anello"],e:"La sostituzione conserva l'anello aromatico stabile; l'addizione distruggerebbe l'aromaticità."},
{id:"C090",s:"chem",u:6,q:"Nella sostituzione elettrofila aromatica, il gruppo −NO₂ legato all'anello è:",o:["disattivante e orientante in meta","attivante e orientante in orto/para","attivante e orientante in meta","disattivante e orientante in orto/para","senza effetto"],e:"Il nitro è un forte elettron-attrattore. Gruppi come −OH, −NH₂ e −CH₃ sono invece attivanti e orto/para orientanti; gli alogeni sono disattivanti ma orto/para orientanti."},
{id:"C091",s:"chem",u:6,q:"Il benzene è considerato tossico soprattutto perché:",o:["è cancerogeno e tossico per il midollo osseo","è un acido forte che corrode le mucose","è radioattivo a causa del carbonio-14","provoca solo irritazione cutanea reversibile","è un gas asfissiante che sposta l'ossigeno"],e:"I metaboliti epatici del benzene danneggiano il midollo osseo; è classificato come cancerogeno certo per l'uomo (IARC gruppo 1)."},
{id:"C092",s:"chem",u:6,q:"Un nucleofilo è una specie che:",o:["dona un doppietto elettronico a un centro povero di elettroni","accetta un doppietto elettronico da un centro ricco di elettroni","dona un doppietto elettronico a un centro ricco di elettroni","è sempre un catione con un orbitale vuoto","è necessariamente un radicale con un elettrone spaiato"],e:"Esempi di nucleofili: OH⁻, NH₃, H₂O, CN⁻. Gli elettrofili (es. H⁺, carbocationi) accettano doppietti."},
{id:"C093",s:"chem",u:6,q:"La rottura eterolitica di un legame covalente produce:",o:["due ioni di carica opposta","due radicali","due atomi neutri con un elettrone spaiato ciascuno","una molecola apolare","nessuna specie reattiva"],e:"Nella rottura eterolitica entrambi gli elettroni restano su un frammento (anione), l'altro rimane positivo. Nell'omolitica ogni frammento tiene un elettrone (radicali)."},
{id:"C094",s:"chem",u:6,q:"Il cicloesano è stabile e privo di tensione d'anello soprattutto perché:",o:["assume la conformazione a sedia con angoli di circa 109,5°","assume una conformazione planare con angoli di legame di 120°","assume la conformazione a barca con angoli di 90°","contiene doppi legami coniugati che lo stabilizzano","ha carboni sp² come il benzene"],e:"Nella conformazione a sedia gli angoli sono tetraedrici e gli idrogeni sfalsati. Il ciclopropano ha invece una forte tensione d'anello (angoli di 60°)."},

{id:"C095",s:"chem",u:7,q:"L'ossidazione di un alcol primario con un ossidante blando produce:",o:["un'aldeide","un chetone","un etere","un estere","un alcano"],e:"Alcol primario → aldeide → (ossidante forte) acido carbossilico. Alcol secondario → chetone. Alcol terziario: non si ossida in condizioni blande."},
{id:"C096",s:"chem",u:7,q:"L'ossidazione dell'etanolo nel fegato (alcol deidrogenasi) produce:",o:["acetaldeide","acetone","metanolo","acido formico","glicole etilenico"],e:"L'acetaldeide, tossica, viene poi ossidata ad acetato dall'aldeide deidrogenasi."},
{id:"C097",s:"chem",u:7,q:"Il fenolo è più acido dell'etanolo perché:",o:["la carica dello ione fenato è delocalizzata per risonanza sull'anello","l'ossidrile del fenolo forma legami a idrogeno più forti","l'anello aromatico dona elettroni all'ossigeno e lo stabilizza","il fenolo è un acido forte completamente dissociato","l'etanolo ha una base coniugata stabilizzata per risonanza"],e:"Il pKa del fenolo è circa 10, quello dell'etanolo circa 16: la stabilizzazione per risonanza della base coniugata rende il fenolo più acido."},
{id:"C098",s:"chem",u:7,q:"L'addizione di un alcol al gruppo carbonilico di un'aldeide forma:",o:["un emiacetale","un estere","un etere","un acetale","un chetale"],e:"Aldeide + alcol ⇌ emiacetale; con un secondo alcol, in ambiente acido, si forma un acetale. La ciclizzazione del glucosio è un emiacetale intramolecolare."},
{id:"C099",s:"chem",u:7,q:"La tautomeria cheto-enolica è un equilibrio tra:",o:["un carbonile e il suo enolo, per spostamento di un H in α","un'aldeide e un chetone con lo stesso numero di carboni","un alcol e un etere con la stessa formula bruta","due enantiomeri che si interconvertono","un carbonile e il suo enolo, per spostamento di un H in β"],e:"L'idrogeno in α al carbonile è debolmente acido; l'equilibrio è importante in reazioni biologiche come l'isomerizzazione dei fosfati di zuccheri in glicolisi."},
{id:"C100",s:"chem",u:7,q:"La condensazione aldolica forma un nuovo legame:",o:["C−C tra un enolato e il carbonio carbonilico di un altro carbonile","C−O tra un enolato e l'ossigeno carbonilico di un altro carbonile","C−N tra un'ammina e il carbonio carbonilico di un'aldeide","C−C tra due carbonili con eliminazione di CO₂","estere tra un acido carbossilico e un alcol"],e:"Il prodotto è un β-idrossicarbonile. In biochimica, l'aldolasi della glicolisi catalizza la reazione inversa."},
{id:"C101",s:"chem",u:7,q:"La reazione tra un acido carbossilico e un alcol in ambiente acido (esterificazione di Fischer) produce:",o:["un estere e acqua","un'ammide e acqua","un etere e acqua","un'anidride","un sale"],e:"R−COOH + R'−OH ⇌ R−COO−R' + H₂O. La reazione è reversibile; l'idrolisi basica degli esteri si chiama saponificazione."},
{id:"C102",s:"chem",u:7,q:"Tra i derivati degli acidi carbossilici, il più reattivo nella sostituzione nucleofila acilica è:",o:["il cloruro acilico","l'ammide","l'estere","l'acido carbossilico","il carbossilato"],e:"Ordine di reattività: alogenuri acilici > anidridi > tioesteri > esteri > ammidi. I tioesteri (es. acetil-CoA) sono intermedi 'attivati' in biochimica."},
{id:"C103",s:"chem",u:7,q:"Le ammine si comportano da basi perché:",o:["l'azoto ha un doppietto solitario che può accettare un protone","l'azoto cede facilmente all'acqua il protone legato","l'azoto ha un orbitale vuoto che accetta un doppietto dall'acqua","l'anello aromatico dona elettroni all'azoto","contengono un gruppo carbossilico deprotonato"],e:"Le ammine alifatiche sono basi un po' più forti dell'ammoniaca; quelle aromatiche (anilina) sono più deboli per la delocalizzazione del doppietto sull'anello."},
{id:"C104",s:"chem",u:7,q:"Le ammidi, rispetto alle ammine, sono:",o:["quasi non basiche: il doppietto dell'azoto è delocalizzato sul carbonile","basi più forti: il carbonile aumenta la densità elettronica sull'azoto","acidi forti: il carbonile rende l'N−H completamente dissociato","basi simili: il carbonile non influenza il doppietto","quasi non basiche perché l'azoto non ha doppietti solitari"],e:"La risonanza conferisce al legame C−N un parziale carattere di doppio legame: è il motivo per cui il legame peptidico è planare e rigido."},
{id:"C105",s:"chem",u:7,q:"Una base di Schiff (immina) si forma dalla reazione tra:",o:["un'aldeide o un chetone e un'ammina primaria","un'aldeide o un chetone e un'ammina terziaria","un acido carbossilico e un'ammina primaria","un'aldeide e un alcol in ambiente acido","un estere e un'ammina secondaria"],e:"Si forma un doppio legame C=N con eliminazione di acqua. Esempi biologici: il legame retinale-opsina nella rodopsina e gli intermedi con il piridossal fosfato."},
{id:"C106",s:"chem",u:7,q:"L'urea è chimicamente:",o:["la diammide dell'acido carbonico","l'ammide dell'acido acetico","un amminoacido a due atomi di azoto","il diestere dell'acido carbonico","un'ammina terziaria"],e:"Formula H₂N−CO−NH₂: è la principale forma di eliminazione dell'azoto nei mammiferi."},
{id:"C107",s:"chem",u:7,q:"Due molecole sono enantiomeri quando:",o:["sono immagini speculari non sovrapponibili","hanno diversa formula molecolare","differiscono per la posizione di un doppio legame","sono immagini speculari sovrapponibili","differiscono per la configurazione di uno solo di più centri stereogenici"],e:"Gli enantiomeri hanno le stesse proprietà fisiche ma ruotano la luce polarizzata in senso opposto. Gli epimeri, citati tra le opzioni, sono invece un tipo di diastereoisomeri."},
{id:"C108",s:"chem",u:7,q:"Una miscela racemica:",o:["contiene quantità uguali di due enantiomeri ed è otticamente inattiva","contiene quantità uguali di due diastereoisomeri ed è otticamente attiva","contiene un solo enantiomero e ruota il piano della luce polarizzata","è un composto meso con due centri chirali opposti","contiene quantità diverse di due enantiomeri ed è inattiva"],e:"Le rotazioni opposte dei due enantiomeri si annullano."},
{id:"C109",s:"chem",u:7,q:"Un composto meso:",o:["ha centri stereogenici ma un piano di simmetria interno ed è inattivo","ha centri stereogenici, nessun piano di simmetria ed è otticamente attivo","è una miscela equimolare di due enantiomeri, otticamente inattiva","non ha centri stereogenici ed è quindi otticamente inattivo","ha un solo centro stereogenico e un piano di simmetria"],e:"Esempio: l'acido meso-tartarico. È achirale nonostante abbia due carboni stereogenici."},
{id:"C110",s:"chem",u:7,q:"Quanti stereoisomeri sono possibili al massimo per una molecola con 3 centri stereogenici?",o:["8","3","6","9","4"],e:"Al massimo 2ⁿ = 2³ = 8 (meno se esistono forme meso)."},
{id:"C111",s:"chem",u:7,q:"Il 2-butene presenta isomeria cis/trans perché:",o:["ciascun carbonio del doppio legame porta due sostituenti diversi","uno dei carboni del doppio legame porta due sostituenti uguali","possiede un carbonio chirale ibridato sp³","il doppio legame si trova in posizione terminale","la rotazione attorno al doppio legame è libera"],e:"Il 1-butene non presenta isomeria geometrica perché il C1 porta due H identici."},
{id:"C112",s:"chem",u:7,q:"La formazione di un tioestere come l'acetil-CoA è importante in biochimica perché:",o:["è un legame 'ad alta energia', facile da trasferire nelle acilazioni","è un legame inerte che protegge il gruppo acetile dall'idrolisi","è un legame a bassa energia, stabile e difficile da idrolizzare","forma legami a idrogeno molto forti con gli enzimi","è un acido forte che cede protoni nel ciclo di Krebs"],e:"L'idrolisi dei tioesteri ha un ΔG° molto negativo; l'acetil-CoA cede il gruppo acetile nel ciclo di Krebs e nelle sintesi."},
{id:"C113",s:"chem",u:7,q:"L'ubichinone (coenzima Q) nella catena respiratoria:",o:["trasporta elettroni passando dalla forma chinonica all'ubichinolo","trasporta elettroni legato a un gruppo eme, come il citocromo c","cede gli elettroni direttamente all'ossigeno, come il complesso IV","sintetizza ATP direttamente ruotando come la subunità F₀","è un trasportatore idrosolubile dello spazio intermembrana"],e:"L'ubichinone è un trasportatore liposolubile della membrana mitocondriale interna; accetta due elettroni e due protoni diventando ubichinolo."},
{id:"C114",s:"chem",u:7,q:"La decarbossilazione è particolarmente facile per:",o:["i β-chetoacidi","gli alcani","gli eteri","le ammine terziarie","gli alcoli primari"],e:"I β-chetoacidi (es. acetoacetato) perdono CO₂ già per blando riscaldamento tramite uno stato di transizione ciclico."},

{id:"C115",s:"chem",u:8,q:"A pH fisiologico (circa 7,4), un amminoacido neutro come l'alanina si trova prevalentemente come:",o:["zwitterione (−NH₃⁺ e −COO⁻)","molecola completamente neutra senza cariche","catione","anione con −NH₂ e −COO⁻","forma non ionizzata insolubile"],e:"Il gruppo carbossilico (pKa ≈ 2) è deprotonato e l'amminico (pKa ≈ 9-10) è protonato."},
{id:"C116",s:"chem",u:8,q:"Il punto isoelettrico di un amminoacido è il pH al quale:",o:["la carica netta della molecola è zero","l'amminoacido è completamente protonato","l'amminoacido precipita sempre","la solubilità è massima","il gruppo amminico perde il protone"],e:"Per un amminoacido con catena laterale non ionizzabile pI = (pKa₁ + pKa₂)/2. Al pI la molecola non migra in un campo elettrico."},
{id:"C117",s:"chem",u:8,q:"Gli amminoacidi delle proteine umane (tranne la glicina) hanno configurazione:",o:["L","D","sia D che L in parti uguali","R per tutti","meso"],e:"La glicina (R = H) è l'unico amminoacido achirale. In convenzione R/S, quasi tutti gli L-amminoacidi sono S (la L-cisteina è R)."},
{id:"C118",s:"chem",u:8,q:"Quale dei seguenti amminoacidi ha una catena laterale carica positivamente a pH fisiologico?",o:["Lisina","Acido glutammico","Serina","Leucina","Fenilalanina"],e:"Basici: lisina, arginina (e in parte istidina). Acidi: aspartato e glutammato. Serina è polare neutra, leucina e fenilalanina idrofobiche."},
{id:"C119",s:"chem",u:8,q:"Il legame peptidico:",o:["è planare per il parziale carattere di doppio legame C−N","ruota liberamente perché è un legame semplice C−N","è planare perché il legame C−N è un vero doppio legame","si forma tra due gruppi carbossilici con perdita d'acqua","è di norma in configurazione cis, non trans"],e:"La rotazione è possibile solo attorno ai legami Cα−N (φ) e Cα−C (ψ); il gruppo peptidico è di norma in configurazione trans."},
{id:"C120",s:"chem",u:8,q:"La struttura quaternaria di una proteina descrive:",o:["l'associazione di più catene polipeptidiche (subunità)","la sequenza lineare degli amminoacidi nella catena","le α-eliche e i foglietti β stabilizzati da legami H","il ripiegamento tridimensionale di una singola catena","i ponti disolfuro all'interno di una stessa catena"],e:"Esempio: l'emoglobina è un tetramero α₂β₂."},
{id:"C121",s:"chem",u:8,q:"Il glucosio e il galattosio sono:",o:["epimeri in C4","enantiomeri","anomeri","isomeri di posizione del gruppo carbonilico","epimeri in C2"],e:"Differiscono solo per la configurazione al C4. Glucosio e mannosio sono epimeri in C2; glucosio e fruttosio sono isomeri costituzionali (aldoso/chetoso)."},
{id:"C122",s:"chem",u:8,q:"L'α-D-glucopiranosio e il β-D-glucopiranosio sono:",o:["anomeri, che differiscono per la configurazione del C1","enantiomeri, immagini speculari non sovrapponibili","epimeri in C4, come glucosio e galattosio","epimeri in C2, come glucosio e mannosio","tautomeri, che differiscono per la posizione di un H"],e:"In soluzione si interconvertono passando per la forma aperta (mutarotazione)."},
{id:"C123",s:"chem",u:8,q:"Il saccarosio è formato da:",o:["glucosio e fruttosio uniti da un legame α(1→2)β","due molecole di glucosio con legame α(1→4)","galattosio e glucosio con legame β(1→4)","glucosio e fruttosio uniti da un legame β(1→4)","due molecole di glucosio con legame α(1→1)"],e:"Coinvolgendo entrambi i carboni anomerici, il saccarosio non è uno zucchero riducente. Il lattosio è galattosio-β(1→4)-glucosio; il maltosio è glucosio-α(1→4)-glucosio."},
{id:"C124",s:"chem",u:8,q:"La cellulosa differisce dall'amido perché:",o:["le unità di glucosio sono unite da legami β(1→4) invece che α(1→4)","le unità di glucosio sono unite da legami α(1→6) invece che α(1→4)","è formata da fruttosio invece che da glucosio","è ramificata ogni 8-12 residui con legami β(1→6)","è un eteropolisaccaride di glucosio e galattosio"],e:"I legami β danno catene lineari rigide unite da legami a idrogeno; l'uomo non possiede enzimi per idrolizzarli."},
{id:"C125",s:"chem",u:8,q:"Il glicogeno è:",o:["un polimero di glucosio con legami α(1→4) e frequenti ramificazioni α(1→6)","un polimero di glucosio con legami β(1→4) e rare ramificazioni β(1→6)","un polimero lineare di glucosio con soli legami α(1→4)","un eteropolisaccaride della matrice extracellulare","un polimero di fruttosio con legami β(2→1)"],e:"È la riserva di glucosio nel fegato e nel muscolo; è più ramificato dell'amilopectina."},
{id:"C126",s:"chem",u:8,q:"La reazione di Maillard avviene tra:",o:["il carbonile di uno zucchero riducente e un gruppo amminico libero","il carbonile di uno zucchero non riducente e un gruppo ossidrilico","il gruppo carbossilico di un acido grasso e un gruppo amminico","due zuccheri riducenti, con formazione di un legame glicosidico","un gruppo amminico e un gruppo fosfato di un nucleotide"],e:"Si forma una base di Schiff che riarrangia nel prodotto di Amadori. L'emoglobina glicata (HbA1c), usata nel monitoraggio del diabete, è un prodotto di Amadori."},
{id:"C127",s:"chem",u:8,q:"Un acido grasso saturo:",o:["non contiene doppi legami C=C nella catena","contiene almeno un doppio legame cis","contiene solo doppi legami in configurazione trans","è liquido a temperatura ambiente","ha una catena ramificata con un anello"],e:"Le catene sature si impacchettano bene e hanno punti di fusione più alti; i doppi legami cis creano pieghe che abbassano il punto di fusione."},
{id:"C128",s:"chem",u:8,q:"Gli acidi grassi essenziali per l'uomo sono:",o:["l'acido linoleico (ω-6) e l'acido α-linolenico (ω-3)","l'acido palmitico (16:0) e l'acido stearico (18:0)","l'acido oleico (ω-9) e l'acido palmitoleico (ω-7)","l'acido oleico (ω-9) e l'acido linoleico (ω-6)","l'acido butirrico (4:0) e l'acido arachidico (20:0)"],e:"L'uomo non sa introdurre doppi legami oltre il C9 contando dal carbossile, quindi deve assumerli con la dieta."},
{id:"C129",s:"chem",u:8,q:"I trigliceridi sono:",o:["esteri del glicerolo con tre acidi grassi","esteri del glicerolo con due acidi grassi e un fosfato","ammidi della sfingosina con un acido grasso","esteri del colesterolo con un acido grasso","esteri di un alcol a lunga catena con un acido grasso"],e:"Sono la principale riserva energetica (tessuto adiposo) e sono molecole apolari."},
{id:"C130",s:"chem",u:8,q:"I glicerofosfolipidi, come la fosfatidilcolina:",o:["anfipatici: testa polare fosforilata e due code idrofobiche","anfipatici: testa polare zuccherina e una coda idrofobica","completamente apolari, come i trigliceridi","derivati della sfingosina con una sola coda idrofobica","completamente polari e solubili in acqua in ogni rapporto"],e:"Sono i principali componenti delle membrane biologiche. Gli sfingolipidi (es. sfingomielina) hanno invece come scheletro la sfingosina."},
{id:"C131",s:"chem",u:8,q:"Il colesterolo:",o:["è uno sterolo a quattro anelli fusi con un OH in C3","è uno sterolo a quattro anelli fusi con un gruppo chetonico in C3","è un acido grasso insaturo a lunga catena","è un glicerofosfolipide con testa di colina","è uno sterolo idrosolubile assente nelle membrane animali"],e:"Nelle membrane ne modula la fluidità. Da esso derivano cortisolo, aldosterone, ormoni sessuali, vitamina D e acidi biliari."},
{id:"C132",s:"chem",u:8,q:"Un nucleotide è costituito da:",o:["una base azotata, un pentoso e uno o più gruppi fosfato","una base azotata e un pentoso, senza gruppi fosfato","una base azotata, un esoso e uno o più gruppi fosfato","un pentoso e uno o più gruppi fosfato, senza base","due basi azotate unite da un ponte fosfato"],e:"Il nucleoside è base + zucchero (legame N-glicosidico); aggiungendo i fosfati sul C5' si ottiene il nucleotide."},
{id:"C133",s:"chem",u:8,q:"Le basi puriniche sono:",o:["adenina e guanina","citosina, timina e uracile","adenina e citosina","guanina e timina","solo l'uracile"],e:"Le purine hanno due anelli fusi; le pirimidine (C, T, U) un solo anello."},
{id:"C134",s:"chem",u:8,q:"L'energia dell'ATP disponibile per il lavoro cellulare deriva soprattutto:",o:["dall'idrolisi dei legami fosfoanidridici tra i fosfati","dall'idrolisi del legame estere tra ribosio e fosfato α","dalla rottura del legame N-glicosidico adenina-ribosio","dall'ossidazione dell'adenina a ipoxantina","dalla rottura dell'anello del ribosio"],e:"ATP + H₂O → ADP + Pi ha ΔG°' ≈ −30,5 kJ/mol, grazie alla repulsione tra cariche negative, alla stabilizzazione per risonanza e all'idratazione dei prodotti."},
{id:"C135",s:"chem",u:8,q:"I glicosamminoglicani (es. acido ialuronico, condroitin solfato) sono:",o:["eteropolisaccaridi lineari di disaccaridi ripetuti con un amminozucchero","omopolisaccaridi ramificati di glucosio con legami α(1→4) e α(1→6)","proteine fibrose glicosilate della matrice extracellulare","eteropolisaccaridi ramificati privi di cariche negative","lipidi complessi con teste zuccherine ripetute"],e:"Sono molto carichi negativamente (carbossili e solfati), legano molta acqua e danno alla matrice extracellulare resistenza alla compressione."},
{id:"C136",s:"chem",u:8,q:"I ponti disolfuro nelle proteine si formano per:",o:["ossidazione dei gruppi −SH di due residui di cisteina","riduzione dei gruppi −SH di due residui di cisteina","ossidazione dei gruppi −SCH₃ di due metionine","condensazione degli ossidrili di due serine","legame a idrogeno tra due residui di cisteina"],e:"Il legame −S−S− è covalente e stabilizza la struttura terziaria e quaternaria, ad esempio nelle catene dell'insulina e negli anticorpi."},

{id:"CC23",s:"chem",u:5,q:"A 25 °C il prodotto ionico dell'acqua Kw vale 1 · 10^……",c:["-14","−14"],n:-14,e:"Kw = [H₃O⁺][OH⁻] = 10⁻¹⁴, quindi pH + pOH = 14."},

{id:"CC27",s:"chem",u:5,q:"Un tampone formato da un acido debole con pKa = 4,8 e dalla sua base coniugata in concentrazioni uguali ha pH ……",c:["4,8","4.8"],n:4.8,e:"Con [A⁻] = [HA], log 1 = 0 e pH = pKa."},

{id:"CC29",s:"chem",u:5,q:"L'equazione che permette di calcolare il potenziale di un elettrodo in condizioni non standard è l'equazione di ……",c:["nernst"],e:"E = E° − (RT/nF)·ln Q."},
{id:"CC30",s:"chem",u:5,q:"Per un elettrodo standard a idrogeno il potenziale di riduzione standard vale per convenzione …… V",c:["0","zero","0,00","0.00"],n:0,e:"È il riferimento rispetto al quale si misurano tutti gli E°."},

{id:"CC32",s:"chem",u:6,q:"Il nome IUPAC dell'idrocarburo CH₃−CH₂−CH₂−CH₂−CH₃ è ……",c:["pentano","n-pentano"],e:"Cinque atomi di carbonio, catena lineare, solo legami semplici."},
{id:"CC33",s:"chem",u:6,q:"Il numero di elettroni π del benzene è ……",c:["6","sei"],n:6,e:"Tre doppi legami formali delocalizzati: 4n + 2 con n = 1."},

{id:"CC44",s:"chem",u:8,q:"Il legame che unisce due amminoacidi in una proteina si chiama legame ……",c:["peptidico","ammidico"],e:"È un legame ammidico tra il carbossile di un amminoacido e l'amminico del successivo."},

{id:"CC46",s:"chem",u:8,q:"Il disaccaride del latte, formato da galattosio e glucosio, è il ……",c:["lattosio"],e:"Viene idrolizzato dall'enzima lattasi."},
