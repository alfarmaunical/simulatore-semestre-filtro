{id:"FU306",s:"fis",u:3,q:"La sfigmomanometria (misura della pressione arteriosa con il bracciale) si basa sull'ascolto dei suoni di Korotkoff, prodotti da:",o:["il flusso turbolento del sangue nell'arteria parzialmente compressa","il flusso laminare del sangue nell'arteria parzialmente compressa","la vibrazione delle valvole cardiache trasmessa lungo l'arteria","il battito del bracciale contro la parete del braccio","l'arresto completo del flusso nell'arteria chiusa"],e:"Quando la pressione del bracciale scende sotto quella sistolica il sangue passa a getti, in regime turbolento e quindi rumoroso."},

// ---- Unità 4: onde (+35 MC)
{id:"FU401",s:"fis",u:4,q:"Un'onda meccanica trasporta:",o:["energia, senza trasporto netto di materia","materia, senza trasporto netto di energia","sia energia sia materia nella direzione di propagazione","solo quantità di moto, senza energia","né energia né materia"],e:"Le particelle del mezzo oscillano intorno alla posizione di equilibrio."},
{id:"FU402",s:"fis",u:4,q:"La relazione tra velocità di propagazione v, lunghezza d'onda λ e frequenza f è:",o:["v = λ·f","v = λ/f","v = f/λ","v = λ + f","v = λ²·f"],e:"In un periodo l'onda avanza di una lunghezza d'onda: v = λ/T = λ·f."},
{id:"FU403",s:"fis",u:4,q:"La pulsazione ω di un'onda di frequenza 50 Hz è circa:",o:["314 rad/s","50 rad/s","8 rad/s","100 rad/s","3,14 rad/s"],e:"ω = 2πf."},
{id:"FU404",s:"fis",u:4,q:"Un'onda ha periodo 4 ms. La sua frequenza è:",o:["250 Hz","4 Hz","0,25 Hz","4000 Hz","25 Hz"],e:"f = 1/T = 1/0,004 s."},
{id:"FU405",s:"fis",u:4,q:"Il vettore d'onda k di un'onda armonica ha modulo:",o:["2π/λ","λ/2π","2π·f","1/T","v·λ"],e:"Indica la direzione di propagazione; insieme a ω compare nell'equazione y = A·sen(kx − ωt)."},
{id:"FU406",s:"fis",u:4,q:"Nell'equazione di un'onda y = A·sen(kx − ωt), la grandezza A rappresenta:",o:["l'ampiezza","la frequenza","la lunghezza d'onda","la velocità","la fase iniziale"],e:"È lo spostamento massimo dalla posizione di equilibrio."},
{id:"FU407",s:"fis",u:4,q:"La velocità di un'onda su una corda tesa aumenta:",o:["aumentando la tensione della corda","aumentando la massa per unità di lunghezza","aumentando l'ampiezza","diminuendo la tensione","aumentando la frequenza della sorgente"],e:"v = √(T/μ): dipende solo dalle proprietà del mezzo."},
{id:"FU408",s:"fis",u:4,q:"La velocità del suono in un gas, all'aumentare della temperatura:",o:["aumenta","diminuisce","resta costante","si annulla","dipende solo dalla frequenza"],e:"In aria passa da circa 331 m/s a 0 °C a circa 343 m/s a 20 °C."},
{id:"FU409",s:"fis",u:4,q:"Un'onda sonora di frequenza 1000 Hz in aria (340 m/s) ha lunghezza d'onda:",o:["0,34 m","3,4 m","34 m","0,034 m","340 m"],e:"λ = 340/1000."},
{id:"FU410",s:"fis",u:4,q:"Gli ultrasuoni usati in ecografia (circa 1-15 MHz) hanno nei tessuti (circa 1540 m/s) lunghezze d'onda dell'ordine di:",o:["decimi di millimetro","metri","centimetri","micrometri","nanometri"],e:"A 5 MHz λ ≈ 0,3 mm: lunghezze d'onda piccole permettono una buona risoluzione."},
{id:"FU411",s:"fis",u:4,q:"In ecografia, aumentando la frequenza degli ultrasuoni:",o:["migliora la risoluzione ma diminuisce la profondità esplorabile","migliora sia la risoluzione sia la profondità esplorabile","peggiora la risoluzione ma aumenta la profondità esplorabile","peggiora sia la risoluzione sia la profondità esplorabile","migliora la risoluzione e la profondità non cambia"],e:"Per gli organi profondi si usano frequenze più basse; per tessuti superficiali (tiroide, tendini) più alte."},
{id:"FU412",s:"fis",u:4,q:"L'altezza di un suono (acuto o grave) dipende soprattutto dalla sua:",o:["frequenza","ampiezza","velocità","durata","direzione"],e:"L'intensità percepita (forte o debole) dipende dall'ampiezza; il timbro dalla composizione in armoniche."},
{id:"FU413",s:"fis",u:4,q:"Il timbro di un suono, che permette di distinguere strumenti diversi che suonano la stessa nota:",o:["dipende dalla forma d'onda, cioè dalle armoniche","dipende solo dalla frequenza fondamentale","dipende solo dall'intensità del suono","dipende dalla velocità del suono nell'aria","dipende dalla lunghezza d'onda fondamentale"],e:"Due strumenti con la stessa fondamentale hanno armoniche con intensità diverse."},
{id:"FU414",s:"fis",u:4,q:"Un suono di 120 dB, rispetto a uno di 60 dB, ha intensità:",o:["10⁶ volte maggiore","2 volte maggiore","60 volte maggiore","10¹² volte maggiore","1000 volte maggiore"],e:"60 dB di differenza = fattore 10⁶."},
{id:"FU415",s:"fis",u:4,q:"La soglia del dolore per l'orecchio umano si trova intorno a:",o:["120-130 dB","0 dB","40-50 dB","60-70 dB","200 dB"],e:"Corrisponde a circa 1-10 W/m²."},
{id:"FU416",s:"fis",u:4,q:"Raddoppiando l'intensità di un suono, il livello sonoro aumenta di circa:",o:["3 dB","2 dB","10 dB","20 dB","6 dB"],e:"10·log 2 ≈ 3 dB."},
{id:"FU417",s:"fis",u:4,q:"Per una sorgente puntiforme, passando da 1 m a 10 m di distanza il livello sonoro diminuisce di:",o:["20 dB","10 dB","2 dB","100 dB","3 dB"],e:"L'intensità diminuisce di 100 volte (1/r²): −20 dB."},
{id:"FU418",s:"fis",u:4,q:"Le onde stazionarie si formano per:",o:["sovrapposizione di due onde uguali che si propagano in versi opposti","sovrapposizione di due onde uguali che si propagano nello stesso verso","sovrapposizione di due onde di frequenza leggermente diversa","diffrazione di un'onda attraverso una fenditura stretta","riflessione di un'onda su un mezzo che la assorbe"],e:"Si osservano in corde fisse agli estremi e in canne d'organo."},
{id:"FU419",s:"fis",u:4,q:"Una corda lunga 1 m fissata agli estremi vibra nella sua armonica fondamentale a 200 Hz. La velocità delle onde sulla corda è:",o:["400 m/s","200 m/s","100 m/s","800 m/s","2 m/s"],e:"λ = 2L = 2 m; v = λ·f = 400 m/s."},
{id:"FU420",s:"fis",u:4,q:"La seconda armonica di una corda fissata agli estremi ha frequenza:",o:["doppia della fondamentale","uguale alla fondamentale","metà della fondamentale","quadrupla della fondamentale","tripla della fondamentale"],e:"Le armoniche di una corda sono fₙ = n·f₁."},
{id:"FU421",s:"fis",u:4,q:"Due onde di uguale ampiezza A che interferiscono in modo costruttivo producono un'onda di ampiezza:",o:["2A","A","0","A²","√2·A"],e:"In fase le ampiezze si sommano; l'intensità diventa 4 volte quella di una singola onda."},
{id:"FU422",s:"fis",u:4,q:"Due suoni di frequenza molto vicina (es. 440 Hz e 442 Hz) sovrapposti producono:",o:["battimenti, con variazioni periodiche dell'intensità a 2 Hz","battimenti, con variazioni periodiche dell'intensità a 441 Hz","un suono a 882 Hz, somma delle due frequenze","un'onda stazionaria a 2 Hz udibile come nota","silenzio, per interferenza distruttiva"],e:"La frequenza dei battimenti è la differenza delle frequenze. I musicisti li usano per accordare gli strumenti."},
{id:"FU423",s:"fis",u:4,q:"La riflessione del suono su una parete lontana che si percepisce come ripetizione distinta si chiama:",o:["eco","riverbero","rifrazione","diffrazione","risonanza"],e:"Per percepire un'eco distinta servono almeno circa 0,1 s di ritardo, cioè una parete a più di 17 m."},
{id:"FU424",s:"fis",u:4,q:"Un pipistrello emette un ultrasuono e ne riceve l'eco dopo 0,02 s. Con v = 340 m/s, l'ostacolo dista:",o:["3,4 m","6,8 m","17 m","0,34 m","1,7 m"],e:"Il suono percorre andata e ritorno: d = v·t/2 = 340 × 0,02/2."},
{id:"FU425",s:"fis",u:4,q:"L'ecografia ricostruisce la profondità di una struttura misurando:",o:["il tempo che l'eco impiega a tornare alla sonda","la variazione di frequenza dell'eco rispetto all'onda emessa","l'intensità dell'eco che torna alla sonda","la frequenza dell'onda emessa dalla sonda","la lunghezza d'onda dell'onda emessa"],e:"Si assume una velocità media nei tessuti di 1540 m/s."},
{id:"FU426",s:"fis",u:4,q:"Nell'ecodoppler, se il sangue si allontana dalla sonda, la frequenza dell'eco ricevuta è:",o:["minore di quella emessa","maggiore di quella emessa","uguale a quella emessa","nulla","doppia"],e:"Dal valore dello spostamento di frequenza si calcola la velocità del sangue."},
{id:"FU427",s:"fis",u:4,q:"Un osservatore che si avvicina a una sorgente sonora ferma percepisce:",o:["una frequenza maggiore di quella emessa","una frequenza minore di quella emessa","la stessa frequenza, perché la sorgente è ferma","una lunghezza d'onda maggiore di quella emessa","una velocità del suono minore"],e:"L'effetto Doppler si verifica sia se si muove la sorgente sia se si muove l'osservatore."},
{id:"FU428",s:"fis",u:4,q:"La risonanza si verifica quando:",o:["la frequenza della sollecitazione coincide con una frequenza propria e l'ampiezza cresce","la frequenza della sollecitazione è doppia di quella propria e l'ampiezza si annulla","due onde in opposizione di fase si annullano a vicenda","un'onda passa da un mezzo a un altro cambiando velocità","la frequenza della sollecitazione coincide con quella propria e l'ampiezza diminuisce"],e:"Esempi: il bicchiere che si rompe con una nota, l'amplificazione nella cassa armonica di una chitarra."},
{id:"FU429",s:"fis",u:4,q:"Le onde sonore non possono essere polarizzate perché:",o:["nei fluidi sono onde longitudinali","nei fluidi sono onde trasversali","sono onde elettromagnetiche longitudinali","hanno frequenza troppo bassa","si propagano troppo lentamente"],e:"La polarizzazione è tipica delle onde trasversali, come la luce."},
{id:"FU430",s:"fis",u:4,q:"L'intensità di un'onda sonora a una certa distanza dalla sorgente è 10⁻⁶ W/m². Il livello sonoro è:",o:["60 dB","6 dB","−60 dB","120 dB","10 dB"],e:"10·log(10⁻⁶/10⁻¹²) = 60 dB."},
{id:"FU431",s:"fis",u:4,q:"La potenza trasportata da un'onda sonora che attraversa una superficie di 2 m² con intensità 0,01 W/m² è:",o:["0,02 W","0,005 W","2 W","0,01 W","200 W"],e:"P = I·A."},
{id:"FU432",s:"fis",u:4,q:"La coclea dell'orecchio interno distingue frequenze diverse perché:",o:["punti diversi della membrana basilare risuonano a frequenze diverse","tutta la membrana basilare vibra insieme a qualsiasi frequenza","contiene cristalli piezoelettrici tarati su frequenze diverse","la base della coclea risponde ai suoni gravi e l'apice agli acuti","misura lo spostamento Doppler dell'onda nel liquido cocleare"],e:"La base della coclea risponde ai suoni acuti, l'apice ai gravi."},
{id:"FU433",s:"fis",u:4,q:"Un oscillatore armonico (massa-molla) è il modello base delle onde perché:",o:["ogni punto del mezzo attraversato da un'onda armonica oscilla di moto armonico","ogni punto del mezzo attraversato da un'onda si sposta insieme all'onda","le onde si propagano sempre lungo traiettorie circolari","l'energia di un'onda è sempre uguale a quella di una molla","le onde armoniche hanno ampiezza costante solo se c'è una molla"],e:"Un'onda è una perturbazione che si propaga facendo oscillare in successione i punti del mezzo."},
{id:"FU434",s:"fis",u:4,q:"Le onde sismiche P (primarie), che arrivano per prime, sono:",o:["longitudinali, e si propagano anche nei liquidi","trasversali, e non attraversano i liquidi","longitudinali, e non attraversano i liquidi","trasversali, e si propagano anche nei liquidi","onde di superficie lente e distruttive"],e:"Le onde S, trasversali e più lente, non attraversano il nucleo esterno liquido della Terra."},
{id:"FU435",s:"fis",u:4,q:"Raddoppiando la frequenza di un'onda in un mezzo, a parità di velocità di propagazione, la lunghezza d'onda:",o:["si dimezza","raddoppia","resta uguale","quadruplica","si riduce a un quarto"],e:"λ = v/f."},

// ---- Unità 5: termodinamica (+22 MC)
{id:"FU501",s:"fis",u:5,q:"Due corpi a contatto termico raggiungono l'equilibrio quando hanno:",o:["la stessa temperatura","la stessa quantità di calore","la stessa massa","la stessa energia interna","lo stesso calore specifico"],e:"È il principio zero della termodinamica, alla base dei termometri."},
{id:"FU502",s:"fis",u:5,q:"Una temperatura di 100 °F corrisponde a circa:",o:["38 °C","100 °C","212 °C","56 °C","73 °C"],e:"T(°C) = (T(°F) − 32)·5/9 = 68 × 5/9 ≈ 37,8 °C."},
{id:"FU503",s:"fis",u:5,q:"Una variazione di temperatura di 10 °C corrisponde a una variazione di:",o:["10 K","283 K","−263 K","50 K","18 K"],e:"Le scale Celsius e Kelvin hanno gradi della stessa ampiezza: cambia solo lo zero."},
{id:"FU504",s:"fis",u:5,q:"Il calore specifico dell'acqua è circa:",o:["4186 J/(kg·K)","418,6 J/(kg·K)","1 J/(kg·K)","41,86 J/(kg·K)","4,186 J/(kg·K)"],e:"Cioè 1 kcal/(kg·K) = 1 cal/(g·K): è tra i più alti tra le sostanze comuni."},
{id:"FU505",s:"fis",u:5,q:"Due corpi con la stessa massa ricevono la stessa quantità di calore. Il primo ha calore specifico doppio del secondo. La variazione di temperatura del primo è:",o:["la metà di quella del secondo","il doppio di quella del secondo","uguale a quella del secondo","un quarto di quella del secondo","quattro volte quella del secondo"],e:"ΔT = Q/(m·c)."},
{id:"FU506",s:"fis",u:5,q:"Un calorimetro serve a:",o:["misurare il calore scambiato in un processo","misurare la temperatura assoluta di un corpo","misurare il calore latente solo dei gas","misurare la capacità termica dell'aria","misurare l'energia interna di un gas ideale"],e:"Si basa sullo scambio di calore con una massa nota d'acqua in un recipiente isolato."},
{id:"FU507",s:"fis",u:5,q:"Durante l'ebollizione dell'acqua a pressione costante, il calore fornito:",o:["fa passare le molecole allo stato di vapore e la temperatura resta costante","fa aumentare la temperatura dell'acqua fino al completamento","fa passare le molecole allo stato di vapore e la temperatura aumenta","fa aumentare l'energia cinetica media delle molecole","viene ceduto all'ambiente e la temperatura diminuisce"],e:"È il calore latente di vaporizzazione."},
{id:"FU508",s:"fis",u:5,q:"Per trasformare 1 kg di acqua a 100 °C in vapore a 100 °C servono circa:",o:["2260 kJ","418,6 kJ","334 kJ","4,186 kJ","100 kJ"],e:"Il calore latente di vaporizzazione è circa 5 volte il calore necessario per scaldare la stessa acqua da 0 a 100 °C."},
{id:"FU509",s:"fis",u:5,q:"Un buon isolante termico ha:",o:["bassa conducibilità termica","alta conducibilità termica","alto calore specifico soltanto","alta densità","alta conducibilità elettrica"],e:"L'aria ferma è un ottimo isolante: per questo isolano piumini, lana e materiali porosi."},
{id:"FU510",s:"fis",u:5,q:"Un thermos riduce gli scambi di calore perché:",o:["il vuoto blocca conduzione e convezione, l'argentatura riduce l'irraggiamento","il vuoto blocca l'irraggiamento, l'argentatura riduce conduzione e convezione","il metallo delle pareti conduce poco il calore e lo trattiene","contiene un liquido refrigerante che assorbe il calore","l'aria nell'intercapedine blocca l'irraggiamento e la conduzione"],e:"Ognuno dei tre meccanismi di trasmissione del calore viene limitato."},
{id:"FU511",s:"fis",u:5,q:"In una trasformazione isobara di un gas ideale, se il volume raddoppia, la temperatura assoluta:",o:["raddoppia","si dimezza","resta costante","quadruplica","diminuisce di 273 K"],e:"V/T = costante a pressione costante."},
{id:"FU512",s:"fis",u:5,q:"Un gas ideale si espande in un'isoterma. Il calore che assorbe è:",o:["uguale al lavoro che compie","nullo","uguale alla variazione di energia interna","maggiore del lavoro","negativo"],e:"ΔU = 0 → Q = L."},
{id:"FU513",s:"fis",u:5,q:"Nel piano P-V, un'isoterma di un gas ideale è rappresentata da:",o:["un ramo di iperbole","una retta orizzontale","una retta verticale","una parabola","una circonferenza"],e:"P·V = costante. L'isobara è orizzontale, l'isocora verticale; l'adiabatica è più ripida dell'isoterma."},
{id:"FU514",s:"fis",u:5,q:"Un gas viene compresso rapidamente in modo adiabatico (es. in una pompa per bicicletta). La sua temperatura:",o:["aumenta","diminuisce","resta costante","si annulla","oscilla"],e:"Q = 0, il lavoro fatto sul gas aumenta la sua energia interna."},
{id:"FU515",s:"fis",u:5,q:"Il lavoro compiuto da un gas in una trasformazione isocora è:",o:["nullo","massimo","uguale al calore assorbito","uguale a P·V","infinito"],e:"Senza variazione di volume non c'è lavoro meccanico."},
{id:"FU516",s:"fis",u:5,q:"Un frigorifero trasferisce calore dall'interno freddo all'ambiente più caldo:",o:["consumando lavoro, nel rispetto del secondo principio","spontaneamente, senza consumare alcuna energia","consumando lavoro, ma violando il secondo principio","creando freddo, cioè energia negativa, dal nulla","cedendo all'ambiente meno calore di quello estratto"],e:"Il calore ceduto all'ambiente è la somma del calore estratto e del lavoro del compressore."},
{id:"FU517",s:"fis",u:5,q:"Il rendimento di una macchina termica reale che lavora tra le stesse temperature di una macchina di Carnot è:",o:["minore di quello della macchina di Carnot","maggiore di quello della macchina di Carnot","uguale a quello della macchina di Carnot","uguale al 100% se gli attriti sono trascurabili","maggiore o minore a seconda del gas usato"],e:"Le irreversibilità (attriti, scambi di calore con salti di temperatura) riducono il rendimento."},
{id:"FU518",s:"fis",u:5,q:"Nelle centrali termoelettriche il calore viene trasformato in energia elettrica con rendimenti tipici intorno al:",o:["35-45%","100%","90-99%","70-80%","5-10%"],e:"Il calore residuo viene disperso (torri di raffreddamento) o recuperato per il teleriscaldamento."},
{id:"FU519",s:"fis",u:5,q:"Dal punto di vista statistico, l'entropia di un sistema è legata:",o:["al numero di microstati compatibili con lo stato macroscopico","al numero di molecole presenti, indipendentemente dallo stato","alla sola temperatura del sistema, indipendentemente dal volume","all'energia cinetica media delle sue molecole","al numero di stati macroscopici possibili del sistema"],e:"Formula di Boltzmann: S = k·ln W."},
{id:"FU520",s:"fis",u:5,q:"Quando il ghiaccio fonde a 0 °C, la sua entropia:",o:["aumenta","diminuisce","resta costante","si annulla","diventa negativa"],e:"ΔS = Q/T > 0: il liquido è più disordinato del solido."},
{id:"FU521",s:"fis",u:5,q:"La temperatura critica di una sostanza è:",o:["la temperatura sopra cui il gas non si liquefa per sola compressione","la temperatura sotto cui il gas non si liquefa per sola compressione","la temperatura alla quale coesistono solido, liquido e vapore","la temperatura di ebollizione alla pressione di 1 atm","la temperatura minima raggiungibile, cioè lo zero assoluto"],e:"Per l'ossigeno è circa −119 °C: per conservarlo liquido serve raffreddarlo."},
{id:"FU522",s:"fis",u:5,q:"Un ciclo termodinamico percorso in senso orario nel piano P-V corrisponde a:",o:["una macchina termica, con lavoro netto positivo","una macchina frigorifera, con lavoro netto negativo","una macchina termica, con lavoro netto nullo","una trasformazione isoterma reversibile","una macchina frigorifera, con lavoro netto positivo"],e:"Il lavoro netto è l'area racchiusa dal ciclo; in senso antiorario il ciclo descrive una macchina frigorifera."},

// ---- Unità 7 (+7 MC)
{id:"FU701",s:"fis",u:7,q:"Un'onda elettromagnetica è formata da:",o:["un campo elettrico e uno magnetico oscillanti, perpendicolari tra loro e alla propagazione","un campo elettrico e uno magnetico oscillanti, paralleli tra loro e alla propagazione","un campo elettrico oscillante parallelo alla direzione di propagazione, senza campo magnetico","particelle cariche che si muovono nella direzione di propagazione","onde di pressione che si propagano anche nel vuoto"],e:"È un'onda trasversale che si propaga anche nel vuoto."},
{id:"FU703",s:"fis",u:7,q:"La radiazione ultravioletta può danneggiare il DNA della pelle perché:",o:["i suoi fotoni hanno energia sufficiente a formare dimeri di timina","riscalda la pelle oltre i 100 °C, denaturando il DNA","è una radiazione corpuscolare formata da particelle α","i suoi fotoni hanno energia minore di quelli della luce visibile","rompe il DNA per effetto meccanico, come gli ultrasuoni"],e:"Per questo l'esposizione eccessiva agli UV aumenta il rischio di tumori cutanei."},
{id:"FU704",s:"fis",u:7,q:"Le microonde scaldano i cibi perché:",o:["fanno oscillare le molecole d'acqua, che sono dipoli","ionizzano gli atomi del cibo liberando energia","provocano reazioni nucleari nelle molecole d'acqua","fanno oscillare le molecole di grasso, che sono apolari","emettono raggi X che vengono assorbiti dal cibo"],e:"Le microonde non sono ionizzanti."},
{id:"FU705",s:"fis",u:7,q:"Nella radiografia le ossa appaiono chiare perché:",o:["assorbono i raggi X più dei tessuti molli","assorbono i raggi X meno dei tessuti molli","riflettono i raggi X verso la sorgente","emettono raggi X per fluorescenza","sono trasparenti ai raggi X"],e:"Il calcio, con numero atomico più alto, attenua di più i raggi X."},
{id:"FU706",s:"fis",u:7,q:"L'angolo limite per la riflessione totale nel passaggio vetro (n = 1,5) → aria vale circa:",o:["42°","30°","60°","90°","15°"],e:"sen θₗ = 1/1,5 ≈ 0,67 → θₗ ≈ 42°."},
{id:"FU707",s:"fis",u:7,q:"Uno specchio piano forma un'immagine:",o:["virtuale, diritta e uguale all'oggetto","reale, capovolta e uguale all'oggetto","virtuale, capovolta e rimpicciolita","reale, diritta e ingrandita","virtuale, diritta e rimpicciolita"],e:"L'immagine si trova dietro lo specchio, alla stessa distanza dell'oggetto."}
);
BANK.push(
{id:"FUF01",s:"fis",u:1,q:"Un angolo di 180° espresso in radianti vale …… (usa 3,14 per π)",c:["3,14","3.14","pi","π"],n:3.14,tol:0.01,e:"180° = π rad."},
{id:"FUF02",s:"fis",u:1,q:"Il numero 0,00450 ha …… cifre significative",c:["3","tre"],n:3,e:"4, 5 e lo zero finale."},
{id:"FUF03",s:"fis",u:1,q:"Il modulo del vettore di componenti (9, 12) è ……",c:["15","quindici"],n:15,e:"√(81 + 144) = 15."},
{id:"FUF04",s:"fis",u:1,q:"Il prefisso 'pico' corrisponde a un fattore 10^……",c:["-12","−12"],n:-12,e:"pico = 10⁻¹²."},
{id:"FUF05",s:"fis",u:1,q:"Una densità di 2,7 g/cm³ corrisponde a …… kg/m³",c:["2700","2.700"],n:2700,e:"Si moltiplica per 1000."},
{id:"FUF06",s:"fis",u:1,q:"Il prodotto 5·10³ × 4·10⁻⁵ vale …… (scrivi il numero decimale)",c:["0,2","0.2","2·10^-1","2e-1"],n:0.2,e:"20·10⁻² = 0,2."},
{id:"FUF07",s:"fis",u:1,q:"L'unità di misura SI dell'intensità luminosa è la ……",c:["candela","cd"],e:"Una delle sette unità fondamentali."},
{id:"FUF08",s:"fis",u:1,q:"Il prodotto scalare di due vettori antiparalleli di modulo 2 e 7 vale ……",c:["-14","−14"],n:-14,e:"2 × 7 × cos 180°."},
{id:"FUF09",s:"fis",u:4,q:"Un'onda con periodo 5 ms ha frequenza …… Hz",c:["200","duecento"],n:200,e:"1/0,005."},
{id:"FUF10",s:"fis",u:4,q:"Una corda lunga 0,5 m fissa agli estremi ha, nella fondamentale, una lunghezza d'onda di …… m",c:["1","uno"],n:1,e:"λ = 2L."},
{id:"FUF11",s:"fis",u:4,q:"Due suoni a 256 Hz e 260 Hz sovrapposti producono battimenti con frequenza di …… Hz",c:["4","quattro"],n:4,e:"Differenza delle frequenze."},
{id:"FUF12",s:"fis",u:4,q:"Un'eco torna dopo 2 s (v = 340 m/s). La parete dista …… m",c:["340","trecentoquaranta"],n:340,e:"d = v·t/2."},
{id:"FUF13",s:"fis",u:4,q:"Un suono con intensità 10⁻⁴ W/m² ha un livello sonoro di …… dB",c:["80","ottanta"],n:80,e:"10·log(10⁻⁴/10⁻¹²) = 80."},
{id:"FUF14",s:"fis",u:4,q:"La sovrapposizione di due suoni di frequenza molto vicina produce il fenomeno dei ……",c:["battimenti","battimento"],e:"Variazioni periodiche dell'intensità."},
{id:"FUF15",s:"fis",u:4,q:"L'aumento dell'ampiezza di oscillazione quando un sistema è sollecitato alla sua frequenza propria si chiama ……",c:["risonanza"],e:"Esempio: la cassa armonica degli strumenti."},
{id:"FUF16",s:"fis",u:4,q:"La terza armonica di una corda con fondamentale a 100 Hz ha frequenza …… Hz",c:["300","trecento"],n:300,e:"f₃ = 3·f₁."},
{id:"FUF17",s:"fis",u:5,q:"Una temperatura di 212 °F corrisponde a …… °C",c:["100","cento"],n:100,e:"(212 − 32)·5/9."},
{id:"FUF18",s:"fis",u:5,q:"Il principio secondo cui due corpi in equilibrio termico con un terzo sono in equilibrio tra loro è il principio …… della termodinamica",c:["zero","0","zeresimo"],e:"È la base logica del termometro."},
{id:"FUF19",s:"fis",u:5,q:"Il calore latente di vaporizzazione dell'acqua è circa …… kJ/kg",c:["2260","2.260","2250","2257","2300"],n:2260,tol:0.03,e:"A 100 °C e 1 atm."}
);

// BIOLOGIA — risposta multipla (parte 1). Convenzione: o[0] è la risposta corretta; le opzioni vengono mescolate a runtime.
BANK.push(
{id:"B001",s:"bio",u:1,q:"Quale delle seguenti caratteristiche è comune a TUTTI i virus?",o:["Sono parassiti endocellulari obbligati","Possiedono un capside e un envelope lipidico","Contengono sia DNA sia RNA nel virione","Hanno ribosomi propri per produrre il capside","Hanno un genoma a DNA a doppio filamento"],e:"I virus non hanno metabolismo né ribosomi propri: si replicano solo dentro una cellula ospite. L'envelope manca nei virus 'nudi' e il genoma può essere DNA o RNA, a singolo o doppio filamento."},
{id:"B002",s:"bio",u:1,q:"Nel ciclo lisogenico di un batteriofago temperato il genoma virale:",o:["si integra nel cromosoma batterico come profago","viene trascritto subito per assemblare nuovi capsidi","viene degradato dagli enzimi di restrizione dell'ospite","si integra nel cromosoma e induce subito la lisi","viene retrotrascritto e inserito da un'integrasi"],e:"Nel ciclo lisogenico il DNA del fago si integra nel cromosoma dell'ospite (profago) e viene replicato con esso finché un segnale (es. danno al DNA) non induce il ciclo litico."},
{id:"B003",s:"bio",u:1,q:"L'enzima che caratterizza i retrovirus come l'HIV è:",o:["la trascrittasi inversa (DNA polimerasi RNA-dipendente)","una RNA polimerasi RNA-dipendente (RNA replicasi virale)","una DNA polimerasi DNA-dipendente ad alta fedeltà","una RNA polimerasi DNA-dipendente di tipo II","una DNA ligasi ATP-dipendente codificata dal genoma virale"],e:"La trascrittasi inversa copia il genoma a RNA in DNA, che l'integrasi inserisce poi nel genoma della cellula ospite."},
{id:"B004",s:"bio",u:1,q:"La colorazione di Gram distingue i batteri principalmente in base a:",o:["spessore del peptidoglicano e presenza di membrana esterna","presenza o assenza di capsula polisaccaridica e flagelli","spessore della membrana plasmatica e presenza di steroli","presenza di parete e tipo di ribosomi (70S o 80S)","composizione degli acidi teicoici e forma della cellula"],e:"I Gram+ hanno uno spesso strato di peptidoglicano che trattiene il cristalvioletto; i Gram− hanno un sottile strato di peptidoglicano e una membrana esterna con lipopolisaccaride (LPS)."},
{id:"B005",s:"bio",u:1,q:"Il lipopolisaccaride (LPS) è un componente tipico:",o:["della membrana esterna dei batteri Gram-negativi","della parete dei batteri Gram-positivi","della membrana plasmatica degli archeobatteri","del peptidoglicano dei batteri Gram-negativi","della capsula dei batteri Gram-positivi"],e:"L'LPS (endotossina) si trova nel foglietto esterno della membrana esterna dei Gram−. Gli acidi teicoici sono invece tipici dei Gram+."},
{id:"B006",s:"bio",u:1,q:"Il trasferimento di DNA da un batterio a un altro mediato da un batteriofago è detto:",o:["trasduzione","trasformazione","coniugazione","traslocazione","transfezione"],e:"Trasduzione: il fago fa da vettore. Trasformazione: captazione di DNA libero. Coniugazione: passaggio di DNA attraverso un pilo sessuale."},
{id:"B007",s:"bio",u:1,q:"Secondo la teoria endosimbiontica, i mitocondri derivano da:",o:["batteri aerobi inglobati da una cellula ospite ancestrale","cianobatteri fotosintetici inglobati da un eucariote ancestrale","invaginazioni della membrana plasmatica di un procariote","archeobatteri anaerobi inglobati da un batterio ospite","virus a DNA integrati e poi rivestiti da membrana"],e:"I mitocondri derivano da α-proteobatteri aerobi; ne sono prova la doppia membrana, il DNA circolare e i ribosomi di tipo procariotico. I cloroplasti derivano invece da cianobatteri."},
{id:"B008",s:"bio",u:1,q:"Quale delle seguenti NON è una prova a favore dell'origine endosimbiontica dei mitocondri?",o:["La maggior parte delle sue proteine è codificata dal nucleo","Possiede un proprio DNA circolare privo di istoni","Si divide per scissione, in modo simile ai batteri","Ha ribosomi di tipo 70S sensibili ad alcuni antibiotici","La membrana interna contiene cardiolipina, tipica dei batteri"],e:"L'importazione di proteine codificate dal nucleo è una conseguenza del trasferimento genico avvenuto dopo l'endosimbiosi, non una prova dell'origine batterica."},
{id:"B009",s:"bio",u:1,q:"Il legame che unisce due monosaccaridi in un disaccaride è detto:",o:["glicosidico","peptidico","fosfodiesterico","estere carbossilico","a idrogeno"],e:"Il legame glicosidico si forma per condensazione tra l'ossidrile anomerico di uno zucchero e un ossidrile di un altro."},
{id:"B010",s:"bio",u:1,q:"Nel DNA, i due filamenti della doppia elica sono:",o:["antiparalleli e complementari","paralleli e identici","antiparalleli e identici","paralleli e complementari","uniti da legami covalenti tra le basi"],e:"Un filamento corre 5'→3' e l'altro 3'→5'; le basi sono appaiate per complementarità (A-T, G-C) tramite legami a idrogeno."},
{id:"B011",s:"bio",u:1,q:"Tra le coppie di basi del DNA, la coppia G-C rispetto alla coppia A-T:",o:["forma tre legami a idrogeno invece di due","forma due legami a idrogeno invece di tre","è formata da due purine anziché da purina e pirimidina","è più frequente nei DNA a bassa temperatura di fusione","si appaia tramite interazioni idrofobiche più deboli"],e:"G-C forma 3 legami a idrogeno, A-T 2. Per questo un DNA ricco in GC ha una temperatura di denaturazione più alta."},
{id:"B012",s:"bio",u:1,q:"Un DNA a doppio filamento contiene il 30% di adenina. Qual è la percentuale di citosina?",o:["20%","30%","40%","60%","70%"],e:"Per le regole di Chargaff A = T = 30%, quindi A+T = 60% e G+C = 40%, cioè G = C = 20%."},
{id:"B013",s:"bio",u:1,q:"Quale tra i seguenti NON è un RNA codificante proteine né coinvolto direttamente nella sintesi proteica?",o:["miRNA","mRNA","tRNA","rRNA 28S","rRNA 5S"],e:"I microRNA sono RNA non codificanti regolatori: si appaiano agli mRNA bersaglio e ne inibiscono la traduzione o ne promuovono la degradazione."},
{id:"B014",s:"bio",u:1,q:"La struttura secondaria di una proteina è stabilizzata principalmente da:",o:["legami a idrogeno tra C=O e N-H dello scheletro peptidico","legami a idrogeno tra le catene laterali degli amminoacidi","ponti disolfuro tra cisteine di segmenti adiacenti","interazioni idrofobiche tra le catene laterali apolari","legami ionici tra gruppi carichi di subunità diverse"],e:"α-eliche e foglietti β sono tenuti insieme da legami a idrogeno tra atomi della catena principale, non delle catene laterali."},
{id:"B015",s:"bio",u:1,q:"Quale delle seguenti è una modificazione post-traduzionale che aggiunge un gruppo fosfato a serina, treonina o tirosina?",o:["Fosforilazione catalizzata da chinasi","Glicosilazione catalizzata da glicosiltransferasi","Acetilazione catalizzata da acetiltransferasi","Defosforilazione catalizzata da fosfatasi","Ubiquitinazione catalizzata da ubiquitina ligasi"],e:"Le chinasi trasferiscono il fosfato γ dell'ATP sull'OH di Ser, Thr o Tyr; le fosfatasi lo rimuovono."},
{id:"B016",s:"bio",u:1,q:"Gli enzimi accelerano una reazione perché:",o:["abbassano l'energia di attivazione","rendono più negativo il ΔG della reazione","spostano l'equilibrio a favore dei prodotti","aumentano la costante di equilibrio","forniscono energia libera ai reagenti"],e:"Un enzima stabilizza lo stato di transizione abbassando l'energia di attivazione. Non cambia il ΔG né la costante di equilibrio e non viene consumato."},
{id:"B017",s:"bio",u:1,q:"Le reazioni di idrolisi dei polimeri biologici:",o:["rompono legami con l'aggiunta di una molecola d'acqua","formano legami con l'eliminazione di una molecola d'acqua","rompono legami liberando una molecola d'acqua","sono tipiche dell'anabolismo e richiedono ATP","avvengono solo nei lisosomi a pH acido"],e:"L'idrolisi scinde un legame consumando H₂O ed è tipica del catabolismo; la condensazione forma un legame liberando H₂O."},
{id:"B018",s:"bio",u:1,q:"Il principio 'One Health' sostiene che:",o:["salute umana, animale e ambientale sono interconnesse","la prevenzione delle zoonosi spetta solo ai veterinari","ogni malattia infettiva ha un unico agente e un unico ospite","la salute dipende soprattutto dal patrimonio genetico","la medicina umana e quella veterinaria vanno tenute separate"],e:"One Health è un approccio integrato: zoonosi, antibiotico-resistenza e inquinamento richiedono di considerare insieme uomo, animali e ambiente."},
{id:"B019",s:"bio",u:1,q:"Gli archeobatteri si differenziano dagli eubatteri perché:",o:["hanno lipidi di membrana uniti da legami etere","hanno lipidi di membrana con legami estere e acidi grassi","hanno una parete di peptidoglicano più spessa dei Gram+","possiedono un nucleo delimitato da una singola membrana","possiedono ribosomi 80S come le cellule eucariotiche"],e:"Gli archei hanno membrane con lipidi legati a etere, pareti prive di peptidoglicano vero e un apparato trascrizionale per alcuni aspetti più simile a quello eucariotico."},
{id:"B020",s:"bio",u:1,q:"I pili sessuali dei batteri servono per:",o:["la coniugazione","la trasduzione","la trasformazione","la motilità","la sporulazione"],e:"Il pilo sessuale (pilo F) mette in contatto due batteri e permette il passaggio di DNA plasmidico durante la coniugazione. Il movimento è affidato ai flagelli."},

{id:"B021",s:"bio",u:2,q:"Il nucleosoma è costituito da:",o:["~147 bp di DNA attorno a un ottamero di H2A, H2B, H3, H4","~147 bp di DNA attorno a un ottamero di istoni H1","~147 bp di DNA attorno a un tetramero di H2A, H2B, H3, H4","~30 bp di DNA linker legate agli istoni H1 e H3","~147 nucleotidi di RNA attorno a un ottamero di istoni"],e:"Il core del nucleosoma contiene due copie di H2A, H2B, H3 e H4. L'istone H1 lega il DNA linker e favorisce la compattazione nella fibra da 30 nm."},
{id:"B022",s:"bio",u:2,q:"L'acetilazione delle code degli istoni di norma:",o:["riduce la carica positiva delle lisine e favorisce la trascrizione","aumenta la carica positiva delle lisine e compatta la cromatina","riduce la carica positiva delle lisine e silenzia la trascrizione","neutralizza le arginine e favorisce l'eterocromatina","aggiunge metili alle lisine e blocca i fattori di trascrizione"],e:"L'acetilazione neutralizza la carica positiva delle lisine, allenta il contatto con il DNA e rende la cromatina accessibile. Le HDAC (deacetilasi) hanno l'effetto opposto."},
{id:"B023",s:"bio",u:2,q:"L'eterocromatina:",o:["è condensata e generalmente trascrizionalmente inattiva","è decondensata e generalmente trascrizionalmente attiva","è condensata solo in mitosi e scompare in interfase","è priva di istoni e ricca di DNA ripetuto","è condensata ma è la frazione più trascritta"],e:"L'eterocromatina è compatta e silente; si distingue in costitutiva (es. centromeri, telomeri) e facoltativa (es. il cromosoma X inattivo)."},
{id:"B024",s:"bio",u:2,q:"Nei mammiferi la metilazione del DNA avviene principalmente:",o:["sulla citosina nei dinucleotidi CpG","sull'adenina nelle sequenze GATC","sulla guanina nei dinucleotidi CpG","sulla citosina nelle sequenze TATA","sull'adenina nei dinucleotidi ApT"],e:"Le DNA metiltransferasi aggiungono un metile al C5 della citosina nei CpG. La metilazione delle isole CpG nei promotori è associata al silenziamento genico."},
{id:"B025",s:"bio",u:2,q:"I telomeri sono:",o:["ripetizioni in tandem alle estremità dei cromosomi lineari","ripetizioni in tandem su cui si assembla il cinetocore","ripetizioni intersperse che fungono da origini di replicazione","sequenze uniche alle estremità dei cromosomi circolari","ripetizioni TTAGGG al centro dei cromosomi metacentrici"],e:"Nell'uomo i telomeri sono ripetizioni TTAGGG che proteggono le estremità dei cromosomi. Il cinetocore, che lega il fuso, si assembla invece sul centromero."},
{id:"B026",s:"bio",u:2,q:"Le sequenze LINE e SINE sono:",o:["sequenze ripetute intersperse, in parte retrotrasposoni","sequenze ripetute in tandem tipiche dei centromeri","trasposoni a DNA che si spostano per taglia-e-cuci","geni ripetuti per gli RNA ribosomiali del nucleolo","brevi ripetizioni in tandem molto polimorfiche (STR)"],e:"LINE (es. L1) e SINE (es. Alu) sono elementi mobili sparsi nel genoma che si spostano tramite un intermedio a RNA."},
{id:"B027",s:"bio",u:2,q:"I microsatelliti sono:",o:["brevi sequenze (1-6 bp) ripetute in tandem, molto polimorfiche","lunghe sequenze ripetute intersperse, come le Alu","brevi ripetizioni in tandem, identiche in tutti gli individui","ripetizioni in tandem di circa 170 bp dei centromeri","geni in singola copia molto conservati tra le specie"],e:"I microsatelliti (STR) sono ripetizioni in tandem di unità molto brevi; il numero di ripetizioni varia tra individui ed è usato in medicina forense e nei test di paternità."},
{id:"B028",s:"bio",u:2,q:"Il cariotipo umano normale di una donna è:",o:["46,XX","46,XY","47,XXX","45,X","23,X"],e:"Le cellule somatiche umane sono diploidi con 44 autosomi più 2 cromosomi sessuali: XX nella femmina, XY nel maschio."},
{id:"B029",s:"bio",u:2,q:"I cromosomi omologhi:",o:["hanno gli stessi loci, ma possono portare alleli diversi","hanno gli stessi geni in ordine diverso e alleli identici","sono copie identiche prodotte dalla replicazione in fase S","sono i due cromatidi fratelli uniti al centromero","derivano entrambi dalla madre e portano gli stessi alleli"],e:"Gli omologhi vengono uno dalla madre e uno dal padre: stessi loci, alleli eventualmente diversi. I cromatidi fratelli sono invece copie identiche prodotte dalla replicazione."},
{id:"B030",s:"bio",u:2,q:"Le famiglie geniche, come quella delle globine, si sono originate principalmente per:",o:["duplicazione genica seguita da divergenza","trasferimento genico orizzontale da batteri simbionti","splicing alternativo di un unico gene ancestrale","retrotrasposizione di mRNA senza successive mutazioni","fusione di cromosomi seguita da ricombinazione"],e:"Duplicazioni successive di un gene ancestrale, seguite da mutazioni, hanno prodotto i geni α- e β-simili delle globine, inclusi alcuni pseudogeni."},

{id:"B031",s:"bio",u:3,q:"La replicazione del DNA è detta semiconservativa perché:",o:["ogni doppia elica figlia ha un filamento vecchio e uno nuovo","una doppia elica figlia è tutta vecchia, l'altra tutta nuova","ogni filamento figlio contiene tratti vecchi e tratti nuovi","metà del genoma viene replicata e metà resta inalterata","si conserva solo il filamento stampo orientato 3'→5'"],e:"Lo dimostrò l'esperimento di Meselson e Stahl: ciascuna molecola figlia conserva un filamento della molecola madre."},
{id:"B032",s:"bio",u:3,q:"Le DNA polimerasi:",o:["sintetizzano solo in direzione 5'→3' e richiedono un primer","sintetizzano solo in direzione 3'→5' e richiedono un primer","sintetizzano in direzione 5'→3' senza bisogno di primer","allungano l'estremità 5'-fosfato di un primer di RNA","usano ribonucleotidi trifosfati e non correggono errori"],e:"Le DNA polimerasi aggiungono nucleotidi all'estremità 3'-OH di un primer (di RNA, fatto dalla primasi). Molte hanno un'attività esonucleasica 3'→5' di correzione (proofreading)."},
{id:"B033",s:"bio",u:3,q:"I frammenti di Okazaki si formano:",o:["sul filamento lento (lagging), sintetizzato in modo discontinuo","sul filamento guida (leading), sintetizzato in modo continuo","sul filamento guida (leading), sintetizzato in modo discontinuo","su entrambi i filamenti, poi uniti dalla topoisomerasi","sull'mRNA nascente durante la trascrizione"],e:"Poiché la sintesi procede solo 5'→3', il filamento che va in senso opposto all'apertura della forcella viene sintetizzato a tratti, poi uniti dalla DNA ligasi."},
{id:"B034",s:"bio",u:3,q:"La funzione della topoisomerasi durante la replicazione è:",o:["eliminare la tensione da superavvolgimento a monte della forcella","separare i due filamenti rompendo i legami a idrogeno tra le basi","stabilizzare il DNA a singolo filamento dietro la forcella","unire i frammenti di Okazaki con legami fosfodiestere","rimuovere i primer di RNA e sostituirli con DNA"],e:"Le topoisomerasi tagliano e ricuciono il DNA per rilasciare i superavvolgimenti. L'elicasi separa i filamenti, la primasi fa il primer, la ligasi unisce i frammenti."},
{id:"B035",s:"bio",u:3,q:"La telomerasi è:",o:["una trascrittasi inversa che contiene un proprio stampo di RNA","una DNA polimerasi DNA-dipendente che copia il filamento stampo","una trascrittasi inversa che usa come stampo l'mRNA cellulare","un'esonucleasi che accorcia i telomeri a ogni divisione","una RNA polimerasi che sintetizza il primer all'estremità 3'"],e:"La telomerasi allunga l'estremità 3' dei telomeri usando il suo RNA come stampo. È attiva nelle cellule germinali, nelle staminali e in molti tumori."},
{id:"B036",s:"bio",u:3,q:"Nell'operone lac di E. coli, in assenza di lattosio:",o:["il repressore si lega all'operatore e blocca la trascrizione","il repressore è inattivo e i geni sono trascritti al massimo","l'allolattosio stacca il repressore dall'operatore","il complesso cAMP-CAP si lega all'operatore e la blocca","il repressore si lega al promotore e attiva la polimerasi"],e:"Senza lattosio il repressore LacI occupa l'operatore. L'allolattosio inattiva il repressore; la trascrizione è massima con lattosio presente e glucosio assente (alto cAMP-CAP)."},
{id:"B037",s:"bio",u:3,q:"Negli eucarioti la RNA polimerasi II trascrive:",o:["gli mRNA e la maggior parte di snRNA e miRNA","gli rRNA 28S, 18S e 5,8S all'interno del nucleolo","i tRNA, l'rRNA 5S e altri piccoli RNA non codificanti","gli mRNA e i grandi rRNA nucleolari","gli mRNA mitocondriali e i tRNA"],e:"Pol I trascrive i grandi rRNA nel nucleolo; Pol II i pre-mRNA (e molti RNA non codificanti); Pol III i tRNA, l'rRNA 5S e altri piccoli RNA."},
{id:"B038",s:"bio",u:3,q:"La TATA box è:",o:["un elemento del promotore legato da TBP, subunità di TFIID","un elemento del promotore legato direttamente dal fattore σ","una sequenza a valle del gene che segnala la terminazione","il segnale AAUAAA che dirige la poliadenilazione","un enhancer distale legato da attivatori specifici"],e:"La TATA box, circa 25-30 bp a monte del sito d'inizio, lega la TBP; da qui si assemblano i fattori generali e la RNA polimerasi II."},
{id:"B039",s:"bio",u:3,q:"Gli enhancer:",o:["agiscono anche a grande distanza e in entrambi gli orientamenti","agiscono solo se adiacenti alla TATA box e orientati 5'→3'","agiscono solo se posti a monte del gene, entro poche basi","sono sequenze di RNA che legano la RNA polimerasi II","legano repressori e impediscono il ripiegamento del DNA"],e:"Gli enhancer legano attivatori e, con il ripiegamento del DNA, contattano il complesso del promotore anche da decine di kb di distanza, a monte, a valle o in un introne."},
{id:"B040",s:"bio",u:3,q:"Lo splicing del pre-mRNA consiste in:",o:["rimozione degli introni e unione degli esoni","rimozione degli esoni e unione degli introni","aggiunta del cappuccio di 7-metilguanosina al 5'","modifica di singole basi dopo la trascrizione","taglio dell'mRNA a valle del segnale AAUAAA"],e:"Lo spliceosoma, formato da snRNP (snRNA + proteine), riconosce i siti di splicing, rimuove gli introni come lariat e unisce gli esoni."},
{id:"B041",s:"bio",u:3,q:"Lo splicing alternativo permette di:",o:["ottenere più proteine diverse da uno stesso gene","ottenere più mRNA da geni diversi con un solo promotore","correggere le mutazioni presenti negli esoni","tradurre lo stesso mRNA in più cornici di lettura","modificare singole basi dell'mRNA maturo"],e:"Combinando in modo diverso gli esoni di uno stesso trascritto si ottengono isoforme proteiche diverse: è uno dei motivi per cui l'uomo ha relativamente pochi geni."},
{id:"B042",s:"bio",u:3,q:"Il cappuccio al 5' dell'mRNA eucariotico è costituito da:",o:["una 7-metilguanosina unita con legame 5'-5' trifosfato","una 7-metilguanosina unita con legame 3'-5' fosfodiestere","una coda di circa 200 adenine aggiunta al 5'","una sequenza di Shine-Dalgarno complementare all'rRNA","una metilguanina legata al 3' tramite un trifosfato"],e:"Il cap protegge l'mRNA dalle esonucleasi, ne favorisce l'esporto e serve al riconoscimento da parte dei fattori di inizio della traduzione."},
{id:"B043",s:"bio",u:3,q:"Il codice genetico è detto degenerato (ridondante) perché:",o:["più codoni possono codificare lo stesso amminoacido","un codone può codificare amminoacidi diversi","i codoni si sovrappongono e condividono nucleotidi","varia in modo sostanziale tra gli organismi","a ogni amminoacido corrisponde un solo codone"],e:"64 codoni codificano 20 amminoacidi più 3 segnali di stop. Il codice è anche non ambiguo (un codone, un solo significato) e quasi universale."},
{id:"B044",s:"bio",u:3,q:"Quanti sono i codoni di stop nel codice genetico standard?",o:["3","1","2","4","61"],e:"UAA, UAG e UGA; non sono riconosciuti da tRNA ma da fattori di rilascio. I restanti 61 codoni codificano amminoacidi."},
{id:"B045",s:"bio",u:3,q:"Durante la traduzione, il tRNA che porta la catena polipeptidica in crescita si trova nel sito:",o:["P del ribosoma","A del ribosoma","E del ribosoma","di legame dell'mRNA","del fattore di rilascio"],e:"L'amminoacil-tRNA entra nel sito A, il peptidil-tRNA occupa il sito P e il tRNA scarico esce dal sito E."},
{id:"B046",s:"bio",u:3,q:"L'attività peptidil-transferasica del ribosoma è svolta:",o:["dall'rRNA della subunità maggiore, che funziona da ribozima","da una proteina della subunità minore con attività enzimatica","dall'rRNA della subunità minore, che lega lo Shine-Dalgarno","dal fattore di allungamento EF-Tu legato a GTP","dall'amminoacil-tRNA sintetasi associata al ribosoma"],e:"Il legame peptidico è catalizzato dall'rRNA 23S (procarioti) o 28S (eucarioti): il ribosoma è un ribozima."},
{id:"B047",s:"bio",u:3,q:"Le chaperonine e le proteine chaperon (es. Hsp70) servono a:",o:["favorire il corretto ripiegamento e impedire l'aggregazione","marcare le proteine mal ripiegate con catene di ubiquitina","degradare in modo ATP-dipendente le proteine denaturate","trasportare gli mRNA maturi attraverso i pori nucleari","aggiungere oligosaccaridi alle proteine nel reticolo"],e:"Le chaperon legano tratti idrofobici esposti delle proteine nascenti o danneggiate, usando ATP, per evitare ripiegamenti errati e aggregati."},
{id:"B048",s:"bio",u:3,q:"Nella degradazione ubiquitina-dipendente, il marcatore di degradazione proteasomica è tipicamente:",o:["una catena di poliubiquitina legata a lisine del bersaglio","una singola ubiquitina legata all'estremità C-terminale","il mannosio-6-fosfato aggiunto nel cis-Golgi","una sequenza KDEL che la riporta nel reticolo","un'ancora GPI aggiunta nel lume del reticolo"],e:"E1 attiva, E2 coniuga ed E3 (ligasi) trasferisce l'ubiquitina alla proteina bersaglio; una catena di almeno 4 ubiquitine è riconosciuta dal proteasoma 26S."},
{id:"B049",s:"bio",u:3,q:"I prioni sono:",o:["proteine mal ripiegate che inducono il misfolding della forma normale","piccoli RNA circolari privi di capside che infettano le cellule","virus a DNA con capside proteico ma senza envelope","batteri privi di parete che crescono dentro le cellule","frammenti di DNA mobili che si inseriscono nel genoma"],e:"Il prione (PrPSc) è una forma ripiegata in modo anomalo, ricca di foglietti β, della proteina PrPC; converte la forma normale e forma aggregati, come nella malattia di Creutzfeldt-Jakob."},
{id:"B050",s:"bio",u:3,q:"L'RNA interference (RNAi) mediata da miRNA o siRNA porta a:",o:["silenziamento post-trascrizionale dell'mRNA bersaglio","silenziamento trascrizionale per metilazione del promotore","aumento della traduzione dell'mRNA bersaglio","degradazione della proteina bersaglio nel proteasoma","splicing alternativo del pre-mRNA bersaglio nel nucleo"],e:"I piccoli RNA, caricati sul complesso RISC (proteine Argonaute), si appaiano all'mRNA bersaglio e ne causano il taglio o l'inibizione della traduzione."},
{id:"B051",s:"bio",u:3,q:"Un gene eucariotico codificante una proteina è tipicamente:",o:["monocistronico","policistronico","privo di promotore","privo di introni","trascritto dalla RNA polimerasi III"],e:"Negli eucarioti ogni mRNA codifica di regola una sola proteina; nei procarioti gli operoni producono mRNA policistronici."},
{id:"B052",s:"bio",u:3,q:"L'editing dell'RNA consiste in:",o:["modifica della sequenza nucleotidica dell'RNA dopo la trascrizione","rimozione degli introni e unione degli esoni nello spliceosoma","correzione degli errori della RNA polimerasi durante la sintesi","modifica della sequenza del DNA prima della trascrizione","aggiunta del cap al 5' e della coda di poli(A) al 3'"],e:"Con l'editing (es. deaminazione C→U nell'mRNA dell'apolipoproteina B) la sequenza dell'mRNA diverge da quella del gene, e così la proteina prodotta."},
{id:"B053",s:"bio",u:3,q:"Il recettore degli ormoni steroidei è un esempio di:",o:["fattore di trascrizione specifico attivato da ligando","recettore di membrana accoppiato a proteine G","recettore tirosin-chinasico che dimerizza col ligando","canale ionico regolato dal legame del ligando","fattore generale di trascrizione legato alla TATA box"],e:"Il complesso ormone-recettore si lega a sequenze specifiche (elementi di risposta agli ormoni) e regola la trascrizione dei geni bersaglio."},
{id:"B054",s:"bio",u:3,q:"Nei procarioti l'inizio della traduzione richiede il riconoscimento della sequenza:",o:["di Shine-Dalgarno a monte del codone di inizio","TATA box a monte del codone di inizio","di Kozak che circonda il primo AUG dopo il cap","di Shine-Dalgarno a valle del codone di stop","AAUAAA che lega la subunità minore"],e:"La sequenza di Shine-Dalgarno sull'mRNA si appaia all'rRNA 16S della subunità minore. Negli eucarioti il ribosoma si lega al cap e scorre fino al primo AUG in contesto Kozak."},
{id:"B055",s:"bio",u:3,q:"Il tRNA iniziatore negli eucarioti porta:",o:["metionina","formilmetionina","alanina","triptofano","nessun amminoacido"],e:"Negli eucarioti l'iniziatore porta metionina; nei batteri e nei mitocondri porta N-formilmetionina."}
);

// BIOLOGIA — risposta multipla (parte 2)
BANK.push(
{id:"B056",s:"bio",u:4,q:"Una mutazione che sostituisce una purina con un'altra purina (es. A→G) è detta:",o:["transizione","transversione","mutazione per scorrimento della fase di lettura","delezione","inversione"],e:"Transizione: purina↔purina o pirimidina↔pirimidina. Transversione: purina↔pirimidina."},
{id:"B057",s:"bio",u:4,q:"La sostituzione che trasforma il codone UAC (Tyr) in UAA è una mutazione:",o:["non senso","missenso","silente","frameshift","conservativa"],e:"UAA è un codone di stop: la mutazione non senso tronca prematuramente la proteina."},
{id:"B058",s:"bio",u:4,q:"L'inserzione di un solo nucleotide nella regione codificante di un gene causa di norma:",o:["uno slittamento della cornice di lettura (frameshift)","una mutazione silente per la degenerazione del codice","la sostituzione di un solo amminoacido nella proteina","l'aggiunta di un solo amminoacido senza altri effetti","una transizione o una transversione a seconda della base"],e:"Poiché il codice è letto a triplette, inserzioni o delezioni non multiple di 3 alterano tutti i codoni a valle e spesso creano uno stop prematuro."},
{id:"B059",s:"bio",u:4,q:"Le malattie da espansione di triplette, come la corea di Huntington, possono mostrare anticipazione, cioè:",o:["esordio più precoce o maggiore gravità nelle generazioni successive","esordio più tardivo e gravità minore nelle generazioni successive","salto di una generazione per penetranza incompleta","comparsa della malattia solo se ereditata dalla madre","sintomi più gravi negli eterozigoti che negli omozigoti"],e:"Il numero di ripetizioni tende ad aumentare passando da una generazione all'altra, e con esso la gravità e la precocità della malattia."},
{id:"B060",s:"bio",u:4,q:"Le rotture a doppio filamento del DNA sono riparate principalmente tramite:",o:["ricombinazione omologa o giunzione di estremità non omologhe","riparazione per escissione di basi (BER) tramite glicosilasi","riparazione dei mismatch guidata dal filamento stampo","escissione di nucleotidi (NER) dei dimeri di timina","fotoriattivazione da parte della DNA fotoliasi"],e:"La ricombinazione omologa usa il cromatidio fratello come stampo (fasi S/G2) ed è fedele; la NHEJ ricongiunge le estremità direttamente ma può perdere nucleotidi."},
{id:"B061",s:"bio",u:4,q:"Un individuo eterozigote per un carattere a dominanza completa:",o:["mostra il fenotipo dominante","mostra il fenotipo recessivo","mostra un fenotipo intermedio","mostra entrambi i fenotipi","non trasmette mai l'allele recessivo"],e:"Nella dominanza completa un solo allele dominante basta per il fenotipo. L'eterozigote trasmette l'allele recessivo al 50% dei gameti."},
{id:"B062",s:"bio",u:4,q:"Dall'incrocio Aa × Aa, con dominanza completa, il rapporto fenotipico atteso è:",o:["3:1","1:2:1","1:1","9:3:3:1","tutti dominanti"],e:"Genotipi 1 AA : 2 Aa : 1 aa; fenotipi 3 dominanti : 1 recessivo."},
{id:"B063",s:"bio",u:4,q:"Il rapporto 9:3:3:1 nella F2 di un diibrido indica che i due geni:",o:["assortiscono in modo indipendente","sono associati sullo stesso cromosoma","mostrano epistasi recessiva","sono legati al cromosoma X","mostrano dominanza incompleta"],e:"È il risultato atteso per due geni non associati, ciascuno a dominanza completa, secondo la seconda legge di Mendel."},
{id:"B064",s:"bio",u:4,q:"Una madre di gruppo A (genotipo I^A i) e un padre di gruppo B (I^B i) possono avere figli di gruppo:",o:["A, B, AB e 0","solo A o B","solo AB","solo A, B o AB","solo 0"],e:"Gameti materni I^A o i, paterni I^B o i: combinazioni I^A I^B (AB), I^A i (A), I^B i (B), i i (0), ciascuna con probabilità 1/4."},
{id:"B065",s:"bio",u:4,q:"Il fenomeno per cui un singolo gene influenza più caratteri fenotipici apparentemente non correlati è detto:",o:["pleiotropia","epistasi","codominanza","penetranza incompleta","eredità poligenica"],e:"Esempio classico è la sindrome di Marfan (FBN1): scheletro, occhio e sistema cardiovascolare."},
{id:"B066",s:"bio",u:4,q:"L'epistasi è:",o:["un gene maschera l'effetto di un gene diverso","un allele maschera l'altro allele dello stesso gene","un gene influenza più caratteri non correlati","l'ambiente impedisce l'espressione di un genotipo","due alleli dello stesso gene si esprimono entrambi"],e:"Nell'epistasi il gene epistatico nasconde l'effetto di un gene diverso (ipostatico), alterando i rapporti mendeliani attesi (es. 9:3:4)."},
{id:"B067",s:"bio",u:4,q:"La penetranza incompleta indica che:",o:["non tutti i portatori del genotipo mostrano il fenotipo","i portatori mostrano il fenotipo con gravità variabile","l'eterozigote mostra un fenotipo intermedio tra i due","il fenotipo compare solo in uno dei due sessi","il fenotipo dipende da molti geni e dall'ambiente"],e:"La penetranza è la percentuale di portatori del genotipo che manifestano il fenotipo. L'espressività variabile riguarda invece l'intensità con cui si manifesta."},
{id:"B068",s:"bio",u:4,q:"Un padre affetto da una malattia recessiva legata all'X e una madre non portatrice avranno:",o:["tutte le figlie portatrici e tutti i figli sani","tutti i figli maschi malati e le figlie sane","il 50% dei figli maschi malati e figlie sane","tutte le figlie malate e tutti i figli sani","metà delle figlie portatrici e figli sani"],e:"Il padre trasmette la sua X a tutte le figlie (che saranno portatrici) e la Y a tutti i figli (sani)."},
{id:"B069",s:"bio",u:4,q:"L'ereditarietà mitocondriale è caratterizzata da:",o:["trasmissione materna a tutta la prole, maschi e femmine","trasmissione paterna ai soli figli maschi","trasmissione materna ai soli figli maschi","trasmissione da entrambi i genitori con rapporto 3:1","trasmissione paterna a tutte le figlie femmine"],e:"I mitocondri dello zigote provengono dall'ovocita: una madre affetta trasmette a tutta la prole, un padre affetto a nessuno."},
{id:"B070",s:"bio",u:4,q:"L'imprinting genomico consiste in:",o:["espressione di un allele dipendente dal genitore di origine","inattivazione casuale di uno dei due cromosomi X","espressione di entrambi gli alleli a prescindere dall'origine","perdita di un allele per non disgiunzione meiotica","silenziamento permanente di un gene per mutazione"],e:"Per alcuni geni è espresso solo l'allele materno o solo quello paterno, per marcature epigenetiche come la metilazione. Esempi: sindromi di Prader-Willi e Angelman."},
{id:"B071",s:"bio",u:4,q:"La sindrome di Down nella grande maggioranza dei casi è dovuta a:",o:["trisomia 21 libera da non disgiunzione meiotica","trisomia 21 da traslocazione robertsoniana ereditata","mosaicismo da non disgiunzione mitotica nello zigote","monosomia del cromosoma 21 per non disgiunzione","trisomia libera del cromosoma 18 per non disgiunzione"],e:"Circa il 95% dei casi è trisomia 21 libera (47,+21), più spesso da non disgiunzione nella meiosi materna; il rischio aumenta con l'età materna. Una minoranza è da traslocazione robertsoniana o mosaicismo."},
{id:"B072",s:"bio",u:4,q:"Il cariotipo 45,X corrisponde a:",o:["sindrome di Turner","sindrome di Klinefelter","sindrome di Down","sindrome di Edwards","sindrome di Patau"],e:"Turner: monosomia X, fenotipo femminile. Klinefelter: 47,XXY. Edwards: trisomia 18. Patau: trisomia 13."},
{id:"B073",s:"bio",u:4,q:"Una traslocazione robertsoniana coinvolge:",o:["la fusione centrica di due cromosomi acrocentrici","lo scambio reciproco tra due cromosomi metacentrici","la fusione di due cromosomi metacentrici ai telomeri","l'inversione pericentrica di un acrocentrico","la perdita dei bracci lunghi di due acrocentrici"],e:"I bracci lunghi di due acrocentrici (13, 14, 15, 21, 22) si fondono a livello del centromero; i bracci corti, ridondanti, vanno persi."},
{id:"B074",s:"bio",u:4,q:"Due geni sono associati (linked) quando:",o:["sono vicini sullo stesso cromosoma e tendono a segregare insieme","sono su cromosomi diversi ma segregano sempre insieme","sono lontani sullo stesso cromosoma e assortiscono indipendentemente","sono alleli diversi dello stesso locus sull'omologo","hanno lo stesso effetto fenotipico e sono epistatici"],e:"Più due geni sono vicini, meno è probabile un crossing over tra loro. La frequenza di ricombinazione (1% = 1 centimorgan) è la base delle mappe genetiche."},
{id:"B075",s:"bio",u:4,q:"In un albero genealogico, un carattere che compare in figli di genitori entrambi sani e colpisce maschi e femmine con uguale frequenza suggerisce un'eredità:",o:["autosomica recessiva","autosomica dominante","dominante legata all'X","legata all'Y","mitocondriale"],e:"Genitori sani con figli affetti indicano che i genitori sono portatori eterozigoti; la parità tra sessi indica un gene autosomico."},
{id:"B076",s:"bio",u:4,q:"I caratteri poligenici, come l'altezza:",o:["mostrano una distribuzione continua nella popolazione","seguono i rapporti mendeliani 3:1 o 9:3:3:1","dipendono da un solo gene a dominanza incompleta","non sono influenzati da fattori ambientali","mostrano classi fenotipiche nettamente distinte"],e:"I caratteri quantitativi dipendono da molti geni ad effetto additivo e dall'ambiente, e mostrano una distribuzione a campana."},

{id:"B077",s:"bio",u:5,q:"Secondo il modello a mosaico fluido, la membrana plasmatica:",o:["è un doppio strato fosfolipidico con proteine libere di muoversi lateralmente","è un doppio strato fosfolipidico con proteine fisse e foglietti identici tra loro","è formata da due strati proteici che racchiudono uno strato lipidico","è un monostrato lipidico rigido in cui le proteine non diffondono","è un doppio strato in cui i lipidi passano liberamente tra i foglietti"],e:"I lipidi e molte proteine diffondono lateralmente; i due foglietti hanno composizione diversa (asimmetria di membrana)."},
{id:"B078",s:"bio",u:5,q:"Il glicocalice è localizzato:",o:["sulla faccia esterna della membrana plasmatica","sulla faccia citosolica della membrana plasmatica","nel lume del reticolo endoplasmatico rugoso","sulla faccia interna della membrana nucleare","nello spazio intermembrana dei mitocondri"],e:"Le catene oligosaccaridiche di glicoproteine e glicolipidi sporgono verso l'esterno: servono al riconoscimento cellulare e alla protezione."},
{id:"B079",s:"bio",u:5,q:"La fosfatidilserina nelle cellule sane si trova prevalentemente:",o:["nel foglietto citosolico della membrana plasmatica","nel foglietto extracellulare della membrana plasmatica","in egual misura nei due foglietti della membrana","nella membrana mitocondriale interna, con la cardiolipina","nel glicocalice, legata a catene oligosaccaridiche"],e:"L'esposizione della fosfatidilserina sul foglietto esterno è un segnale 'mangiami' delle cellule apoptotiche per i macrofagi."},
{id:"B080",s:"bio",u:5,q:"La pompa Na⁺/K⁺-ATPasi, per ogni ATP idrolizzato:",o:["espelle 3 Na⁺ e importa 2 K⁺","espelle 2 Na⁺ e importa 3 K⁺","importa 3 Na⁺ ed espelle 2 K⁺","scambia 1 Na⁺ con 1 K⁺","trasporta Na⁺ e K⁺ nella stessa direzione"],e:"Il trasporto è elettrogenico (una carica positiva netta esce per ciclo) e mantiene i gradienti di Na⁺ e K⁺ alla base del potenziale di membrana."},
{id:"B081",s:"bio",u:5,q:"La diffusione facilitata:",o:["segue il gradiente tramite proteine, senza consumo diretto di ATP","segue il gradiente senza proteine, attraversando il doppio strato","procede contro gradiente sfruttando il gradiente di un altro ione","segue il gradiente tramite proteine ma non mostra mai saturazione","richiede l'idrolisi di ATP da parte del trasportatore"],e:"È un trasporto passivo mediato da proteine; con i trasportatori la velocità mostra saturazione."},
{id:"B082",s:"bio",u:5,q:"Il cotrasporto Na⁺-glucosio nell'epitelio intestinale è un esempio di:",o:["trasporto attivo secondario (simporto)","trasporto attivo primario dipendente da ATP","trasporto attivo secondario di tipo antiporto","diffusione facilitata tramite il trasportatore GLUT2","diffusione semplice favorita dal gradiente del glucosio"],e:"L'energia viene dal gradiente di Na⁺ (mantenuto dalla pompa Na⁺/K⁺), che trascina il glucosio contro il suo gradiente nella stessa direzione."},
{id:"B083",s:"bio",u:5,q:"Il potenziale di membrana a riposo di un neurone (circa −70 mV) dipende soprattutto:",o:["dalla maggiore permeabilità della membrana a riposo al K⁺","dalla maggiore permeabilità della membrana a riposo al Na⁺","dall'attività elettrogenica della sola pompa Na⁺/K⁺","dall'ingresso continuo di Ca²⁺ attraverso canali di perdita","dall'uscita di anioni proteici attraverso la membrana"],e:"A riposo sono aperti soprattutto canali di 'perdita' per il K⁺: il K⁺ esce secondo gradiente e l'interno diventa negativo. Il contributo diretto della pompa è piccolo."},
{id:"B084",s:"bio",u:5,q:"La fase di depolarizzazione del potenziale d'azione è dovuta a:",o:["apertura dei canali voltaggio-dipendenti per il Na⁺","apertura dei canali voltaggio-dipendenti per il K⁺","inattivazione dei canali voltaggio-dipendenti per il Na⁺","blocco della pompa Na⁺/K⁺ e accumulo di Na⁺ interno","apertura dei canali per il Cl⁻ e ingresso di anioni"],e:"L'ingresso rapido di Na⁺ porta il potenziale verso valori positivi; la ripolarizzazione segue all'inattivazione dei canali del Na⁺ e all'apertura di quelli del K⁺."},
{id:"B085",s:"bio",u:5,q:"I trasportatori ABC (es. CFTR, MDR):",o:["usano l'idrolisi di ATP tramite domini di legame per i nucleotidi","sfruttano il gradiente di Na⁺ generato dalla pompa Na⁺/K⁺","sono canali passivi che si aprono in risposta al voltaggio","usano il gradiente protonico come le ATP sintasi di tipo F","sono pompe di tipo P che si autofosforilano durante il ciclo"],e:"Gli ABC hanno domini che legano e idrolizzano ATP. La glicoproteina P (MDR1) espelle farmaci e causa chemioresistenza; CFTR, mutato nella fibrosi cistica, è un canale per il Cl⁻."},
{id:"B086",s:"bio",u:5,q:"Le proteine destinate al reticolo endoplasmatico rugoso vengono riconosciute durante la traduzione da:",o:["SRP, che lega la sequenza segnale N-terminale idrofobica","le importine, che legano una sequenza NLS ricca di lisine","il complesso TOM, che lega una presequenza anfipatica","SRP, che lega una sequenza KDEL all'estremità C-terminale","il recettore del mannosio-6-fosfato nel cis-Golgi"],e:"SRP lega la sequenza segnale, arresta la traduzione e porta il ribosoma al recettore di SRP e al traslocone sul RER; la peptidasi del segnale rimuove poi la sequenza."},
{id:"B087",s:"bio",u:5,q:"La sequenza C-terminale KDEL serve a:",o:["trattenere o recuperare le proteine residenti nel RE","indirizzare le proteine dal trans-Golgi ai lisosomi","indirizzare le proteine dal citosol ai perossisomi","trattenere le proteine residenti nelle cisterne del Golgi","esportare le proteine dal RE verso la membrana plasmatica"],e:"Il recettore KDEL nel cis-Golgi riconosce le proteine del RE sfuggite e le riporta indietro con vescicole COPI."},
{id:"B088",s:"bio",u:5,q:"Nel reticolo endoplasmatico, calnexina e calreticulina:",o:["sono chaperon che legano glicoproteine monoglucosilate","sono lectine che aggiungono mannosio-6-fosfato agli enzimi","sono chaperon citosoliche che legano proteine ubiquitinate","formano il rivestimento delle vescicole COPII in uscita dal RE","sono peptidasi che rimuovono la sequenza segnale"],e:"Fanno parte del ciclo calnexina/calreticulina: le proteine mal ripiegate vengono trattenute e, se non si ripiegano, avviate all'ERAD."},
{id:"B089",s:"bio",u:5,q:"Il sistema ERAD:",o:["riporta nel citosol le proteine mal ripiegate del RE per il proteasoma","porta le proteine mal ripiegate del RE ai lisosomi per l'idrolisi","riporta al RE, con vescicole COPI, le proteine sfuggite al Golgi","aumenta la sintesi di chaperon in risposta allo stress del RE","degrada nel lume del RE le proteine prive di glicosilazione"],e:"ERAD = ER-associated degradation. Nella fibrosi cistica la variante più comune di CFTR (ΔF508) è riconosciuta come mal ripiegata e degradata così."},
{id:"B090",s:"bio",u:5,q:"La risposta UPR (unfolded protein response) viene attivata da:",o:["accumulo di proteine mal ripiegate nel lume del RE","accumulo di proteine mal ripiegate nel citosol, legate a Hsp70","accumulo di proteine poliubiquitinate nel nucleo","carenza di colesterolo nella membrana del reticolo","accumulo di enzimi lisosomiali privi di mannosio-6-fosfato"],e:"La UPR riduce la traduzione, aumenta la produzione di chaperon e di componenti ERAD e, se lo stress persiste, può indurre apoptosi."},
{id:"B091",s:"bio",u:5,q:"Il segnale che indirizza gli enzimi idrolitici ai lisosomi è:",o:["il mannosio-6-fosfato aggiunto nel cis-Golgi","la sequenza KDEL riconosciuta nel cis-Golgi","la sequenza SKL C-terminale riconosciuta da Pex5","il glucosio terminale riconosciuto dalla calnexina","una presequenza N-terminale anfipatica"],e:"La fosfotransferasi del cis-Golgi aggiunge il fosfato al mannosio; nel trans-Golgi i recettori M6P smistano gli enzimi verso gli endosomi e i lisosomi."},
{id:"B092",s:"bio",u:5,q:"Le vescicole rivestite da COPII mediano il trasporto:",o:["dal reticolo endoplasmatico al Golgi (anterogrado)","dal Golgi al reticolo endoplasmatico (retrogrado)","dalla membrana plasmatica agli endosomi precoci","dal trans-Golgi agli endosomi e ai lisosomi","tra le cisterne del Golgi in senso retrogrado"],e:"COPII: RE → Golgi. COPI: trasporto retrogrado Golgi → RE e tra cisterne. Clatrina: endocitosi e trans-Golgi → endosomi."},
{id:"B093",s:"bio",u:5,q:"Le proteine SNARE sono coinvolte nella:",o:["fusione delle vescicole con la membrana bersaglio","formazione del rivestimento di clatrina sulle fossette","gemmazione delle vescicole dal reticolo endoplasmatico","fissione del collo delle vescicole tramite la dinamina","selezione del carico tramite le proteine adattatrici"],e:"v-SNARE (sulla vescicola) e t-SNARE (sul bersaglio) si avvolgono a formare un fascio di eliche che avvicina le membrane fino alla fusione; NSF e SNAP poi separano il complesso."},
{id:"B094",s:"bio",u:5,q:"Nell'endocitosi delle LDL mediata da recettore:",o:["il recettore torna in membrana e le LDL vanno ai lisosomi","il recettore e le LDL vengono degradati insieme nei lisosomi","le LDL tornano in membrana e il recettore va ai lisosomi","le LDL si staccano a pH neutro e restano nel citosol","le LDL entrano senza formare fossette rivestite di clatrina"],e:"Nell'endosoma precoce il pH acido stacca le LDL dal recettore: il recettore torna in membrana, le LDL vanno ai lisosomi dove si libera colesterolo. Difetti del recettore causano ipercolesterolemia familiare."},
{id:"B095",s:"bio",u:5,q:"Nell'endocitosi della transferrina, dopo l'acidificazione dell'endosoma:",o:["il ferro si libera e l'apotransferrina torna in superficie col recettore","il ferro si libera e la transferrina viene degradata nei lisosomi","il ferro resta legato e la transferrina torna in superficie col recettore","il recettore si stacca e viene degradato insieme alla transferrina","la transferrina si stacca dal recettore e passa nel citosol"],e:"A pH acido il Fe³⁺ si dissocia, mentre l'apotransferrina resta legata al recettore e insieme vengono riciclati alla membrana, dove a pH neutro si staccano."},
{id:"B096",s:"bio",u:5,q:"La transcitosi è:",o:["il trasporto di macromolecole attraverso una cellula polarizzata","l'esocitosi regolata di macromolecole da una cellula polarizzata","il passaggio di macromolecole tra cellule adiacenti via giunzioni gap","il passaggio paracellulare di macromolecole tra le giunzioni strette","l'ingresso di macromolecole e la loro degradazione nei lisosomi"],e:"Un esempio è il passaggio di IgA attraverso gli epiteli o di IgG materne attraverso la placenta e l'epitelio intestinale del neonato."},
{id:"B097",s:"bio",u:5,q:"La macroautofagia prevede:",o:["un autofagosoma a doppia membrana che poi si fonde con un lisosoma","un autofagosoma a membrana singola che si fonde con il Golgi","l'invaginazione diretta della membrana lisosomiale","il trasporto di singole proteine tramite Hsc70 e LAMP-2A","la degradazione di organelli interi nel proteasoma 26S"],e:"Nella macroautofagia porzioni di citoplasma o organelli sono racchiusi in un autofagosoma. La microautofagia è l'inglobamento diretto da parte del lisosoma; l'autofagia mediata da chaperon usa Hsc70 e LAMP-2A."},
{id:"B098",s:"bio",u:5,q:"Le malattie lisosomiali da accumulo sono dovute di solito a:",o:["deficit di un'idrolasi lisosomiale con accumulo del substrato","eccesso di attività di un enzima lisosomiale e deplezione del substrato","deficit della pompa protonica con aumento del pH del lisosoma","deficit di un enzima perossisomiale con accumulo di acidi grassi","mutazioni del DNA mitocondriale che riducono la sintesi di ATP"],e:"Esempi: malattia di Tay-Sachs (esosaminidasi A), di Gaucher (glucocerebrosidasi), di Pompe (α-glucosidasi acida). La malattia a cellule I deriva invece da un difetto nella marcatura M6P."},
{id:"B099",s:"bio",u:5,q:"I perossisomi:",o:["ossidano acidi grassi a catena molto lunga e degradano H₂O₂ con la catalasi","ossidano acidi grassi a catena corta e producono ATP per fosforilazione","degradano H₂O₂ con la superossido dismutasi e contengono DNA proprio","derivano per gemmazione dal Golgi e contengono idrolasi acide","sintetizzano glicogeno e degradano H₂O₂ con la perossidasi"],e:"Ospitano ossidasi che producono H₂O₂, eliminata dalla catalasi. La sindrome di Zellweger è un difetto della biogenesi perossisomiale (mutazioni dei geni PEX)."},
{id:"B100",s:"bio",u:5,q:"Il segnale PTS1 per l'importazione nei perossisomi è:",o:["un tripeptide C-terminale Ser-Lys-Leu (SKL)","un tripeptide N-terminale Ser-Lys-Leu (SKL)","una sequenza C-terminale Lys-Asp-Glu-Leu (KDEL)","una sequenza interna ricca di lisine e arginine","una presequenza N-terminale anfipatica"],e:"PTS1 è riconosciuto dal recettore citosolico Pex5. Particolarità: i perossisomi importano proteine già ripiegate."},
{id:"B101",s:"bio",u:5,q:"Il complesso TOM si trova:",o:["sulla membrana mitocondriale esterna","sulla membrana mitocondriale interna","nella membrana del reticolo endoplasmatico","nell'involucro nucleare","nella membrana dei perossisomi"],e:"TOM (translocase of the outer membrane) importa tutte le proteine mitocondriali codificate dal nucleo; TIM23 e TIM22 operano sulla membrana interna, SAM inserisce le proteine a barile β nella membrana esterna."},
{id:"B102",s:"bio",u:5,q:"L'importazione di una proteina nella matrice mitocondriale richiede:",o:["una presequenza N-terminale, il potenziale di membrana e ATP","una presequenza C-terminale, il gradiente di Na⁺ e GTP","una sequenza segnale riconosciuta da SRP e il traslocone Sec61","una sequenza NLS e il gradiente di Ran-GTP","una sequenza SKL e il recettore citosolico Pex5"],e:"La presequenza carica positivamente è attratta dal potenziale negativo della matrice; mtHsp70 tira la catena dentro consumando ATP e la peptidasi MPP rimuove la presequenza."},
{id:"B103",s:"bio",u:5,q:"La catena di trasporto degli elettroni mitocondriale si trova:",o:["nella membrana mitocondriale interna","nella membrana mitocondriale esterna","nella matrice","nello spazio intermembrana","nel citosol"],e:"I complessi I-IV pompano protoni dalla matrice allo spazio intermembrana; l'ATP sintasi (complesso V), anch'essa nella membrana interna, usa il gradiente per produrre ATP."},
{id:"B104",s:"bio",u:5,q:"La glicolisi avviene:",o:["nel citosol","nella matrice mitocondriale","nella membrana mitocondriale interna","nel reticolo endoplasmatico","nei perossisomi"],e:"La glicolisi è citosolica e produce 2 piruvati, 2 ATP netti e 2 NADH per glucosio. Ciclo di Krebs e β-ossidazione avvengono nella matrice."},
{id:"B105",s:"bio",u:5,q:"Nella respirazione cellulare, l'accettore finale degli elettroni è:",o:["l'ossigeno, che viene ridotto ad acqua","il NAD⁺, che viene ridotto a NADH","il citocromo c, ridotto dal complesso III","l'ubichinone, ridotto a ubichinolo","il piruvato, ridotto a lattato"],e:"Il complesso IV (citocromo c ossidasi) trasferisce gli elettroni all'O₂, formando H₂O."},
{id:"B106",s:"bio",u:5,q:"I microtubuli sono polimeri di:",o:["eterodimeri di α- e β-tubulina","monomeri di actina G legati ad ATP","eterodimeri di α- e γ-tubulina","tetrameri di cheratine acide e basiche","dimeri di lamine di tipo A e B"],e:"I dimeri di α/β-tubulina formano protofilamenti (13 per microtubulo) con un'estremità + a crescita rapida e un'estremità − ancorata al centrosoma tramite γ-TuRC."},
{id:"B107",s:"bio",u:5,q:"L'instabilità dinamica dei microtubuli dipende da:",o:["idrolisi del GTP legato alla β-tubulina","idrolisi del GTP legato all'α-tubulina","idrolisi dell'ATP legato alla β-tubulina","idrolisi dell'ATP legato all'actina G","fosforilazione della tubulina da parte di CDK1"],e:"Il 'cappuccio' di GTP-tubulina stabilizza l'estremità +; se l'idrolisi lo raggiunge, il microtubulo va incontro a una rapida depolimerizzazione (catastrofe)."},
{id:"B108",s:"bio",u:5,q:"Le chinesine e le dineine:",o:["sono motori dei microtubuli diretti di solito verso + e − rispettivamente","sono motori dei microtubuli diretti di solito verso − e + rispettivamente","sono motori dell'actina diretti verso l'estremità + dei filamenti","sono proteine che nucleano i microtubuli dal centrosoma","sono motori dei filamenti intermedi che usano GTP"],e:"La maggior parte delle chinesine trasporta carichi verso la periferia (estremità +), la dineina citoplasmatica verso il centrosoma (estremità −). Entrambe usano ATP."},
{id:"B109",s:"bio",u:5,q:"L'assonema di ciglia e flagelli eucariotici ha una struttura:",o:["9 doppiette periferiche + 2 microtubuli centrali","9 triplette periferiche senza microtubuli centrali","9 doppiette periferiche senza microtubuli centrali","9 triplette periferiche + 2 microtubuli centrali","un fascio di filamenti di actina legati da fimbrina"],e:"Nove doppiette periferiche e due microtubuli centrali, con bracci di dineina assonemale. I centrioli e i corpi basali hanno invece 9 triplette."},
{id:"B110",s:"bio",u:5,q:"Il complesso Arp2/3:",o:["promuove la nucleazione di nuovi filamenti di actina ramificati","promuove l'allungamento di filamenti di actina lineari non ramificati","taglia e depolimerizza i filamenti di actina più vecchi","nuclea i microtubuli a partire dal centrosoma","sequestra i monomeri di actina impedendone la polimerizzazione"],e:"Arp2/3 si lega al lato di un filamento esistente e nuclea un ramo a circa 70°, formando la rete del lamellipodio."},
{id:"B111",s:"bio",u:5,q:"Nella regolazione del citoscheletro di actina, Rho, Rac e Cdc42 inducono rispettivamente:",o:["fibre da stress, lamellipodi e filopodi","filopodi, fibre da stress e lamellipodi","lamellipodi, filopodi e fibre da stress","microtubuli, filamenti intermedi e actina","ciglia, flagelli e microvilli"],e:"Sono piccole GTPasi: Rho forma fibre da stress e contrattilità, Rac lamellipodi, Cdc42 filopodi."},
{id:"B112",s:"bio",u:5,q:"La distrofina:",o:["collega l'actina del muscolo alla matrice extracellulare","collega i microtubuli del muscolo alla lamina nucleare","collega i filamenti spessi di miosina alla linea Z","lega il Ca²⁺ e regola il complesso troponina-tropomiosina","è un motore molecolare che trasporta vescicole nel muscolo"],e:"La distrofina lega l'actina e il complesso distroglicano-sarcoglicano; la sua assenza causa la distrofia muscolare di Duchenne (legata all'X)."},
{id:"B113",s:"bio",u:5,q:"Le lamine nucleari sono:",o:["filamenti intermedi che formano una rete sotto la membrana nucleare interna","filamenti intermedi che formano una rete sotto la membrana plasmatica","filamenti di actina che rivestono la membrana nucleare esterna","microtubuli che ancorano i cromosomi all'involucro nucleare","nucleoporine che formano l'anello del poro nucleare"],e:"La lamina sostiene l'involucro nucleare e organizza la cromatina; la sua fosforilazione da parte di CDK1 all'inizio della mitosi ne causa il disassemblaggio."},
{id:"B114",s:"bio",u:5,q:"Il trasporto nucleare di una proteina con NLS richiede:",o:["importine e un gradiente di Ran-GTP alto nel nucleo","importine e un gradiente di Ran-GTP alto nel citosol","esportine e un gradiente di Ran-GDP alto nel nucleo","SRP, il suo recettore e il traslocone Sec61","vescicole rivestite di clatrina e la dinamina"],e:"Ran-GEF (RCC1) è legato alla cromatina e genera Ran-GTP nel nucleo; Ran-GAP è nel citosol. Ran-GTP stacca il carico dalle importine nel nucleo e favorisce il legame alle esportine."},
{id:"B115",s:"bio",u:5,q:"Il nucleolo è il sito:",o:["di trascrizione degli rRNA e assemblaggio delle subunità","di traduzione degli mRNA e assemblaggio dei ribosomi 80S completi","di trascrizione dell'rRNA 5S e dei tRNA da parte della Pol III","di trascrizione degli mRNA e del loro splicing","di replicazione del DNA ribosomiale durante la fase G2"],e:"Nel nucleolo la Pol I trascrive il precursore 45S degli rRNA, che viene processato e assemblato con le proteine ribosomiali (l'rRNA 5S arriva dalla Pol III)."},
{id:"B116",s:"bio",u:5,q:"Il fattore di trascrizione SREBP viene attivato quando:",o:["il colesterolo è basso: SREBP va al Golgi e viene tagliato","il colesterolo è alto: SREBP va al Golgi e viene tagliato","il colesterolo è basso: SREBP viene ubiquitinato e degradato","il colesterolo è alto: SREBP lega il DNA restando nel RE","lega un ormone steroideo nel citosol ed entra nel nucleo"],e:"Con poco colesterolo, SCAP accompagna SREBP al Golgi, dove le proteasi S1P e S2P liberano il dominio citosolico, che attiva nel nucleo i geni per la sintesi e la captazione del colesterolo."}
);

// BIOLOGIA — risposta multipla (parte 3: segnalazione, ciclo cellulare, morte) + completamento
BANK.push(
