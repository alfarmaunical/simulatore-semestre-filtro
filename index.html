{id:"B516",s:"bio",u:5,q:"Nella mitofagia mediata da PINK1 e Parkin, il segnale che marca un mitocondrio danneggiato è:",o:["l'accumulo di PINK1 sulla membrana esterna dei mitocondri depolarizzati","l'importazione di PINK1 nella matrice dei mitocondri depolarizzati","l'aumento del potenziale di membrana e l'accumulo di Parkin nella matrice","la fusione con mitocondri sani mediata dalle mitofusine","la degradazione di PINK1 sulla membrana interna dei mitocondri"],e:"Nei mitocondri sani PINK1 viene importata e degradata; mutazioni di PINK1 o PRKN causano forme familiari di malattia di Parkinson."},
{id:"B517",s:"bio",u:5,q:"Le ciglia primarie, presenti in una sola copia su molte cellule, hanno struttura 9+0 e svolgono soprattutto funzione:",o:["sensoriale e di segnalazione","di movimento coordinato dei fluidi","di locomozione della cellula","di ancoraggio alla lamina basale","di organizzazione del fuso mitotico"],e:"Difetti delle ciglia primarie causano le ciliopatie (es. rene policistico)."},
{id:"B518",s:"bio",u:5,q:"L'actina e la tubulina hanno in comune il fatto di:",o:["polimerizzare in filamenti polarizzati idrolizzando un NTP legato","polimerizzare in filamenti apolari che legano entrambi GTP","polimerizzare in filamenti polarizzati che legano entrambi ATP","formare filamenti senza motori associati, come i filamenti intermedi","polimerizzare solo nel nucleo durante la mitosi"],e:"L'actina lega ATP, la tubulina GTP; l'idrolisi del nucleotide regola la dinamica dei polimeri."},
{id:"B519",s:"bio",u:5,q:"La falloidina, tossina del fungo Amanita phalloides, è tossica perché:",o:["stabilizza i filamenti di actina impedendone la depolimerizzazione","depolimerizza i filamenti di actina legandosi ai monomeri","stabilizza i microtubuli del fuso impedendone la depolimerizzazione","inibisce la RNA polimerasi II bloccando la trascrizione","blocca la polimerizzazione dell'actina all'estremità +"],e:"Nella stessa amanita l'α-amanitina inibisce invece la RNA polimerasi II ed è la principale causa del danno epatico."},
{id:"B520",s:"bio",u:5,q:"Le proteine MAP non motrici (come tau) servono soprattutto a:",o:["stabilizzare i microtubuli e regolarne l'organizzazione","trasportare vescicole verso l'estremità + dei microtubuli","nucleare nuovi microtubuli a partire dal centrosoma","tagliare i microtubuli in frammenti più corti","collegare i microtubuli ai filamenti di actina corticale"],e:"Nella malattia di Alzheimer tau iperfosforilata si stacca dai microtubuli e forma grovigli neurofibrillari."},

{id:"B521",s:"bio",u:3,d:1,q:"Il segmento di DNA 5'-ATT GGC AGC-3' è il filamento codificante di un gene. Il peptide codificato (codoni dell'mRNA identici al filamento codificante, con U al posto di T) è:",o:["Ile-Gly-Ser","Tyr-Pro-Ser","Leu-Ala-Arg","Ile-Ala-Ser","Asn-Gly-Ser"],e:"mRNA 5'-AUU GGC AGC-3': AUU = Ile, GGC = Gly, AGC = Ser."},
{id:"B522",s:"bio",u:3,d:1,q:"In un mRNA eucariotico maturo, la mutazione del secondo codone AUG presente più a valle rispetto al primo AUG in buon contesto di Kozak:",o:["di norma non cambia l'inizio, che avviene al primo AUG","sposta l'inizio sul secondo AUG, perché il primo viene saltato","impedisce la traduzione, perché servono entrambi gli AUG","produce una proteina più lunga che inizia dal terzo AUG","blocca lo scanning del ribosoma a livello del cap"],e:"Il complesso di preinizio scansiona dal cap e inizia di norma al primo AUG in contesto favorevole; un AUG più a valle codifica solo una metionina interna."},
{id:"B523",s:"bio",u:3,d:1,q:"Una mutazione che elimina il sito di splicing al 5' dell'introne 2 di un gene può avere come conseguenza:",o:["ritenzione dell'introne o uso di un sito criptico, spesso con frameshift","l'aumento della trascrizione del gene per perdita di un silencer intronico","la perdita del cap al 5' e la degradazione rapida dell'mRNA","la rimozione corretta dell'introne, guidata dal solo sito al 3'","la sostituzione di un solo amminoacido senza altre conseguenze"],e:"Molte malattie genetiche (es. alcune β-talassemie) derivano da mutazioni dei siti di splicing."},
{id:"B524",s:"bio",u:3,d:1,q:"Gli mRNA che contengono un codone di stop prematuro lontano dall'ultimo esone vengono spesso degradati dal meccanismo:",o:["NMD (nonsense-mediated decay)","ERAD (degradazione associata al RE)","RNAi mediata da siRNA esogeni","autofagia mediata da chaperon","editing dell'RNA da parte di ADAR"],e:"La NMD riconosce stop che precedono complessi giunzione-esone ancora legati all'mRNA; protegge la cellula da proteine tronche potenzialmente dannose."},
{id:"B525",s:"bio",u:3,d:1,q:"Durante la replicazione di un cromosoma lineare, l'estremità 3' di ciascun filamento stampo non può essere copiata completamente perché:",o:["tolto l'ultimo primer del filamento lento, manca un 3'-OH da cui riempire il vuoto","la DNA polimerasi lavora solo 3'→5' e si ferma prima dell'estremità","l'elicasi non riesce a srotolare le ultime basi del cromosoma","le topoisomerasi tagliano i telomeri a ogni ciclo di replicazione","tolto l'ultimo primer del filamento guida, manca un 5'-fosfato da cui ripartire"],e:"È il 'problema della replicazione delle estremità', risolto dalla telomerasi nelle cellule che la esprimono."},

{id:"B526",s:"bio",u:4,d:1,q:"In una coppia la madre è di gruppo A e il padre di gruppo B; il loro primo figlio è di gruppo 0. La probabilità che il secondo figlio sia di gruppo AB è:",o:["1/4","1/2","0","3/4","1/8"],e:"Il figlio 0 (ii) dimostra che entrambi i genitori sono eterozigoti: I^A i × I^B i → 1/4 AB, 1/4 A, 1/4 B, 1/4 0."},
{id:"B527",s:"bio",u:4,d:1,q:"Una donna con visione normale, il cui padre era daltonico, sposa un uomo daltonico. La probabilità che una loro figlia sia daltonica è:",o:["1/2","1/4","0","1","3/4"],e:"La donna è portatrice (XᴰXᵈ); le figlie ricevono Xᵈ dal padre e con probabilità 1/2 Xᵈ dalla madre."},
{id:"B528",s:"bio",u:4,d:1,q:"Due genitori sani hanno un figlio con fibrosi cistica (autosomica recessiva). Una loro figlia sana chiede la probabilità di essere portatrice. Essa è:",o:["2/3","1/2","1/4","3/4","1/3"],e:"Tra i figli sani (AA o Aa, in rapporto 1:2) la probabilità di essere Aa è 2/3."},
{id:"B529",s:"bio",u:4,d:1,q:"Due geni A e B distano 20 cM. Un individuo AB/ab (in fase di accoppiamento) viene incrociato con ab/ab. La percentuale attesa di figli con fenotipo Ab è:",o:["10%","20%","40%","25%","5%"],e:"I gameti ricombinanti (Ab e aB) sono in totale il 20%, quindi il 10% ciascuno."},
{id:"B530",s:"bio",u:4,d:1,q:"In una specie, il colore del fiore dipende da due geni: serve almeno un allele dominante di entrambi (A_B_) per il fiore viola, altrimenti è bianco. Dalla F2 di AaBb × AaBb si ottiene:",o:["9 viola : 7 bianchi","15 viola : 1 bianco","3 viola : 1 bianco","12 viola : 4 bianchi","1 viola : 1 bianco"],e:"È l'epistasi doppia recessiva (geni complementari): 9/16 A_B_ viola; tutti gli altri genotipi (3 + 3 + 1) bianchi."},
{id:"B531",s:"bio",u:4,d:1,q:"Un uomo affetto da una malattia mitocondriale ha figli con una donna sana. La probabilità che i figli siano affetti è circa:",o:["0","1/2","1/4","1","dipende dal sesso del figlio"],e:"I mitocondri dello spermatozoo non vengono trasmessi in modo significativo allo zigote."},
{id:"B532",s:"bio",u:4,d:1,q:"Una portatrice bilanciata di una traslocazione robertsoniana 14;21 ha 45 cromosomi. Il suo rischio principale è:",o:["avere figli con sindrome di Down da traslocazione","avere figli con sindrome di Down da trisomia libera","essere lei stessa affetta da una forma lieve di Down","avere figli con sindrome di Patau da trisomia 13","avere figli con 45 cromosomi e sindrome di Turner"],e:"Alla meiosi può produrre gameti con il cromosoma di traslocazione più un 21 libero; il figlio avrà 46 cromosomi ma tre copie del materiale del 21."},
{id:"B533",s:"bio",u:4,d:1,q:"La frequenza dei gameti ricombinanti tra due geni non può superare circa il 50% perché:",o:["con più crossing over il risultato equivale all'assortimento indipendente","il crossing over avviene al massimo una volta per coppia di omologhi","i gameti ricombinanti sono meno vitali di quelli parentali","i geni associati non possono ricombinare oltre una certa distanza fisica","il 50% dei gameti non partecipa alla fecondazione"],e:"Per geni molto distanti sullo stesso cromosoma la frequenza tende al 50%, come per geni su cromosomi diversi."},

{id:"B534",s:"bio",u:7,d:1,q:"Una cellula con 2n = 6 subisce una non disgiunzione di una coppia di omologhi in meiosi I. I quattro gameti avranno numero di cromosomi:",o:["4, 4, 2, 2","3, 3, 3, 3","4, 3, 3, 2","6, 6, 0, 0","3, 3, 4, 2"],e:"Una cellula figlia riceve entrambi gli omologhi (4 cromosomi), l'altra nessuno (2); in meiosi II ciascuna si divide normalmente."},
{id:"B535",s:"bio",u:7,d:1,q:"Una non disgiunzione dei cromatidi fratelli di un cromosoma durante la meiosi II di una sola delle due cellule produce gameti con numero (n = 23):",o:["23, 23, 24, 22","24, 24, 22, 22","23, 23, 23, 23","46, 46, 0, 0","24, 23, 23, 22"],e:"La cellula che ha completato normalmente la meiosi II dà due gameti normali; l'altra dà un gamete n+1 e uno n−1."},
{id:"B536",s:"bio",u:7,d:1,q:"Una cellula tumorale ha perso entrambe le copie di RB1. Quale delle seguenti conseguenze è più diretta?",o:["E2F resta libero e la cellula entra in S anche senza mitogeni","E2F resta sequestrato e la cellula non può più entrare in S","p53 viene iperattivata e la cellula va subito in apoptosi","il checkpoint del fuso si inattiva e la cellula diventa aneuploide","la ciclina B non viene degradata e la cellula resta in mitosi"],e:"Rb è il 'freno' del punto di restrizione G1/S; senza Rb la proliferazione non dipende più dai segnali mitogeni."},
{id:"B537",s:"bio",u:7,d:1,q:"Un farmaco che stabilizza i microtubuli (come il taxolo) blocca le cellule in mitosi perché:",o:["blocca la dinamica dei microtubuli e mantiene attivo il checkpoint del fuso","depolimerizza i microtubuli e impedisce la formazione del fuso","impedisce la replicazione del DNA e attiva il checkpoint G2/M","degrada la ciclina B e impedisce l'uscita dalla mitosi","inattiva il checkpoint del fuso e fa separare i cromatidi in anticipo"],e:"Senza tensione e attacchi corretti, il SAC inibisce APC/C e la cellula resta in metafase; un arresto prolungato porta spesso all'apoptosi."},
{id:"B538",s:"bio",u:7,d:1,q:"Una cellula con un'iperespressione di Bcl-2 risponde a un danno al DNA grave e irreparabile:",o:["resistendo all'apoptosi intrinseca, perché la MOMP è inibita","andando in apoptosi più rapidamente per eccesso di Bax attivo","attivando automaticamente la via estrinseca tramite Fas","riparando sempre il danno grazie all'attività di Bcl-2","andando in necrosi per rottura della membrana mitocondriale"],e:"È un meccanismo di sopravvivenza tumorale, ad esempio nel linfoma follicolare con traslocazione t(14;18)."},
{id:"B539",s:"bio",u:6,d:1,q:"Una mutazione che rende la subunità Gα incapace di idrolizzare il GTP porta a:",o:["attivazione persistente degli effettori anche senza ligando","assenza totale di segnale, perché Gα non si separa più da βγ","attivazione persistente del recettore, che non lega più il ligando","rapida degradazione del recettore per desensitizzazione","segnale normale, perché l'idrolisi è affidata alle sole RGS"],e:"È lo stesso effetto della tossina colerica su Gs: la proteina resta bloccata nella forma attiva."},
{id:"B540",s:"bio",u:6,d:1,q:"In una cellula priva dell'enzima fosfodiesterasi del cAMP, dopo una stimolazione β-adrenergica si osserverebbe:",o:["una risposta prolungata, perché il cAMP prodotto non viene degradato","nessuna risposta, perché il cAMP non viene prodotto","una risposta più breve, per desensitizzazione rapida del recettore","l'attivazione della PKC invece della PKA, per eccesso di cAMP","una risposta prolungata, perché l'adenilato ciclasi non si spegne mai"],e:"La fosfodiesterasi spegne il segnale idrolizzando il cAMP in AMP; la caffeina, inibendola debolmente, prolunga gli effetti del cAMP."}
);
BANK.push(
{id:"BH01",s:"bio",u:4,d:1,q:"Due genitori eterozigoti per una malattia autosomica recessiva hanno tre figli. La probabilità che nessuno dei tre sia affetto, espressa come frazione, è 27/……",c:["64","sessantaquattro"],n:64,e:"(3/4)³ = 27/64."},
{id:"BH02",s:"bio",u:4,d:1,q:"Da un incrocio AaBbCc × AaBbCc (geni indipendenti) la probabilità di un figlio aabbcc è 1/……",c:["64","sessantaquattro"],n:64,e:"(1/4)³ = 1/64."},
{id:"BH03",s:"bio",u:4,d:1,q:"Il numero di tipi diversi di gameti prodotti da un individuo AaBbCcDd (geni indipendenti) è ……",c:["16","sedici"],n:16,e:"2⁴ = 16."},
{id:"BH04",s:"bio",u:3,d:1,q:"Una molecola di DNA a doppio filamento con ¹⁵N replica 4 volte in terreno con ¹⁴N. Il numero di molecole che contengono ¹⁵N è ……",c:["2","due"],n:2,e:"Su 16 molecole solo 2 conservano un filamento originale."},
{id:"BH05",s:"bio",u:3,d:1,q:"Un gene codifica una proteina di 300 amminoacidi. La regione codificante dell'mRNA, compreso il codone di stop, è lunga …… nucleotidi.",c:["903","novecentotre"],n:903,e:"300 × 3 = 900, più 3 nucleotidi del codone di stop."},
{id:"BH07",s:"bio",u:7,d:1,q:"Una cellula con 2n = 46 in anafase mitotica contiene …… cromosomi (contando ogni cromatidio separato come un cromosoma).",c:["92","novantadue"],n:92,e:"In anafase i cromatidi fratelli si separano e diventano cromosomi indipendenti."},
{id:"BH08",s:"bio",u:7,d:1,q:"Con 23 coppie di cromosomi e assortimento indipendente (senza crossing over), il numero di combinazioni diverse di gameti è 2^……",c:["23","ventitre","ventitré"],n:23,e:"2²³ ≈ 8,4 milioni."},
{id:"BH09",s:"bio",u:5,d:1,q:"La proteina disaccoppiante del tessuto adiposo bruno che dissipa il gradiente protonico producendo calore si indica con la sigla ……",c:["ucp1","ucp","termogenina"],e:"È detta anche termogenina."},
{id:"BH10",s:"bio",u:3,d:1,q:"Il meccanismo che degrada gli mRNA contenenti un codone di stop prematuro si indica con la sigla ……",c:["nmd"],e:"Nonsense-mediated decay."},
{id:"BH11",s:"bio",u:4,d:1,q:"Due geni distano 15 cM. Da un AB/ab × ab/ab la percentuale attesa di figli con fenotipo aB è …… %",c:["7,5","7.5"],n:7.5,e:"Ricombinanti totali 15%, metà per ciascuna classe."}
);

BANK.push(
{id:"C501",s:"chem",u:3,q:"Si sciolgono 4 g di NaOH (M = 40 g/mol) in acqua fino a 200 mL. La molarità è:",o:["0,5 M","0,02 M","2 M","0,1 M","20 M"],e:"n = 0,1 mol; M = 0,1/0,2 = 0,5 M."},
{id:"C502",s:"chem",u:3,q:"Quanti mL di una soluzione 2 M di HCl servono per avere 0,1 mol di HCl?",o:["50 mL","20 mL","200 mL","5 mL","100 mL"],e:"V = n/M = 0,1/2 = 0,05 L."},
{id:"C503",s:"chem",u:3,q:"Una soluzione di etanolo al 40% v/v contiene in 250 mL di soluzione:",o:["100 mL di etanolo","40 mL di etanolo","150 mL di etanolo","10 mL di etanolo","250 mL di etanolo"],e:"0,40 × 250 = 100 mL."},
{id:"C504",s:"chem",u:3,q:"Quale delle seguenti soluzioni è isotonica con una soluzione 0,3 M di glucosio?",o:["NaCl 0,15 M","NaCl 0,3 M","CaCl₂ 0,3 M","glucosio 0,15 M","urea 0,6 M"],e:"Il glucosio 0,3 M ha osmolarità 0,3; NaCl 0,15 M dà 0,15 × 2 = 0,3 osmol/L."},
{id:"C505",s:"chem",u:3,q:"Due soluzioni separate da una membrana semipermeabile: A è NaCl 0,1 M, B è glucosio 0,1 M. L'acqua si sposta:",o:["da B verso A","da A verso B","in nessuna direzione","solo se si scalda","da A verso B e poi torna indietro"],e:"A ha osmolarità 0,2, B 0,1: l'acqua va verso la soluzione a osmolarità maggiore."},
{id:"C506",s:"chem",u:3,q:"La solubilità dell'ossigeno nel sangue a livello del mare dipende soprattutto:",o:["dalla pressione parziale dell'O₂ negli alveoli (legge di Henry)","dalla pressione atmosferica totale, indipendentemente dalla composizione","dalla concentrazione di emoglobina nel sangue (legge di Henry)","dal pH del plasma, secondo l'equazione di Henderson-Hasselbalch","dalla pressione parziale dell'azoto negli alveoli"],e:"La quota disciolta è piccola; la maggior parte dell'O₂ è trasportata dall'emoglobina."},
{id:"C507",s:"chem",u:3,q:"A parità di massa, quale soluto abbassa di più il punto di congelamento dell'acqua?",o:["NaCl (M = 58,5)","glucosio (M = 180)","saccarosio (M = 342)","urea (M = 60)","glicerolo (M = 92)"],e:"Conta il numero di particelle: NaCl ha massa molare piccola e si dissocia in 2 ioni."},
{id:"C508",s:"chem",u:3,q:"L'innalzamento ebullioscopico di una soluzione acquosa 1 molale di glucosio è circa 0,52 °C. Per una soluzione 1 molale di NaCl sarà circa:",o:["1,04 °C","0,52 °C","0,26 °C","1,56 °C","5,2 °C"],e:"ΔTeb = i·Keb·m con i = 2."},
{id:"C509",s:"chem",u:3,q:"Un elettrolita debole in soluzione:",o:["si dissocia solo in parte e la soluzione conduce poco","si dissocia completamente e la soluzione conduce molto","si dissocia completamente ma la soluzione conduce poco","non si dissocia affatto e non conduce","si dissocia solo in parte ma conduce più di un elettrolita forte"],e:"Esempi: acido acetico, ammoniaca."},

{id:"C510",s:"chem",u:5,q:"Il pH di una soluzione 0,1 M di acido acetico (Ka ≈ 1,8·10⁻⁵) è circa:",o:["2,9","1","4,7","5,8","7"],e:"[H⁺] ≈ √(1,8·10⁻⁶) ≈ 1,34·10⁻³ M → pH ≈ 2,87."},
{id:"C511",s:"chem",u:5,q:"Il pH di una soluzione 0,1 M di ammoniaca (Kb ≈ 1,8·10⁻⁵) è circa:",o:["11,1","2,9","13","9,25","7"],e:"[OH⁻] ≈ 1,34·10⁻³ M → pOH ≈ 2,87 → pH ≈ 11,1."},
{id:"C512",s:"chem",u:5,q:"Un tampone è formato da 0,2 mol di acido acetico e 0,2 mol di acetato di sodio in 1 L (pKa = 4,75). Il pH è:",o:["4,75","2,9","7","5,05","4,45"],e:"Concentrazioni uguali → pH = pKa."},
{id:"C513",s:"chem",u:5,q:"Aggiungendo una piccola quantità di HCl a un tampone acetico/acetato:",o:["l'acetato reagisce con gli H⁺ formando acido acetico e il pH cambia poco","l'acido acetico reagisce con gli H⁺ formando acetato e il pH cambia poco","l'acetato reagisce con gli H⁺ e il pH crolla bruscamente","l'acido acetico neutralizza l'HCl e il pH aumenta","gli H⁺ restano liberi e il pH scende come in acqua pura"],e:"La base del tampone neutralizza l'acido aggiunto; il rapporto [A⁻]/[HA] cambia poco, e quindi anche il pH."},
{id:"C514",s:"chem",u:5,q:"Quale coppia può costituire un sistema tampone?",o:["NaH₂PO₄ / Na₂HPO₄","HCl / NaCl","NaOH / NaCl","KOH / KCl","HNO₃ / KNO₃"],e:"Serve un acido debole con la sua base coniugata: H₂PO₄⁻/HPO₄²⁻ (pKa ≈ 6,8)."},
{id:"C515",s:"chem",u:5,q:"Il potere tampone di una soluzione è massimo quando:",o:["pH = pKa, con acido e base coniugata in concentrazioni uguali","pH = 7, indipendentemente dal pKa dell'acido debole","pH = pKa + 2, con base in forte eccesso sull'acido","pH = pKa, con l'acido completamente dissociato","pH = pKa − 2, con acido in forte eccesso sulla base"],e:"In questa condizione il tampone neutralizza ugualmente bene acidi e basi aggiunti."},
{id:"C516",s:"chem",u:5,q:"Le proteine plasmatiche e l'emoglobina contribuiscono al tamponamento del sangue soprattutto grazie:",o:["ai residui di istidina, con pKa vicino a 6-7","ai residui di lisina, con pKa vicino a 10","ai residui di aspartato, con pKa vicino a 4","ai legami peptidici, con pKa vicino a 7","al ferro dell'eme, che lega gli H⁺"],e:"Le catene laterali ionizzabili con pKa vicino al pH fisiologico sono le più efficaci."},
{id:"C517",s:"chem",u:5,q:"In una soluzione 0,01 M di NaOH, la concentrazione di H₃O⁺ è:",o:["10⁻¹² M","10⁻² M","10⁻⁷ M","10⁻¹⁴ M","10² M"],e:"[OH⁻] = 10⁻² → [H₃O⁺] = Kw/[OH⁻] = 10⁻¹²."},
{id:"C518",s:"chem",u:5,q:"Il carbonato di sodio Na₂CO₃ sciolto in acqua dà una soluzione:",o:["basica","acida","neutra","acida o basica a seconda della temperatura","non si scioglie"],e:"CO₃²⁻ è la base coniugata dell'acido debole HCO₃⁻ e si idrolizza producendo OH⁻."},
{id:"C519",s:"chem",u:5,q:"Bilanciando in ambiente acido Fe²⁺ + MnO₄⁻ → Fe³⁺ + Mn²⁺, il rapporto tra Fe²⁺ e MnO₄⁻ è:",o:["5 : 1","1 : 5","1 : 1","2 : 5","3 : 1"],e:"Ogni Fe²⁺ cede 1 elettrone, ogni MnO₄⁻ ne acquista 5: servono 5 Fe²⁺ per ogni MnO₄⁻."},
{id:"C520",s:"chem",u:5,q:"Secondo l'equazione di Nernst, in una pila a concentrazione con Cu²⁺ 1 M e 0,01 M (n = 2, 25 °C) la f.e.m. è circa:",o:["0,059 V","0,118 V","0,03 V","1,1 V","0 V"],e:"E = (0,059/2)·log(1/0,01) = 0,0295 × 2 = 0,059 V."},
{id:"C521",s:"chem",u:5,q:"La relazione tra potenziale standard e costante di equilibrio di una reazione redox è:",o:["un E° positivo corrisponde a K > 1","un E° positivo corrisponde a K < 1","E° e K non sono collegati","K è sempre 1","un E° negativo corrisponde a K molto grande"],e:"ΔG° = −nFE° = −RT ln K."},

{id:"C522",s:"chem",u:8,q:"A pH 7, il dipeptide Lys-Gly ha carica netta circa:",o:["+1","0","−1","+2","−2"],e:"Gruppi carichi: NH₃⁺ N-terminale (+1), catena laterale della lisina (+1), COO⁻ C-terminale (−1): totale +1."},
{id:"C523",s:"chem",u:8,q:"A pH 7, il dipeptide Asp-Gly ha carica netta circa:",o:["−1","+1","0","−2","+2"],e:"+1 (N-terminale) −1 (C-terminale) −1 (catena laterale dell'aspartato) = −1."},
{id:"C524",s:"chem",u:8,q:"Quanti legami peptidici sono presenti in un tetrapeptide lineare?",o:["3","4","2","5","8"],e:"In un peptide lineare di n amminoacidi ci sono n − 1 legami peptidici."},
{id:"C525",s:"chem",u:8,q:"Quanti tripeptidi diversi si possono formare usando una volta ciascuno tre amminoacidi diversi (A, B, C)?",o:["6","3","9","27","1"],e:"Permutazioni di 3 elementi: 3! = 6 (la sequenza ha una direzione N→C)."},
{id:"C526",s:"chem",u:8,q:"Nel foglietto β delle proteine, i legami a idrogeno si formano:",o:["tra segmenti diversi della catena, affiancati paralleli o antiparalleli","tra residui distanti 4 posizioni all'interno della stessa α-elica","tra catene laterali di cisteina di segmenti affiancati","tra catene laterali cariche di segmenti diversi","tra segmenti diversi, ma solo in disposizione parallela"],e:"Nell'α-elica invece il C=O del residuo n lega l'N−H del residuo n+4."},
{id:"C527",s:"chem",u:8,q:"L'emoglobina con quattro subunità, ciascuna con un gruppo eme, è un esempio di proteina con struttura:",o:["quaternaria","solo primaria","solo secondaria","fibrosa","lipidica"],e:"La mioglobina, con una sola catena, ha solo fino alla struttura terziaria."},
{id:"C528",s:"chem",u:8,q:"Il glucosio in soluzione acquosa si trova prevalentemente:",o:["in forma ciclica piranosica, con circa due terzi di anomero β","in forma ciclica piranosica, con circa due terzi di anomero α","in forma ciclica furanosica, con circa due terzi di anomero β","in forma aperta aldeidica, con piccole quantità di forme cicliche","in forma ciclica piranosica, con anomeri α e β in parti uguali"],e:"La forma aperta è meno dell'1%; l'anomero β è favorito perché tutti i sostituenti voluminosi sono in posizione equatoriale."},
{id:"C529",s:"chem",u:8,q:"La riduzione del gruppo carbonilico del glucosio produce:",o:["sorbitolo (glucitolo), un polialcol","acido gluconico, un acido aldonico","acido glucuronico, un acido uronico","fruttosio, un chetoesoso","mannitolo, l'epimero in C2 del sorbitolo"],e:"L'ossidazione del C1 dà invece acido gluconico. Nel diabete l'accumulo di sorbitolo nel cristallino contribuisce alla cataratta."},
{id:"C530",s:"chem",u:8,q:"L'acido ialuronico è:",o:["un glicosamminoglicano non solfatato di acido glucuronico e N-acetilglucosammina","un glicosamminoglicano solfatato di acido glucuronico e N-acetilgalattosammina","un omopolisaccaride lineare di N-acetilglucosammina (come la chitina)","una glicoproteina fibrosa della matrice extracellulare","un glicosamminoglicano non solfatato legato covalentemente a una proteina centrale"],e:"Lega moltissima acqua: lubrifica le articolazioni ed è abbondante nell'umor vitreo e nella cute."},
{id:"C531",s:"chem",u:8,q:"Gli acidi grassi ω-3 si chiamano così perché:",o:["il primo doppio legame è sul C3 contando dall'estremità metilica","il primo doppio legame è sul C3 contando dal carbonio carbossilico","hanno esattamente 3 doppi legami nella catena","l'ultimo doppio legame è sul C3 contando dal carbossile","hanno un doppio legame ogni 3 atomi di carbonio"],e:"Esempi: α-linolenico, EPA, DHA (abbondanti nel pesce)."},
{id:"C532",s:"chem",u:8,q:"La fosfatidilcolina (lecitina) è formata da:",o:["glicerolo, due acidi grassi, un fosfato e la colina","sfingosina, un acido grasso, un fosfato e la colina","glicerolo, tre acidi grassi e la colina","glicerolo, due acidi grassi, un fosfato e la serina","glicerolo, un acido grasso, due fosfati e la colina"],e:"È il fosfolipide più abbondante delle membrane eucariotiche."},
{id:"C533",s:"chem",u:8,q:"Nel DNA, il legame fosfodiesterico unisce:",o:["il C3' di un nucleotide al C5' del successivo, tramite un fosfato","il C5' di un nucleotide al C5' del successivo, tramite un fosfato","il C2' di un nucleotide al C5' del successivo, tramite un fosfato","la base di un nucleotide al pentoso del successivo","due basi complementari dei filamenti opposti"],e:"Ne risulta uno scheletro zucchero-fosfato con un'estremità 5' e una 3'."},
{id:"C534",s:"chem",u:8,q:"Il coenzima A contiene un gruppo funzionale −SH che forma con gli acidi carbossilici:",o:["tioesteri","esteri","ammidi","eteri","disolfuri"],e:"L'acetil-CoA è un tioestere ad alta energia."},

{id:"C535",s:"chem",u:5,d:1,q:"Si mescolano 100 mL di acido acetico 0,2 M (pKa 4,75) con 50 mL di NaOH 0,2 M. Il pH della soluzione è circa:",o:["4,75","2,9","7","8,9","9,25"],e:"NaOH (0,01 mol) neutralizza metà dell'acido (0,02 mol): restano 0,01 mol di acido e 0,01 di acetato → pH = pKa."},
{id:"C536",s:"chem",u:5,d:1,q:"Si mescolano 100 mL di acido acetico 0,1 M e 100 mL di NaOH 0,1 M. Il pH della soluzione finale è:",o:["maggiore di 7, perché si forma acetato che si idrolizza","esattamente 7, perché acido e base sono equimolari","minore di 7, perché resta acido acetico non dissociato","uguale al pKa, perché acido e acetato sono in parti uguali","maggiore di 7, perché resta NaOH in eccesso"],e:"Al punto equivalente di una titolazione acido debole-base forte c'è solo la base coniugata (acetato 0,05 M): pH circa 8,7."},
{id:"C537",s:"chem",u:5,d:1,q:"Il rapporto [HCO₃⁻]/[CO₂] nel plasma a pH 7,4 (pKa = 6,1) è circa:",o:["20","1","1,3","13","0,05"],e:"log(rapporto) = 7,4 − 6,1 = 1,3 → rapporto ≈ 10¹·³ ≈ 20."},
{id:"C538",s:"chem",u:5,d:1,q:"Una soluzione di HCl ha pH 2. Quanta acqua bisogna aggiungere a 10 mL di questa soluzione per portarla a pH 3?",o:["90 mL","10 mL","100 mL","1000 mL","9 mL"],e:"Serve una diluizione 1:10, cioè un volume finale di 100 mL: si aggiungono 90 mL."},
{id:"C539",s:"chem",u:5,d:1,q:"In una soluzione di un acido debole HA 0,1 M il pH è 3. La costante Ka è circa:",o:["1·10⁻⁵","1·10⁻³","1·10⁻⁷","1·10⁻²","1·10⁻⁴"],e:"[H⁺] = 10⁻³; Ka ≈ [H⁺]²/C = 10⁻⁶/0,1 = 10⁻⁵."},
{id:"C540",s:"chem",u:5,d:1,q:"Il grado di dissociazione di un acido debole HA 0,1 M con pH 3 è:",o:["1%","10%","0,1%","3%","100%"],e:"α = [A⁻]/C = 10⁻³/10⁻¹ = 0,01."},
{id:"C541",s:"chem",u:4,d:1,q:"Il prodotto di solubilità di CaF₂ è 3,2·10⁻¹¹. La sua solubilità molare è:",o:["2·10⁻⁴ M","5,7·10⁻⁶ M","3,2·10⁻¹¹ M","1,6·10⁻⁴ M","8·10⁻¹² M"],e:"Ks = 4s³ → s³ = 8·10⁻¹² → s = 2·10⁻⁴ M."},
{id:"C542",s:"chem",u:4,d:1,q:"Per la reazione A ⇌ 2B, all'equilibrio [A] = 0,5 M e [B] = 0,1 M. La costante di equilibrio Kc vale:",o:["0,02","0,2","5","50","0,01"],e:"Kc = [B]²/[A] = 0,01/0,5 = 0,02."},
{id:"C543",s:"chem",u:4,d:1,q:"Si mescolano 0,4 mol di N₂ e 0,9 mol di H₂ per formare NH₃ (N₂ + 3 H₂ → 2 NH₃) con resa completa. Si ottengono:",o:["0,6 mol di NH₃, con 0,1 mol di N₂ in eccesso","0,8 mol di NH₃, con 0,3 mol di H₂ in eccesso","0,6 mol di NH₃, con 0,3 mol di H₂ in eccesso","0,8 mol di NH₃, senza reagenti in eccesso","0,3 mol di NH₃, con 0,1 mol di N₂ in eccesso"],e:"0,9 mol di H₂ richiedono 0,3 mol di N₂: l'H₂ è limitante e produce 0,6 mol di NH₃."},
{id:"C544",s:"chem",u:3,d:1,q:"Una soluzione di H₂SO₄ al 98% p/p ha densità 1,84 g/mL (M = 98 g/mol). La sua molarità è circa:",o:["18,4 M","9,8 M","1,84 M","98 M","10 M"],e:"1 L pesa 1840 g, di cui il 98% (1803 g) è acido: 1803/98 ≈ 18,4 mol."},
{id:"C545",s:"chem",u:3,d:1,q:"La pressione osmotica del plasma (circa 290 mOsm/L) a 37 °C è circa (R = 0,082 L·atm/(mol·K)):",o:["7,4 atm","0,74 atm","74 atm","24 atm","1 atm"],e:"π = 0,29 × 0,082 × 310 ≈ 7,4 atm."},
{id:"C546",s:"chem",u:2,d:1,q:"Una reazione ha ΔH = +40 kJ/mol e ΔS = +100 J/(mol·K). Diventa spontanea sopra la temperatura di:",o:["400 K","40 K","4000 K","0,4 K","127 K"],e:"ΔG = 0 per T = ΔH/ΔS = 40 000/100 = 400 K."},
{id:"C547",s:"chem",u:7,d:1,q:"Quanti stereoisomeri esistono per l'acido tartarico (HOOC−CHOH−CHOH−COOH), che ha due centri stereogenici equivalenti?",o:["3","4","2","8","1"],e:"Due enantiomeri (R,R e S,S) più la forma meso (R,S), che è achirale."},
{id:"C548",s:"chem",u:6,d:1,q:"L'addizione di HCl al 2-metilpropene (CH₂=C(CH₃)₂) dà come prodotto principale:",o:["2-cloro-2-metilpropano","1-cloro-2-metilpropano","2-clorobutano","1-clorobutano","2-metilpropano"],e:"Si forma il carbocatione terziario (Markovnikov), che lega poi il cloruro."},
{id:"C549",s:"chem",u:8,d:1,q:"Un tripeptide Lys-Ala-Glu a pH 7 ha carica netta circa:",o:["0","+1","−1","+2","−2"],e:"+1 (N-term) +1 (Lys) −1 (Glu) −1 (C-term) = 0."},
{id:"C550",s:"chem",u:8,d:1,q:"L'idrolisi completa di un trigliceride con NaOH produce:",o:["glicerolo e tre sali di sodio di acidi grassi (saponi)","glicerolo e tre acidi grassi liberi indissociati","tre molecole di glicerolo e un acido grasso","glicerolo, due saponi e un fosfolipide","un sapone e tre molecole di glicerolo libero"],e:"È la saponificazione: in ambiente basico gli acidi grassi si trovano come carbossilati."}
);

{id:"CH10",s:"chem",u:8,d:1,q:"Il numero di legami peptidici in un polipeptide lineare di 150 amminoacidi è ……",c:["149"],n:149,e:"n − 1."},
{id:"CH11",s:"chem",u:7,d:1,q:"Il numero di stereoisomeri dell'acido tartarico, considerando la forma meso, è ……",c:["3","tre"],n:3,e:"(R,R), (S,S) e meso."}

{id:"C551",s:"chem",u:1,d:1,q:"Il cloro naturale è formato per circa il 75% da ³⁵Cl e per il 25% da ³⁷Cl. La sua massa atomica media è circa:",o:["35,5","36","35","37","35,25"],e:"0,75 × 35 + 0,25 × 37 = 26,25 + 9,25 = 35,5."},
{id:"C552",s:"chem",u:1,d:1,q:"Quanti elettroni spaiati ha l'atomo di ferro (Z = 26, configurazione [Ar] 3d⁶ 4s²) allo stato fondamentale?",o:["4","2","6","0","8"],e:"Nei 5 orbitali 3d, 6 elettroni si dispongono secondo Hund: uno è appaiato e 4 restano spaiati."},
{id:"C553",s:"chem",u:3,d:1,q:"Una soluzione contiene 1,17 g di NaCl (M = 58,5 g/mol) in 200 mL. La sua osmolarità è:",o:["0,2 osmol/L","0,1 osmol/L","0,02 osmol/L","0,4 osmol/L","0,01 osmol/L"],e:"n = 0,02 mol → 0,1 M; con i = 2 → 0,2 osmol/L (lievemente ipotonica rispetto al plasma)."},
{id:"C554",s:"chem",u:5,d:1,q:"Per neutralizzare 20 mL di H₂SO₄ 0,5 M servono di NaOH 1 M:",o:["20 mL","10 mL","40 mL","5 mL","80 mL"],e:"H₂SO₄ cede 2 H⁺: 0,01 mol × 2 = 0,02 mol di H⁺ → 0,02 L di NaOH 1 M."},
{id:"C555",s:"chem",u:4,d:1,q:"Una reazione del primo ordine ha un tempo di dimezzamento di 10 minuti. Dopo 30 minuti la concentrazione del reagente è:",o:["1/8 di quella iniziale","1/3 di quella iniziale","1/6 di quella iniziale","nulla","1/4 di quella iniziale"],e:"Per il primo ordine il tempo di dimezzamento è costante: tre dimezzamenti → (1/2)³."},
{id:"C556",s:"chem",u:7,d:1,q:"L'ossidazione blanda del 2-butanolo e quella dell'1-butanolo producono rispettivamente:",o:["butanone e butanale","butanale e butanone","acido butanoico e butanone","butanone in entrambi i casi","nessuna reazione in entrambi i casi"],e:"L'alcol secondario dà il chetone, il primario l'aldeide."}
);

// FISICA — rinforzo meccanica (unità 2) e domande difficili (d:1)
BANK.push(
{id:"F501",s:"fis",u:2,q:"Un corpo si muove di moto rettilineo uniforme. Si può affermare che:",o:["la risultante delle forze agenti su di esso è nulla","su di esso non agisce nessuna forza","su di esso agisce una forza costante nel verso del moto","la sua accelerazione è costante e diversa da zero","la sua energia cinetica aumenta"],e:"Possono agire più forze, purché la loro somma sia zero (primo principio)."},
{id:"F502",s:"fis",u:2,q:"Il grafico velocità-tempo di un corpo è una retta orizzontale sopra l'asse dei tempi. Il corpo:",o:["si muove con velocità costante","è fermo","accelera uniformemente","decelera uniformemente","si muove con accelerazione costante non nulla"],e:"Velocità costante → accelerazione nulla; lo spazio percorso è l'area del rettangolo sotto la retta."},
{id:"F503",s:"fis",u:2,q:"Due corpi di massa diversa cadono nel vuoto dalla stessa altezza partendo da fermi. Arrivano al suolo:",o:["nello stesso istante e con la stessa velocità","prima quello più pesante, con velocità maggiore","nello stesso istante, ma il più pesante più veloce","con la stessa velocità ma in tempi diversi","nello stesso istante e con la stessa energia cinetica"],e:"Nel vuoto tutti i corpi cadono con accelerazione g; l'energia cinetica invece dipende dalla massa."},
{id:"F504",s:"fis",u:2,q:"Un corpo è lanciato orizzontalmente da un tavolo alto 1,25 m con velocità 2 m/s (g = 10 m/s²). Tocca terra a una distanza orizzontale dal tavolo di:",o:["1 m","2 m","0,5 m","2,5 m","1,25 m"],e:"Tempo di caduta t = √(2h/g) = √0,25 = 0,5 s; distanza = v·t = 2 × 0,5 = 1 m."},
{id:"F505",s:"fis",u:2,q:"Un proiettile è lanciato con angolo di 45° rispetto all'orizzontale. Trascurando l'aria, la sua gittata è:",o:["massima, a parità di velocità iniziale","minima, a parità di velocità iniziale","uguale a quella per un angolo di 60°","uguale a quella per un angolo di 90°","indipendente dalla velocità iniziale"],e:"Gittata = v₀²·sen(2θ)/g, massima per θ = 45°. Angoli complementari (es. 30° e 60°) danno la stessa gittata."},
{id:"F506",s:"fis",u:2,q:"Una massa di 0,5 kg ruota su una circonferenza di raggio 0,4 m alla velocità costante di 2 m/s. La forza centripeta è:",o:["5 N","2,5 N","10 N","0,4 N","1 N"],e:"F = m·v²/r = 0,5 × 4/0,4 = 5 N."},
{id:"F507",s:"fis",u:2,q:"Se si raddoppia la velocità di un corpo in moto circolare uniforme mantenendo lo stesso raggio, la forza centripeta necessaria:",o:["quadruplica","raddoppia","si dimezza","resta uguale","si riduce a un quarto"],e:"F = m·v²/r."},
{id:"F508",s:"fis",u:2,q:"Due forze perpendicolari di 30 N e 40 N agiscono su un corpo di 10 kg. L'accelerazione del corpo è:",o:["5 m/s²","7 m/s²","1 m/s²","50 m/s²","3,5 m/s²"],e:"Risultante = √(900 + 1600) = 50 N; a = 50/10 = 5 m/s²."},
{id:"F509",s:"fis",u:2,q:"Tre forze agiscono su un corpo e la somma di due di esse è uguale e opposta alla terza. Il corpo:",o:["è in quiete o in moto rettilineo uniforme","accelera nella direzione della terza forza","descrive una circonferenza","si ferma necessariamente","accelera in modo variabile"],e:"La risultante è nulla."},
{id:"F510",s:"fis",u:2,q:"Un corpo di 2 kg è appeso a un filo dentro un ascensore che scende rallentando con decelerazione di 2 m/s² (g = 10 m/s²). La tensione del filo è:",o:["24 N","16 N","20 N","4 N","0 N"],e:"Scendere rallentando significa accelerazione verso l'alto: T = m(g + a) = 2 × 12 = 24 N."},
{id:"F511",s:"fis",u:2,q:"Una cassa di 50 kg è ferma su un pavimento con coefficiente di attrito statico 0,4 (g = 10 m/s²). Spingendola orizzontalmente con 150 N:",o:["resta ferma e l'attrito statico vale 150 N","si muove perché 150 N > 0","resta ferma e l'attrito statico vale 200 N","si muove con a = 3 m/s²","si solleva"],e:"La forza di attrito statico massima è 0,4 × 500 = 200 N; finché la spinta è minore, l'attrito si adegua a essa."},
{id:"F512",s:"fis",u:2,q:"Un corpo che si muove su un piano orizzontale a 4 m/s con coefficiente di attrito dinamico 0,2 (g = 10 m/s²) si ferma dopo:",o:["4 m","8 m","2 m","0,8 m","16 m"],e:"Decelerazione a = μ·g = 2 m/s²; s = v²/(2a) = 16/4 = 4 m."},
{id:"F513",s:"fis",u:2,q:"Il lavoro della forza peso su un corpo che si sposta da un punto A a un punto B:",o:["dipende solo dalla differenza di quota tra A e B","dipende dalla lunghezza del percorso tra A e B","dipende dalla velocità con cui il corpo si sposta","è sempre nullo, perché il peso è conservativo","è sempre positivo, qualunque sia il percorso"],e:"La forza peso è conservativa: L = m·g·(hA − hB)."},
{id:"F514",s:"fis",u:2,q:"Un corpo di 15 kg è lanciato a 20 m/s su per un piano inclinato e si ferma a un'altezza di 15 m (g = 10 m/s²). L'energia dissipata dagli attriti è:",o:["750 J","3000 J","2250 J","0 J","1500 J"],e:"Ec iniziale = ½ × 15 × 400 = 3000 J; U finale = 15 × 10 × 15 = 2250 J; dissipata = 750 J."},
{id:"F515",s:"fis",u:2,q:"Una cascata porta a valle 600 m³ d'acqua al minuto da un'altezza di 50 m (g = 10 m/s²). Se metà dell'energia diventa elettrica, la potenza elettrica è:",o:["2,5 MW","5 MW","25 MW","300 MW","0,5 MW"],e:"Massa al secondo = 10 m³/s = 10 000 kg/s; potenza = 10 000 × 10 × 50 = 5 MW; la metà è 2,5 MW."},
{id:"F516",s:"fis",u:2,q:"Due ragazzi di 50 kg e 70 kg salgono una fune fino alla stessa altezza, il primo in 10 s e il secondo in 14 s. Si può affermare che:",o:["sviluppano la stessa potenza, ma il secondo compie più lavoro","compiono lo stesso lavoro, ma il primo sviluppa più potenza","il primo compie più lavoro e sviluppa più potenza","compiono lo stesso lavoro e sviluppano la stessa potenza","il secondo compie più lavoro e sviluppa più potenza"],e:"Il lavoro è proporzionale alla massa (rapporto 5:7) e lo è anche il tempo (10:14 = 5:7): il rapporto lavoro/tempo è uguale."},
{id:"F517",s:"fis",u:2,q:"Due sferette uguali scorrono senza attrito su una guida: una a 5 m/s urta elasticamente e frontalmente l'altra, ferma. Dopo l'urto:",o:["la prima si ferma e la seconda prosegue a 5 m/s","proseguono insieme a 2,5 m/s","rimbalzano entrambe all'indietro","la prima prosegue a 5 m/s e la seconda resta ferma","si fermano entrambe"],e:"In un urto elastico frontale tra masse uguali le velocità si scambiano (come nel pendolo di Newton)."},
{id:"F518",s:"fis",u:2,q:"Un'asta orizzontale di massa trascurabile, incernierata in un estremo, porta un peso di 30 N a 40 cm dalla cerniera. Per tenerla in equilibrio con una forza verticale applicata a 120 cm dalla cerniera serve una forza di:",o:["10 N","90 N","30 N","40 N","3,3 N"],e:"Equilibrio dei momenti: F × 120 = 30 × 40 → F = 10 N (verso l'alto)."},
{id:"F519",s:"fis",u:2,q:"Una bilancia a bracci disuguali è in equilibrio con 2 kg a 30 cm dal fulcro da un lato. Dall'altro lato, a 20 cm, serve una massa di:",o:["3 kg","1,33 kg","2 kg","6 kg","1,5 kg"],e:"2 × 30 = m × 20 → m = 3 kg."},
{id:"F520",s:"fis",u:2,q:"Quattro masse m, 2m, 2m e 4m sono ai vertici di un quadrato di lato 3 m, rispettivamente in (0,0), (0,3), (3,0) e (3,3). Il centro di massa si trova in:",o:["(2, 2)","(1,5, 1,5)","(2, 1,5)","(1, 1)","(3, 3)"],e:"x = (0 + 0 + 2m·3 + 4m·3)/9m = 18/9 = 2; y = (2m·3 + 4m·3)/9m = 2."},
{id:"F521",s:"fis",u:2,q:"Una piattaforma rotante senza attrito gira a 2 giri/s con un uomo al centro a braccia aperte. Se l'uomo, chiudendo le braccia, dimezza il momento d'inerzia totale, la piattaforma gira a:",o:["4 giri/s","2 giri/s","1 giro/s","8 giri/s","2,8 giri/s"],e:"Conservazione del momento angolare: I·ω = costante."},
{id:"F522",s:"fis",u:2,q:"Un'auto di 1000 kg passa da 0 a 20 m/s in 10 s su strada piana. La potenza media sviluppata (trascurando gli attriti) è:",o:["20 kW","2 kW","200 kW","10 kW","40 kW"],e:"ΔEc = ½ × 1000 × 400 = 200 000 J; P = 200 000/10 = 20 000 W."},
{id:"F523",s:"fis",u:2,q:"Una molla viene compressa del doppio rispetto a una situazione iniziale. L'energia potenziale elastica immagazzinata:",o:["quadruplica","raddoppia","resta uguale","si dimezza","aumenta di 8 volte"],e:"U = ½·k·x²."},
{id:"F524",s:"fis",u:2,q:"Un pendolo semplice lungo 1 m ha un periodo di circa 2 s sulla Terra. Sulla Luna (g circa 1/6 di quella terrestre) il suo periodo sarebbe circa:",o:["4,9 s","2 s","12 s","0,8 s","0,33 s"],e:"T ∝ 1/√g: 2 × √6 ≈ 4,9 s."},
{id:"F525",s:"fis",u:2,q:"Un corpo che si muove di moto armonico impiega 0,25 s per andare da un estremo all'altro della traiettoria. La sua frequenza è:",o:["2 Hz","4 Hz","0,25 Hz","0,5 Hz","8 Hz"],e:"Da un estremo all'altro passa mezzo periodo: T = 0,5 s → f = 2 Hz."},

{id:"F526",s:"fis",u:2,d:1,q:"Un corpo scivola senza attrito lungo un piano inclinato alto 1,8 m partendo da fermo, poi prosegue su un tratto orizzontale con attrito (μ = 0,3). Con g = 10 m/s², quanta strada percorre sul tratto orizzontale prima di fermarsi?",o:["6 m","1,8 m","3 m","5,4 m","0,54 m"],e:"m·g·h = μ·m·g·d → d = h/μ = 1,8/0,3 = 6 m (indipendente dalla massa)."},
{id:"F527",s:"fis",u:2,d:1,q:"Un corpo lanciato verso l'alto a 20 m/s da un'altezza di 25 m sopra il suolo (g = 10 m/s²) tocca il suolo dopo:",o:["5 s","2 s","4 s","2,5 s","7 s"],e:"Sale per 2 s fino a 20 m sopra il punto di lancio (45 m dal suolo), poi cade da 45 m in √(2·45/10) = 3 s: totale 5 s."},
{id:"F528",s:"fis",u:2,d:1,q:"Due corpi di 3 kg e 2 kg sono collegati da un filo che passa su una carrucola ideale e pendono verticalmente (macchina di Atwood). Con g = 10 m/s², l'accelerazione del sistema è:",o:["2 m/s²","10 m/s²","5 m/s²","1 m/s²","4 m/s²"],e:"a = (m₁ − m₂)·g/(m₁ + m₂) = 1 × 10/5 = 2 m/s²."},
{id:"F529",s:"fis",u:2,d:1,q:"Un blocco di 4 kg su un piano orizzontale liscio è collegato tramite un filo e una carrucola a un corpo di 1 kg che pende verticalmente (g = 10 m/s²). L'accelerazione del sistema è:",o:["2 m/s²","2,5 m/s²","10 m/s²","8 m/s²","0,4 m/s²"],e:"Solo il peso del corpo sospeso accelera tutta la massa: a = 10/(4 + 1) = 2 m/s²."},
{id:"F530",s:"fis",u:2,d:1,q:"Una pallina di 100 g legata a un filo lungo 0,5 m ruota in un piano verticale. Nel punto più alto la velocità minima perché il filo resti teso è circa (g = 10 m/s²):",o:["2,2 m/s","5 m/s","1 m/s","0 m/s","3,2 m/s"],e:"Nel punto più alto basta che il peso fornisca la forza centripeta: m·g = m·v²/r → v = √(g·r) = √5 ≈ 2,24 m/s."},
{id:"F531",s:"fis",u:2,d:1,q:"Un proiettile di 20 g a 300 m/s attraversa un blocco di legno fermo di 2 kg e ne esce a 100 m/s. Il blocco (su piano senza attrito) acquista una velocità di:",o:["2 m/s","3 m/s","4 m/s","1 m/s","0,2 m/s"],e:"Δp proiettile = 0,02 × (300 − 100) = 4 kg·m/s, trasferita al blocco: v = 4/2 = 2 m/s."},
{id:"F532",s:"fis",u:2,d:1,q:"Una palla di gomma cade da 80 cm e a ogni rimbalzo perde il 25% della sua energia. Dopo il primo rimbalzo risale a:",o:["60 cm","20 cm","40 cm","75 cm","56 cm"],e:"L'energia (e quindi l'altezza) residua è il 75%: 0,75 × 80 = 60 cm."},
{id:"F533",s:"fis",u:2,d:1,q:"Un filo d'acciaio con sezione 0,2 mm² si allunga dello 0,1% sotto una forza di 40 N. Il modulo di Young dell'acciaio risulta:",o:["2·10¹¹ N/m²","2·10⁸ N/m²","4·10¹⁰ N/m²","2·10⁵ N/m²","4·10¹¹ N/m²"],e:"Sforzo = 40/(0,2·10⁻⁶) = 2·10⁸ Pa; deformazione = 10⁻³; Y = 2·10¹¹ Pa."},
{id:"F534",s:"fis",u:2,d:1,q:"Il peso di un corpo sulla superficie di un pianeta con massa doppia e raggio doppio rispetto alla Terra sarebbe:",o:["la metà di quello terrestre","il doppio di quello terrestre","uguale a quello terrestre","un quarto di quello terrestre","un ottavo di quello terrestre"],e:"g ∝ M/R² = 2/4 = 1/2."},
{id:"F535",s:"fis",u:3,d:1,q:"Un recipiente sferico di 8 L galleggia in acqua con metà del volume immerso (g = 10 m/s²). Quanta acqua si può versare al suo interno prima che affondi del tutto?",o:["4 kg","8 kg","2 kg","16 kg","0,4 kg"],e:"Peso del recipiente = spinta con 4 L immersi = 40 N. Completamente immerso la spinta è 80 N: si possono aggiungere 40 N, cioè 4 kg."},
{id:"F536",s:"fis",u:3,d:1,q:"Due liquidi non miscibili stanno nei due rami di un tubo a U; le altezze dei liquidi sopra la superficie di separazione sono 10 cm e 12,5 cm. Il rapporto tra le densità (primo/secondo) è:",o:["1,25","0,8","1","1,5","2,25"],e:"All'equilibrio ρ₁·h₁ = ρ₂·h₂ → ρ₁/ρ₂ = h₂/h₁ = 12,5/10."},
{id:"F537",s:"fis",u:3,d:1,q:"In un'arteria con stenosi la sezione si riduce a un quarto. Se la velocità del sangue prima della stenosi è 0,5 m/s (ρ ≈ 1000 kg/m³), la caduta di pressione nella stenosi (Bernoulli, condotto orizzontale) è circa:",o:["1875 Pa","125 Pa","500 Pa","4000 Pa","2000 Pa"],e:"v₂ = 2 m/s; ΔP = ½·ρ·(v₂² − v₁²) = 500 × (4 − 0,25) = 1875 Pa (circa 14 mmHg)."},
{id:"F538",s:"fis",u:3,d:1,q:"Un vaso si ramifica in 4 vasi uguali, ciascuno con raggio pari alla metà del vaso di partenza. Se la portata totale si conserva, la velocità media del sangue nei rami rispetto al vaso iniziale:",o:["resta uguale","raddoppia","si dimezza","quadruplica","si riduce a un quarto"],e:"Area totale dei rami = 4 × π(r/2)² = πr²: la stessa del vaso iniziale, quindi la velocità resta uguale."},
{id:"F539",s:"fis",u:4,d:1,q:"Un'ambulanza si avvicina a un osservatore fermo e la frequenza percepita è il 5% più alta di quella emessa. Con velocità del suono 340 m/s, in prima approssimazione la velocità dell'ambulanza è circa:",o:["17 m/s","5 m/s","34 m/s","1,7 m/s","68 m/s"],e:"Al primo ordine f'/f ≈ 1 + v/c → v ≈ 0,05 × 340 = 17 m/s (circa 61 km/h)."},
{id:"F540",s:"fis",u:4,d:1,q:"A 2 m da una sorgente sonora puntiforme il livello sonoro è 80 dB. A 20 m il livello sarà circa:",o:["60 dB","8 dB","70 dB","40 dB","78 dB"],e:"A distanza 10 volte maggiore l'intensità è 100 volte minore: −20 dB."},
{id:"F541",s:"fis",u:5,d:1,q:"Si mettono 100 g di ghiaccio a 0 °C in 400 g d'acqua a 50 °C (calore latente di fusione 80 cal/g, recipiente isolato). La temperatura finale è circa:",o:["24 °C","40 °C","30 °C","0 °C","10 °C"],e:"Calore per fondere: 8000 cal. L'acqua calda scende a 50 − 8000/400 = 30 °C; poi 100 g a 0 °C e 400 g a 30 °C si mescolano: (0 × 100 + 30 × 400)/500 = 24 °C."},
{id:"F542",s:"fis",u:5,d:1,q:"Un gas ideale compie un ciclo: si espande a 2·10⁵ Pa da 1 L a 3 L, poi torna allo stato iniziale passando per una pressione costante di 1·10⁵ Pa (con due isocore). Il lavoro netto compiuto dal gas nel ciclo è:",o:["200 J","400 J","600 J","0 J","100 J"],e:"È l'area del rettangolo nel piano P-V: ΔP·ΔV = 1·10⁵ Pa × 2·10⁻³ m³ = 200 J."},
{id:"F543",s:"fis",u:6,d:1,q:"Una resistenza R è collegata a una pila di f.e.m. 12 V e resistenza interna 1 Ω. Se la corrente è 2 A, R vale:",o:["5 Ω","6 Ω","12 Ω","4 Ω","24 Ω"],e:"I = ε/(R + r) → R + 1 = 6 → R = 5 Ω."},
{id:"F544",s:"fis",u:6,d:1,q:"Un elettrone (e = 1,6·10⁻¹⁹ C) parte da fermo e viene accelerato da una differenza di potenziale di 100 V. La sua energia cinetica finale è:",o:["1,6·10⁻¹⁷ J","1,6·10⁻²¹ J","100 J","1,6·10⁻¹⁹ J","6,25·10²⁰ J"],e:"Ec = e·ΔV = 1,6·10⁻¹⁹ × 100 = 1,6·10⁻¹⁷ J = 100 eV."},
{id:"F545",s:"fis",u:6,d:1,q:"Un condensatore piano carico e isolato (carica costante) viene allontanato raddoppiando la distanza tra le armature. L'energia immagazzinata:",o:["raddoppia","si dimezza","resta uguale","quadruplica","si azzera"],e:"C si dimezza; a carica costante U = Q²/(2C) raddoppia: il lavoro per separare le armature si accumula come energia."},
{id:"F546",s:"fis",u:7,d:1,q:"Per ridurre l'intensità di un fascio di fotoni da 1 MeV a 1/16, con piombo di spessore di dimezzamento 0,9 cm, serve uno spessore di:",o:["3,6 cm","1,8 cm","14,4 cm","0,9 cm","7,2 cm"],e:"1/16 = (1/2)⁴: quattro spessori di dimezzamento = 3,6 cm."},
{id:"F547",s:"fis",u:7,d:1,q:"Un oggetto alto 2 cm si trova a 15 cm da una lente convergente di focale 10 cm. L'immagine è:",o:["reale, capovolta, alta 4 cm, a 30 cm","virtuale, diritta, alta 4 cm, a 30 cm","reale, capovolta, alta 1 cm, a 7,5 cm","reale, diritta, alta 4 cm, a 30 cm","virtuale, diritta, alta 2 cm, a 6 cm"],e:"1/q = 1/10 − 1/15 = 1/30 → q = 30 cm; ingrandimento −q/p = −2: immagine capovolta di 4 cm."},
{id:"F548",s:"fis",u:7,d:1,q:"Un campione contiene uno iodio radioattivo con emivita di 8 giorni. Dopo 24 giorni, quale frazione dell'attività iniziale è già scomparsa?",o:["7/8","1/8","3/4","1/3","2/3"],e:"Restano (1/2)³ = 1/8; è scomparso 1 − 1/8 = 7/8."}
);

 proc:{n:"Schema a passaggi rifatto a memoria",d:"Disegna il processo come sequenza numerata di passaggi (chi fa cosa, in che ordine). Poi rifallo su un foglio bianco senza guardare e confronta: ripeti finché esce completo."},

  L.forEach(t=>{const sc=2*(main.match(t.g)||[]).length+(ex.match(t.g)||[]).length;if(sc>bs){bs=sc;best=t;}});
  if(best)return best.id;
  const gid=q.s+q.u+"_g";if(!TP[gid])TP[gid]={id:gid,s:q.s,u:+q.u,n:"Altri concetti di "+SUBJ[q.s].units[q.u].toLowerCase(),t:"conc",r:["Rileggi la spiegazione di ogni domanda sbagliata qui sotto","Ritrova il paragrafo corrispondente sul libro e rifai le domande dell'unità"]};
  return gid;}

const LKEY="sf-sim-v1",DKEY="sf-sim-draft-v1";

  const out={attempts:[],qs:{},v:1};const seen=new Set();
  [...(a.attempts||[]),...(b.attempts||[])].forEach(x=>{if(x&&!seen.has(x.id)){seen.add(x.id);out.attempts.push(x)}});
  out.attempts.sort((x,y)=>x.date-y.date);out.attempts=out.attempts.slice(-300);
  out.pr=Object.assign({},b.pr||{},a.pr||{});
  const keys=new Set([...Object.keys(a.qs||{}),...Object.keys(b.qs||{})]);
  keys.forEach(k=>{const x=(a.qs||{})[k]||[0,0,0,0],y=(b.qs||{})[k]||[0,0,0,0];
    out.qs[k]=(x[0]>=y[0])?x:y;});
  return out;
}

  const ok=!!($("#who-ok")&&$("#who-ok").checked);const c=newCode();P.pr[c]={n,t:Date.now(),ok};setMe(c);save();view.who.step="code";view.who.code=c;renderWho();}

  if(w.step==="confirm"){const p=P.pr[ME];b=`<p>Stai per iniziare la simulazione come:</p><div class="who-me"><b>${esc(p.n)}</b><span class="code">${esc(ME)}</span></div>

    <div class="row"><button class="btn primary" data-act="whoNew">Sono una persona nuova</button></div>`;}
  else if(w.step==="privacy"){return `<div class="overlay" data-act="whoClose"><div class="dialog stack privacy" role="dialog" aria-modal="true" aria-labelledby="who-h"><div class="row" style="justify-content:space-between"><h3 id="who-h">Informativa privacy</h3><button class="btn ghost small" data-act="whoClose" aria-label="Chiudi">✕</button></div>${PRIVACY}<div class="row"><button class="btn primary" data-act="whoClose">Ho capito</button></div></div></div>`;}
  else if(w.step==="new"){b=`<label class="field">Come ti chiami?<input id="who-n" type="text" autocomplete="name" maxlength="40" placeholder="Nome e cognome"></label>
    ${ONLINE?`<label class="consent"><input type="checkbox" id="who-ok"><span>Acconsento all'invio di nome, codice e risultati delle simulazioni all'associazione ALFARMA, come descritto nell'<button class="linkish" data-act="whoInfo">informativa privacy</button>. Facoltativo: senza consenso il simulatore funziona lo stesso.</span></label>
    ${w.info?`<div class="privacy small">${PRIVACY}</div>`:""}
    <p class="muted small">Ti assegneremo un codice personale: in graduatoria compare solo quello, mai il nome.</p>`:`<p class="muted small">Il nome resta solo su questo dispositivo. Ti assegneremo un codice personale: in graduatoria compare solo quello.</p>`}
    <div class="row"><button class="btn primary" data-act="whoCreate">Crea il mio codice</button></div>`;}
  else b=`<p>Ciao <b>${esc(P.pr[w.code].n)}</b>, questo è il tuo codice personale:</p><div class="code big">${esc(w.code)}</div>
    <p class="muted small">Annotalo: in graduatoria vedrai i tuoi punteggi accanto a questo codice.</p><div class="row"><button class="btn primary" data-act="whoGo">Inizia la simulazione</button></div>`;

function isCalc(q){return q.t==="fill"?typeof q.n==="number":/\d/.test(q.q);}

function spread(keys,k,cap){const out={};keys.forEach(x=>out[x]=0);let left=k,ks=shuffle(keys);

function takeUnit(list,need,hard){const N=typeof need==="number"?{any:need}:Object.assign({},need);

function buildExam(s,hard){

  const units=Object.keys(by);
  const quota=spread(units,EXAM.mc+EXAM.fill,u=>by[u].mc.length+by[u].fill.length);
  // completamento distribuiti anch'essi in modo uniforme tra le unità
  const fq=spread(units,EXAM.fill,u=>Math.min(by[u].fill.length,quota[u]));

  units.forEach(u=>{takeUnit(by[u].mc.concat(by[u].fill),{mc:quota[u]-fq[u],fill:fq[u]},hard).forEach(q=>(q.t==="mc"?mc:fi).push(q));});

/* ------------------------------------------------------------------ EXAM */
function startExam(s,items,mode,opts){
  const ex={pid:mode==="exam"?ME:null,s,mode,items:items.map(q=>({id:q.id,ord:q.t==="mc"?optOrder(q):null,ans:null,flag:false})),cur:0,start:Date.now(),timed:mode==="exam",limit:EXAM.minutes*60*1000,submitted:false,confirm:false,opts:opts||{}};
  if(mode==="exam")lsSet(DKEY,ex);
  go({name:"exam",ex});}
function examLeft(ex){return ex.limit-(Date.now()-ex.start);}
function fmtTime(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
function examHTML(){
  const ex=view.ex;const it=ex.items[ex.cur];const q=QI[it.id];const n=ex.items.length;const answered=ex.items.filter(x=>x.ans!=null&&x.ans!=="").length;
  const isPractice=ex.mode!=="exam";const revealed=isPractice&&it.checked;
  let h=`<div class="topbar ${SUBJ[ex.s].cls}"><div class="topbar-in">
    <div class="row"><span class="tag">${esc(sname(ex.s))}</span><span class="progress-txt">${isPractice?(ex.mode==="errors"?"Ripasso errori":"Esercitazione"):(ex.opts&&ex.opts.hard?"Simulazione difficile":"Simulazione")} · ${answered}/${n} risposte</span></div>
    <div class="row">${ex.timed?`<span class="timer" id="timer" aria-live="off">${fmtTime(examLeft(ex))}</span>`:""}
    <button class="btn ${isPractice?"":"primary"} small" data-act="askSubmit">${isPractice?"Termina":"Consegna"}</button></div></div></div>
  <div class="wrap stack ${SUBJ[ex.s].cls}">`;
  if(ex.confirm){const om=n-answered;h+=`<div class="confirm" role="alertdialog"><b>${isPractice?"Terminare l'esercitazione?":"Consegnare la prova?"}</b><p>${om?`Hai ${om} domand${om===1?"a":"e"} senza risposta: ${isPractice?"non verranno conteggiate.":"varranno 0 punti."}`:"Hai risposto a tutte le domande."}</p><div class="row"><button class="btn primary" data-act="submit">${isPractice?"Termina e vedi il riepilogo":"Consegna"}</button><button class="btn ghost" data-act="cancelSubmit">Torna alle domande</button></div></div>`;}
  h+=`<article class="qcard"><div class="qmeta"><span class="eyebrow">${q.t==="mc"?"Risposta multipla":"Completamento"} · ${esc(SUBJ[ex.s].units[q.u])}</span>${!isPractice?`<button class="btn ghost small" data-act="flag" aria-pressed="${it.flag}">${it.flag?"★ Segnata":"☆ Segna per dopo"}</button>`:""}</div>
    <p class="qtext"><span class="num">${ex.cur+1}.</span>${esc(q.q)}</p>`;
  if(q.t==="mc"){h+=`<div class="opts" role="radiogroup">`;it.ord.forEach((oi,k)=>{let cls="";if(revealed){if(oi===0)cls="correct";else if(it.ans===oi)cls="wrong";}else if(it.ans===oi)cls="sel";
      h+=`<button class="opt ${cls}" role="radio" aria-checked="${it.ans===oi}" data-act="choose" data-o="${oi}" ${revealed?"disabled":""}><span class="let">${LET[k]}</span><span>${esc(q.o[oi])}</span></button>`;});h+=`</div>`;
    if(!isPractice&&it.ans!=null)h+=`<div><button class="btn ghost small" data-act="clear">Togli la risposta</button></div>`;}
  else{let cls="";if(revealed)cls=it.ok?"ok":"bad";
    h+=`<div class="fill"><input id="fill-${esc(it.id)}" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Scrivi la parola o il numero mancante" value="${esc(it.ans||"")}" class="${cls}" ${revealed?"disabled":""} aria-label="Risposta"></div>
    <p class="note">Scrivi una sola parola o un numero, senza unità di misura se è già indicata nel testo. Per i decimali puoi usare la virgola. Sono accettati sinonimi, singolare e plurale e piccoli errori di battitura.</p>`;}
  if(revealed){let head;if(q.t==="mc")head=it.ans==null?"Nessuna risposta.":(it.ans===0?"Esatto.":"Sbagliato.");else head=it.ok===null?"Nessuna risposta.":(it.ok?(it.how==="typo"?"Esatto, ma attenzione all'ortografia.":"Esatto."):"Sbagliato.");

  h+=`<button class="btn ${isPractice&&revealed?"primary":""}" data-act="next">${ex.cur===n-1?(isPractice?"Riepilogo":"Fine"):"Successiva →"}</button></div></article>`;
  h+=`<section class="panel stack"><h3>Navigazione</h3><div class="navgrid">`;
  ex.items.forEach((x,i)=>{const qq=QI[x.id];if(i===0)h+=`<div class="nav-sep">Risposta multipla</div>`;if(qq.t==="fill"&&(i===0||QI[ex.items[i-1].id].t==="mc"))h+=`<div class="nav-sep">Completamento</div>`;
    let cls=(x.ans!=null&&x.ans!=="")?"ans":"";if(isPractice&&x.checked){cls=x.ok===true?"r-ok":x.ok===false?"r-bad":"r-om";}
    h+=`<button class="nav-cell ${cls} ${i===ex.cur?"cur":""} ${x.flag?"flag":""}" data-act="goto" data-i="${i}" aria-label="Domanda ${i+1}">${i+1}</button>`;});
  h+=`</div>${!isPractice?`<p class="note">Le domande con il pallino giallo sono segnate per un secondo controllo. Puoi cambiare risposta fino alla consegna.</p>`:""}</section>
  <div class="row"><button class="btn ghost" data-act="quit">${isPractice?"Esci senza salvare":"Abbandona la simulazione"}</button></div></div>`;
  return h;}
function persistDraft(){if(view.name==="exam"&&view.ex.mode==="exam"&&!view.ex.submitted)lsSet(DKEY,view.ex);}
function readFill(){const ex=view.ex;const it=ex.items[ex.cur];const q=QI[it.id];if(q.t!=="fill")return;const el=document.getElementById("fill-"+it.id);if(el&&!el.disabled){const v=el.value.trim();it.ans=v===""?null:v;}}
function checkItem(it){const q=QI[it.id];if(q.t==="mc")it.ok=it.ans==null?null:it.ans===0;else{const r=fillMatch(q,it.ans);it.ok=r.ok;it.how=r.how||null;}}
function submitExam(){
  const ex=view.ex;readFill();ex.submitted=true;clearInterval(tick);
  ex.items.forEach(it=>{checkItem(it);});
  const isPractice=ex.mode!=="exam";
  const counted=isPractice?ex.items.filter(it=>it.checked||it.ok!==null):ex.items;
  counted.forEach(it=>recordAnswer(QI[it.id],it.ok));
  const c=counted.filter(i=>i.ok===true).length,w=counted.filter(i=>i.ok===false).length,o=ex.items.length-c-w;
  const units={};ex.items.forEach(it=>{const u=QI[it.id].u;units[u]=units[u]||[0,0];units[u][1]++;if(it.ok===true)units[u][0]++;});
  const a={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),pid:ex.mode==="exam"?(ex.pid||null):null,s:ex.s,mode:ex.mode==="exam"?"exam":"practice",hard:!!(ex.opts&&ex.opts.hard),date:Date.now(),score:Math.round(scoreOf(c,w)*100)/100,correct:c,wrong:w,omitted:o,n:ex.items.length,dur:Date.now()-ex.start,units};
  if(isPractice&&c+w===0){lsSet(DKEY,null);go({name:"home"});return;}
  P.attempts.push(a);P.attempts=P.attempts.slice(-300);save();if(a.mode==="exam")enqueue(a,ex);if(ex.mode==="exam")lsSet(DKEY,null);
  go({name:"result",ex,a,filter:"all"});}

/* ------------------------------------------------------------------ RESULT */
function ringHTML(score,max,isExam){const R=64,C=2*Math.PI*R;const f=Math.max(0,Math.min(1,score/max));const thr=EXAM.pass/EXAM.max;

  const weakest=Object.keys(a.units).filter(u=>a.units[u][1]>=2).sort((x,y)=>a.units[x][0]/a.units[x][1]-a.units[y][0]/a.units[y][1])[0];

  h+=planHTML(ex,a);

    if(ex.mode!=="exam"&&!it.checked&&it.ok===null&&f!=="om")return;

/* ------------------------------------------------------------------ PIANO DI RIPASSO */
function topicHist(id){let r=0,w=0,n=0;BY[TP[id].s].forEach(q=>{if(q.tp!==id)return;n++;const st=qstat(q.id);r+=st[2];w+=st[1];});return {r,w,n};}
const pct=(a,b)=>b?Math.round(a/b*100):0;
function planHTML(ex,a){
  const s=ex.s,isExam=a.mode==="exam";
  const T={};const typ={mc:[0,0],fill:[0,0]};let calcBad=0,allBad=0;
  ex.items.forEach((it,i)=>{const q=QI[it.id];const answered=it.ok!==null;
    if(!isExam&&!answered&&!it.checked)return;
    const t=T[q.tp]=T[q.tp]||{id:q.tp,ok:0,bad:0,om:0,nums:[]};
    if(it.ok===true)t.ok++;else{if(it.ok===false)t.bad++;else t.om++;t.nums.push(i+1);allBad++;if(TP[q.tp].t==="calc")calcBad++;}
    if(answered){typ[q.t][1]++;if(it.ok)typ[q.t][0]++;}});
  const weak=Object.values(T).filter(t=>t.bad+t.om>0).sort((x,y)=>(y.bad+y.om*0.8)-(x.bad+x.om*0.8)||x.ok-y.ok);
  // consigli di strategia
  const tips=[];
  const omMc=ex.items.filter(it=>it.ok===null&&QI[it.id].t==="mc").length,omF=ex.items.filter(it=>it.ok===null&&QI[it.id].t==="fill").length;
  if(isExam&&omMc>=2)tips.push(["Non lasciare in bianco la multipla",`Hai lasciato ${omMc} domande a risposta multipla senza risposta. Con 5 alternative e penalità di −0,1, anche una risposta del tutto casuale vale in media <b>+0,12 punti</b>; se riesci a escludere un'alternativa sale a +0,175. Rispondi sempre, partendo dall'eliminare le opzioni sicuramente false.`]);
  if(isExam&&omF>=3)tips.push(["Completamento: scrivi comunque un'ipotesi",`${omF} domande a completamento sono rimaste vuote. Un errore costa solo 0,1: se hai un'idea del termine o dell'ordine di grandezza del risultato, scrivilo.`]);
  if(isExam){const used=a.dur/60000;
    if(used>=EXAM.minutes-0.5&&a.omitted>0)tips.push(["Gestione del tempo",`Il tempo è finito prima che rispondessi a tutto. Hai circa <b>1 minuto e 37 secondi</b> per domanda: fai un primo giro rispondendo solo a ciò che sai subito, segna con la bandierina le domande lunghe o di calcolo e torna su quelle alla fine.`]);
    else if(used<EXAM.minutes*0.6&&a.score<EXAM.pass)tips.push(["Usa tutto il tempo",`Hai consegnato dopo ${Math.max(1,Math.round(used))} minut${Math.max(1,Math.round(used))>1?"i":"o"} su ${EXAM.minutes}. Il tempo avanzato serve a rileggere le domande con «NON», «ECCETTO» o «FALSA», ricontrollare i calcoli e le unità di misura.`]);}
  if(typ.mc[1]>=4&&typ.fill[1]>=3){const pm=pct(...typ.mc),pf=pct(...typ.fill);
    if(pm-pf>=20)tips.push(["Il completamento è il tuo punto debole",`Esatte: ${pm}% nella multipla contro ${pf}% nel completamento. Senza alternative davanti devi richiamare il termine a memoria: allenati con il <b>richiamo attivo</b> (copri la risposta e scrivila) e fai esercitazioni «solo completamento». Attenzione anche al formato: numero senza unità, virgola decimale, termine al singolare.`]);
    else if(pf-pm>=20)tips.push(["Attenzione ai distrattori",`Nel completamento vai meglio (${pf}%) che nella multipla (${pm}%): le alternative ti stanno ingannando. Leggi tutte e 5 le opzioni prima di scegliere e diffida di quelle «quasi giuste», che cambiano un solo dettaglio.`]);}
  if(allBad>=3&&calcBad/allBad>=0.5)tips.push(["Più esercizi di calcolo",`${calcBad} errori su ${allBad} sono in argomenti di calcolo. Il problema spesso non è la teoria ma l'esecuzione: scrivi dati e formula prima di fare i conti, porta tutto in unità SI e controlla che l'ordine di grandezza del risultato abbia senso.`]);
  if(isExam&&a.score>=EXAM.pass+6&&!weak.length)tips.push(["Ottimo lavoro","Nessun argomento da segnalare. Prova la simulazione difficile per metterti alla prova."]);

  let h=`<section class="panel stack plan"><div><p class="eyebrow">Feedback personalizzato</p><h3>Piano di ripasso</h3></div>`;
  if(tips.length)h+=`<div class="tips">${tips.map(t=>`<div class="tip"><b>${t[0]}</b><p>${t[1]}</p></div>`).join("")}</div>`;
  if(weak.length){
    h+=`<p class="muted">Gli argomenti dove hai perso punti, in ordine di priorità. Per ognuno: cosa rivedere e il metodo di studio più adatto a quel tipo di contenuto.</p><div class="topic-list">`;
    weak.slice(0,5).forEach((t,k)=>{const tp=TP[t.id],te=TECH[tp.t],hi=topicHist(t.id);const hs=hi.r+hi.w;
      h+=`<article class="topic-card${k===0?" first":""}"><header><span class="rank">${k+1}</span><div><b>${esc(tp.n)}</b><small>${esc(SUBJ[s].units[tp.u])}</small></div></header>
      <p class="tstat">${t.bad?`<span class="pill bad">${t.bad} ${t.bad>1?"errate":"errata"}</span>`:""}${t.om?`<span class="pill neutral">${t.om} ${t.om>1?"omesse":"omessa"}</span>`:""}${t.ok?`<span class="pill ok">${t.ok} ${t.ok>1?"esatte":"esatta"}</span>`:""}<span class="muted small">domand${t.nums.length>1?"e":"a"} ${t.nums.join(", ")}${hs>=4?` · nel complesso ${pct(hi.r,hs)}% esatte`:""}</span></p>
      <div class="tcols"><div><h4>Cosa rivedere</h4><ul>${tp.r.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="tech"><h4>Come studiarlo · ${esc(te.n)}</h4><p>${esc(te.d)}</p></div></div>
      <div class="row"><button class="btn small" data-act="practiceTopic" data-s="${s}" data-tp="${t.id}">Esercitati su questo argomento (${Math.min(15,BY[s].filter(q=>q.tp===t.id).length)} domande)</button></div></article>`;});
    h+=`</div>`;
    if(weak.length>5)h+=`<p class="muted small">Altri argomenti con errori: ${weak.slice(5,13).map(t=>esc(TP[t.id].n)).join(" · ")}${weak.length>13?` e altri ${weak.length-13}`:""}.</p>`;}
  else if(!tips.length)h+=`<p class="muted">Nessun errore in questa prova: niente da ripassare.</p>`;
  // argomenti deboli ricorrenti nello storico
  const shown=new Set(weak.slice(0,5).map(t=>t.id));
  const rec=Object.values(TP).filter(t=>t.s===s&&!shown.has(t.id)).map(t=>({t,h:topicHist(t.id)})).filter(x=>x.h.r+x.h.w>=5&&x.h.r/(x.h.r+x.h.w)<0.6).sort((x,y)=>x.h.r/(x.h.r+x.h.w)-y.h.r/(y.h.r+y.h.w)).slice(0,4);
  if(rec.length)h+=`<div class="stack" style="gap:8px"><h4>Punti deboli ricorrenti nelle prove precedenti</h4>${rec.map(x=>`<div class="rec-row"><span><b>${esc(x.t.n)}</b> <small class="muted">${pct(x.h.r,x.h.r+x.h.w)}% esatte su ${x.h.r+x.h.w} risposte · metodo: ${esc(TECH[x.t.t].n)}</small></span><button class="btn ghost small" data-act="practiceTopic" data-s="${s}" data-tp="${x.t.id}">Esercitati</button></div>`).join("")}</div>`;
  return h+`</section>`;}

/* ------------------------------------------------------------------ RENDER + EVENTS */
function render(){const app=$("#app");if(view.name==="home")loadGB();
  if(view.name==="home"){app.innerHTML=homeHTML();drawGBtn();}
  else if(view.name==="exam"){app.innerHTML=examHTML();if(view.ex.timed&&!view.ex.submitted){clearInterval(tick);tick=setInterval(()=>{const left=examLeft(view.ex);const t=$("#timer");if(t){t.textContent=fmtTime(left);t.classList.toggle("low",left<5*60000);}if(left<=0){clearInterval(tick);submitExam();}},500);}
    const inp=document.querySelector(".fill input:not([disabled])");if(inp){inp.addEventListener("input",()=>{readFill();persistDraft();updateCounter();});inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();act(view.ex.mode==="exam"||view.ex.items[view.ex.cur].checked?"next":"check");}});}}
  else if(view.name==="result")app.innerHTML=resultHTML();
  else if(view.name==="practice")app.innerHTML=practiceHTML();}
function updateCounter(){const ex=view.ex;const el=document.querySelector(".progress-txt");if(!el)return;const n=ex.items.length,answered=ex.items.filter(x=>x.ans!=null&&x.ans!=="").length;el.textContent=el.textContent.replace(/\d+\/\d+ risposte/,answered+"/"+n+" risposte");const cell=document.querySelector(`.nav-cell[data-i="${ex.cur}"]`);if(cell&&ex.mode==="exam")cell.classList.toggle("ans",ex.items[ex.cur].ans!=null);}

function act(a,d){d=d||{};
  const ex=view.ex;
  switch(a){
  case "home":go({name:"home"});break;
  case "exam":case "examHard":view.who={next:a,s:d.s,step:ME&&P.pr[ME]?"confirm":(Object.keys(P.pr).length?"pick":"new")};renderWho();break;
  case "whoGo":{const w=view.who;if(!w)break;view.who=null;renderWho();lsSet(DKEY,null);if(w.next==="examHard")startExam(w.s,buildExam(w.s,true),"exam",{hard:true});else startExam(w.s,buildExam(w.s),"exam");break;}
  case "whoPick":setMe(d.code);view.who.step="confirm";renderWho();break;
  case "whoNew":view.who.step="new";renderWho();break;
  case "whoOther":view.who.step=Object.keys(P.pr).length>1?"pick":"new";renderWho();break;
  case "whoCreate":whoCreate();break;
  case "whoClose":view.who=view.who&&view.who.back?view.who.back:null;renderWho();break;
  case "whoInfo":view.who.info=!view.who.info;renderWho();break;
  case "whoPrivacy":view.who={step:"privacy",back:view.who};renderWho();break;
  case "privacy":view.who={step:"privacy"};renderWho();break;
  case "whoConsent":if(ME&&P.pr[ME]){P.pr[ME].ok=!P.pr[ME].ok;save();}break;
  case "acctMenu":view.acct=!view.acct;view.acctDel=false;render();break;
  case "acctClose":view.acct=false;render();break;
  case "acctOut":logoutLocal("Sei uscito. I progressi restano su questo dispositivo e sul tuo account.");break;
  case "acctDel":view.acctDel=true;render();break;
  case "acctDelNo":view.acctDel=false;render();break;
  case "acctDelYes":{const t=ACC&&ACC.tok;view.acctDel=false;api({act:"delete",tok:t}).then(j=>logoutLocal(j&&j.ok?"Dati eliminati dal server. Su questo dispositivo restano.":"Non è stato possibile eliminare i dati: riprova più tardi.")).catch(()=>{acctMsg="Non è stato possibile eliminare i dati: riprova più tardi.";render();});break;}
  case "lbScope":view.lbScope=d.v;render();break;
  case "lb":view.lb=d.s;render();break;
  case "resume":{const dr=lsGet(DKEY);if(dr){go({name:"exam",ex:dr});}break;}
  case "discard":lsSet(DKEY,null);render();break;
  case "practice":go({name:"practice",s:d.s,units:Object.keys(SUBJ[d.s].units)});break;
  case "practiceUnit":go({name:"practice",s:d.s,units:[String(d.u)]});break;
  case "practiceTopic":{const items=pick(BY[d.s].filter(q=>q.tp===d.tp),15).sort((x,y)=>x.t===y.t?0:(x.t==="mc"?-1:1));if(items.length)startExam(d.s,items,"practice");break;}
  case "errors":{const pool=shuffle(errorPool(d.s)).slice(0,20);if(pool.length)startExam(d.s,pool,"errors");break;}
  case "utoggle":{const u=d.u;const i=view.units.indexOf(u);if(i>=0)view.units.splice(i,1);else view.units.push(u);render();break;}
  case "uall":view.units=Object.keys(SUBJ[view.s].units);render();break;
  case "unone":view.units=[];render();break;
  case "startPractice":{const type=$("#ptype").value,num=+$("#pnum").value;let pool=BY[view.s].filter(q=>view.units.includes(String(q.u))&&(type==="all"||q.t===type));const items=pick(pool,num).sort((x,y)=>(x.t===y.t?x.u-y.u:(x.t==="mc"?-1:1)));if(items.length)startExam(view.s,items,"practice");break;}
  case "choose":{const it=ex.items[ex.cur];const o=+d.o;it.ans=(ex.mode==="exam"&&it.ans===o)?null:o;persistDraft();render();break;}
  case "clear":ex.items[ex.cur].ans=null;persistDraft();render();break;
  case "flag":ex.items[ex.cur].flag=!ex.items[ex.cur].flag;persistDraft();render();break;
  case "check":{readFill();const it=ex.items[ex.cur];checkItem(it);it.checked=true;render();break;}
  case "prev":readFill();if(ex.cur>0){ex.cur--;persistDraft();render();}break;
  case "next":readFill();if(ex.mode!=="exam"&&!ex.items[ex.cur].checked&&ex.items[ex.cur].ans!=null){const it=ex.items[ex.cur];checkItem(it);it.checked=true;render();break;}
    if(ex.cur<ex.items.length-1){ex.cur++;persistDraft();render();window.scrollTo({top:0});}else{ex.confirm=true;render();window.scrollTo({top:0});}break;
  case "goto":readFill();ex.cur=+d.i;persistDraft();render();window.scrollTo({top:0});break;
  case "askSubmit":readFill();ex.confirm=true;render();window.scrollTo({top:0});break;
  case "cancelSubmit":ex.confirm=false;render();break;
  case "submit":submitExam();break;
  case "quit":if(ex.mode==="exam"){if(!ex.quitAsk){ex.quitAsk=true;ex.confirm=false;render();showQuit();break;}}lsSet(DKEY,null);go({name:"home"});break;
  case "quitYes":lsSet(DKEY,null);go({name:"home"});break;
  case "filter":view.filter=d.f;render();break;
  case "askreset":view.confirmReset=true;render();break;
  case "noreset":view.confirmReset=false;render();break;
  case "reset":P={attempts:[],qs:{},v:1,pr:P.pr||{}};lsSet(DKEY,null);save();view.confirmReset=false;render();break;
  }}
function showQuit(){const wrap=document.querySelector(".wrap");const box=document.createElement("div");box.className="confirm";box.innerHTML=`<b>Abbandonare la simulazione?</b><p>Le risposte date finora non verranno salvate.</p><div class="row"><button class="btn danger" data-act="quitYes">Abbandona</button><button class="btn ghost" data-act="quitNo">Continua la prova</button></div>`;wrap.prepend(box);window.scrollTo({top:0});}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;if(b.classList.contains("overlay")&&e.target!==b)return;if(b.tagName==="INPUT")return;if(b.dataset.act==="quitNo"){view.ex.quitAsk=false;render();return;}e.preventDefault();act(b.dataset.act,b.dataset);});
document.addEventListener("change",e=>{const b=e.target.closest("input[data-act]");if(b)act(b.dataset.act,b.dataset);});
document.addEventListener("keydown",e=>{if(view.who){if(e.key==="Escape"){view.who=null;renderWho();}else if(e.key==="Enter"&&e.target.id==="who-n"){e.preventDefault();whoCreate();}return;}if(view.name!=="exam"||e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.tagName==="TEXTAREA")return;const ex=view.ex;const it=ex.items[ex.cur];const q=QI[it.id];
  if(e.key==="ArrowRight"){act("next");}else if(e.key==="ArrowLeft"){act("prev");}
  else if(q.t==="mc"&&/^[a-eA-E1-5]$/.test(e.key)&&!it.checked){const k=/\d/.test(e.key)?+e.key-1:"abcde".indexOf(e.key.toLowerCase());if(k<it.ord.length)act("choose",{o:it.ord[k]});}});
window.addEventListener("pagehide",()=>{if(view.name==="exam"){readFill();persistDraft();}});

window.__sim={fillMatch,TP,TOPICS,BANK,checkFill,parseNum,norm,buildExam,EXAM,P:()=>P};
render();initCloud();flush();loadGIS();pullAcct();if(location.hash==="#privacy"){view.who={step:"privacy"};renderWho();}
})();
</script>
