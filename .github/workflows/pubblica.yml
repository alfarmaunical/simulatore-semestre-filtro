name: Pubblica il simulatore
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Controlla le domande
        run: node sorgenti/check.js
      - name: Costruisci la pagina
        run: |
          python3 sorgenti/build.py
          mkdir -p _sito && cp index.html _sito/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sito
      - id: deploy
        uses: actions/deploy-pages@v4
