BANK.push(
{id:"C601",s:"chem",u:3,q:"Quanti equivalenti sono contenuti in una mole di Al(OH)₃?",o:["3","1","2","6","1/3"],e:"Ogni mole può fornire (o neutralizzare) 3 moli di OH⁻."},
{id:"C602",s:"chem",u:6,q:"La formula molecolare dell'eicosano (alcano lineare con 20 atomi di carbonio) è:",o:["C₂₀H₄₂","C₂₀H₄₀","C₂₀H₃₈","C₂₀H₂₀","C₂₀H₄₄"],e:"CₙH₂ₙ₊₂ con n = 20."},
{id:"C603",s:"chem",u:3,q:"Una soluzione è ottenuta mescolando 30 g di etanolo con 70 g di acqua. La concentrazione percentuale in massa dell'etanolo è:",o:["30%","43%","70%","23%","3%"],e:"30/(30 + 70) × 100 = 30%."},
{id:"C604",s:"chem",u:1,q:"Quante molecole sono contenute in 18 g di glucosio (M = 180 g/mol)?",o:["6,02·10²²","6,02·10²³","1,08·10²⁵","3,01·10²³","6,02·10²¹"],e:"18/180 = 0,1 mol; 0,1 × 6,02·10²³ = 6,02·10²²."},
{id:"C605",s:"chem",u:5,q:"Il pH di una soluzione 0,5 M di KCl a 25 °C è:",o:["7","0,3","13,7","5","9"],e:"KCl deriva da acido forte e base forte: nessuno dei due ioni si idrolizza."},
{id:"C606",s:"chem",u:5,q:"Un tampone acido formico/formiato ha pH 4,15. Diluendolo 10 volte con acqua il pH:",o:["resta praticamente 4,15","diventa 5,15","diventa 3,15","diventa circa 7","aumenta fino a circa 4,5"],e:"Il pH di un tampone dipende dal rapporto [A⁻]/[HA], che non cambia con la diluizione (diminuisce però la capacità tamponante)."},
{id:"C607",s:"chem",u:1,q:"Una mole di una proteina pesa 60 kg. Si può dedurre che:",o:["la massa molecolare della proteina è 60 000 u (60 kDa)","ogni molecola della proteina pesa 60 kg","la massa molecolare della proteina è 60 u","la massa molecolare della proteina è 6000 u (6 kDa)","in una mole ci sono 60 000 molecole"],e:"La massa molare in g/mol coincide numericamente con la massa molecolare in u."},
{id:"C608",s:"chem",u:6,q:"Un alchene aciclico con un solo doppio legame contiene n atomi di idrogeno. Il numero di atomi di carbonio è:",o:["n/2","n","2n","n − 2","n + 2"],e:"Formula CₙH₂ₙ: il numero di H è il doppio di quello dei C."},
{id:"C609",s:"chem",u:4,q:"Una soluzione satura di NaCl in presenza di sale non disciolto è un esempio di:",o:["equilibrio eterogeneo","reazione irreversibile","soluzione sovrasatura","equilibrio omogeneo in fase gassosa","miscela colloidale"],e:"Coesistono la fase solida e la soluzione: NaCl(s) ⇌ Na⁺(aq) + Cl⁻(aq)."},
{id:"C610",s:"chem",u:5,q:"Nella reazione tra ossalato (C₂O₄²⁻, che si ossida a CO₂) e permanganato (MnO₄⁻, che si riduce a Mn²⁺) in ambiente acido, il rapporto stechiometrico ossalato : permanganato è:",o:["5 : 2","2 : 5","1 : 1","1 : 5","5 : 1"],e:"Ogni ossalato cede 2 elettroni (C da +3 a +4, ×2), ogni permanganato ne acquista 5: 5 × 2 = 2 × 5."},
{id:"C611",s:"chem",u:3,q:"Una soluzione A è ipotonica rispetto a una soluzione B se:",o:["ha un'osmolarità minore di quella di B","ha un'osmolarità maggiore di quella di B","ha la stessa osmolarità di B","contiene più soluto non permeante di B","ha una pressione osmotica maggiore di B"],e:"Messe a contatto tramite una membrana semipermeabile, l'acqua passerebbe da A verso B."},
{id:"C612",s:"chem",u:1,q:"Il calcio e lo stronzio appartengono entrambi al gruppo 2. Rispetto al calcio, lo stronzio ha:",o:["raggio atomico maggiore ed energia di ionizzazione minore","raggio atomico minore ed energia di ionizzazione maggiore","raggio atomico maggiore ed energia di ionizzazione maggiore","raggio atomico minore ed elettronegatività minore","un elettrone di valenza in più e raggio maggiore"],e:"Scendendo nel gruppo aumentano i livelli elettronici. Lo stronzio radioattivo (⁹⁰Sr), come il calcio, si accumula nelle ossa."},
{id:"C613",s:"chem",u:1,q:"Un elemento forma un ossido che, sciolto in acqua, dà una soluzione acida. L'elemento è probabilmente:",o:["un non metallo, come lo zolfo","un metallo alcalino, come il sodio","un metallo alcalino-terroso, come il calcio","un metallo di transizione, come il ferro(II)","un gas nobile, come il neon"],e:"Gli ossidi dei non metalli sono anidridi e formano ossiacidi."},
{id:"C614",s:"chem",u:8,q:"Quale delle seguenti macromolecole è un omopolimero, cioè formato da monomeri tutti uguali?",o:["La cellulosa","Una proteina","Il DNA","L'RNA","L'acido ialuronico"],e:"La cellulosa è un polimero del solo glucosio; proteine e acidi nucleici contengono monomeri diversi."},

{id:"B601",s:"bio",u:1,q:"Gli esperimenti che dimostrarono per primi che il DNA è la sostanza responsabile della trasformazione batterica furono quelli di:",o:["Avery, MacLeod e McCarty","Watson e Crick","Meselson e Stahl","Hershey e Chase","Beadle e Tatum"],e:"Proseguendo gli studi di Griffith sugli pneumococchi, nel 1944 mostrarono che solo la distruzione del DNA eliminava il fattore trasformante. Hershey e Chase lo confermarono nel 1952 con i fagi."},
{id:"B602",s:"bio",u:5,q:"Quale complesso della catena respiratoria NON pompa protoni nello spazio intermembrana?",o:["Il complesso II (succinato deidrogenasi)","Il complesso I (NADH deidrogenasi)","Il complesso III (citocromo bc₁)","Il complesso IV (citocromo c ossidasi)","Nessuno: tutti pompano protoni"],e:"Il complesso II trasferisce elettroni dal FADH₂ all'ubichinone senza pompare protoni: per questo il FADH₂ rende meno ATP del NADH."},
{id:"B603",s:"bio",u:7,q:"Il nematode Caenorhabditis elegans è stato fondamentale per lo studio dell'apoptosi perché:",o:["ha un numero fisso di cellule e si sa quali muoiono nello sviluppo","non ha apoptosi, per cui serve da controllo negativo","ha cellule giganti in cui l'apoptosi si osserva a occhio nudo","ha un numero variabile di cellule, che muoiono a caso","è privo di caspasi e usa solo la via indipendente da caspasi"],e:"Nell'ermafrodita adulto rimangono 959 cellule somatiche; 131 cellule muoiono sempre per apoptosi durante lo sviluppo. Gli studi valsero il Nobel 2002."},
{id:"B604",s:"bio",u:4,q:"Si incrociano un individuo AABBdd e un individuo aabbDD (geni indipendenti). La percentuale di figli con genotipo AaBbDd è:",o:["100%","50%","25%","12,5%","0%"],e:"Ogni genitore produce un solo tipo di gamete (ABd e abD): tutti i figli sono AaBbDd."},
{id:"B605",s:"bio",u:6,q:"La perdita delle giunzioni comunicanti tra cardiomiociti può causare:",o:["alterazioni della propagazione dell'impulso elettrico (aritmie)","perdita della polarità epiteliale dei cardiomiociti","distacco dei cardiomiociti dalla lamina basale","rottura dei dischi intercalari per perdita dei desmosomi","blocco della contrazione per mancato rilascio di Ca²⁺ dal RS"],e:"Le gap junction permettono il passaggio diretto di ioni e quindi l'accoppiamento elettrico."},
{id:"B606",s:"bio",u:4,q:"Una mutazione per delezione di due nucleotidi adiacenti all'interno della regione codificante di un gene batterico produce:",o:["uno spostamento della cornice di lettura, che altera i codoni a valle","la perdita di un solo amminoacido, senza altre conseguenze","una mutazione silente per la degenerazione del codice genetico","la sostituzione di due amminoacidi adiacenti nella proteina","uno slittamento della cornice che altera solo il codone colpito dalla delezione"],e:"Solo inserzioni o delezioni di multipli di 3 nucleotidi mantengono la cornice di lettura."},
{id:"B607",s:"bio",u:6,q:"Lo ione Ca²⁺ all'interno della cellula agisce spesso come:",o:["secondo messaggero, ad esempio legandosi alla calmodulina","secondo messaggero, ad esempio attivando direttamente la PKA","primo messaggero, legandosi a recettori nucleari","cofattore dei ribosomi necessario alla traduzione","ormone che lega recettori intracellulari"],e:"La sua concentrazione citosolica a riposo è molto bassa (circa 100 nM) e aumenta rapidamente in risposta ai segnali."},
{id:"B608",s:"bio",u:3,q:"Nella replicazione, l'attività esonucleasica 3'→5' delle DNA polimerasi serve a:",o:["rimuovere i nucleotidi appaiati in modo errato appena inseriti","rimuovere il primer di RNA dal filamento lento","rimuovere i nucleotidi appaiati correttamente all'estremità 5'","unire i frammenti di Okazaki dopo la rimozione dei primer","separare i due filamenti davanti alla forcella"],e:"Il proofreading riduce gli errori di circa 100 volte."},
{id:"B609",s:"bio",u:1,q:"Le cellule che possiedono sia mitocondri sia cloroplasti sono:",o:["le cellule vegetali fotosintetiche e le alghe eucariotiche","le cellule animali e quelle dei funghi eucariotici","i cianobatteri e le cellule vegetali fotosintetiche","le cellule vegetali non fotosintetiche delle radici","i batteri fotosintetici e le alghe procariotiche"],e:"I cianobatteri fanno la fotosintesi ma sono procarioti e non hanno organelli."},
{id:"B610",s:"bio",u:4,q:"L'osteogenesi imperfetta è una malattia autosomica dominante dovuta ad anomalie del collagene di tipo I. Un genitore affetto (eterozigote) e uno sano hanno una probabilità di avere un figlio affetto pari a:",o:["1/2","1/4","3/4","1","0"],e:"Ogni figlio riceve l'allele mutato con probabilità 1/2."},

{id:"F601",s:"fis",u:2,q:"Una valigia con rotelle di raggio 5 cm viene trascinata a 7,2 km/h. La velocità angolare delle rotelle è:",o:["40 rad/s","1,44 rad/s","0,4 rad/s","144 rad/s","4 rad/s"],e:"7,2 km/h = 2 m/s; nel rotolamento senza strisciamento ω = v/r = 2/0,05 = 40 rad/s."},
{id:"F602",s:"fis",u:6,q:"L'energia elettrica viene trasportata su lunghe distanze ad alta tensione perché:",o:["a parità di potenza la corrente è minore, quindi le perdite R·I² calano","a parità di potenza la corrente è maggiore, quindi le perdite R·I² calano","l'alta tensione riduce a zero la resistenza dei cavi","l'alta tensione aumenta la velocità degli elettroni nei cavi","a parità di corrente la potenza trasportata è minore"],e:"P = V·I: aumentando V di 10 volte, I diventa 10 volte più piccola e le perdite R·I² 100 volte più piccole."},
{id:"F603",s:"fis",u:6,q:"Un trapano da 880 W si collega alla rete a 220 V. La corrente assorbita è:",o:["4 A","0,25 A","193 600 A","40 A","2 A"],e:"I = P/V = 880/220 = 4 A."},
{id:"F604",s:"fis",u:7,q:"Un vetro protettivo lascia passare 1/5 della luce incidente. Sovrapponendo due vetri identici passa:",o:["1/25 della luce","2/5 della luce","1/10 della luce","1/5 della luce","4/5 della luce"],e:"Le attenuazioni si moltiplicano: (1/5)²."},
{id:"F605",s:"fis",u:3,q:"Un relitto di 7 tonnellate e volume 5 m³ giace sul fondo di un lago (ρ acqua = 1000 kg/m³, g = 10 m/s²). La forza minima per sollevarlo è:",o:["2·10⁴ N","7·10⁴ N","5·10⁴ N","1,2·10⁵ N","2·10³ N"],e:"Peso = 70 000 N; spinta = 1000 × 5 × 10 = 50 000 N; differenza 20 000 N."},
{id:"F606",s:"fis",u:6,q:"Due pile da 4,5 V in serie alimentano una resistenza da 90 Ω. La corrente è:",o:["0,1 A","0,05 A","10 A","20 A","0,9 A"],e:"I = 9/90."},
{id:"F607",s:"fis",u:6,q:"Una resistenza di 2 Ω dissipa una potenza di 18 W. La corrente che la attraversa è:",o:["3 A","9 A","36 A","6 A","1,5 A"],e:"P = R·I² → I² = 9 → I = 3 A."},
{id:"F608",s:"fis",u:1,q:"La glicemia normale è circa 100 mg/dL. In 5 L di sangue sono contenuti circa:",o:["5 g di glucosio","500 mg di glucosio","50 g di glucosio","0,5 g di glucosio","100 g di glucosio"],e:"5 L = 50 dL; 50 × 100 mg = 5000 mg = 5 g."},
{id:"F609",s:"fis",u:2,q:"Un'auto alle 15:30 ha il contachilometri a 22 715 km e alle 17:00 a 22 850 km. La sua velocità media è stata:",o:["90 km/h","135 km/h","67,5 km/h","1,5 km/h","45 km/h"],e:"135 km in 1,5 h."},
{id:"F610",s:"fis",u:2,q:"Una fionda fa compiere a un sasso 5 giri al secondo su una circonferenza di raggio 0,5 m. La velocità del sasso è circa:",o:["15,7 m/s","2,5 m/s","31,4 m/s","5 m/s","10 m/s"],e:"v = 2π·r·f = 2π × 0,5 × 5 ≈ 15,7 m/s."},
{id:"F611",s:"fis",u:2,q:"Un corpo può scendere lungo un piano inclinato a velocità costante?",o:["Sì, se l'attrito equilibra la componente del peso lungo il piano","No, perché la componente del peso lungo il piano lo fa sempre accelerare","Sì, ma solo se l'attrito è nullo e il piano è liscio","No, perché l'attrito lo fa sempre fermare","Sì, se la reazione normale equilibra il peso"],e:"Con risultante nulla il moto è rettilineo uniforme: succede quando tg θ = μd."},
{id:"F612",s:"fis",u:7,q:"Della luce non polarizzata attraversa due polarizzatori con assi perpendicolari. Inserendo tra i due un terzo polarizzatore a 45°:",o:["passa un po' di luce (circa 1/8 dell'intensità iniziale)","non passa comunque luce, perché gli assi estremi sono incrociati","passa circa 1/4 dell'intensità iniziale","passa metà dell'intensità iniziale","passa circa 1/16 dell'intensità iniziale"],e:"Il primo dimezza (I₀/2); ciascun polarizzatore successivo a 45° moltiplica per cos²45° = 1/2: I₀/8."},
{id:"F613",s:"fis",u:6,q:"Due cariche positive sono poste in acqua (costante dielettrica relativa 80) invece che nel vuoto, alla stessa distanza. La forza di repulsione:",o:["diventa 80 volte più piccola","diventa 80 volte più grande","diventa √80 volte più piccola","resta uguale","diventa 6400 volte più piccola"],e:"F = k·q₁·q₂/(εr·r²)."},
{id:"F614",s:"fis",u:2,q:"Una ruota di bicicletta rotola senza strisciare. Il punto della ruota a contatto con la strada, in quell'istante:",o:["è fermo rispetto alla strada","si muove al doppio della velocità della bicicletta","si muove alla velocità della bicicletta","si muove all'indietro","si muove verso l'alto alla velocità della bicicletta"],e:"Il punto più alto della ruota si muove invece al doppio della velocità del centro."},
{id:"F615",s:"fis",u:5,q:"Il corpo umano a circa 36 °C emette radiazione elettromagnetica soprattutto nella regione:",o:["dell'infrarosso","del visibile","dell'ultravioletto","dei raggi X","delle microonde lunghe"],e:"Per la legge di Wien λ_max ≈ 2,9·10⁻³/309 ≈ 9,4 μm."},
{id:"F616",s:"fis",u:2,q:"Un foglio e una pallina di carta con la stessa massa cadono dalla stessa altezza in aria. Arriva prima:",o:["la pallina, perché subisce meno resistenza dell'aria","il foglio, perché ha una superficie maggiore","arrivano insieme, perché hanno la stessa massa","la pallina, perché ha un peso maggiore","arrivano insieme, perché g è uguale per entrambi"],e:"Nel vuoto arriverebbero insieme; in aria conta la forma, che determina la resistenza aerodinamica."},
{id:"F617",s:"fis",u:2,q:"Un uomo di 60 kg cammina in salita superando 240 m di dislivello ogni ora (g = 10 m/s²). La potenza media spesa per sollevare il proprio peso è:",o:["40 W","144 kW","14 400 W","4 W","400 W"],e:"L = 60 × 10 × 240 = 144 000 J in 3600 s → 40 W."},
{id:"F618",s:"fis",u:6,q:"Il lavoro necessario per avvicinare tra loro due cariche positive inizialmente molto lontane:",o:["è positivo, perché bisogna vincere la repulsione","è negativo, perché le cariche si respingono","è nullo, perché la forza elettrica è conservativa","è positivo, ma non dipende dalla distanza finale","è negativo, perché l'energia potenziale diminuisce"],e:"Il lavoro compiuto dall'esterno si accumula come energia potenziale elettrica U = k·q₁·q₂/r."},
{id:"F619",s:"fis",u:3,q:"In due tubi capillari comunicanti di raggio diverso, con un liquido che bagna le pareti, il livello del liquido:",o:["è più alto nel tubo più sottile","è uguale nei due tubi","è più alto nel tubo più largo","è più basso in entrambi rispetto al recipiente","oscilla continuamente"],e:"Legge di Jurin: l'altezza di risalita è inversamente proporzionale al raggio."}
);

{id:"XC11",s:"chem",u:3,q:"Una mole di H₃PO₄, acido triprotico, corrisponde a …… equivalenti",c:["3","tre"],n:3,e:"Può cedere tre protoni."},
{id:"XC12",s:"chem",u:1,q:"In 9 g di acqua (M = 18 g/mol) sono contenute …… mol di acqua",c:["0,5","0.5"],n:0.5,e:"9/18."},
{id:"XB11",s:"bio",u:7,q:"Nella specie umana il numero aploide n è uguale a ……",c:["23","ventitre","ventitré"],n:23,e:"2n = 46."},
{id:"XB12",s:"bio",u:6,q:"La proteina che lega il Ca²⁺ e media molti dei suoi effetti intracellulari si chiama ……",c:["calmodulina"],e:"Il complesso Ca²⁺-calmodulina attiva numerose chinasi."},
{id:"XF11",s:"fis",u:6,q:"Due resistori da 10 Ω e 40 Ω collegati in parallelo hanno una resistenza equivalente di …… Ω",c:["8","otto"],n:8,e:"(10·40)/(10 + 40) = 400/50."},
{id:"XF12",s:"fis",u:6,q:"Un chilowattora equivale a …… MJ",c:["3,6","3.6"],n:3.6,e:"1000 W × 3600 s = 3,6·10⁶ J."}
);

BANK.push(
{id:"BF001",s:"bio",u:1,q:"La teoria secondo cui tutti gli organismi sono formati da cellule e ogni cellula deriva da un'altra cellula si chiama teoria ……",c:["cellulare"],e:"Formulata da Schleiden, Schwann e Virchow (omnis cellula e cellula)."},
{id:"BF002",s:"bio",u:1,q:"Le proteine che formano il capside di un virus sono organizzate in subunità chiamate ……",c:["capsomeri","capsomero","capsomeri proteici"],e:"I capsomeri si dispongono con simmetria elicoidale o icosaedrica."},
{id:"BF003",s:"bio",u:1,q:"I virus che infettano i batteri si chiamano ……",c:["batteriofagi","batteriofago","fagi","fago"],e:"Esempi: T4, lambda."},
{id:"BF004",s:"bio",u:1,q:"Nel ciclo lisogenico il genoma del fago integrato nel cromosoma batterico prende il nome di ……",c:["profago"],e:"Nei virus animali il genoma integrato si chiama provirus."},
{id:"BF005",s:"bio",u:1,q:"Il genoma di un retrovirus integrato nel DNA della cellula ospite si chiama ……",c:["provirus"],e:"È trascritto dalla RNA polimerasi II della cellula."},
{id:"BF006",s:"bio",u:1,q:"I batteri Gram-positivi, dopo la colorazione di Gram, appaiono di colore ……",c:["viola","violetto","blu-violetto","violaceo"],e:"I Gram-negativi perdono il cristalvioletto con l'alcol e appaiono rosa-rossi per la safranina."},
{id:"BF007",s:"bio",u:1,q:"Le appendici lunghe che permettono il movimento dei batteri si chiamano ……",c:["flagelli","flagello"],e:"Il flagello batterico ruota grazie a un motore alimentato dal gradiente protonico, a differenza di quello eucariotico."},
{id:"BF008",s:"bio",u:1,q:"Il monosaccaride a 6 atomi di carbonio principale fonte di energia per le cellule è il ……",c:["glucosio"],e:"Ha formula C₆H₁₂O₆."},
{id:"BF009",s:"bio",u:1,q:"Il legame tra il gruppo carbossilico di un amminoacido e il gruppo amminico del successivo si chiama legame ……",c:["peptidico","ammidico"],e:"Si forma per condensazione con perdita di una molecola d'acqua."},
{id:"BF010",s:"bio",u:1,q:"Le proteine che catalizzano le reazioni biologiche si chiamano ……",c:["enzimi","enzima"],e:"Alcuni RNA (ribozimi) possono avere anch'essi attività catalitica."},
{id:"BF011",s:"bio",u:1,q:"La molecola su cui agisce un enzima si chiama ……",c:["substrato"],e:"Il substrato si lega al sito attivo."},
{id:"BF012",s:"bio",u:1,q:"Le reazioni cellulari che sintetizzano molecole complesse consumando energia costituiscono l'……",c:["anabolismo"],e:"Il catabolismo le demolisce liberando energia."},
{id:"BF013",s:"bio",u:1,q:"I lipidi formati da glicerolo, due acidi grassi e un gruppo fosfato si chiamano ……",c:["fosfolipidi","glicerofosfolipidi","fosfogliceridi"],e:"Sono i principali costituenti delle membrane."},
{id:"BF014",s:"bio",u:1,q:"La forma tridimensionale complessiva di una singola catena polipeptidica è detta struttura ……",c:["terziaria"],e:"È stabilizzata da interazioni tra le catene laterali."},
{id:"BF015",s:"bio",u:1,q:"Il trasferimento di geni tra organismi diversi non legati da riproduzione si chiama trasferimento genico ……",c:["orizzontale","laterale"],e:"Nei batteri avviene per trasformazione, trasduzione o coniugazione."},
{id:"BF016",s:"bio",u:1,q:"La teoria che spiega l'origine di mitocondri e cloroplasti da batteri inglobati si chiama teoria ……",c:["endosimbiontica","dell'endosimbiosi","endosimbiotica"],e:"Fu sostenuta in particolare da Lynn Margulis."},
{id:"BF017",s:"bio",u:2,q:"Il complesso di DNA e proteine che costituisce i cromosomi eucariotici si chiama ……",c:["cromatina"],e:"Si distingue in eucromatina ed eterocromatina."},
{id:"BF018",s:"bio",u:2,q:"La cromatina decondensata e trascrizionalmente attiva si chiama ……",c:["eucromatina"],e:"L'eterocromatina è invece condensata e silente."},
{id:"BF019",s:"bio",u:2,q:"Le proteine basiche, ricche di lisina e arginina, attorno a cui si avvolge il DNA si chiamano ……",c:["istoni","istone","proteine istoniche"],e:"La loro carica positiva interagisce con i fosfati del DNA."},
{id:"BF020",s:"bio",u:2,q:"Il numero di molecole di istoni che formano il core di un nucleosoma è ……",c:["8","otto"],n:8,e:"Due copie ciascuno di H2A, H2B, H3 e H4."},
{id:"BF021",s:"bio",u:2,q:"La rappresentazione ordinata del corredo cromosomico di una cellula, a coppie di omologhi, si chiama ……",c:["cariotipo","cariogramma"],e:"Si allestisce su cellule bloccate in metafase."},
{id:"BF022",s:"bio",u:2,q:"Nell'uomo le coppie di autosomi sono ……",c:["22","ventidue"],n:22,e:"Più una coppia di cromosomi sessuali."},
{id:"BF024",s:"bio",u:2,q:"Le sequenze Alu sono il principale esempio di sequenze ripetute intersperse corte, indicate con la sigla ……",c:["sine"],e:"Short Interspersed Nuclear Elements; le LINE sono quelle lunghe."},
{id:"BF025",s:"bio",u:2,q:"Le copie non funzionanti di un gene, accumulate nel genoma dopo duplicazione o retrotrascrizione, si chiamano ……",c:["pseudogeni","pseudogene"],e:"Sono presenti ad esempio nella famiglia delle globine."},
{id:"BF026",s:"bio",u:2,q:"Le modificazioni degli istoni e la metilazione del DNA che regolano l'espressione genica senza modificare la sequenza costituiscono la regolazione ……",c:["epigenetica"],e:"Possono essere trasmesse alle cellule figlie."},
{id:"BF027",s:"bio",u:3,q:"Il punto del cromosoma batterico in cui inizia la replicazione si chiama ……",c:["oric","origine di replicazione","ori"],e:"Negli eucarioti le origini sono molte per ogni cromosoma."},
{id:"BF028",s:"bio",u:3,q:"La struttura a forma di Y che si forma dove la doppia elica si apre durante la replicazione si chiama ……",c:["forcella replicativa","forcella di replicazione","forcella"],e:"Da ogni origine partono due forcelle (replicazione bidirezionale)."},
{id:"BF029",s:"bio",u:3,q:"Il filamento di DNA sintetizzato in modo continuo durante la replicazione si chiama filamento ……",c:["guida","leading","veloce","continuo"],e:"Il filamento lento (lagging) è sintetizzato in frammenti di Okazaki."},
{id:"BF030",s:"bio",u:3,q:"L'attività con cui la DNA polimerasi rimuove un nucleotide appena inserito in modo errato si chiama correzione di bozze o ……",c:["proofreading"],e:"È dovuta all'attività esonucleasica 3'→5'."},
{id:"BF031",s:"bio",u:3,q:"Il processo con cui l'informazione del DNA viene copiata in RNA si chiama ……",c:["trascrizione"],e:"La traduzione è invece la sintesi delle proteine sull'mRNA."},
{id:"BF032",s:"bio",u:3,q:"La sequenza di DNA a cui si lega la RNA polimerasi per iniziare la trascrizione si chiama ……",c:["promotore"],e:"Negli eucarioti contiene spesso la TATA box."},
{id:"BF033",s:"bio",u:3,q:"Le regioni di un gene eucariotico che vengono rimosse dal trascritto primario si chiamano ……",c:["introni","introne"],e:"Le regioni conservate nell'mRNA maturo sono gli esoni."},
{id:"BF034",s:"bio",u:3,q:"Le regioni di un gene che rimangono nell'mRNA maturo si chiamano ……",c:["esoni","esone"],e:"Comprendono anche le regioni non tradotte (UTR) al 5' e al 3'."},
{id:"BF035",s:"bio",u:3,q:"L'aggiunta di una coda di adenine all'estremità 3' del pre-mRNA si chiama ……",c:["poliadenilazione"],e:"Il segnale AAUAAA dirige il taglio e la poliadenilazione."},

{id:"FF048",s:"fis",u:3,q:"La spinta di Archimede su un corpo di volume 0,01 m³ completamente immerso in acqua (g = 10 m/s²) è …… N",c:["100","cento"],n:100,e:"1000 × 0,01 × 10."},
{id:"FF049",s:"fis",u:3,q:"Lo strumento che misura la pressione atmosferica si chiama ……",c:["barometro"],e:"Il primo fu quello a mercurio di Torricelli."},
{id:"FF050",s:"fis",u:3,q:"Il volume di fluido che attraversa una sezione nell'unità di tempo si chiama ……",c:["portata"],e:"Q = A·v."},
{id:"FF051",s:"fis",u:3,q:"Un tubo di sezione 4 cm² percorso da un fluido a 2 m/s ha portata …… cm³/s",c:["800","ottocento"],n:800,e:"4 cm² × 200 cm/s."},
{id:"FF052",s:"fis",u:3,q:"Il moto di un fluido in cui gli strati scorrono ordinatamente l'uno sull'altro si dice ……",c:["laminare"],e:"Il moto disordinato con vortici si dice turbolento."},
{id:"FF053",s:"fis",u:3,q:"La proprietà dei fluidi che rappresenta l'attrito interno tra gli strati si chiama ……",c:["viscosita","viscosità"],e:"Nel SI si misura in Pa·s."},
{id:"FF054",s:"fis",u:3,q:"La legge che lega la portata alla quarta potenza del raggio di un condotto è la legge di ……",c:["poiseuille","hagen-poiseuille"],e:"Valida per il moto laminare di fluidi viscosi."},
{id:"FF055",s:"fis",u:3,q:"Il fenomeno per cui un liquido risale in un tubo sottile si chiama ……",c:["capillarita","capillarità"],e:"L'altezza è inversamente proporzionale al raggio."},
{id:"FF056",s:"fis",u:3,q:"La legge che lega la pressione di curvatura al raggio di una bolla e alla tensione superficiale è la legge di ……",c:["laplace"],e:"ΔP = 2τ/r."},
{id:"FF057",s:"fis",u:3,q:"Un fluido incomprimibile scorre in un tubo a 3 m/s. Dove la sezione è dimezzata la velocità diventa …… m/s",c:["6","sei"],n:6,e:"Equazione di continuità."},
{id:"FF058",s:"fis",u:4,q:"Il numero di oscillazioni compiute in un secondo si chiama ……",c:["frequenza"],e:"Si misura in hertz."},
{id:"FF059",s:"fis",u:4,q:"La distanza tra due creste successive di un'onda si chiama ……",c:["lunghezza d'onda","lunghezza donda","lambda"],e:"Si indica con λ."},
{id:"FF060",s:"fis",u:4,q:"La massima distanza di un punto dalla posizione di equilibrio durante l'oscillazione si chiama ……",c:["ampiezza"],e:"L'energia dell'onda è proporzionale al suo quadrato."},
{id:"FF061",s:"fis",u:4,q:"Un'onda di frequenza 200 Hz e lunghezza d'onda 1,7 m si propaga a …… m/s",c:["340","trecentoquaranta"],n:340,e:"v = λ·f."},
{id:"FF062",s:"fis",u:4,q:"Le onde in cui le particelle oscillano nella stessa direzione di propagazione si dicono ……",c:["longitudinali","longitudinale"],e:"Il suono nei gas è longitudinale."},
{id:"FF063",s:"fis",u:4,q:"La sovrapposizione di due onde in fase che produce un'ampiezza maggiore si chiama interferenza ……",c:["costruttiva"],e:"In opposizione di fase l'interferenza è distruttiva."},
{id:"FF065",s:"fis",u:4,q:"La soglia di udibilità corrisponde a un'intensità di 10^…… W/m²",c:["-12","−12"],n:-12,e:"Corrisponde a 0 dB."},
{id:"FF066",s:"fis",u:4,q:"Un suono 10 000 volte più intenso della soglia di udibilità ha un livello sonoro di …… dB",c:["40","quaranta"],n:40,e:"10·log(10⁴)."},
{id:"FF067",s:"fis",u:4,q:"Le onde sonore con frequenza inferiore a 20 Hz si chiamano ……",c:["infrasuoni","infrasuono"],e:"Non sono udibili dall'uomo."},
{id:"FF068",s:"fis",u:4,q:"L'apparente variazione di frequenza dovuta al moto relativo tra sorgente e osservatore si chiama effetto ……",c:["doppler"],e:"Usato nell'ecodoppler."},
{id:"FF069",s:"fis",u:4,q:"In un'onda stazionaria, i punti che oscillano con ampiezza massima si chiamano ……",c:["ventri","ventre"],e:"I punti fermi sono i nodi."},
{id:"FF070",s:"fis",u:5,q:"Una temperatura di 0 °C corrisponde a …… K",c:["273","273,15","273.15"],n:273.15,tol:0.002,e:"T(K) = T(°C) + 273,15."},
{id:"FF071",s:"fis",u:5,q:"L'energia scambiata tra due corpi a causa della differenza di temperatura si chiama ……",c:["calore"],e:"Si misura in joule (o calorie)."},
{id:"FF072",s:"fis",u:5,q:"Per scaldare 1 kg d'acqua di 10 °C servono circa …… kJ",c:["41,86","41.86","41,9","41.9","42"],n:41.86,tol:0.02,e:"Q = m·c·ΔT = 1 × 4186 × 10."},
{id:"FF073",s:"fis",u:5,q:"Una kilocaloria equivale a circa …… J",c:["4186","4.186","4190","4180","4200"],n:4186,tol:0.01,e:"1 kcal = 1000 cal."},
{id:"FF074",s:"fis",u:5,q:"Il calore necessario per far fondere un'unità di massa di sostanza a temperatura costante si chiama calore latente di ……",c:["fusione"],e:"Per il ghiaccio circa 334 kJ/kg."},
{id:"FF075",s:"fis",u:5,q:"Una trasformazione che avviene a temperatura costante si chiama ……",c:["isoterma","isotermica"],e:"Per un gas ideale PV = costante."},
{id:"FF076",s:"fis",u:5,q:"Una trasformazione che avviene a volume costante si chiama ……",c:["isocora","isocorica","isometrica"],e:"Il lavoro compiuto è nullo."},
{id:"FF077",s:"fis",u:5,q:"Un gas assorbe 300 J di calore a volume costante. La sua energia interna aumenta di …… J",c:["300","trecento"],n:300,e:"L = 0 → ΔU = Q."},
{id:"FF078",s:"fis",u:5,q:"Il ciclo ideale formato da due isoterme e due adiabatiche si chiama ciclo di ……",c:["carnot"],e:"Ha il rendimento massimo possibile tra due temperature."},
{id:"FF079",s:"fis",u:5,q:"La grandezza termodinamica che misura il disordine di un sistema si chiama ……",c:["entropia"],e:"In un sistema isolato non diminuisce mai."},
{id:"FF080",s:"fis",u:5,q:"La legge secondo cui il prodotto λ_max·T è costante per un corpo nero è la legge di ……",c:["wien"],e:"Spostamento di Wien."},
{id:"FF081",s:"fis",u:5,q:"La trasmissione del calore senza trasporto di materia, per contatto diretto, si chiama ……",c:["conduzione"],e:"È efficiente nei metalli."},
{id:"FF082",s:"fis",u:5,q:"Un gas ideale a pressione costante viene scaldato da 300 K a 450 K. Il suo volume aumenta di un fattore ……",c:["1,5","1.5"],n:1.5,e:"V ∝ T a pressione costante."},
{id:"FF083",s:"fis",u:6,q:"La legge che descrive la forza tra due cariche puntiformi è la legge di ……",c:["coulomb"],e:"F = k·q₁·q₂/r²."},
{id:"FF084",s:"fis",u:6,q:"L'unità di misura SI della carica elettrica è il ……",c:["coulomb","c"],e:"1 C = 1 A·s."},
{id:"FF085",s:"fis",u:6,q:"Le cariche elettriche dello stesso segno si ……",c:["respingono","respingono tra loro"],e:"Quelle di segno opposto si attraggono."},
{id:"FF086",s:"fis",u:6,q:"L'unità di misura SI della differenza di potenziale è il ……",c:["volt","v"],e:"1 V = 1 J/C."},
{id:"FF087",s:"fis",u:6,q:"L'unità di misura SI della resistenza elettrica è l'……",c:["ohm"],e:"1 Ω = 1 V/A."},
{id:"FF088",s:"fis",u:6,q:"Un resistore di 50 Ω sottoposto a 10 V è attraversato da una corrente di …… A",c:["0,2","0.2"],n:0.2,e:"I = V/R."},
{id:"FF089",s:"fis",u:6,q:"Due resistori da 12 Ω in parallelo hanno resistenza equivalente di …… Ω",c:["6","sei"],n:6,e:"R/2."},
{id:"FF090",s:"fis",u:6,q:"La potenza dissipata da un resistore di 4 Ω con ai capi 8 V è …… W",c:["16","sedici"],n:16,e:"P = V²/R = 64/4."},
{id:"FF091",s:"fis",u:6,q:"Il riscaldamento di un conduttore attraversato da corrente si chiama effetto ……",c:["joule"],e:"P = R·I²."},
{id:"FF092",s:"fis",u:6,q:"Un condensatore da 5 μF caricato a 10 V porta una carica di …… μC",c:["50","cinquanta"],n:50,e:"Q = C·V."},
{id:"FF093",s:"fis",u:6,q:"Un isolante inserito tra le armature di un condensatore si chiama ……",c:["dielettrico"],e:"Aumenta la capacità di un fattore εr."},
{id:"FF094",s:"fis",u:6,q:"La forza che agisce su una carica in moto in un campo magnetico si chiama forza di ……",c:["lorentz"],e:"F = q·v·B·sen θ."},
{id:"FF095",s:"fis",u:6,q:"L'esperimento che dimostrò che una corrente elettrica genera un campo magnetico, facendo deviare un ago magnetico, è l'esperimento di ……",c:["oersted","ørsted","oerstedt"],e:"Risale al 1820."},
{id:"FF096",s:"fis",u:6,q:"Una bobina formata da molte spire avvolte a elica si chiama ……",c:["solenoide"],e:"Al suo interno il campo è uniforme."},
{id:"FF097",s:"fis",u:6,q:"Il segno meno nella legge di Faraday-Neumann indica che la corrente indotta si oppone alla variazione che l'ha generata: è la legge di ……",c:["lenz"],e:"È una conseguenza della conservazione dell'energia."},
{id:"FF098",s:"fis",u:6,q:"Una carica di 3 C che attraversa una ddp di 4 V acquista un'energia di …… J",c:["12","dodici"],n:12,e:"E = q·ΔV."},
{id:"FF099",s:"fis",u:7,q:"La velocità della luce nel vuoto è circa 3·10^…… m/s",c:["8","otto"],n:8,e:"c ≈ 299 792 km/s."},
{id:"FF100",s:"fis",u:7,q:"La costante di Planck vale circa 6,63·10^…… J·s",c:["-34","−34"],n:-34,e:"E = h·f."},
{id:"FF101",s:"fis",u:7,q:"Le radiazioni elettromagnetiche con lunghezza d'onda appena superiore al rosso visibile si chiamano ……",c:["infrarosso","infrarossi","raggi infrarossi","ir"],e:"Sono legate all'emissione termica."},
{id:"FF102",s:"fis",u:7,q:"Le radiazioni elettromagnetiche con lunghezza d'onda appena inferiore al violetto si chiamano ……",c:["ultravioletti","ultravioletto","uv","raggi ultravioletti"],e:"Gli UV-B causano eritemi e danni al DNA."},
{id:"FF103",s:"fis",u:7,q:"Il rapporto tra la velocità della luce nel vuoto e nel mezzo si chiama indice di ……",c:["rifrazione"],e:"n = c/v ≥ 1."},
{id:"FF104",s:"fis",u:7,q:"La legge n₁·sen θ₁ = n₂·sen θ₂ è la legge di ……",c:["snell","snell-cartesio","cartesio","snell cartesio"],e:"Descrive la rifrazione."},
{id:"FF105",s:"fis",u:7,q:"Nella riflessione, l'angolo di riflessione è …… all'angolo di incidenza",c:["uguale","pari"],e:"Entrambi misurati rispetto alla normale."},
{id:"FF106",s:"fis",u:7,q:"Una lente convergente con focale 50 cm ha un potere di …… diottrie",c:["2","+2","due"],n:2,e:"D = 1/0,5 m."},
{id:"FF107",s:"fis",u:7,q:"Una lente che fa divergere i raggi paralleli all'asse ottico ha potere diottrico ……",c:["negativo"],e:"Si usa per correggere la miopia."},
{id:"FF108",s:"fis",u:7,q:"Il difetto visivo in cui l'immagine di un oggetto lontano si forma dietro la retina si chiama ……",c:["ipermetropia"],e:"Si corregge con lenti convergenti."},
{id:"FF109",s:"fis",u:7,q:"L'emissione di elettroni da un metallo colpito da luce di frequenza sufficiente si chiama effetto ……",c:["fotoelettrico"],e:"Spiegato da Einstein con i fotoni (Nobel 1921)."},
{id:"FF110",s:"fis",u:7,q:"Il nucleo emesso nel decadimento α è un nucleo di ……",c:["elio","he","elio-4"],e:"⁴He: 2 protoni e 2 neutroni."},
{id:"FF111",s:"fis",u:7,q:"Nel decadimento β⁻ il numero atomico del nucleo aumenta di ……",c:["1","uno"],n:1,e:"Un neutrone si trasforma in un protone."},
{id:"FF112",s:"fis",u:7,q:"Un'attività di una disintegrazione al secondo corrisponde a 1 ……",c:["becquerel","bq"],e:"Unità SI dell'attività."},
{id:"FF113",s:"fis",u:7,q:"Dopo 4 tempi di dimezzamento resta una frazione 1/…… dei nuclei iniziali",c:["16","sedici"],n:16,e:"(1/2)⁴."}
);

// FISICA — risposta multipla (parte 1: metodi, meccanica, fluidi)
BANK.push(
{id:"F001",s:"fis",u:1,q:"Quale delle seguenti è una grandezza fondamentale del Sistema Internazionale?",o:["L'intensità di corrente elettrica","La forza","L'energia","La carica elettrica","La differenza di potenziale elettrico"],e:"Le 7 grandezze fondamentali SI: lunghezza, massa, tempo, intensità di corrente, temperatura, quantità di sostanza, intensità luminosa. La carica (coulomb = A·s) è derivata."},
{id:"F002",s:"fis",u:1,q:"Le dimensioni fisiche della pressione sono:",o:["[M L⁻¹ T⁻²]","[M L T⁻²]","[M L² T⁻²]","[M L⁻² T⁻²]","[M L⁻³]"],e:"P = F/A = (kg·m/s²)/m² = kg·m⁻¹·s⁻²."},
{id:"F003",s:"fis",u:1,q:"Un'area di 1 cm² equivale a:",o:["10⁻⁴ m²","10⁻² m²","10⁻⁶ m²","10⁻³ m²","10² m²"],e:"1 cm = 10⁻² m, quindi 1 cm² = (10⁻² m)² = 10⁻⁴ m²."},
{id:"F004",s:"fis",u:1,q:"Una velocità di 72 km/h corrisponde a:",o:["20 m/s","72 m/s","7,2 m/s","259 m/s","2 m/s"],e:"Si divide per 3,6: 72 / 3,6 = 20 m/s."},
{id:"F005",s:"fis",u:1,q:"Il prodotto scalare di due vettori perpendicolari è:",o:["nullo","massimo","uguale al prodotto dei moduli","un vettore perpendicolare a entrambi","negativo"],e:"a·b = |a||b|cos θ e cos 90° = 0. Il prodotto vettoriale invece è massimo per vettori perpendicolari."},
{id:"F006",s:"fis",u:1,q:"Due vettori di modulo 3 e 4 sono perpendicolari. Il modulo della loro somma è:",o:["5","7","1","12","25"],e:"Per il teorema di Pitagora: √(3² + 4²) = √25 = 5."},
{id:"F007",s:"fis",u:1,q:"Il modulo della somma di due vettori di modulo 6 e 8 può assumere valori compresi tra:",o:["2 e 14","0 e 14","6 e 8","8 e 14","2 e 10"],e:"Il minimo si ha con vettori antiparalleli (8 − 6 = 2), il massimo con vettori paralleli e concordi (6 + 8 = 14)."},
{id:"F008",s:"fis",u:1,q:"Quale tra le seguenti è una grandezza vettoriale?",o:["La quantità di moto","L'energia cinetica","Il lavoro","La temperatura assoluta","La potenza meccanica"],e:"p = m·v ha modulo, direzione e verso. Lavoro ed energia sono scalari."},
{id:"F009",s:"fis",u:1,q:"Il numero 0,000 045 in notazione scientifica si scrive:",o:["4,5·10⁻⁵","4,5·10⁻⁴","4,5·10⁵","45·10⁻⁴","4,5·10⁻⁶"],e:"Si sposta la virgola di 5 posizioni a destra: 4,5·10⁻⁵."},
{id:"F010",s:"fis",u:1,q:"Una grandezza intensiva:",o:["non dipende dalla quantità di materia del sistema","è proporzionale alla massa del sistema","si somma quando si uniscono due sistemi uguali","dipende dal volume ma non dalla massa del sistema","è sempre una grandezza vettoriale adimensionale"],e:"Esempi di grandezze intensive: temperatura, pressione, densità. Massa, volume ed energia sono estensive."},

{id:"F011",s:"fis",u:2,q:"Nel moto rettilineo uniforme:",o:["la velocità è costante e l'accelerazione è nulla","l'accelerazione è costante e diversa da zero","la velocità aumenta linearmente nel tempo","lo spazio percorso è proporzionale al quadrato del tempo","la forza risultante è costante e non nulla"],e:"s = s₀ + v·t. Per il primo principio la forza risultante è nulla."},
{id:"F012",s:"fis",u:2,q:"Un'auto parte da ferma con accelerazione costante di 2 m/s². Quanta strada percorre in 5 s?",o:["25 m","10 m","50 m","12,5 m","100 m"],e:"s = ½·a·t² = ½ × 2 × 25 = 25 m."},
{id:"F013",s:"fis",u:2,q:"Un'auto che viaggia a 20 m/s frena con decelerazione costante di 5 m/s². Lo spazio di frenata è:",o:["40 m","20 m","80 m","4 m","100 m"],e:"v² = v₀² − 2·a·s → s = v₀²/(2a) = 400/10 = 40 m."},
{id:"F014",s:"fis",u:2,q:"Un sasso viene lasciato cadere da fermo. Trascurando l'attrito dell'aria e ponendo g = 10 m/s², dopo 3 s la sua velocità è:",o:["30 m/s","45 m/s","10 m/s","90 m/s","15 m/s"],e:"v = g·t = 10 × 3 = 30 m/s (nel frattempo è caduto di ½·g·t² = 45 m)."},
{id:"F015",s:"fis",u:2,q:"Un corpo viene lanciato verticalmente verso l'alto con velocità iniziale di 20 m/s (g = 10 m/s²). L'altezza massima raggiunta è:",o:["20 m","40 m","10 m","200 m","2 m"],e:"h = v₀²/(2g) = 400/20 = 20 m."},
{id:"F016",s:"fis",u:2,q:"Nel punto più alto della traiettoria di un proiettile lanciato obliquamente (senza attrito):",o:["la velocità è orizzontale e l'accelerazione è g verso il basso","la velocità è nulla e l'accelerazione è g verso il basso","la velocità è orizzontale e l'accelerazione è nulla","la velocità e l'accelerazione sono entrambe nulle","la velocità è verticale e l'accelerazione è g verso il basso"],e:"La componente orizzontale della velocità resta costante; quella verticale si annulla nel punto più alto. L'accelerazione è sempre g."},
{id:"F017",s:"fis",u:2,q:"Nel moto circolare uniforme:",o:["il modulo della velocità è costante, ma c'è un'accelerazione centripeta","il vettore velocità è costante e l'accelerazione è nulla","il modulo della velocità è costante e l'accelerazione è tangenziale","il modulo della velocità varia e l'accelerazione è centrifuga","la forza risultante sul corpo è nulla"],e:"La direzione della velocità cambia continuamente: a = v²/r, diretta verso il centro."},
{id:"F018",s:"fis",u:2,q:"Un corpo percorre una circonferenza di raggio 2 m alla velocità costante di 4 m/s. La sua accelerazione centripeta è:",o:["8 m/s²","2 m/s²","16 m/s²","32 m/s²","0,5 m/s²"],e:"a = v²/r = 16/2 = 8 m/s²."},
{id:"F019",s:"fis",u:2,q:"Il periodo di un moto armonico è 0,5 s. La sua frequenza è:",o:["2 Hz","0,5 Hz","4π Hz","π Hz","5 Hz"],e:"f = 1/T = 1/0,5 = 2 Hz; la pulsazione è ω = 2πf = 4π rad/s."},
{id:"F020",s:"fis",u:2,q:"Il primo principio della dinamica afferma che:",o:["un corpo con forza risultante nulla resta in quiete o in moto rettilineo uniforme","un corpo con forza risultante nulla rallenta fino a fermarsi","la forza risultante su un corpo è uguale al prodotto della massa per l'accelerazione","a ogni azione corrisponde una reazione uguale e contraria applicata all'altro corpo","un corpo con forza risultante costante si muove di moto rettilineo uniforme"],e:"È il principio d'inerzia, valido nei sistemi di riferimento inerziali."},
{id:"F021",s:"fis",u:2,q:"Una forza risultante di 12 N agisce su un corpo di 3 kg. L'accelerazione del corpo è:",o:["4 m/s²","36 m/s²","0,25 m/s²","9 m/s²","15 m/s²"],e:"a = F/m = 12/3 = 4 m/s²."},
{id:"F022",s:"fis",u:2,q:"Un libro è appoggiato su un tavolo. La reazione (terzo principio) della forza peso del libro è:",o:["la forza con cui il libro attira la Terra","la forza normale del tavolo sul libro","la forza con cui il libro preme sul tavolo","l'attrito statico","la forza centripeta"],e:"La coppia azione-reazione agisce su corpi diversi: la Terra attira il libro, il libro attira la Terra. La normale del tavolo e il peso agiscono entrambi sul libro e sono in equilibrio, ma non sono una coppia azione-reazione."},
{id:"F023",s:"fis",u:2,q:"Una molla con costante elastica k = 200 N/m viene allungata di 5 cm. La forza elastica ha modulo:",o:["10 N","1000 N","40 N","4 N","0,1 N"],e:"F = k·x = 200 × 0,05 = 10 N (legge di Hooke)."},
{id:"F024",s:"fis",u:2,q:"Il coefficiente di attrito dinamico tra una cassa di 20 kg e il pavimento è 0,3. Con g = 10 m/s², la forza d'attrito durante lo scivolamento su un piano orizzontale vale:",o:["60 N","6 N","200 N","600 N","66,7 N"],e:"F = μ·N = μ·m·g = 0,3 × 20 × 10 = 60 N."},
{id:"F025",s:"fis",u:2,q:"Il peso di una persona di 70 kg sulla Luna, dove g ≈ 1,6 m/s², è circa:",o:["112 N","70 N","686 N","11,2 N","43,75 N"],e:"P = m·g = 70 × 1,6 = 112 N. La massa resta 70 kg."},
{id:"F026",s:"fis",u:2,q:"Se la distanza tra due masse triplica, la forza gravitazionale tra esse:",o:["diventa 1/9","diventa 1/3","triplica","diventa 9 volte maggiore","resta invariata"],e:"F = G·m₁·m₂/r²: con 3r la forza si riduce di 3² = 9 volte."},
{id:"F027",s:"fis",u:2,q:"Una forza di 50 N sposta un corpo di 4 m formando un angolo di 60° con lo spostamento. Il lavoro compiuto è:",o:["100 J","200 J","173 J","50 J","12,5 J"],e:"L = F·s·cos θ = 50 × 4 × 0,5 = 100 J."},
{id:"F028",s:"fis",u:2,q:"Il lavoro compiuto dalla forza centripeta in un moto circolare uniforme è:",o:["nullo","positivo","negativo","uguale all'energia cinetica","uguale a m·v²"],e:"La forza centripeta è sempre perpendicolare allo spostamento, quindi non compie lavoro e l'energia cinetica resta costante."},
{id:"F029",s:"fis",u:2,q:"Se la velocità di un corpo raddoppia, la sua energia cinetica:",o:["quadruplica","raddoppia","si dimezza","resta invariata","aumenta di 8 volte"],e:"Ec = ½·m·v²: dipende dal quadrato della velocità."},
{id:"F030",s:"fis",u:2,q:"Un corpo di 2 kg cade da un'altezza di 5 m (g = 10 m/s², attriti trascurabili). La sua velocità al suolo è:",o:["10 m/s","100 m/s","5 m/s","50 m/s","√10 m/s"],e:"m·g·h = ½·m·v² → v = √(2gh) = √100 = 10 m/s, indipendente dalla massa."},
{id:"F031",s:"fis",u:2,q:"Un motore solleva un carico di 100 kg di 10 m in 20 s a velocità costante (g = 10 m/s²). La potenza sviluppata è:",o:["500 W","10 000 W","200 W","5000 W","50 W"],e:"L = m·g·h = 100 × 10 × 10 = 10 000 J; P = L/t = 10 000/20 = 500 W."},
{id:"F032",s:"fis",u:2,q:"Il kilowattora (kWh) è un'unità di misura di:",o:["energia","potenza","forza","carica elettrica","intensità di corrente"],e:"1 kWh = 1000 W × 3600 s = 3,6·10⁶ J."},
{id:"F033",s:"fis",u:2,q:"Una forza è conservativa se:",o:["il lavoro che compie tra due punti non dipende dal percorso","il lavoro che compie tra due punti dipende dal percorso seguito","il lavoro che compie su un percorso chiuso è sempre positivo","è sempre perpendicolare allo spostamento del corpo","il suo modulo resta costante lungo il percorso"],e:"Esempi di forze conservative: forza peso, forza elastica, forza elettrostatica. L'attrito non è conservativo."},
{id:"F034",s:"fis",u:2,q:"L'energia potenziale elastica di una molla con k = 400 N/m compressa di 10 cm è:",o:["2 J","4 J","40 J","20 J","0,2 J"],e:"U = ½·k·x² = ½ × 400 × 0,01 = 2 J."},
{id:"F035",s:"fis",u:2,q:"Il teorema dell'impulso afferma che:",o:["l'impulso di una forza è uguale alla variazione della quantità di moto","l'impulso di una forza è uguale alla variazione dell'energia cinetica","il lavoro di una forza è uguale alla variazione della quantità di moto","la quantità di moto di un corpo si conserva anche con forze esterne","l'impulso di una forza è uguale al prodotto della forza per lo spostamento"],e:"I = F·Δt = Δp. Allungare il tempo di arresto (airbag) riduce la forza media."},
{id:"F036",s:"fis",u:2,q:"Un proiettile di 10 g sparato a 400 m/s si conficca in un blocco di legno di 1,99 kg inizialmente fermo su un piano senza attrito. La velocità del sistema dopo l'urto è:",o:["2 m/s","4 m/s","0,2 m/s","20 m/s","400 m/s"],e:"Urto completamente anelastico: si conserva la quantità di moto. 0,01 × 400 = 2,00 × v → v = 2 m/s."},
{id:"F037",s:"fis",u:2,q:"In un urto elastico si conservano:",o:["sia la quantità di moto totale sia l'energia cinetica totale","solo la quantità di moto totale, non l'energia cinetica","solo l'energia cinetica totale, non la quantità di moto","la quantità di moto e la velocità di ciascun corpo","l'energia cinetica di ciascun corpo separatamente"],e:"Negli urti anelastici si conserva solo la quantità di moto totale (in un sistema isolato)."},
{id:"F038",s:"fis",u:2,q:"Il momento di una forza di 20 N applicata perpendicolarmente a una chiave lunga 0,25 m è:",o:["5 N·m","80 N·m","20 N·m","0,0125 N·m","50 N·m"],e:"M = F·b = 20 × 0,25 = 5 N·m."},
{id:"F039",s:"fis",u:2,q:"Una leva è vantaggiosa quando:",o:["il braccio della forza motrice supera quello della resistente","il braccio della forza resistente supera quello della motrice","il fulcro si trova sempre tra le due forze","i due bracci sono uguali e il fulcro è al centro","la forza motrice è applicata più vicino al fulcro"],e:"All'equilibrio Fm·bm = Fr·br; con bm > br si ha Fm < Fr. L'avambraccio (flessione del gomito) è una leva di terzo genere, svantaggiosa."},
{id:"F040",s:"fis",u:2,q:"Una pattinatrice che gira su sé stessa avvicina le braccia al corpo. La sua velocità angolare:",o:["aumenta, perché si conserva il momento angolare e diminuisce il momento d'inerzia","diminuisce, perché si conserva il momento angolare e diminuisce il momento d'inerzia","aumenta, perché si conserva l'energia cinetica e aumenta il momento d'inerzia","resta invariata, perché il momento angolare si conserva","aumenta, perché il momento angolare aumenta"],e:"L = I·ω si conserva in assenza di momenti esterni: se I diminuisce, ω aumenta."},
{id:"F041",s:"fis",u:2,q:"Il modulo di Young di un materiale si misura in:",o:["N/m² (pascal)","N/m","N","adimensionale","J/kg"],e:"Y = sforzo/deformazione = (F/A)/(ΔL/L); la deformazione è adimensionale, quindi Y ha le dimensioni di una pressione."},
{id:"F042",s:"fis",u:2,q:"Il centro di massa di un sistema isolato, su cui non agiscono forze esterne:",o:["si muove di moto rettilineo uniforme o resta fermo","si muove di moto uniformemente accelerato","descrive un moto circolare uniforme attorno al corpo più pesante","coincide sempre con il centro geometrico del sistema","si sposta verso il corpo più leggero del sistema"],e:"La quantità di moto totale si conserva, quindi la velocità del centro di massa è costante."},

{id:"F043",s:"fis",u:3,q:"Secondo la legge di Stevino, la pressione in un liquido in quiete:",o:["aumenta linearmente con la profondità","aumenta con il quadrato della profondità","è uguale a tutte le profondità","dipende dalla forma del recipiente","diminuisce linearmente con la profondità"],e:"P = P₀ + ρ·g·h, indipendentemente dalla forma del recipiente (paradosso idrostatico)."},
{id:"F044",s:"fis",u:3,q:"La pressione idrostatica dovuta all'acqua (ρ = 1000 kg/m³, g = 10 m/s²) a 20 m di profondità è:",o:["2·10⁵ Pa","2·10⁴ Pa","2·10⁶ Pa","20 Pa","1·10⁵ Pa"],e:"ρ·g·h = 1000 × 10 × 20 = 2·10⁵ Pa (circa 2 atm); la pressione assoluta è circa 3 atm."},
{id:"F045",s:"fis",u:3,q:"Il principio di Pascal è alla base del funzionamento di:",o:["torchio idraulico","termometro a mercurio","barometro aneroide","fibra ottica","stetoscopio"],e:"Una pressione applicata a un fluido incomprimibile si trasmette inalterata in ogni punto: F₁/A₁ = F₂/A₂."},
{id:"F046",s:"fis",u:3,q:"In un torchio idraulico il pistone grande ha un'area 50 volte quella del piccolo. Per sollevare un'auto di 10 000 N serve sul pistone piccolo una forza di:",o:["200 N","500 000 N","50 N","2000 N","20 N"],e:"F₁ = F₂·A₁/A₂ = 10 000/50 = 200 N."},
{id:"F047",s:"fis",u:3,q:"Un corpo completamente immerso in acqua riceve una spinta di Archimede pari:",o:["al peso dell'acqua spostata","al peso del corpo","alla massa del corpo","alla densità del corpo per g","alla pressione sul fondo"],e:"S = ρ_fluido·V_immerso·g."},
{id:"F048",s:"fis",u:3,q:"Un cubo di ghiaccio (ρ ≈ 920 kg/m³) galleggia in acqua (ρ = 1000 kg/m³). La frazione di volume immersa è circa:",o:["92%","8%","50%","100%","108%"],e:"All'equilibrio V_imm/V = ρ_corpo/ρ_fluido = 0,92."},
{id:"F049",s:"fis",u:3,q:"Un oggetto di volume 2 dm³ è completamente immerso in acqua (ρ = 1000 kg/m³, g = 10 m/s²). La spinta di Archimede vale:",o:["20 N","2 N","200 N","2000 N","0,2 N"],e:"V = 2·10⁻³ m³; S = 1000 × 2·10⁻³ × 10 = 20 N."},
{id:"F050",s:"fis",u:3,q:"Nell'esperimento di Torricelli, al livello del mare, la colonna di mercurio è alta circa:",o:["760 mm","76 mm","10,3 m","1013 mm","7,6 m"],e:"1 atm = 760 mmHg ≈ 1,013·10⁵ Pa. Con l'acqua la colonna sarebbe alta circa 10,3 m."},
{id:"F051",s:"fis",u:3,q:"La portata di un fluido in un condotto è definita come:",o:["il volume di fluido che attraversa una sezione nell'unità di tempo","la massa di fluido contenuta nel condotto in un dato istante","la velocità del fluido moltiplicata per la lunghezza del condotto","la pressione del fluido moltiplicata per l'area della sezione","il volume di fluido contenuto nel condotto per unità di lunghezza"],e:"Q = A·v, si misura in m³/s."},
{id:"F052",s:"fis",u:3,q:"In un tubo, la sezione si riduce a un terzo. Per l'equazione di continuità (fluido ideale incomprimibile), la velocità del fluido:",o:["triplica","si riduce a un terzo","resta invariata","aumenta di 9 volte","si riduce a un nono"],e:"A₁·v₁ = A₂·v₂: se A₂ = A₁/3 allora v₂ = 3·v₁."},
{id:"F053",s:"fis",u:3,q:"Secondo il teorema di Bernoulli, in un condotto orizzontale nel punto in cui la sezione si restringe:",o:["la velocità aumenta e la pressione diminuisce","la velocità aumenta e la pressione aumenta","la velocità diminuisce e la pressione aumenta","velocità e pressione restano costanti","la pressione si annulla"],e:"P + ½·ρ·v² = costante (a quota costante). Nella stenosi la pressione laterale cala e il vaso può collassare."},
{id:"F054",s:"fis",u:3,q:"In un aneurisma (dilatazione di un'arteria), rispetto al tratto sano:",o:["la velocità diminuisce e la pressione aumenta","la velocità aumenta e la pressione diminuisce","la velocità e la pressione diminuiscono entrambe","la velocità e la pressione aumentano entrambe","la velocità diminuisce e la portata raddoppia"],e:"Sezione maggiore → velocità minore (continuità) → pressione maggiore (Bernoulli): si innesca un circolo vizioso."},
{id:"F055",s:"fis",u:3,q:"Secondo il teorema di Torricelli, la velocità di efflusso da un foro posto a una profondità h sotto il pelo libero è:",o:["√(2gh)","2gh","√(gh/2)","√(gh)","2√(gh)"],e:"È la stessa velocità di un corpo in caduta libera da un'altezza h."},
{id:"F056",s:"fis",u:3,q:"Secondo la legge di Poiseuille, se il raggio di un vaso si dimezza (a parità di differenza di pressione e lunghezza), la portata:",o:["si riduce di 16 volte","si dimezza","si riduce di 4 volte","si riduce di 8 volte","si riduce di 32 volte"],e:"Q = π·r⁴·ΔP/(8·η·L): dipende dalla quarta potenza del raggio, (1/2)⁴ = 1/16."},
{id:"F057",s:"fis",u:3,q:"La resistenza idraulica di un condotto è inversamente proporzionale:",o:["alla quarta potenza del raggio","al quadrato del raggio","alla lunghezza del condotto","alla viscosità del fluido","al quadrato della lunghezza"],e:"R = 8·η·L/(π·r⁴): aumenta con viscosità e lunghezza e diminuisce molto rapidamente all'aumentare del raggio."},
{id:"F058",s:"fis",u:3,q:"Due resistenze idrauliche uguali R collegate in parallelo hanno una resistenza equivalente pari a:",o:["R/2","2R","R","R/4","4R"],e:"Come per le resistenze elettriche: 1/Req = 1/R + 1/R = 2/R."},
{id:"F059",s:"fis",u:3,q:"Il moto di un fluido diventa turbolento quando:",o:["il numero di Reynolds supera un valore critico","il numero di Reynolds scende sotto un valore critico","la viscosità del fluido aumenta molto","la velocità del fluido diminuisce molto","la densità del fluido diminuisce molto"],e:"Re = ρ·v·d/η; per i tubi il regime laminare si ha di solito per Re < circa 2000. Il moto turbolento è rumoroso (soffi cardiaci, suoni di Korotkoff)."},
{id:"F060",s:"fis",u:3,q:"Nel moto laminare di un fluido viscoso in un tubo, il profilo delle velocità è:",o:["parabolico, con velocità massima al centro e nulla alle pareti","parabolico, con velocità massima alle pareti e nulla al centro","uniforme in tutta la sezione, come per un fluido ideale","lineare, con velocità massima al centro e nulla alle pareti","parabolico, con velocità uguale al centro e alle pareti"],e:"Gli strati di fluido scorrono l'uno sull'altro; quello a contatto con la parete è fermo."},
{id:"F061",s:"fis",u:3,q:"Secondo la legge di Laplace per una bolla sferica, a parità di tensione superficiale, la pressione di curvatura è:",o:["inversamente proporzionale al raggio","direttamente proporzionale al raggio","indipendente dal raggio","proporzionale al quadrato del raggio","proporzionale al volume"],e:"ΔP = 2τ/r per una superficie singola (4τ/r per una bolla di sapone con due superfici). Gli alveoli piccoli tenderebbero a collassare: il surfattante abbassa τ."},
{id:"F062",s:"fis",u:3,q:"Il fenomeno per cui l'acqua risale in un tubicino di vetro sottile si chiama:",o:["capillarità","osmosi","diffusione","viscosità","effetto Venturi"],e:"Dipende dalla tensione superficiale e dall'adesione al vetro; l'altezza di risalita (legge di Jurin) è inversamente proporzionale al raggio del tubo."},
{id:"F063",s:"fis",u:3,q:"La tensione superficiale si misura in:",o:["N/m","N/m²","N·m","Pa·s","adimensionale"],e:"È una forza per unità di lunghezza, oppure un'energia per unità di superficie (J/m² = N/m)."},
{id:"F064",s:"fis",u:3,q:"La viscosità di un fluido nel SI si misura in:",o:["Pa·s","N/m","Pa/s","m²/s","kg/m³"],e:"Un'unità storica è il poise: 1 P = 0,1 Pa·s."}
);

// FISICA — risposta multipla (parte 2: onde, termodinamica, elettromagnetismo, radiazioni e ottica) + completamento
BANK.push(
{id:"F065",s:"fis",u:4,q:"Un'onda ha frequenza 500 Hz e si propaga a 340 m/s. La sua lunghezza d'onda è:",o:["0,68 m","1,47 m","170 000 m","0,34 m","6,8 m"],e:"λ = v/f = 340/500 = 0,68 m."},
{id:"F066",s:"fis",u:4,q:"Le onde sonore nell'aria sono onde:",o:["longitudinali","trasversali","elettromagnetiche","stazionarie per definizione","che non trasportano energia"],e:"Le particelle del mezzo oscillano nella stessa direzione di propagazione (compressioni e rarefazioni)."},
{id:"F067",s:"fis",u:4,q:"Quando un'onda sonora passa dall'aria all'acqua, rimane invariata:",o:["la frequenza","la velocità","la lunghezza d'onda","l'intensità","l'ampiezza"],e:"La frequenza è fissata dalla sorgente; nell'acqua la velocità (circa 1500 m/s) e quindi la lunghezza d'onda aumentano."},
{id:"F068",s:"fis",u:4,q:"L'intervallo di frequenze udibili dall'orecchio umano è circa:",o:["20 Hz – 20 kHz","2 Hz – 2 kHz","200 Hz – 200 kHz","20 kHz – 2 MHz","1 Hz – 1000 Hz"],e:"Sotto i 20 Hz si parla di infrasuoni, sopra i 20 kHz di ultrasuoni (usati in ecografia, nell'ordine dei MHz)."},
{id:"F069",s:"fis",u:4,q:"Se l'intensità di un suono aumenta di un fattore 100, il livello sonoro aumenta di:",o:["20 dB","100 dB","2 dB","10 dB","40 dB"],e:"β = 10·log(I/I₀): un fattore 100 corrisponde a 10 × log 100 = 20 dB."},
{id:"F070",s:"fis",u:4,q:"Un suono di 80 dB ha un'intensità, rispetto a uno di 50 dB:",o:["1000 volte maggiore","30 volte maggiore","1,6 volte maggiore","3 volte maggiore","100 volte maggiore"],e:"Δβ = 30 dB → rapporto di intensità 10³ = 1000."},
{id:"F071",s:"fis",u:4,q:"L'intensità di un'onda sonora che si propaga da una sorgente puntiforme in tutte le direzioni, a distanza doppia:",o:["si riduce a un quarto","si dimezza","resta costante","raddoppia","si riduce a un ottavo"],e:"I = P/(4πr²): l'intensità decresce con il quadrato della distanza."},
{id:"F072",s:"fis",u:4,q:"L'interferenza distruttiva tra due onde uguali si ha quando la loro differenza di fase è:",o:["π (mezza lunghezza d'onda di sfasamento)","2π (una lunghezza d'onda di sfasamento)","π/2 (un quarto di lunghezza d'onda)","0 (onde in fase)","π/4 (un ottavo di lunghezza d'onda)"],e:"Due onde in opposizione di fase si sommano dando ampiezza nulla."},
{id:"F073",s:"fis",u:4,q:"In una corda fissata a entrambi gli estremi lunga L, la lunghezza d'onda dell'armonica fondamentale è:",o:["2L","L","L/2","4L","L/4"],e:"La fondamentale ha nodi solo agli estremi: metà lunghezza d'onda è uguale a L."},
{id:"F074",s:"fis",u:4,q:"L'effetto Doppler consiste in:",o:["una variazione della frequenza percepita per il moto relativo sorgente-osservatore","una variazione della velocità del suono per il moto relativo sorgente-osservatore","una variazione dell'ampiezza percepita per la distanza dalla sorgente","la riflessione del suono su un ostacolo che rimanda un'eco","l'interferenza tra due sorgenti di frequenza leggermente diversa (battimenti)"],e:"Se sorgente e osservatore si avvicinano la frequenza percepita aumenta; se si allontanano diminuisce. È alla base dell'ecodoppler per misurare la velocità del sangue."},
{id:"F075",s:"fis",u:4,q:"Il suono non si propaga:",o:["nel vuoto","nei solidi","nei liquidi","nell'aria","nell'acqua di mare"],e:"Le onde meccaniche richiedono un mezzo materiale; nei solidi il suono è in genere più veloce che nei gas."},
{id:"F076",s:"fis",u:4,q:"L'energia trasportata da un'onda meccanica armonica è proporzionale:",o:["al quadrato dell'ampiezza","all'ampiezza","alla lunghezza d'onda","all'inverso della frequenza","alla velocità di propagazione soltanto"],e:"Intensità e potenza sono proporzionali ad A² e anche a f²."},

{id:"F077",s:"fis",u:5,q:"Una temperatura di 37 °C corrisponde a:",o:["310 K","236 K","37 K","98,6 K","300 K"],e:"T(K) = T(°C) + 273,15 ≈ 310 K. In gradi Fahrenheit 37 °C sono 98,6 °F."},
{id:"F078",s:"fis",u:5,q:"Per scaldare 2 kg di acqua da 20 °C a 70 °C (c = 4186 J/(kg·K)) servono circa:",o:["418,6 kJ","209,3 kJ","4186 J","837,2 kJ","41,86 kJ"],e:"Q = m·c·ΔT = 2 × 4186 × 50 = 418 600 J."},
{id:"F079",s:"fis",u:5,q:"Durante un cambiamento di stato di una sostanza pura a pressione costante, la temperatura:",o:["resta costante finché la trasformazione non è completa","aumenta linearmente con il calore fornito","aumenta, ma più lentamente che prima del cambiamento","diminuisce, perché il calore latente è negativo","resta costante solo se la massa è piccola"],e:"Il calore scambiato (calore latente, Q = m·λ) serve a rompere o formare i legami tra le molecole, non ad aumentare la loro energia cinetica media."},
{id:"F080",s:"fis",u:5,q:"Il calore si trasmette nel vuoto tramite:",o:["irraggiamento","conduzione","convezione","conduzione e convezione","nessun meccanismo"],e:"L'irraggiamento avviene tramite onde elettromagnetiche; conduzione e convezione richiedono un mezzo materiale."},
{id:"F081",s:"fis",u:5,q:"Secondo la legge di Wien, all'aumentare della temperatura di un corpo nero la lunghezza d'onda del massimo di emissione:",o:["diminuisce","aumenta","resta costante","si annulla","dipende solo dal colore del corpo"],e:"λ_max·T = costante (circa 2,9·10⁻³ m·K). Il corpo umano (≈ 310 K) emette soprattutto nell'infrarosso, intorno a 9-10 μm."},
{id:"F082",s:"fis",u:5,q:"La potenza irraggiata da un corpo nero, secondo la legge di Stefan-Boltzmann, è proporzionale:",o:["alla quarta potenza della temperatura assoluta","alla temperatura assoluta","al quadrato della temperatura assoluta","alla quarta potenza della temperatura in °C","al cubo della temperatura assoluta"],e:"P = σ·e·A·T⁴: raddoppiando la temperatura assoluta la potenza aumenta di 16 volte."},
{id:"F083",s:"fis",u:5,q:"Il primo principio della termodinamica si scrive:",o:["ΔU = Q − L (con L lavoro compiuto dal sistema)","ΔU = Q + L (con L lavoro compiuto dal sistema)","ΔU = L − Q (con L lavoro compiuto dal sistema)","ΔU = Q (per qualsiasi trasformazione)","ΔU = Q·L (con L lavoro compiuto sul sistema)"],e:"È la conservazione dell'energia: il calore assorbito va in parte ad aumentare l'energia interna e in parte in lavoro compiuto sull'ambiente."},
{id:"F084",s:"fis",u:5,q:"In una trasformazione isoterma di un gas ideale:",o:["ΔU = 0 e Q = L","L = 0 e ΔU = Q","Q = 0 e ΔU = −L","la pressione resta costante e L = P·ΔV","ΔU = 0 e Q = 0"],e:"L'energia interna di un gas ideale dipende solo da T: se T è costante, ΔU = 0."},
{id:"F085",s:"fis",u:5,q:"In una trasformazione adiabatica:",o:["non c'è scambio di calore con l'ambiente","la temperatura del gas resta costante","il volume del gas resta costante","l'energia interna del gas resta costante","il lavoro compiuto dal gas è nullo"],e:"Q = 0, quindi ΔU = −L: in un'espansione adiabatica il gas si raffredda."},
{id:"F086",s:"fis",u:5,q:"In una trasformazione isocora di un gas:",o:["il lavoro è nullo e Q = ΔU","il calore è nullo e ΔU = −L","ΔU è nulla e Q = L","il lavoro è nullo e ΔU = 0","la pressione è costante e Q = L"],e:"Senza variazione di volume non c'è lavoro (L = P·ΔV = 0), quindi ΔU = Q = n·cv·ΔT."},
{id:"F087",s:"fis",u:5,q:"Un gas si espande alla pressione costante di 2·10⁵ Pa passando da 1 L a 4 L. Il lavoro compiuto dal gas è:",o:["600 J","6·10⁵ J","800 J","200 J","60 J"],e:"L = P·ΔV = 2·10⁵ × 3·10⁻³ = 600 J."},
{id:"F088",s:"fis",u:5,q:"Il rendimento di una macchina di Carnot che opera tra 600 K e 300 K è:",o:["50%","100%","25%","75%","200%"],e:"η = 1 − Tf/Tc = 1 − 300/600 = 0,5."},
{id:"F089",s:"fis",u:5,q:"Il secondo principio della termodinamica, nell'enunciato di Kelvin-Planck, afferma che:",o:["nessuna trasformazione può avere come unico risultato convertire in lavoro tutto il calore di un'unica sorgente","nessuna trasformazione può avere come unico risultato il passaggio di calore da un corpo freddo a uno caldo","l'energia di un sistema isolato si conserva in ogni trasformazione ciclica","l'entropia di un sistema isolato diminuisce nei processi spontanei","esiste una macchina termica che converte in lavoro tutto il calore prelevato"],e:"Ne segue che nessuna macchina termica ciclica può avere rendimento del 100%. L'enunciato sul passaggio di calore dal freddo al caldo è quello di Clausius."},
{id:"F090",s:"fis",u:5,q:"In un sistema isolato, l'entropia:",o:["non diminuisce mai: aumenta se irreversibile, è costante se reversibile","non aumenta mai: diminuisce se irreversibile, è costante se reversibile","aumenta sempre, anche nelle trasformazioni reversibili","resta sempre costante, qualunque sia il processo","diminuisce nei processi spontanei e aumenta in quelli forzati"],e:"L'aumento di entropia indica la direzione naturale dei processi spontanei."},
{id:"F091",s:"fis",u:5,q:"Due recipienti uguali contengono lo stesso numero di moli di elio e di azoto alla stessa temperatura. Si può affermare che:",o:["le pressioni sono uguali","l'azoto ha pressione maggiore perché ha massa molare maggiore","l'elio ha pressione maggiore perché ha massa molare minore","le molecole hanno la stessa velocità media","le masse dei gas sono uguali"],e:"Per un gas ideale P = nRT/V non dipende dalla natura del gas. Le molecole di elio, più leggere, hanno però velocità media maggiore."},
{id:"F092",s:"fis",u:5,q:"Al di sopra della temperatura critica, un gas:",o:["non può essere liquefatto per sola compressione","si liquefa a qualsiasi pressione","si comporta sempre come un gas ideale","può essere liquefatto solo per sola compressione","solidifica senza passare dallo stato liquido"],e:"Sopra la temperatura critica non esiste una distinzione netta tra liquido e vapore."},

{id:"F093",s:"fis",u:6,q:"Se la distanza tra due cariche puntiformi si dimezza, la forza elettrica tra esse:",o:["quadruplica","raddoppia","si dimezza","si riduce a un quarto","resta invariata"],e:"F = k·q₁·q₂/r²: con r/2 la forza diventa 4 volte maggiore."},
{id:"F094",s:"fis",u:6,q:"Il campo elettrico generato da una carica puntiforme positiva è diretto:",o:["radialmente verso l'esterno, allontanandosi dalla carica","radialmente verso l'interno, avvicinandosi alla carica","tangente a circonferenze centrate sulla carica","parallelo a un asse fisso passante per la carica","radialmente verso l'esterno, con modulo costante"],e:"Le linee di campo escono dalle cariche positive ed entrano in quelle negative; il modulo è E = k·q/r²."},
{id:"F095",s:"fis",u:6,q:"All'interno di un conduttore carico in equilibrio elettrostatico, il campo elettrico è:",o:["nullo","massimo","uguale a quello sulla superficie","diretto verso il centro","uniforme e diverso da zero"],e:"Le cariche si dispongono sulla superficie esterna; è il principio della gabbia di Faraday."},
{id:"F096",s:"fis",u:6,q:"Secondo la legge di Gauss, il flusso del campo elettrico attraverso una superficie chiusa è:",o:["proporzionale alla carica totale racchiusa dalla superficie","proporzionale alla carica totale esterna alla superficie","proporzionale all'area della superficie chiusa","sempre nullo, qualunque siano le cariche interne","proporzionale al volume racchiuso dalla superficie"],e:"Φ = Q_int/ε₀."},
{id:"F097",s:"fis",u:6,q:"Una carica di 2 μC si sposta tra due punti con differenza di potenziale di 100 V. Il lavoro compiuto dal campo vale in modulo:",o:["2·10⁻⁴ J","200 J","50 J","2·10⁻⁶ J","2·10⁻² J"],e:"L = q·ΔV = 2·10⁻⁶ × 100 = 2·10⁻⁴ J."},
{id:"F098",s:"fis",u:6,q:"L'elettronvolt (eV) è un'unità di misura di:",o:["energia","potenziale elettrico","carica elettrica","campo elettrico","intensità di corrente"],e:"1 eV è l'energia acquistata da un elettrone accelerato da una ddp di 1 V: 1,6·10⁻¹⁹ J."},
{id:"F099",s:"fis",u:6,q:"Un resistore di 10 Ω è attraversato da una corrente di 2 A. La differenza di potenziale ai suoi capi è:",o:["20 V","5 V","0,2 V","12 V","40 V"],e:"Prima legge di Ohm: V = R·I = 10 × 2 = 20 V."},
{id:"F100",s:"fis",u:6,q:"La potenza dissipata per effetto Joule da un resistore di 10 Ω percorso da 2 A è:",o:["40 W","20 W","5 W","200 W","400 W"],e:"P = R·I² = 10 × 4 = 40 W."},
{id:"F101",s:"fis",u:6,q:"Tre resistori da 6 Ω collegati in parallelo hanno resistenza equivalente:",o:["2 Ω","18 Ω","6 Ω","3 Ω","0,5 Ω"],e:"1/Req = 3/6 → Req = 2 Ω. In serie sarebbe 18 Ω."},
{id:"F102",s:"fis",u:6,q:"Secondo la seconda legge di Ohm, la resistenza di un filo conduttore:",o:["è proporzionale a L e inversamente proporzionale alla sezione","è proporzionale alla sezione e inversamente proporzionale a L","è proporzionale sia a L sia alla sezione","è inversamente proporzionale sia a L sia alla sezione","dipende dalla corrente ma non dal materiale"],e:"R = ρ·L/A, dove ρ è la resistività del materiale."},
{id:"F103",s:"fis",u:6,q:"La capacità di un condensatore piano:",o:["è proporzionale all'area delle armature e inversamente alla distanza","è proporzionale alla distanza tra le armature e inversamente all'area","è proporzionale alla tensione applicata alle armature","diminuisce se si inserisce un dielettrico tra le armature","è proporzionale sia all'area sia alla distanza delle armature"],e:"C = ε₀·εr·A/d. Un dielettrico (εr > 1) aumenta la capacità."},
{id:"F104",s:"fis",u:6,q:"L'energia immagazzinata in un condensatore da 10 μF caricato a 100 V è:",o:["0,05 J","0,1 J","1000 J","5·10⁻⁴ J","50 J"],e:"U = ½·C·V² = ½ × 10⁻⁵ × 10⁴ = 0,05 J. È l'ordine di grandezza in gioco in un defibrillatore (ma con C e V maggiori)."},
{id:"F105",s:"fis",u:6,q:"Due condensatori uguali di capacità C collegati in serie hanno capacità equivalente:",o:["C/2","2C","C","C/4","4C"],e:"Per i condensatori in serie 1/Ceq = 1/C + 1/C. In parallelo le capacità si sommano."},
{id:"F106",s:"fis",u:6,q:"Il prodotto R·C in un circuito di carica di un condensatore rappresenta:",o:["la costante di tempo del circuito","la carica finale sulle armature","la corrente massima nel circuito","l'energia immagazzinata nel condensatore","la potenza dissipata nella resistenza"],e:"Dopo un tempo τ = RC il condensatore ha raggiunto circa il 63% della carica finale; si misura in secondi."},
{id:"F107",s:"fis",u:6,q:"Una carica in moto con velocità parallela a un campo magnetico uniforme:",o:["non subisce alcuna forza magnetica","subisce la forza massima","descrive una circonferenza","viene accelerata nel verso del campo","si ferma"],e:"F = q·v·B·sen θ: con θ = 0 la forza è nulla."},
{id:"F108",s:"fis",u:6,q:"Una carica che entra perpendicolarmente in un campo magnetico uniforme:",o:["descrive un moto circolare uniforme","descrive un moto elicoidale lungo il campo","accelera nella direzione del campo","descrive una parabola come in un campo elettrico","prosegue in linea retta senza deviare"],e:"La forza di Lorentz è sempre perpendicolare alla velocità: agisce come forza centripeta e non cambia il modulo della velocità (r = m·v/(q·B))."},
{id:"F109",s:"fis",u:6,q:"Il campo magnetico generato da un filo rettilineo infinito percorso da corrente:",o:["ha linee circolari concentriche al filo e B ∝ 1/r","ha linee circolari concentriche al filo e B ∝ 1/r²","ha linee radiali uscenti dal filo e B ∝ 1/r","è parallelo al filo e uniforme nello spazio","ha linee circolari concentriche al filo ed è uniforme"],e:"Legge di Biot-Savart: B = μ₀·I/(2π·r). Il verso si trova con la regola della mano destra."},
{id:"F110",s:"fis",u:6,q:"All'interno di un solenoide ideale percorso da corrente il campo magnetico è:",o:["uniforme e parallelo all'asse, con B = μ₀·n·I","nullo","radiale","circolare attorno all'asse","inversamente proporzionale alla distanza dall'asse"],e:"n è il numero di spire per unità di lunghezza. Il campo uniforme dei solenoidi è sfruttato nella risonanza magnetica."},
{id:"F111",s:"fis",u:6,q:"Secondo la legge di Faraday-Neumann-Lenz, la forza elettromotrice indotta in un circuito è:",o:["proporzionale alla rapidità di variazione del flusso, e si oppone alla variazione","proporzionale al flusso magnetico concatenato, e si oppone al flusso stesso","proporzionale alla rapidità di variazione del flusso, e la asseconda","proporzionale all'intensità del campo, indipendentemente dal tempo","nulla quando il flusso varia, massima quando è costante"],e:"f.e.m. = −ΔΦ/Δt. Il segno meno (Lenz) esprime l'opposizione alla variazione che la genera."},
{id:"F112",s:"fis",u:6,q:"Due fili paralleli percorsi da correnti nello stesso verso:",o:["si attraggono","si respingono","non interagiscono","ruotano","si respingono solo se le correnti sono uguali"],e:"Correnti concordi si attraggono, correnti discordi si respingono."},
{id:"F113",s:"fis",u:6,q:"Il potenziale di riposo della membrana cellulare (circa −70 mV) indica che:",o:["l'interno della cellula è a potenziale più basso dell'esterno","l'interno della cellula è a potenziale più alto dell'esterno","l'interno e l'esterno hanno lo stesso potenziale ma cariche diverse","la membrana conduce perfettamente la corrente ionica","la membrana è del tutto impermeabile a tutti gli ioni"],e:"La membrana si comporta come un condensatore: un sottile strato di cariche negative in eccesso sul lato interno e positive su quello esterno."},

{id:"F114",s:"fis",u:7,q:"Ordinate le seguenti radiazioni per frequenza crescente:",o:["onde radio, infrarosso, visibile, ultravioletto, raggi X","raggi X, ultravioletto, visibile, infrarosso, onde radio","visibile, infrarosso, onde radio, raggi X, ultravioletto","infrarosso, onde radio, visibile, raggi X, ultravioletto","ultravioletto, visibile, raggi X, infrarosso, onde radio"],e:"All'aumentare della frequenza diminuisce la lunghezza d'onda e aumenta l'energia dei fotoni."},
{id:"F115",s:"fis",u:7,q:"L'energia di un fotone è:",o:["direttamente proporzionale alla frequenza","inversamente proporzionale alla frequenza","proporzionale alla lunghezza d'onda","indipendente dalla frequenza","proporzionale al quadrato dell'ampiezza"],e:"E = h·f = h·c/λ, con h ≈ 6,63·10⁻³⁴ J·s."},
{id:"F116",s:"fis",u:7,q:"Nell'effetto fotoelettrico, l'emissione di elettroni da un metallo:",o:["avviene solo se la frequenza supera una soglia, qualunque sia l'intensità","avviene a qualsiasi frequenza, purché l'intensità sia abbastanza alta","avviene solo se l'intensità supera una soglia, qualunque sia la frequenza","produce elettroni con energia proporzionale all'intensità della luce","avviene solo se la lunghezza d'onda supera un valore di soglia"],e:"Einstein spiegò l'effetto con i fotoni: Ec,max = h·f − W. L'intensità determina il numero di elettroni emessi, non la loro energia."},
{id:"F117",s:"fis",u:7,q:"Quale tra le seguenti radiazioni è ionizzante?",o:["I raggi X","Le microonde","L'infrarosso","Le onde radio","La luce rossa"],e:"Sono ionizzanti le radiazioni con energia sufficiente a strappare elettroni agli atomi: UV di alta energia, raggi X, raggi γ e le particelle α e β."},
{id:"F118",s:"fis",u:7,q:"La velocità della luce nel vuoto è circa:",o:["3·10⁸ m/s","3·10⁵ m/s","340 m/s","3·10⁶ km/s","1,5·10⁸ m/s"],e:"c ≈ 3·10⁸ m/s = 3·10⁵ km/s."},
{id:"F119",s:"fis",u:7,q:"La velocità della luce in un mezzo con indice di rifrazione n = 1,5 è:",o:["2·10⁸ m/s","4,5·10⁸ m/s","3·10⁸ m/s","1,5·10⁸ m/s","1·10⁸ m/s"],e:"v = c/n = 3·10⁸/1,5 = 2·10⁸ m/s."},
{id:"F120",s:"fis",u:7,q:"Un raggio di luce che passa dall'aria al vetro:",o:["si avvicina alla normale","si allontana dalla normale","non cambia direzione in nessun caso","viene sempre riflesso totalmente","aumenta la sua velocità"],e:"Per la legge di Snell n₁·sen θ₁ = n₂·sen θ₂: entrando in un mezzo più rifrangente l'angolo diminuisce."},
{id:"F121",s:"fis",u:7,q:"La riflessione totale può avvenire quando la luce:",o:["passa a un mezzo con indice minore, con incidenza oltre l'angolo limite","passa a un mezzo con indice maggiore, con incidenza oltre l'angolo limite","passa a un mezzo con indice minore, con incidenza sotto l'angolo limite","incide perpendicolarmente sulla superficie di separazione","ha una frequenza superiore a una frequenza di soglia"],e:"È il principio delle fibre ottiche usate negli endoscopi."},
{id:"F122",s:"fis",u:7,q:"La dispersione della luce bianca in un prisma è dovuta al fatto che:",o:["l'indice di rifrazione dipende dalla lunghezza d'onda","la luce bianca è monocromatica","il prisma emette luce colorata","la velocità della luce nel vetro è uguale per tutti i colori","il prisma assorbe il colore rosso"],e:"Nel vetro il violetto viene deviato più del rosso."},
{id:"F123",s:"fis",u:7,q:"Una lente convergente ha distanza focale 20 cm. Il suo potere diottrico è:",o:["+5 diottrie","+20 diottrie","+0,05 diottrie","−5 diottrie","+2 diottrie"],e:"D = 1/f (in metri) = 1/0,20 = 5 m⁻¹. Le lenti divergenti hanno potere negativo."},
{id:"F124",s:"fis",u:7,q:"Un oggetto posto tra il fuoco e una lente convergente forma un'immagine:",o:["virtuale, diritta e ingrandita","reale, capovolta e rimpicciolita","reale, capovolta e ingrandita","virtuale, capovolta e rimpicciolita","non forma alcuna immagine"],e:"È il funzionamento della lente d'ingrandimento e dell'oculare del microscopio."},
{id:"F125",s:"fis",u:7,q:"La miopia si corregge con lenti:",o:["divergenti","convergenti","cilindriche convergenti","prismatiche","di potere nullo"],e:"Nell'occhio miope l'immagine si forma davanti alla retina: una lente divergente sposta indietro il punto di fuoco."},
{id:"F126",s:"fis",u:7,q:"Nel decadimento α, il numero di massa A e il numero atomico Z del nucleo:",o:["diminuiscono rispettivamente di 4 e di 2","diminuiscono rispettivamente di 2 e di 4","diminuiscono rispettivamente di 4 e di 4","A resta invariato e Z diminuisce di 2","aumentano rispettivamente di 4 e di 2"],e:"Il nucleo emette un nucleo di elio ⁴₂He."},
{id:"F127",s:"fis",u:7,q:"La radiazione γ è costituita da:",o:["fotoni ad alta energia","elettroni ad alta energia","nuclei di elio","neutroni veloci","fotoni a bassa energia (infrarossi)"],e:"I raggi γ nascono da transizioni tra livelli energetici nucleari; sono molto penetranti e servono schermature spesse di piombo o calcestruzzo."},
{id:"F128",s:"fis",u:7,q:"Il potere risolutivo di un microscopio ottico è limitato principalmente da:",o:["la diffrazione, legata alla lunghezza d'onda della luce","il numero e l'ingrandimento delle lenti dell'obiettivo","la lunghezza del tubo ottico","l'intensità della sorgente luminosa","l'aberrazione cromatica, legata all'intensità della luce"],e:"Il limite è circa λ/2, cioè circa 0,2 μm con luce visibile; il microscopio elettronico sfrutta lunghezze d'onda molto più piccole."},

/* ---------- COMPLETAMENTO ---------- */
{id:"FC01",s:"fis",u:1,q:"Un volume di 1 m³ corrisponde a …… litri.",c:["1000","1.000","mille"],n:1000,e:"1 L = 1 dm³ = 10⁻³ m³."},
{id:"FC02",s:"fis",u:1,q:"Una velocità di 108 km/h corrisponde a …… m/s.",c:["30"],n:30,e:"108/3,6 = 30 m/s."},
{id:"FC03",s:"fis",u:1,q:"Il prefisso 'micro' corrisponde a un fattore 10^……",c:["-6","−6"],n:-6,e:"milli = 10⁻³, micro = 10⁻⁶, nano = 10⁻⁹."},
{id:"FC04",s:"fis",u:1,q:"Il prodotto vettoriale di due vettori paralleli è un vettore di modulo ……",c:["0","zero","nullo"],n:0,e:"|a × b| = |a||b|sen θ, e sen 0° = 0."},
{id:"FC05",s:"fis",u:1,q:"Una massa di 2,5 g espressa in kilogrammi vale …… kg",c:["0,0025","0.0025","2,5·10^-3","2.5e-3","2,5e-3","2,5 10^-3"],n:0.0025,e:"2,5 g = 2,5·10⁻³ kg."},
{id:"FC06",s:"fis",u:2,q:"Nel grafico velocità-tempo di un moto, l'area sotto la curva rappresenta lo ……",c:["spostamento","spazio percorso","spazio"],e:"La pendenza del grafico v-t rappresenta invece l'accelerazione."},
{id:"FC07",s:"fis",u:2,q:"Il grafico velocità-tempo di un moto uniformemente accelerato è una ……",c:["retta","linea retta","retta inclinata","semiretta"],e:"v = v₀ + a·t è una funzione lineare del tempo; il grafico spazio-tempo è invece una parabola."},
{id:"FC08",s:"fis",u:2,q:"Un corpo di 5 kg si muove a 4 m/s. La sua energia cinetica vale …… J",c:["40"],n:40,e:"Ec = ½ × 5 × 16 = 40 J."},
{id:"FC09",s:"fis",u:2,q:"Un corpo di 3 kg che si muove a 6 m/s ha una quantità di moto pari a …… kg·m/s",c:["18"],n:18,e:"p = m·v = 3 × 6 = 18 kg·m/s."},
{id:"FC10",s:"fis",u:2,q:"Un corpo di 10 kg posto a 3 m di altezza (g = 10 m/s²) possiede un'energia potenziale gravitazionale di …… J",c:["300"],n:300,e:"U = m·g·h = 10 × 10 × 3 = 300 J."},
{id:"FC12",s:"fis",u:2,q:"Un motore che compie 1200 J di lavoro in 4 s sviluppa una potenza di …… W",c:["300"],n:300,e:"P = L/t = 1200/4."},
{id:"FC13",s:"fis",u:2,q:"La forza che si oppone al moto relativo tra due superfici a contatto si chiama forza di ……",c:["attrito"],e:"L'attrito statico è in genere maggiore di quello dinamico."},
{id:"FC14",s:"fis",u:2,q:"Per una molla ideale la forza elastica è proporzionale all'allungamento: è la legge di ……",c:["hooke"],e:"F = −k·x."},
{id:"FC15",s:"fis",u:2,q:"Un corpo cade liberamente da fermo da un'altezza di 20 m (g = 10 m/s²). Arriva al suolo dopo …… s",c:["2","due"],n:2,e:"t = √(2h/g) = √4 = 2 s."},
{id:"FC16",s:"fis",u:3,q:"Una pressione di 1 atm corrisponde a circa …… mmHg",c:["760"],n:760,e:"1 atm = 760 mmHg = 101 325 Pa."},
{id:"FC17",s:"fis",u:3,q:"Il pascal equivale a un newton su metro ……",c:["quadrato","quadro","al quadrato","2"],e:"1 Pa = 1 N/m²."},
{id:"FC18",s:"fis",u:3,q:"Un corpo con densità minore di quella del liquido in cui è immerso tende a ……",c:["galleggiare","salire","risalire"],e:"La spinta di Archimede supera il peso finché il corpo non è solo parzialmente immerso."},
{id:"FC19",s:"fis",u:3,q:"Se il raggio di un vaso raddoppia, a parità di differenza di pressione, la portata secondo Poiseuille aumenta di …… volte.",c:["16","sedici"],n:16,e:"Q ∝ r⁴: 2⁴ = 16."},
{id:"FC20",s:"fis",u:3,q:"Un tubo di sezione 2 cm² è percorso da acqua a 3 m/s. Nel tratto in cui la sezione è 6 cm² la velocità diventa …… m/s",c:["1","uno"],n:1,e:"A₁·v₁ = A₂·v₂ → v₂ = 2 × 3/6 = 1 m/s."},
{id:"FC21",s:"fis",u:3,q:"La grandezza adimensionale che permette di prevedere se il moto di un fluido è laminare o turbolento è il numero di ……",c:["reynolds"],e:"Re = ρ·v·d/η."},
