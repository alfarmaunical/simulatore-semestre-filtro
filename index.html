<style>/* Layout: banda d'apertura blu notte con il logo alfarma e un reticolo esagonale (anelli benzenici) come texture; sotto, "schede di laboratorio" per materia con icona, contatori e andamento dei punteggi rispetto alla soglia del 18. Durante la prova: barra fissa blu notte con il timer. */
:root{
  --bg:#eaf0f6; --paper:#ffffff; --paper2:#f5f8fb; --ink:#0d2236; --muted:#55687e; --line:#d3dde8; --line2:#e6edf4;
  --navy:#0d2f52; --navy2:#164a78; --steel:#7996b8; --ice:#cfe0f1;
  --accent:#164a78; --accent-ink:#ffffff; --accent-soft:#dde9f6;
  --bio:#0f7a5c; --bio-soft:#dcf1e9; --chem:#c2560f; --chem-soft:#fbe9dc; --fis:#5a44c9; --fis-soft:#e9e5fb;
  --ok:#11804a; --ok-soft:#dff3e8; --bad:#c62f3b; --bad-soft:#fbe4e6; --warn:#9a6a00; --warn-soft:#fbf0d4;
  --shadow:0 1px 2px rgba(13,34,54,.06),0 10px 30px -12px rgba(13,34,54,.22);
  --f-display:"Quicksand",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08121e; --paper:#0f1d2e; --paper2:#13243a; --ink:#e4edf7; --muted:#93a6bd; --line:#22364d; --line2:#1a2c41;
  --navy:#0a2440; --navy2:#123d66; --steel:#8fb0d6; --ice:#1d3753;
  --accent:#7fb2ea; --accent-ink:#06121f; --accent-soft:#16304d;
  --bio:#43d3a3; --bio-soft:#0f2b23; --chem:#f6a15c; --chem-soft:#2e1d10; --fis:#a998ff; --fis-soft:#211c40;
  --ok:#4fd68c; --ok-soft:#0f2a1c; --bad:#ff7d86; --bad-soft:#331a1e; --warn:#e9c15a; --warn-soft:#2e2712;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08121e; --paper:#0f1d2e; --paper2:#13243a; --ink:#e4edf7; --muted:#93a6bd; --line:#22364d; --line2:#1a2c41;
  --navy:#0a2440; --navy2:#123d66; --steel:#8fb0d6; --ice:#1d3753;
  --accent:#7fb2ea; --accent-ink:#06121f; --accent-soft:#16304d;
  --bio:#43d3a3; --bio-soft:#0f2b23; --chem:#f6a15c; --chem-soft:#2e1d10; --fis:#a998ff; --fis-soft:#211c40;
  --ok:#4fd68c; --ok-soft:#0f2a1c; --bad:#ff7d86; --bad-soft:#331a1e; --warn:#e9c15a; --warn-soft:#2e2712;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0}
body{font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:24px 80px}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0;font-weight:700}
h1{font-size:clamp(32px,6vw,52px);letter-spacing:-.02em}
h2{font-size:24px}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;color:inherit}

/* Buttons */
.btn{appearance:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;line-height:1.2;min-height:44px;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .12s ease,background .15s ease,border-color .15s ease}

{id:"BU201",s:"bio",u:2,q:"Il genoma umano aploide contiene circa:",o:["3 miliardi di paia di basi","3 milioni di paia di basi","300 000 paia di basi","30 miliardi di paia di basi","3000 paia di basi"],e:"Circa 3,1·10⁹ bp per corredo aploide; una cellula diploide ne contiene circa il doppio."},
{id:"BU202",s:"bio",u:2,q:"Il numero di geni codificanti proteine nel genoma umano è stimato intorno a:",o:["20 000","2 000","200 000","2 milioni","500"],e:"Sorprendentemente pochi: la complessità deriva anche da splicing alternativo, regolazione e modificazioni post-traduzionali."},
{id:"BU203",s:"bio",u:2,q:"Un cromosoma metafasico è formato da:",o:["due cromatidi fratelli identici uniti al centromero","due cromosomi omologhi uniti al centromero","due cromatidi non fratelli uniti al centromero","quattro cromatidi appaiati in una tetrade","due cromatidi fratelli uniti ai telomeri"],e:"Dopo la fase S ogni cromosoma contiene due molecole di DNA identiche (cromatidi), separate in anafase."},
{id:"BU204",s:"bio",u:2,q:"Per 'organizzazione minimale' di un cromosoma eucariotico funzionante si intende la presenza di:",o:["origini di replicazione, un centromero e due telomeri","un'origine di replicazione, due centromeri e un telomero","un centromero, due telomeri e nessuna origine","origini di replicazione, un nucleolo e un centrosoma","un promotore, un operone e due telomeri"],e:"Questi tre elementi permettono replicazione, segregazione in mitosi e protezione delle estremità; sono la base dei cromosomi artificiali di lievito (YAC)."},
{id:"BU205",s:"bio",u:2,q:"Il DNA centromerico umano è costituito soprattutto da:",o:["DNA satellite α, ripetuto in tandem","DNA satellite α, ripetuto in modo intersperso","sequenze telomeriche TTAGGG ripetute in tandem","geni per gli rRNA organizzati in tandem","microsatelliti CA molto polimorfici"],e:"Il centromero è definito epigeneticamente dalla variante istonica CENP-A, che sostituisce H3 nei nucleosomi centromerici."},
{id:"BU206",s:"bio",u:2,q:"La variante istonica CENP-A si trova:",o:["nei nucleosomi del centromero, dove specifica il cinetocore","nei nucleosomi dei telomeri, dove protegge le estremità","nei nucleosomi dell'eterocromatina, dove sostituisce H1","nei nucleosomi dei promotori attivi, al posto di H2A","nel cinetocore come proteina che lega i microtubuli"],e:"È un esempio di come le varianti istoniche marchino regioni funzionali particolari della cromatina."},
{id:"BU207",s:"bio",u:2,q:"Le code N-terminali degli istoni:",o:["sporgono dal nucleosoma e vengono acetilate, metilate o fosforilate","sono nascoste nel core e non sono accessibili agli enzimi modificanti","sono legate covalentemente al DNA linker","sporgono dal nucleosoma e sono ricche di residui acidi","sporgono dal nucleosoma ma non subiscono modificazioni"],e:"Le combinazioni di queste modificazioni costituiscono il cosiddetto 'codice istonico'."},
{id:"BU208",s:"bio",u:2,q:"Gli enzimi che rimuovono i gruppi acetile dagli istoni (HDAC) di norma:",o:["favoriscono la compattazione della cromatina e il silenziamento genico","favoriscono la decompattazione della cromatina e la trascrizione","metilano le citosine dei dinucleotidi CpG nei promotori","aggiungono gruppi acetile alle lisine delle code istoniche","degradano gli istoni liberando il DNA dai nucleosomi"],e:"Gli inibitori delle HDAC sono usati come farmaci antitumorali per riattivare geni silenziati."},
{id:"BU209",s:"bio",u:2,q:"La metilazione della lisina 9 dell'istone H3 (H3K9me3) è un marcatore tipico di:",o:["eterocromatina silente","promotori attivi","geni in trascrizione","DNA in replicazione","rotture del DNA"],e:"Viene riconosciuta dalla proteina HP1, che promuove la compattazione. La metilazione di H3K4 è invece associata ai promotori attivi."},
{id:"BU210",s:"bio",u:2,q:"Le isole CpG sono:",o:["regioni ricche di CG nei promotori, non metilate nei geni attivi","regioni ricche di CG nei promotori, sempre metilate nei geni attivi","regioni povere di CG tipiche dell'eterocromatina centromerica","regioni ricche di CG alle estremità dei cromosomi (telomeri)","regioni ricche di AT che fungono da origini di replicazione"],e:"La loro ipermetilazione nei tumori può spegnere geni oncosoppressori."},
{id:"BU211",s:"bio",u:2,q:"Durante la replicazione, il pattern di metilazione del DNA viene trasmesso alle cellule figlie grazie a:",o:["la DNMT1 di mantenimento, che riconosce il DNA emimetilato","la DNMT3 de novo, che riconosce il DNA non metilato","la DNMT1 di mantenimento, che riconosce il DNA non metilato","le istone deacetilasi, che copiano le marcature sul nuovo filamento","la DNA polimerasi, che incorpora direttamente citosine metilate"],e:"Dopo la replicazione un filamento è metilato e l'altro no: DNMT1 metila il nuovo filamento sulle CpG corrispondenti."},
{id:"BU212",s:"bio",u:2,q:"L'eterocromatina costitutiva, rispetto a quella facoltativa:",o:["è condensata in tutte le cellule e ricca di sequenze ripetute","può decondensarsi in alcuni tipi cellulari o fasi dello sviluppo","corrisponde al cromosoma X inattivo delle cellule femminili","è condensata in tutte le cellule e ricca di geni attivi","è assente nei mammiferi e tipica dei procarioti"],e:"L'eterocromatina facoltativa (es. X inattivo) è condensata solo in alcune cellule o in alcune fasi."},
{id:"BU213",s:"bio",u:2,q:"Il numero di corpi di Barr in una persona con cariotipo 47,XXY è:",o:["1","0","2","3","dipende dall'età"],e:"Resta attivo un solo X per cellula: corpi di Barr = numero di X − 1."},
{id:"BU214",s:"bio",u:2,q:"Il numero di corpi di Barr in una donna con cariotipo 47,XXX è:",o:["2","1","0","3","4"],e:"Corpi di Barr = numero di X − 1."},
{id:"BU215",s:"bio",u:2,q:"L'inattivazione del cromosoma X è avviata dal lncRNA:",o:["XIST","SRY","HOTAIR","miR-21","U6"],e:"XIST è trascritto dall'X che verrà inattivato e lo riveste in cis, reclutando complessi repressivi."},
{id:"BU216",s:"bio",u:2,q:"Il fenotipo 'a chiazze' del pelo delle gatte calico (tartarugate) è dovuto a:",o:["inattivazione casuale di un X in femmine eterozigoti per il colore","inattivazione dell'X paterno in femmine omozigoti per il colore","codominanza tra due alleli autosomici del colore","mutazioni somatiche multiple nei melanociti","imprinting genomico di un gene autosomico del colore"],e:"Ogni chiazza deriva da un gruppo di cellule con lo stesso X attivo: è un mosaico funzionale."},
{id:"BU217",s:"bio",u:2,q:"Le sequenze ripetute in tandem dei minisatelliti hanno unità ripetitive lunghe circa:",o:["10-100 paia di basi","1-6 paia di basi","1000-5000 paia di basi","un solo nucleotide","300 paia di basi intersperse"],e:"I microsatelliti hanno unità di 1-6 bp; entrambi sono molto polimorfici e usati per l'identificazione genetica."},
{id:"BU218",s:"bio",u:2,q:"Le sequenze LINE-1 si spostano nel genoma tramite:",o:["RNA retrotrascritto da una trascrittasi inversa che esse codificano","taglia-e-incolla del DNA con una trasposasi che esse codificano","RNA retrotrascritto da una trascrittasi inversa fornita dalle SINE","ricombinazione omologa tra copie disperse nel genoma","DNA trasferito da virus esterni che infettano la cellula"],e:"Le SINE (es. Alu) non codificano enzimi e usano quelli delle LINE."},
{id:"BU219",s:"bio",u:2,q:"Le sequenze Alu costituiscono circa:",o:["il 10% del genoma umano, con oltre un milione di copie","il 50% del genoma umano, con circa cento milioni di copie","l'1% del genoma umano, con poche migliaia di copie","il 10% del genoma, ma solo nel DNA mitocondriale","una sola copia per cromosoma, vicino al centromero"],e:"Sono le SINE più abbondanti dei primati; la loro inserzione in un gene può causare malattie."},
{id:"BU220",s:"bio",u:2,q:"Il DNA a sequenza unica (single copy) del genoma umano comprende:",o:["la maggior parte dei geni codificanti proteine","i telomeri e i centromeri","le sequenze Alu e LINE","i geni per gli istoni, ripetuti in cluster","i geni per gli rRNA del nucleolo"],e:"La maggior parte dei geni per proteine è presente in una o poche copie per genoma aploide."},
{id:"BU221",s:"bio",u:2,q:"I geni per gli istoni nell'uomo:",o:["sono ripetuti in cluster, per produrre molti istoni in fase S","sono in copia singola, ma trascritti molto rapidamente in fase S","sono ripetuti in cluster e trascritti dalla RNA polimerasi I","si trovano nel DNA mitocondriale in molte copie","sono ripetuti in cluster e producono mRNA con lunghe code di poli(A)"],e:"Servono grandi quantità di istoni a ogni replicazione; i loro mRNA non hanno coda di poli(A)."},
{id:"BU222",s:"bio",u:2,q:"La famiglia genica delle β-globine umane comprende geni espressi in momenti diversi dello sviluppo, come:",o:["ε (embrionale), γ (fetale) e β (adulto)","ε (fetale), γ (embrionale) e β (adulto)","α (embrionale), γ (fetale) e β (adulto)","ζ (embrionale), α (fetale) e β (adulto)","ε (embrionale), β (fetale) e γ (adulto)"],e:"Il passaggio dall'emoglobina fetale (α₂γ₂) a quella adulta (α₂β₂) avviene intorno alla nascita."},
{id:"BU223",s:"bio",u:2,q:"Nella cellula interfasica i cromosomi:",o:["occupano territori distinti nel nucleo, non sono disposti a caso","sono tutti condensati come in metafase, ma senza fuso","sono disposti a caso e si mescolano liberamente nel nucleo","sono uniti tra loro in un unico filamento continuo","sono ancorati alla lamina proprio con i loro geni attivi"],e:"Le regioni attive tendono a trovarsi verso l'interno dei territori e del nucleo, quelle silenti verso la periferia, vicino alla lamina."},
{id:"BU224",s:"bio",u:2,q:"La coesina e la condensina sono entrambe:",o:["complessi SMC che formano anelli capaci di legare il DNA","istoni del core che formano ottameri attorno al DNA","complessi SMC che tagliano il DNA tra i cromatidi","chinasi del ciclo che fosforilano le lamine nucleari","topoisomerasi che rilasciano i superavvolgimenti"],e:"La coesina tiene uniti i cromatidi e organizza le anse in interfase; la condensina compatta i cromosomi mitotici."},
{id:"BU225",s:"bio",u:2,q:"Il cariotipo si allestisce di solito da:",o:["linfociti del sangue stimolati a dividersi e bloccati in metafase","globuli rossi maturi del sangue periferico, bloccati in metafase","piastrine stimolate a dividersi e bloccate in anafase","neuroni maturi prelevati e bloccati in interfase","linfociti a riposo, analizzati in interfase senza stimolo"],e:"Servono cellule in divisione: i globuli rossi e le piastrine non hanno nucleo; i neuroni maturi non si dividono."},
{id:"BU226",s:"bio",u:2,q:"Nella nomenclatura cromosomica, la sigla 5p indica:",o:["il braccio corto del cromosoma 5","il braccio lungo del cromosoma 5","il centromero del cromosoma 5","la banda numero 5","il cromosoma 5 paterno"],e:"p = braccio corto (petit), q = braccio lungo."},
{id:"BU227",s:"bio",u:2,q:"Il cromosoma umano più grande è il:",o:["cromosoma 1","cromosoma 21","cromosoma Y","cromosoma 22","cromosoma X"],e:"I cromosomi autosomici sono numerati all'incirca in ordine di dimensione decrescente (il 21 è in realtà più piccolo del 22)."},
{id:"BU228",s:"bio",u:2,q:"Il cromosoma Y umano:",o:["contiene pochi geni, tra cui SRY, e ampie regioni eterocromatiche","contiene più geni dell'X, tra cui SRY, e poca eterocromatina","non ricombina mai con l'X in nessuna regione","è il più grande del cariotipo e ricco di geni","contiene pochi geni, tra cui XIST, ed è tutto eucromatico"],e:"Le regioni pseudoautosomiche alle estremità permettono l'appaiamento e la ricombinazione con l'X in meiosi."},
{id:"BU229",s:"bio",u:2,q:"La tecnica FISH (ibridazione in situ fluorescente) permette di:",o:["localizzare una sequenza di DNA sui cromosomi con sonde fluorescenti","sequenziare l'intero genoma con nucleotidi fluorescenti","colorare le bande dei cromosomi dopo trattamento con tripsina","misurare la quantità di proteina con anticorpi fluorescenti","amplificare in vitro una sequenza di DNA con sonde fluorescenti"],e:"È usata per diagnosticare delezioni, traslocazioni e aneuploidie."},
{id:"BU230",s:"bio",u:2,q:"Il 'DNA spazzatura' (junk DNA), secondo le conoscenze attuali:",o:["include molte sequenze regolative o strutturali, pur non codificanti","è privo di qualsiasi funzione ed è un residuo evolutivo inutile","coincide con gli esoni che non vengono più tradotti","viene eliminato dalle cellule somatiche durante la mitosi","è presente solo nei batteri e nei loro plasmidi"],e:"Molte regioni non codificanti contengono enhancer, siti di legame per proteine o geni per RNA non codificanti."},
{id:"BU231",s:"bio",u:2,q:"La differenza nella quantità di DNA tra specie diverse, non correlata alla loro complessità (paradosso del valore C), si spiega soprattutto con:",o:["la diversa quantità di DNA non codificante e ripetuto","il diverso numero di geni codificanti e di introni per gene","la diversa quantità di DNA mitocondriale per cellula","il diverso numero di cromosomi sessuali e autosomi","la presenza o assenza di istoni nel nucleo"],e:"Alcune piante e anfibi hanno genomi molto più grandi di quello umano."},
{id:"BU232",s:"bio",u:2,q:"Le regioni di cromatina accessibili e prive di nucleosomi si trovano tipicamente:",o:["nei promotori e negli enhancer attivi","nei centromeri e nell'eterocromatina costitutiva","nei telomeri e nelle regioni subtelomeriche","nell'X inattivo e nei geni silenziati","nei corpi dei geni non trascritti"],e:"Sono ipersensibili alla DNasi I e vengono usate per mappare le regioni regolative attive."},
{id:"BU233",s:"bio",u:2,q:"La proteina CTCF, insieme alla coesina, contribuisce a:",o:["formare anse di cromatina e domini topologici (isolatori)","formare il fuso mitotico ancorando i microtubuli ai centromeri","degradare gli mRNA non correttamente processati","condensare i cromosomi mitotici al posto della condensina","importare nel nucleo le proteine con segnale NLS"],e:"Questi 'isolatori' impediscono a un enhancer di attivare geni non appropriati."},
{id:"BU234",s:"bio",u:2,q:"Una cellula somatica umana in G1 contiene:",o:["46 molecole di DNA nucleare","92 molecole di DNA nucleare","23 molecole di DNA nucleare","46 cromatidi doppi","nessun cromosoma"],e:"Ogni cromosoma in G1 è un'unica molecola di DNA; dopo la fase S le molecole diventano 92."},
{id:"BU238",s:"bio",u:2,q:"Le cellule di uno stesso individuo, pur avendo lo stesso genoma, sono diverse perché:",o:["esprimono insiemi diversi di geni grazie alla regolazione","contengono geni diversi a seconda del tessuto di origine","perdono durante il differenziamento i geni non usati","hanno numeri diversi di cromosomi a seconda del tessuto","accumulano mutazioni diverse che ne determinano la funzione"],e:"Il differenziamento si basa sull'espressione genica selettiva, non sulla perdita di DNA (con poche eccezioni, come i linfociti)."},

// ---- Unità 1: basi della vita (+16 MC)
{id:"BU101",s:"bio",u:1,q:"I virus a RNA a polarità positiva (+):",o:["hanno un genoma traducibile direttamente come mRNA dai ribosomi","devono prima copiare il genoma in un filamento negativo per tradurlo","devono prima essere retrotrascritti in DNA nel nucleo","portano nel virione una RNA polimerasi indispensabile all'inizio","hanno genoma a RNA a doppio filamento con polarità mista"],e:"Esempi: poliovirus e coronavirus. I virus a polarità negativa (es. influenza) devono portare una RNA polimerasi propria."},
{id:"BU102",s:"bio",u:1,q:"Nella classificazione di Baltimore i virus sono raggruppati in base a:",o:["tipo di genoma e strategia con cui producono mRNA","forma del capside e presenza dell'envelope","tipo di cellula ospite e via di trasmissione","dimensioni del virione e numero di geni","tipo di genoma e presenza dell'envelope lipidico"],e:"Le classi sono sette (sei nel syllabus, più quella dei virus a DNA parzialmente retrotrascritto come l'epatite B)."},
{id:"BU103",s:"bio",u:1,q:"I virus con envelope entrano spesso nella cellula animale:",o:["per fusione dell'envelope con la membrana o dopo endocitosi","per fusione del capside con la membrana nucleare","iniettando il solo genoma attraverso la membrana, come i fagi","attraverso i pori nucleari, senza passare dalla membrana","per coniugazione con la cellula ospite tramite un pilo"],e:"Il riconoscimento avviene tramite il legame tra glicoproteine virali e recettori della cellula (es. Spike-ACE2 per SARS-CoV-2)."},
{id:"BU104",s:"bio",u:1,q:"Gli antibiotici β-lattamici (es. penicilline) sono efficaci sui batteri ma non sulle cellule umane perché:",o:["inibiscono la sintesi del peptidoglicano, assente nelle cellule umane","bloccano i ribosomi 80S, assenti nei batteri","inibiscono la sintesi della membrana esterna, assente nelle cellule umane","inibiscono la sintesi dell'ergosterolo, assente nelle cellule umane","danneggiano il DNA circolare, assente nelle cellule umane"],e:"Altri antibiotici sfruttano differenze nei ribosomi (70S vs 80S), come tetracicline e aminoglicosidi."},
{id:"BU105",s:"bio",u:1,q:"La trasformazione batterica consiste in:",o:["acquisizione di DNA libero dall'ambiente","trasferimento di DNA mediato da un fago","trasferimento di DNA tramite pilo sessuale","acquisizione di RNA libero dall'ambiente","fusione di due batteri e scambio di cromosomi"],e:"Fu scoperta da Griffith nel 1928 con lo pneumococco."},
{id:"BU106",s:"bio",u:1,q:"Le spore batteriche (endospore) sono:",o:["forme di resistenza a calore, essiccamento e disinfettanti","forme di riproduzione sessuata prodotte per meiosi","forme di riproduzione asessuata che germinano in molte cellule","forme di resistenza che però non sopravvivono all'ebollizione","organelli fotosintetici dei batteri del suolo"],e:"Le producono ad esempio Clostridium e Bacillus; per distruggerle serve la sterilizzazione in autoclave."},
{id:"BU107",s:"bio",u:1,q:"La molecola d'acqua è polare perché:",o:["l'ossigeno è più elettronegativo e la molecola è angolare","l'ossigeno è più elettronegativo e la molecola è lineare","l'idrogeno è più elettronegativo e la molecola è angolare","i legami O−H sono ionici e la molecola è angolare","la molecola contiene un doppio legame O=H"],e:"La geometria angolare impedisce che i due dipoli O−H si annullino."},
{id:"BU108",s:"bio",u:1,q:"Le interazioni idrofobiche nelle proteine:",o:["portano i residui apolari all'interno, lontano dall'acqua","portano i residui apolari in superficie, a contatto con l'acqua","sono legami covalenti tra catene laterali apolari","si formano tra residui di carica opposta","coincidono con i ponti disolfuro tra cisteine"],e:"Sono un motore importante del ripiegamento delle proteine globulari."},
{id:"BU109",s:"bio",u:1,q:"I domini proteici sono:",o:["unità che si ripiegano in modo indipendente in una proteina","le singole α-eliche e i foglietti β della struttura secondaria","le subunità distinte di una proteina con struttura quaternaria","le sequenze introniche che vengono rimosse dal pre-mRNA","i legami peptidici che uniscono gli amminoacidi"],e:"Lo stesso dominio (es. SH2, chinasico) si ritrova in proteine diverse, spesso combinato con altri."},
{id:"BU110",s:"bio",u:1,q:"Un cofattore metallico in un enzima (es. Zn²⁺ nell'anidrasi carbonica):",o:["partecipa alla catalisi o alla stabilizzazione della struttura","viene consumato nella reazione e va reintegrato a ogni ciclo catalitico","è sempre un coenzima organico derivato da vitamine","è il substrato che viene trasformato in prodotto","si lega al sito allosterico e inibisce l'enzima"],e:"Gli enzimi con il loro cofattore si chiamano oloenzimi; senza cofattore apoenzimi."},
{id:"BU111",s:"bio",u:1,q:"La temperatura e il pH influenzano l'attività di un enzima perché:",o:["ne modificano la conformazione e la carica dei residui catalitici","cambiano la sequenza degli amminoacidi dell'enzima","cambiano il ΔG della reazione e quindi la sua costante di equilibrio","aumentano sempre l'attività fino alla denaturazione","modificano la sequenza del substrato e la sua carica"],e:"Ogni enzima ha valori ottimali; a temperature elevate si denatura."},
{id:"BU112",s:"bio",u:1,q:"Nella regolazione a feedback negativo di una via metabolica:",o:["il prodotto finale inibisce un enzima all'inizio della via","il prodotto finale attiva un enzima all'inizio della via","il substrato iniziale inibisce l'ultimo enzima della via","il prodotto finale inibisce l'ultimo enzima della via","il prodotto finale induce la degradazione di tutti gli enzimi della via"],e:"Evita l'accumulo inutile di prodotto; l'inibizione è spesso allosterica."},
{id:"BU113",s:"bio",u:1,q:"Le reazioni endoergoniche nella cellula possono avvenire perché:",o:["sono accoppiate a reazioni esoergoniche, come l'idrolisi dell'ATP","gli enzimi ne rendono negativo il ΔG abbassando l'energia di attivazione","sono accoppiate a reazioni endoergoniche, come la sintesi di ATP","avvengono spontaneamente se la temperatura è abbastanza alta","non richiedono energia perché hanno ΔG negativo"],e:"L'accoppiamento rende negativo il ΔG complessivo."},
{id:"BU114",s:"bio",u:1,q:"Quale caratteristica distingue un organismo vivente da un virus?",o:["La capacità di metabolismo e riproduzione autonomi","La presenza di acidi nucleici come materiale genetico","La presenza di proteine che formano un rivestimento","La capacità di evolvere tramite mutazione e selezione","La presenza di un rivestimento lipidico esterno"],e:"I virus contengono acidi nucleici e proteine ed evolvono, ma dipendono interamente dalla cellula ospite."},
{id:"BU115",s:"bio",u:1,q:"La sintesi di un polisaccaride a partire da monosaccaridi è un esempio di reazione:",o:["di condensazione, anabolica","di idrolisi, catabolica","di condensazione, catabolica","di idrolisi, anabolica","di ossidoriduzione, catabolica"],e:"Per ogni legame glicosidico che si forma si libera una molecola d'acqua."},
{id:"BU116",s:"bio",u:1,q:"Gli RNA ribosomiali, i tRNA e gli snRNA sono esempi di:",o:["RNA non codificanti con funzione strutturale o catalitica","RNA codificanti tradotti in proteine strutturali","RNA non codificanti con funzione solo regolativa, come i miRNA","ribozimi proteici con attività catalitica","mRNA privi di cap tradotti nei mitocondri"],e:"Oltre a questi esistono RNA non codificanti regolatori come miRNA e lncRNA."},

// ---- Unità 3 (+3) e 7 (+5)
{id:"BU301",s:"bio",u:3,q:"Il gene, secondo una definizione moderna, è:",o:["una sequenza trascritta in un RNA funzionale, con le sue regioni regolative","una sequenza di DNA che codifica sempre una proteina, senza introni","una sequenza di DNA compresa tra un codone di inizio e uno di stop","un tratto di cromosoma che contiene sempre un solo esone","una sequenza di RNA che viene retrotrascritta nel genoma"],e:"La definizione include i geni per RNA non codificanti e tiene conto dello splicing alternativo."},
{id:"BU302",s:"bio",u:3,q:"La regione 5' non tradotta (5' UTR) di un mRNA:",o:["si trova tra il cappuccio e il codone di inizio e può regolare la traduzione","si trova tra il codone di stop e la coda di poli(A) e regola la stabilità","si trova tra il cappuccio e il codone di inizio e codifica il peptide segnale","viene rimossa con lo splicing prima dell'esportazione","contiene la coda di poli(A) e il segnale AAUAAA"],e:"La 3' UTR, dopo il codone di stop, contiene spesso siti di legame per i miRNA."},
{id:"BU303",s:"bio",u:3,q:"Le RNA polimerasi, a differenza delle DNA polimerasi:",o:["possono iniziare la sintesi senza bisogno di un primer","sintetizzano in direzione 3'→5' usando uno stampo di RNA","usano desossiribonucleotidi trifosfati come substrato","hanno un'attività di correzione di bozze molto più efficiente","possono sintetizzare RNA senza bisogno di uno stampo"],e:"Per questo la primasi, una RNA polimerasi, fornisce l'innesco alla replicazione."},
{id:"BU701",s:"bio",u:7,q:"La fase G2 del ciclo cellulare:",o:["segue la S e precede la mitosi; si controlla che la replicazione sia completa e il DNA integro","precede la S e segue la mitosi; si controlla l'integrità del DNA","segue la mitosi e comprende la divisione del citoplasma","è una fase di quiescenza fuori dal ciclo, da cui si può rientrare","segue la S e precede la mitosi; avviene il crossing over"],e:"Al checkpoint G2/M il danno al DNA o la replicazione incompleta bloccano l'attivazione di CDK1."},
{id:"BU702",s:"bio",u:7,q:"I fattori di crescita stimolano la proliferazione soprattutto:",o:["promuovendo la sintesi di ciclina D e l'ingresso nel ciclo","promuovendo la degradazione della ciclina D e l'uscita in G0","promuovendo la sintesi di ciclina B e l'uscita dalla mitosi","attivando direttamente la DNA polimerasi in fase S","inibendo p53 e attivando la caspasi 9"],e:"Senza segnali mitogeni molte cellule restano in G0."},
{id:"BU703",s:"bio",u:7,q:"La differenza principale tra mitosi e meiosi è che:",o:["mitosi: 2 cellule identiche; meiosi: 4 cellule aploidi diverse","mitosi: 4 cellule aploidi diverse; meiosi: 2 cellule identiche","mitosi: 2 cellule aploidi identiche; meiosi: 4 cellule diploidi","mitosi: 2 cellule identiche; meiosi: 4 cellule diploidi diverse","mitosi: 2 cellule diverse; meiosi: 4 cellule aploidi identiche"],e:"La meiosi comprende due divisioni dopo una sola replicazione, con appaiamento degli omologhi e ricombinazione."},
{id:"BU704",s:"bio",u:7,q:"Il punto di restrizione (punto R) del ciclo cellulare si trova:",o:["in G1: superato, la cellula procede verso S anche senza mitogeni","in G2: superato, la cellula entra in mitosi anche senza mitogeni","in G1: superato, la cellula torna in G0 se mancano i mitogeni","in metafase: superato, i cromatidi si separano","in fase S: superato, la replicazione non può più fermarsi"],e:"Corrisponde alla fosforilazione completa di Rb."},
{id:"BU705",s:"bio",u:7,q:"Nella spermatogenesi, la meiosi inizia a partire da:",o:["la pubertà e prosegue per tutta la vita","la vita fetale e si blocca fino alla pubertà","la pubertà e si arresta con l'andropausa","la nascita e si completa entro i 20 anni","la vita fetale e prosegue senza pause per tutta la vita"],e:"Nella donna, invece, le ovogoni entrano in meiosi durante la vita fetale."},

// ---- Unità 6: segnalazione e matrice (+20 MC)
{id:"BU601",s:"bio",u:6,q:"La lamina basale è:",o:["uno strato di matrice specializzata su cui poggiano gli epiteli","la rete di lamine che sostiene la membrana nucleare interna","una seconda membrana plasmatica sul lato basale degli epiteli","uno strato di cellule mioepiteliali alla base delle ghiandole","una giunzione che unisce le cellule epiteliali sul lato basale"],e:"È formata soprattutto da collagene IV, laminina, nidogeno e perlecano."},
{id:"BU602",s:"bio",u:6,q:"I proteoglicani della matrice extracellulare sono formati da:",o:["una proteina centrale a cui sono legate catene di glicosamminoglicani","una proteina centrale a cui sono legate catene di oligosaccaridi corti","catene di glicosamminoglicani senza alcuna proteina centrale","fibre di collagene rivestite da lipidi e colesterolo","una catena di elastina legata a fibrillina"],e:"Legano grandi quantità d'acqua e conferiscono resistenza alla compressione (es. aggrecano nella cartilagine)."},
{id:"BU603",s:"bio",u:6,q:"L'elastina della matrice extracellulare:",o:["conferisce elasticità a tessuti come arterie, polmoni e cute","conferisce resistenza alla trazione a tendini e legamenti","conferisce resistenza alla compressione alla cartilagine","conferisce rigidità all'osso legando il fosfato di calcio","conferisce elasticità alla lamina nucleare delle cellule"],e:"Le fibre elastiche contengono anche la fibrillina, mutata nella sindrome di Marfan."},
{id:"BU604",s:"bio",u:6,q:"Le integrine possono trasmettere segnali in entrambe le direzioni: la segnalazione 'inside-out' significa che:",o:["segnali interni modificano l'affinità delle integrine per i ligandi","ligandi esterni attivano segnali all'interno della cellula","le integrine entrano nel nucleo e regolano la trascrizione","la matrice viene sintetizzata dentro la cellula e poi secreta","le integrine si staccano dal citoscheletro e passano alla cellula vicina"],e:"Nei leucociti, ad esempio, l'attivazione rende le integrine capaci di legarsi saldamente all'endotelio."},
{id:"BU605",s:"bio",u:6,q:"La perdita della E-caderina nelle cellule tumorali epiteliali favorisce:",o:["il distacco dalle cellule vicine e l'invasività","l'aumento delle giunzioni occludenti e della polarità","la riduzione della migrazione e dell'invasività","la formazione di nuovi desmosomi tra cellule","un'adesione più stabile alle cellule epiteliali vicine"],e:"È un evento chiave della transizione epitelio-mesenchimale (EMT)."},
{id:"BU606",s:"bio",u:6,q:"Il pemfigo, una malattia autoimmune con bolle cutanee, è dovuto ad anticorpi diretti contro:",o:["proteine dei desmosomi (desmogleine)","proteine degli emidesmosomi (integrina α6β4)","proteine delle giunzioni comunicanti (connessine)","proteine delle giunzioni occludenti (claudine)","proteine delle giunzioni aderenti (E-caderina)"],e:"Senza desmosomi funzionanti i cheratinociti si staccano l'uno dall'altro."},
{id:"BU607",s:"bio",u:6,q:"Un ligando idrofilo come l'adrenalina agisce sulle cellule bersaglio:",o:["legandosi a un recettore sulla membrana plasmatica","legandosi a recettori intracellulari dopo aver attraversato la membrana","entrando nel nucleo e legando direttamente il DNA","diffondendo attraverso il doppio strato lipidico","passando nelle cellule vicine tramite gap junction"],e:"Agisce tramite recettori adrenergici accoppiati a proteine G."},
{id:"BU608",s:"bio",u:6,q:"Le proteine G monomeriche (piccole GTPasi) come Ras e Rab:",o:["funzionano da interruttori, attive con GTP e inattive con GDP","funzionano da interruttori, attive con GDP e inattive con GTP","sono formate da tre subunità α, β e γ che si separano","sono recettori transmembrana con attività GTPasica","funzionano da interruttori, attive con ATP e inattive con ADP"],e:"La loro attività è regolata da GEF (attivazione) e GAP (inattivazione)."},
{id:"BU609",s:"bio",u:6,q:"La proteina chinasi A (PKA), una volta attivata dal cAMP, può entrare nel nucleo e fosforilare:",o:["il fattore di trascrizione CREB, che attiva geni bersaglio","il fattore di trascrizione CREB, che reprime i geni bersaglio","il fattore NF-κB, liberandolo dall'inibitore IκB","gli istoni H1, marcandoli per la degradazione","direttamente il DNA nei promotori dei geni bersaglio"],e:"CREB fosforilato lega le sequenze CRE nei promotori."},
{id:"BU610",s:"bio",u:6,q:"L'IP₃ provoca l'aumento del Ca²⁺ citosolico perché:",o:["apre i canali per il Ca²⁺ della membrana del RE","attiva le pompe SERCA che liberano Ca²⁺ dal RE","apre i canali per il Ca²⁺ della membrana plasmatica","attiva la PKC, che fosforila i canali del Ca²⁺","libera il Ca²⁺ legato alla calmodulina nel citosol"],e:"Il Ca²⁺ viene poi riportato nel RE da pompe SERCA."},
{id:"BU611",s:"bio",u:6,q:"Le cascate di chinasi (come Raf → MEK → ERK) servono soprattutto a:",o:["amplificare il segnale e integrarlo con altri segnali","ridurre il segnale a ogni passaggio per evitare risposte eccessive","trasportare fisicamente il ligando fino al nucleo","produrre ATP per le reazioni di fosforilazione","degradare il recettore attivato dopo il legame"],e:"Ogni chinasi attivata può fosforilare molte molecole del livello successivo."},
{id:"BU612",s:"bio",u:6,q:"Il recettore dell'EGF (EGFR) iperespresso o mutato in alcuni tumori è il bersaglio di farmaci come:",o:["inibitori tirosin-chinasici e anticorpi monoclonali anti-EGFR","inibitori della serina-treonina chinasi BRAF mutata nel melanoma","statine che inibiscono la HMG-CoA reduttasi","antibiotici β-lattamici che bloccano il peptidoglicano","inibitori dell'aromatasi e antiestrogeni"],e:"Esempi: gefitinib (inibitore chinasico) e cetuximab (anticorpo)."},
{id:"BU613",s:"bio",u:6,q:"I recettori accoppiati a canali ionici sono tipici:",o:["della trasmissione sinaptica rapida","della segnalazione rapida degli ormoni steroidei","della segnalazione lenta dell'insulina","della via Notch per contatto diretto","della segnalazione endocrina a lunga distanza"],e:"Aprono un canale in millisecondi (es. recettori nicotinici, GABA-A, glutammatergici AMPA)."},
{id:"BU614",s:"bio",u:6,q:"La β-arrestina contribuisce alla desensitizzazione dei GPCR:",o:["legando il recettore fosforilato e impedendone l'accoppiamento a G","legando il recettore defosforilato e favorendone l'accoppiamento a G","idrolizzando il GTP legato alla subunità α","degradando il ligando nello spazio extracellulare","fosforilando il recettore attivato al posto delle GRK"],e:"Le chinasi GRK fosforilano il recettore attivato, creando il sito di legame per l'arrestina."},
{id:"BU615",s:"bio",u:6,q:"Lo stesso ligando può provocare risposte diverse in cellule diverse perché:",o:["le cellule esprimono recettori e vie intracellulari diverse","il ligando cambia struttura a seconda del tessuto raggiunto","le cellule di tessuti diversi hanno DNA diverso","il ligando entra solo nelle cellule che lo devono degradare","il ligando viene modificato dagli enzimi di ciascuna cellula"],e:"L'acetilcolina, ad esempio, contrae il muscolo scheletrico ma rallenta il cuore."},
{id:"BU616",s:"bio",u:6,q:"Nella via di segnalazione dell'insulina, la proteina IRS ha la funzione di:",o:["proteina adattatrice che, fosforilata, recluta PI3K e altre proteine","enzima che, fosforilato, produce cAMP e attiva la PKA","proteina adattatrice che, defosforilata, recluta Ras-GAP","canale per il glucosio inserito in membrana dall'insulina","fattore di trascrizione che entra nel nucleo dopo la fosforilazione"],e:"Le proteine adattatrici legano le tirosine fosforilate tramite domini SH2 o PTB."},
{id:"BU617",s:"bio",u:6,q:"I domini SH2 presenti in molte proteine di segnalazione riconoscono:",o:["tirosine fosforilate in un contesto di sequenza specifico","serine e treonine fosforilate in un contesto specifico","tirosine non fosforilate in un contesto specifico","sequenze ricche di prolina in eliche poliprolina","il PIP₃ della membrana tramite un dominio lipidico"],e:"Così proteine come Grb2 si legano ai recettori tirosin-chinasici attivati."},
{id:"BU618",s:"bio",u:6,q:"L'ossido nitrico ha emivita molto breve e agisce quindi come segnale:",o:["paracrino, sulle cellule vicine","endocrino, su organi lontani","endocrino, trasportato legato all'albumina","iuxtacrino, tramite proteine di membrana","sinaptico, rilasciato da vescicole"],e:"La nitroglicerina usata nell'angina libera NO, causando vasodilatazione coronarica."},
{id:"BU619",s:"bio",u:6,q:"La fosfolipasi C viene attivata tipicamente da:",o:["proteine Gq e da alcuni recettori tirosin-chinasici","proteine Gs e Gi che regolano l'adenilato ciclasi","il cAMP prodotto dall'adenilato ciclasi","il cGMP prodotto dalla guanilato ciclasi","proteine Gq soltanto, mai da recettori chinasici"],e:"PLC-β è attivata da Gq, PLC-γ da recettori tirosin-chinasici."},
{id:"BU620",s:"bio",u:6,q:"Un proto-oncogene che codifica un recettore tirosin-chinasico può diventare oncogenico se:",o:["una mutazione lo rende attivo anche in assenza di ligando","una mutazione ne elimina il dominio chinasico","viene deleto completamente su entrambi gli alleli","una mutazione lo rende incapace di dimerizzare col ligando","viene internalizzato e degradato più rapidamente"],e:"L'attivazione costitutiva invia continuamente segnali di proliferazione (es. HER2 amplificato nel tumore della mammella)."}
);
BANK.push(
{id:"BUF01",s:"bio",u:2,q:"Il braccio lungo di un cromosoma si indica con la lettera ……",c:["q"],e:"Il braccio corto con la p."},
{id:"BUF02",s:"bio",u:2,q:"La variante istonica che marca i nucleosomi del centromero si chiama ……",c:["cenp-a","cenpa","cenp a"],e:"Sostituisce l'istone H3."},
{id:"BUF03",s:"bio",u:2,q:"Il lncRNA che riveste il cromosoma X da inattivare si chiama ……",c:["xist"],e:"X-inactive specific transcript."},
{id:"BUF04",s:"bio",u:2,q:"Una donna con cariotipo 47,XXX ha …… corpi di Barr",c:["2","due"],n:2,e:"Numero di X − 1."},
{id:"BUF05",s:"bio",u:2,q:"Gli enzimi che aggiungono gruppi acetile alle lisine degli istoni si indicano con la sigla ……",c:["hat","hats","istone acetiltransferasi"],e:"Histone AcetylTransferases; le HDAC li rimuovono."},
{id:"BUF06",s:"bio",u:2,q:"Le regioni ricche di dinucleotidi CG spesso presenti nei promotori si chiamano isole ……",c:["cpg"],e:"La loro metilazione silenzia i geni."},
{id:"BUF07",s:"bio",u:2,q:"La tecnica che localizza sequenze di DNA sui cromosomi con sonde fluorescenti si indica con la sigla ……",c:["fish"],e:"Fluorescence In Situ Hybridization."},
{id:"BUF08",s:"bio",u:2,q:"Il genoma umano aploide contiene circa 3 miliardi di paia di ……",c:["basi","nucleotidi"],e:"3,1·10⁹ bp."},
{id:"BUF10",s:"bio",u:2,q:"La proteina che riconosce la metilazione H3K9 e compatta l'eterocromatina si indica con la sigla ……",c:["hp1"],e:"Heterochromatin Protein 1."},
{id:"BUF11",s:"bio",u:2,q:"Il complesso SMC che compatta i cromosomi all'inizio della mitosi si chiama ……",c:["condensina","condensine"],e:"La coesina tiene invece uniti i cromatidi fratelli."},
{id:"BUF13",s:"bio",u:1,q:"I virus il cui genoma a RNA funziona direttamente da mRNA si dicono a polarità ……",c:["positiva","+"],e:"Quelli a polarità negativa devono essere prima copiati."},
{id:"BUF14",s:"bio",u:1,q:"Le strutture di resistenza prodotte da Bacillus e Clostridium si chiamano ……",c:["endospore","spore","endospora"],e:"Resistono al calore e si eliminano in autoclave."},
{id:"BUF15",s:"bio",u:6,q:"Lo strato di matrice extracellulare su cui poggiano gli epiteli si chiama lamina ……",c:["basale"],e:"Contiene collagene IV e laminina."},
{id:"BUF16",s:"bio",u:6,q:"La proteina della matrice responsabile dell'elasticità di arterie e polmoni è l'……",c:["elastina"],e:"Si organizza in fibre elastiche con la fibrillina."},
{id:"BUF17",s:"bio",u:6,q:"Le molecole formate da una proteina centrale e da catene di glicosamminoglicani si chiamano ……",c:["proteoglicani","proteoglicano"],e:"Esempio: aggrecano nella cartilagine."},
{id:"BUF18",s:"bio",u:6,q:"Il fattore di trascrizione fosforilato dalla PKA che lega le sequenze CRE si chiama ……",c:["creb"],e:"cAMP Response Element Binding protein."},
{id:"BUF19",s:"bio",u:6,q:"La proteina che si lega ai GPCR fosforilati causandone la desensitizzazione è l'……",c:["arrestina","beta-arrestina","β-arrestina","b-arrestina"],e:"Favorisce anche l'endocitosi del recettore."},
{id:"BUF20",s:"bio",u:6,q:"Il dominio proteico che riconosce le tirosine fosforilate si chiama dominio ……",c:["sh2"],e:"Src Homology 2."},
{id:"BUF21",s:"bio",u:6,q:"La GTPasi Ras viene attivata dalla GEF chiamata ……",c:["sos","son of sevenless"],e:"SOS è reclutata dall'adattatore Grb2."},
{id:"BUF22",s:"bio",u:6,q:"Le giunzioni che collegano le cellule epiteliali alla lamina basale tramite integrine e cheratine si chiamano ……",c:["emidesmosomi","emidesmosoma"],e:"Contengono l'integrina α6β4."},
{id:"BUF23",s:"bio",u:6,q:"La malattia autoimmune con bolle cutanee dovuta ad anticorpi contro le desmogleine si chiama ……",c:["pemfigo"],e:"Colpisce i desmosomi dei cheratinociti."},
{id:"BUF24",s:"bio",u:6,q:"La transizione in cui le cellule epiteliali perdono le giunzioni e diventano migratorie si indica con la sigla ……",c:["emt"],e:"Epithelial-Mesenchymal Transition."},
{id:"BUF25",s:"bio",u:6,q:"Il recettore tirosin-chinasico amplificato in alcuni tumori della mammella e bersaglio del trastuzumab è ……",c:["her2","erbb2","her-2"],e:"Appartiene alla famiglia dei recettori dell'EGF."}
);

// CHIMICA — bilanciamento delle unità (u2, u3, u4, u6, u7) — domande originali
BANK.push(
// ---- Unità 2: stati della materia e termodinamica (+27 MC)
{id:"CU201",s:"chem",u:2,q:"Nei solidi molecolari (es. ghiaccio, iodio, zucchero) le unità del reticolo sono tenute insieme da:",o:["forze intermolecolari deboli","legami covalenti estesi a tutto il cristallo","legami ionici","legami metallici","legami nucleari"],e:"Per questo hanno in genere punti di fusione relativamente bassi."},
{id:"CU202",s:"chem",u:2,q:"Il cloruro di sodio solido è un esempio di solido:",o:["ionico","molecolare","covalente reticolare","metallico","amorfo"],e:"Ogni Na⁺ è circondato da 6 Cl⁻ e viceversa; alto punto di fusione (801 °C)."},
{id:"CU203",s:"chem",u:2,q:"Un solido amorfo, come il vetro, si distingue da un solido cristallino perché:",o:["non ha ordine a lungo raggio né un punto di fusione netto","ha un reticolo ordinato e un punto di fusione netto","non ha ordine a lungo raggio ma ha un punto di fusione netto","ha un reticolo ordinato ma fonde in un intervallo di temperature","è formato solo da ioni disposti in modo casuale"],e:"Rammollisce gradualmente in un intervallo di temperature."},
{id:"CU204",s:"chem",u:2,q:"Un gas viene compresso a temperatura costante da 10 L a 2 L. Se la pressione iniziale era 1 atm, quella finale è:",o:["5 atm","0,2 atm","2 atm","10 atm","20 atm"],e:"P₁V₁ = P₂V₂ → P₂ = 10/2 = 5 atm."},
{id:"CU205",s:"chem",u:2,q:"Un gas a volume costante passa da 300 K a 450 K. Se la pressione iniziale era 2 atm, quella finale è:",o:["3 atm","1,33 atm","4,5 atm","2 atm","6 atm"],e:"P/T = costante → 2 × 450/300 = 3 atm."},
{id:"CU206",s:"chem",u:2,q:"Quale volume occupano 2 mol di gas ideale a 27 °C e 1 atm (R = 0,082 L·atm/(mol·K))?",o:["49,2 L","44,8 L","4,4 L","24,6 L","22,4 L"],e:"V = nRT/P = 2 × 0,082 × 300 = 49,2 L."},
{id:"CU207",s:"chem",u:2,q:"Nella respirazione, durante l'inspirazione l'aria entra nei polmoni perché:",o:["il volume toracico aumenta e la pressione alveolare scende sotto quella atmosferica","il volume toracico diminuisce e la pressione alveolare sale sopra quella atmosferica","il volume toracico aumenta e la pressione alveolare sale sopra quella atmosferica","l'emoglobina attira l'ossigeno creando un gradiente di pressione","la temperatura dell'aria inspirata diminuisce nei polmoni"],e:"È un'applicazione della legge di Boyle: a temperatura costante, aumentando il volume la pressione cala."},
{id:"CU208",s:"chem",u:2,q:"La pressione di vapore dell'acqua a 100 °C è:",o:["1 atm (760 mmHg)","0 atm","2 atm (1520 mmHg)","0,5 atm (380 mmHg)","23,8 mmHg"],e:"Per definizione il punto di ebollizione normale è la temperatura alla quale la tensione di vapore vale 1 atm."},
{id:"CU209",s:"chem",u:2,q:"A parità di temperatura, quale liquido ha la tensione di vapore più alta?",o:["Il dietiletere","L'acqua","Il glicerolo","Il mercurio","L'olio d'oliva"],e:"L'etere ha forze intermolecolari deboli (niente legami a idrogeno tra le sue molecole) ed è molto volatile."},
{id:"CU210",s:"chem",u:2,q:"Il calore latente di vaporizzazione dell'acqua è particolarmente alto perché:",o:["bisogna rompere molti legami a idrogeno tra le molecole","bisogna rompere i legami covalenti O−H delle molecole","l'acqua è un composto ionico con forti legami","l'acqua ha massa molare elevata rispetto agli altri liquidi","il vapore acqueo si comporta da gas reale"],e:"Questo rende l'evaporazione del sudore molto efficace nel raffreddare il corpo."},
{id:"CU211",s:"chem",u:2,q:"La temperatura di ebollizione di un liquido:",o:["aumenta all'aumentare della pressione esterna","non dipende dalla pressione esterna","diminuisce all'aumentare della pressione esterna","dipende solo dalla quantità di liquido","è uguale per tutti i liquidi"],e:"In montagna l'acqua bolle a meno di 100 °C; in pentola a pressione a più di 100 °C."},
{id:"CU212",s:"chem",u:2,q:"La tensione superficiale dell'acqua diminuisce aggiungendo:",o:["tensioattivi, come i saponi o il surfattante polmonare","sale da cucina, che aumenta le interazioni ione-dipolo","zucchero, che forma legami a idrogeno con l'acqua","ghiaccio, che raffredda e ordina la superficie","cloruro di potassio, che si dissocia in ioni K⁺ e Cl⁻"],e:"I tensioattivi si dispongono all'interfaccia aria-acqua riducendo le interazioni tra le molecole superficiali."},
{id:"CU213",s:"chem",u:2,q:"Il primo principio della termodinamica esprime:",o:["la conservazione dell'energia","l'aumento dell'entropia nei processi spontanei","l'impossibilità di raggiungere lo zero assoluto","la proporzionalità tra pressione e temperatura","la definizione di energia libera"],e:"ΔU = q + w (con w lavoro fatto sul sistema): l'energia non si crea né si distrugge."},
{id:"CU214",s:"chem",u:2,q:"Il secondo principio della termodinamica afferma che, in un processo spontaneo:",o:["l'entropia totale dell'universo (sistema + ambiente) aumenta","l'entropia del solo sistema aumenta sempre","l'entropia totale dell'universo resta costante","l'energia totale dell'universo aumenta nel processo","l'entropia dell'ambiente diminuisce sempre nel processo"],e:"L'entropia del solo sistema può diminuire, purché quella dell'ambiente aumenti di più."},
{id:"CU215",s:"chem",u:2,q:"Quale dei seguenti processi comporta un aumento di entropia del sistema?",o:["L'evaporazione dell'acqua","La solidificazione dell'acqua","La condensazione del vapore","La formazione di un cristallo da una soluzione","La reazione 2 H₂(g) + O₂(g) → 2 H₂O(l)"],e:"Il passaggio a uno stato con molecole più libere (gas) aumenta il disordine."},
{id:"CU216",s:"chem",u:2,q:"Un sistema che scambia energia ma non materia con l'ambiente si dice:",o:["chiuso","aperto","isolato","adiabatico per definizione","reversibile"],e:"Aperto: scambia energia e materia (come una cellula). Isolato: non scambia né l'una né l'altra."},
{id:"CU217",s:"chem",u:2,q:"Una cellula vivente, dal punto di vista termodinamico, è un sistema:",o:["aperto, che scambia materia ed energia con l'ambiente","chiuso, che scambia solo energia con l'ambiente","isolato, che non scambia né materia né energia","aperto, ma all'equilibrio chimico con l'ambiente","chiuso, che scambia solo materia con l'ambiente"],e:"Mantiene uno stato stazionario lontano dall'equilibrio grazie al flusso continuo di energia."},
{id:"CU218",s:"chem",u:2,q:"Una reazione esoergonica:",o:["ha ΔG < 0 e può avvenire spontaneamente","ha ΔG > 0 e richiede energia esterna","ha ΔH < 0 e avviene sempre rapidamente","ha ΔG < 0 e avviene sempre rapidamente","ha ΔS < 0 e non raggiunge mai l'equilibrio"],e:"Spontanea non significa veloce: la velocità dipende dall'energia di attivazione."},
{id:"CU219",s:"chem",u:2,q:"Una reazione con ΔG° molto negativo:",o:["ha una costante di equilibrio molto maggiore di 1","ha una costante di equilibrio molto minore di 1","ha una costante di equilibrio vicina a 1","è necessariamente una reazione molto veloce","ha ΔH positivo e ΔS negativo"],e:"ΔG° = −RT ln K."},
{id:"CU220",s:"chem",u:2,q:"All'equilibrio chimico la variazione di energia libera ΔG della reazione è:",o:["zero","massima","minima e negativa","uguale a ΔG°","uguale a −RT"],e:"ΔG = ΔG° + RT ln Q; all'equilibrio Q = K e ΔG = 0."},
{id:"CU221",s:"chem",u:2,q:"La combustione del glucosio (C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O) è:",o:["esotermica ed esoergonica","endotermica ed endoergonica","esotermica ma non spontanea","endotermica ma spontanea","all'equilibrio a 25 °C"],e:"ΔG° ≈ −2870 kJ/mol: nella cellula questa energia viene recuperata in parte come ATP."},
{id:"CU222",s:"chem",u:2,q:"L'entalpia standard di formazione di un elemento nel suo stato standard (es. O₂ gassoso) vale per convenzione:",o:["0","1 kJ/mol","−1 kJ/mol","100 kJ/mol","dipende dalla temperatura in modo arbitrario"],e:"È il riferimento per calcolare le entalpie di reazione (legge di Hess)."},
{id:"CU223",s:"chem",u:2,q:"Secondo la legge di Hess, la variazione di entalpia di una reazione:",o:["è la stessa qualunque sia il percorso seguito","dipende dal numero di stadi del percorso","dipende dalla presenza di un catalizzatore","è uguale alla variazione di energia libera","è la stessa solo se gli stadi sono reversibili"],e:"Perché l'entalpia è una funzione di stato."},
{id:"CU224",s:"chem",u:2,q:"Nel diagramma di fase dell'acqua, a una pressione inferiore a quella del punto triplo, riscaldando il ghiaccio si ottiene:",o:["sublimazione diretta a vapore","fusione e poi ebollizione","solo fusione","fusione seguita da solidificazione","condensazione del vapore"],e:"È il principio della liofilizzazione, usata per conservare farmaci e alimenti."},
{id:"CU225",s:"chem",u:2,q:"I gas reali deviano maggiormente dal comportamento ideale:",o:["ad alta pressione e bassa temperatura","a bassa pressione e alta temperatura","ad alta pressione e alta temperatura","a bassa pressione e bassa temperatura","solo se sono gas monoatomici"],e:"In queste condizioni contano il volume proprio delle molecole e le attrazioni intermolecolari."},
{id:"CU226",s:"chem",u:2,q:"Secondo la teoria cinetica, a parità di temperatura le molecole di H₂ rispetto a quelle di O₂:",o:["hanno la stessa energia cinetica media ma velocità media maggiore","hanno energia cinetica media maggiore e velocità media maggiore","hanno la stessa energia cinetica media e la stessa velocità media","hanno energia cinetica media minore ma velocità media maggiore","hanno la stessa energia cinetica media ma velocità media minore"],e:"Ec media = (3/2)kT è uguale; essendo più leggere (2 contro 32 g/mol), si muovono circa 4 volte più velocemente."},
{id:"CU227",s:"chem",u:2,q:"Il passaggio di stato da vapore a solido senza passare per il liquido si chiama:",o:["brinamento","sublimazione","condensazione","solidificazione","fusione"],e:"Il passaggio inverso (solido → vapore) è la sublimazione."},

// ---- Unità 3: soluzioni (+11 MC)
{id:"CU301",s:"chem",u:3,q:"Lo zucchero si scioglie bene in acqua perché:",o:["ha molti gruppi −OH che formano legami a idrogeno con l'acqua","è un composto ionico che si dissocia in acqua","è apolare e si scioglie per interazioni di van der Waals","reagisce con l'acqua formando glucosio libero","ha una massa molare molto bassa"],e:"Le sostanze polari si sciolgono in solventi polari."},
{id:"CU302",s:"chem",u:3,q:"Quando un sale si scioglie in acqua, gli ioni vengono circondati da molecole d'acqua: questo fenomeno si chiama:",o:["idratazione (solvatazione)","idrolisi","precipitazione","osmosi","dissociazione elettrolitica"],e:"Le molecole d'acqua orientano verso i cationi l'ossigeno (parziale carica negativa) e verso gli anioni gli idrogeni."},
{id:"CU303",s:"chem",u:3,q:"La solubilità della maggior parte dei solidi in acqua, all'aumentare della temperatura:",o:["aumenta","diminuisce","resta costante","diventa nulla","dipende solo dalla pressione"],e:"Per i gas accade il contrario: la loro solubilità diminuisce con la temperatura."},
{id:"CU304",s:"chem",u:3,q:"Il plasma ha una concentrazione di Na⁺ di circa 140 mEq/L. Espressa in mmol/L è:",o:["140 mmol/L","70 mmol/L","280 mmol/L","14 mmol/L","1,4 mmol/L"],e:"Per uno ione monovalente equivalenti e moli coincidono."},
{id:"CU305",s:"chem",u:3,q:"Una concentrazione di Ca²⁺ di 2,5 mmol/L corrisponde a:",o:["5 mEq/L","2,5 mEq/L","1,25 mEq/L","10 mEq/L","0,25 mEq/L"],e:"Per uno ione bivalente gli equivalenti sono il doppio delle moli."},
{id:"CU306",s:"chem",u:3,q:"Si ha un'emulsione quando:",o:["un liquido è disperso in un altro non miscibile, come olio in acqua","un gas è disperso in un liquido, come nella panna montata","un solido è disperso in un liquido, come nella vernice","due liquidi miscibili formano una soluzione omogenea","un liquido è disperso in un gas, come nella nebbia o nello spray"],e:"Il latte e la maionese sono emulsioni; gli emulsionanti (es. lecitina, sali biliari) le stabilizzano."},
{id:"CU307",s:"chem",u:3,q:"Due soluzioni con la stessa osmolarità si dicono:",o:["isosmotiche","ipertoniche","ipotoniche","sature","sovrasature"],e:"Isosmotica non coincide sempre con isotonica: l'urea attraversa le membrane e non contribuisce alla tonicità."},
{id:"CU308",s:"chem",u:3,q:"Una soluzione di urea 0,3 M, pur essendo isosmotica con il citoplasma, è ipotonica per i globuli rossi perché:",o:["l'urea attraversa la membrana ed entra, seguita dall'acqua","l'urea è un elettrolita forte che si dissocia in due ioni","l'urea viene pompata fuori dalla cellula, trascinando acqua","l'urea non attraversa la membrana e richiama acqua fuori","l'urea si lega all'emoglobina e ne riduce l'osmolarità"],e:"La tonicità dipende solo dai soluti che non attraversano la membrana."},
{id:"CU309",s:"chem",u:3,q:"La molalità di una soluzione si esprime in:",o:["moli di soluto per kg di solvente","moli di soluto per litro di soluzione","grammi di soluto per 100 mL","equivalenti per litro","moli di solvente per mole di soluto"],e:"A differenza della molarità non dipende dalla temperatura (le masse non cambiano con T, i volumi sì)."},
{id:"CU310",s:"chem",u:3,q:"Il congelamento dell'acqua di mare avviene a temperatura più bassa di quella dell'acqua dolce perché:",o:["i sali disciolti abbassano il punto di congelamento","i sali disciolti innalzano il punto di congelamento","i sali disciolti aumentano la tensione di vapore","l'acqua di mare ha una densità minore","i sali disciolti aumentano la viscosità e impediscono il congelamento"],e:"È una proprietà colligativa (abbassamento crioscopico)."},
{id:"CU311",s:"chem",u:3,q:"Nella legge di Raoult, aggiungendo un soluto non volatile a un solvente la tensione di vapore:",o:["diminuisce in proporzione alla frazione molare del soluto","aumenta in proporzione alla frazione molare del soluto","diminuisce in proporzione alla frazione molare del solvente","resta invariata perché il soluto non è volatile","diminuisce in proporzione alla massa del soluto"],e:"ΔP = x_soluto·P°."},

// ---- Unità 4: reazioni, cinetica, equilibrio (+21 MC)
{id:"CU401",s:"chem",u:4,q:"La reazione 2 KClO₃ → 2 KCl + 3 O₂ è una reazione di:",o:["decomposizione","sintesi","scambio semplice","doppio scambio","neutralizzazione"],e:"Un composto si scinde in sostanze più semplici."},
{id:"CU402",s:"chem",u:4,q:"La reazione AgNO₃ + NaCl → AgCl + NaNO₃ è un esempio di:",o:["reazione di doppio scambio con precipitazione","ossidoriduzione con precipitazione","reazione di sintesi con formazione di un gas","decomposizione con precipitazione","reazione di neutralizzazione acido-base"],e:"Gli ioni si scambiano i partner; AgCl, poco solubile, precipita come solido bianco."},
{id:"CU403",s:"chem",u:4,q:"In una reazione chimica si conservano:",o:["la massa, il numero di atomi di ogni elemento e la carica","la massa, il numero di molecole e la carica totale","il numero di moli totali e il volume dei gas","la massa e il numero di molecole, ma non la carica","il numero di atomi e di molecole, ma non la massa totale"],e:"Il numero di molecole e di moli può cambiare (es. N₂ + 3 H₂ → 2 NH₃)."},
{id:"CU404",s:"chem",u:4,q:"Bilanciando Fe + O₂ → Fe₂O₃ con i minimi coefficienti interi, la somma dei coefficienti è:",o:["9","5","7","3","11"],e:"4 Fe + 3 O₂ → 2 Fe₂O₃: 4 + 3 + 2 = 9."},
{id:"CU405",s:"chem",u:4,q:"Bilanciando C₂H₆ + O₂ → CO₂ + H₂O con i minimi interi, il coefficiente dell'ossigeno è:",o:["7","3,5","5","6","9"],e:"2 C₂H₆ + 7 O₂ → 4 CO₂ + 6 H₂O."},
{id:"CU406",s:"chem",u:4,q:"La velocità di una reazione si misura come:",o:["variazione della concentrazione di reagenti o prodotti nel tempo","energia liberata dalla reazione nell'unità di tempo","valore della costante di equilibrio a una data temperatura","tempo necessario a raggiungere l'equilibrio","variazione della massa totale del sistema nel tempo"],e:"Si esprime ad esempio in mol·L⁻¹·s⁻¹."},
{id:"CU407",s:"chem",u:4,q:"Quale dei seguenti fattori NON aumenta la velocità di una reazione?",o:["Diminuire la temperatura","Aumentare la concentrazione dei reagenti","Aggiungere un catalizzatore","Aumentare la superficie di contatto di un reagente solido","Aumentare la temperatura"],e:"Riducendo la temperatura diminuisce la frazione di urti efficaci."},
{id:"CU408",s:"chem",u:4,q:"Una regola empirica afferma che, per molte reazioni, un aumento di 10 °C della temperatura:",o:["circa raddoppia la velocità di reazione","circa dimezza la velocità di reazione","circa decuplica la velocità di reazione","non cambia la velocità, ma solo l'equilibrio","circa raddoppia la costante di equilibrio"],e:"È una conseguenza dell'equazione di Arrhenius; per questo la febbre accelera il metabolismo."},
{id:"CU409",s:"chem",u:4,q:"Secondo la teoria degli urti, perché un urto tra molecole sia efficace servono:",o:["energia almeno pari a quella di attivazione e orientamento corretto","energia almeno pari al ΔH di reazione e orientamento casuale","solo un'elevata concentrazione dei reagenti","solo la presenza di un catalizzatore","energia almeno pari a quella di attivazione, con qualsiasi orientamento"],e:"Solo una piccola frazione degli urti porta ai prodotti."},
{id:"CU410",s:"chem",u:4,q:"Per la reazione elementare A + B → C, l'equazione cinetica è:",o:["v = k[A][B]","v = k[C]","v = k[A]²","v = k","v = k[A] + [B]"],e:"Per uno stadio elementare gli esponenti coincidono con i coefficienti stechiometrici."},
{id:"CU411",s:"chem",u:4,q:"Le unità di misura della costante di velocità di una reazione del primo ordine sono:",o:["s⁻¹","mol·L⁻¹·s⁻¹","L·mol⁻¹·s⁻¹","mol/L","adimensionali"],e:"v = k[A]: (mol/L·s) = k·(mol/L) → k in s⁻¹."},
{id:"CU412",s:"chem",u:4,q:"Gli enzimi si differenziano dai catalizzatori inorganici soprattutto per:",o:["l'elevata specificità per il substrato e la possibilità di essere regolati","la capacità di spostare l'equilibrio verso i prodotti","il fatto di essere consumati e poi rigenerati nella reazione","la capacità di rendere spontanee reazioni con ΔG > 0","il funzionamento ottimale solo a temperature e pressioni elevate"],e:"Accelerano le reazioni anche di milioni di volte in condizioni blande."},
{id:"CU413",s:"chem",u:4,q:"In un equilibrio chimico dinamico:",o:["la reazione diretta e quella inversa avvengono alla stessa velocità","entrambe le reazioni si sono fermate completamente","le concentrazioni di reagenti e prodotti sono sempre uguali","la reazione diretta resta più veloce di quella inversa","la costante di velocità diretta è sempre uguale a quella inversa"],e:"Le concentrazioni restano costanti, ma non necessariamente uguali."},
{id:"CU414",s:"chem",u:4,q:"Per l'equilibrio 2 SO₂(g) + O₂(g) ⇌ 2 SO₃(g) (esotermico), quale cambiamento sposta l'equilibrio verso SO₃?",o:["Aumentare la pressione","Aumentare la temperatura","Sottrarre O₂","Aggiungere SO₃","Diminuire la pressione"],e:"Il lato dei prodotti ha meno moli di gas (2 contro 3); essendo esotermica, scaldare favorisce invece i reagenti."},
{id:"CU415",s:"chem",u:4,q:"L'aggiunta di un catalizzatore a un sistema già all'equilibrio:",o:["non modifica la composizione all'equilibrio","sposta l'equilibrio verso i prodotti","sposta l'equilibrio verso i reagenti","aumenta il valore della costante K","accelera solo la reazione diretta, non quella inversa"],e:"Accelera allo stesso modo reazione diretta e inversa."},
{id:"CU416",s:"chem",u:4,q:"L'emoglobina lega l'ossigeno secondo l'equilibrio Hb + 4 O₂ ⇌ Hb(O₂)₄. Nei tessuti, dove la pressione parziale di O₂ è bassa:",o:["l'equilibrio si sposta verso sinistra e l'O₂ viene rilasciato","l'equilibrio si sposta verso destra e l'O₂ viene rilasciato","l'equilibrio si sposta verso destra e l'Hb lega più O₂","l'equilibrio non cambia perché K resta costante","l'equilibrio si sposta verso sinistra e l'Hb lega più O₂"],e:"È un'applicazione del principio di Le Châtelier; nei polmoni, con alta pO₂, avviene il contrario."},
{id:"CU417",s:"chem",u:4,q:"La reazione inversa di N₂ + 3 H₂ ⇌ 2 NH₃ ha costante K' uguale a 1/K. Se K = 4, la costante per 2 NH₃ ⇌ N₂ + 3 H₂ vale:",o:["0,25","4","16","−4","0,5"],e:"K' = 1/K."},
{id:"CU418",s:"chem",u:4,q:"Se si raddoppiano tutti i coefficienti di una reazione con costante K, la nuova costante è:",o:["K²","2K","K/2","√K","K"],e:"Le concentrazioni compaiono elevate a esponenti doppi."},
{id:"CU419",s:"chem",u:4,q:"Il prodotto di solubilità di un sale:",o:["dipende dalla temperatura ma non dalla presenza di altri ioni","dipende dalla presenza di uno ione comune ma non dalla temperatura","dipende dalla quantità di solido presente sul fondo","non dipende né dalla temperatura né dagli altri ioni","è sempre maggiore di 1 per i sali poco solubili"],e:"Lo ione comune riduce la solubilità del sale, non il valore di Ks."},
{id:"CU420",s:"chem",u:4,q:"Tra due sali dello stesso tipo AB, è più solubile quello con:",o:["Ks maggiore","Ks minore","massa molare maggiore","colore più chiaro","punto di fusione più alto"],e:"Per sali dello stesso tipo s = √Ks; per tipi diversi il confronto va fatto calcolando la solubilità."},
{id:"CU421",s:"chem",u:4,q:"In una reazione di sintesi:",o:["due o più sostanze si combinano in un unico prodotto","un composto si scompone in due o più sostanze più semplici","un elemento sostituisce un altro elemento in un composto","due composti si scambiano ioni formando due nuovi composti","un acido e una base reagiscono formando sale e acqua"],e:"Esempio: 2 H₂ + O₂ → 2 H₂O."},

// ---- Unità 6: idrocarburi e reattività (+18 MC)
{id:"CU601",s:"chem",u:6,q:"Il carbonio può formare un numero massimo di legami covalenti pari a:",o:["4","2","3","6","8"],e:"Ha 4 elettroni di valenza: questo spiega la grande varietà dei composti organici."},
{id:"CU603",s:"chem",u:6,q:"Il nome IUPAC del composto CH₃−CH=CH−CH₃ è:",o:["2-butene","1-butene","butano","2-butino","ciclobutano"],e:"Il doppio legame inizia al carbonio 2."},
{id:"CU604",s:"chem",u:6,q:"Il nome IUPAC di CH≡C−CH₃ è:",o:["propino","propene","propano","etino","1-propene"],e:"Il suffisso -ino indica il triplo legame."},
{id:"CU605",s:"chem",u:6,q:"La combustione completa di un idrocarburo produce:",o:["anidride carbonica e acqua","monossido di carbonio e idrogeno","solo acqua","carbonio e ossigeno","metano"],e:"In carenza di ossigeno si forma anche monossido di carbonio (CO), molto tossico."},
{id:"CU607",s:"chem",u:6,q:"Gli alcani sono poco reattivi perché:",o:["contengono solo legami σ C−C e C−H, forti e poco polari","contengono legami π deboli che si rompono con difficoltà","contengono legami ionici C−H molto forti","sono aromatici e quindi stabilizzati per risonanza","hanno gruppi funzionali polari ma ingombrati"],e:"Reagiscono soprattutto in combustione e in sostituzioni radicaliche."},
{id:"CU608",s:"chem",u:6,q:"Il ciclopropano è un cicloalcano molto reattivo a causa:",o:["della forte tensione d'anello dovuta ad angoli di 60°","della forte tensione d'anello dovuta ad angoli di 120°","della presenza di un doppio legame nell'anello","della sua aromaticità con 3 elettroni π","dell'elevata polarità dei legami C−H"],e:"Gli orbitali sp³ si sovrappongono male e i legami C−C sono deboli."},
{id:"CU609",s:"chem",u:6,q:"Un carbanione è:",o:["una specie con un carbonio carico negativamente e un doppietto libero","una specie con un carbonio carico positivamente e un orbitale vuoto","una specie con un carbonio neutro e un elettrone spaiato","una specie con un carbonio carico negativamente e un orbitale vuoto","un carbonio ibridato sp legato a un alogeno"],e:"È un nucleofilo forte. Il carbocatione, con carica positiva, è un elettrofilo."},
{id:"CU610",s:"chem",u:6,q:"Un gruppo elettron-attrattore legato vicino a un carbocatione:",o:["lo destabilizza","lo stabilizza","non ha effetto","lo trasforma in carbanione","lo rende aromatico"],e:"I gruppi elettron-donatori (es. alchilici) stabilizzano i carbocationi; quelli elettron-attrattori (es. −CF₃, −NO₂) li destabilizzano."},
{id:"CU611",s:"chem",u:6,q:"La delocalizzazione elettronica (risonanza) in una molecola:",o:["la stabilizza, distribuendo gli elettroni π su più atomi","la destabilizza, concentrando gli elettroni π su un atomo","la stabilizza, distribuendo gli elettroni σ su più atomi","la rende sempre più reattiva verso gli elettrofili","è possibile solo in molecole con legami ionici"],e:"Esempi: benzene, ione carbossilato, dieni coniugati."},
{id:"CU612",s:"chem",u:6,q:"Il naftalene è:",o:["un idrocarburo aromatico a due anelli benzenici fusi","un idrocarburo aromatico a tre anelli benzenici fusi","un cicloalcano saturo a due anelli fusi","un eterociclo aromatico azotato a due anelli","un idrocarburo aromatico con due anelli uniti da un legame semplice"],e:"Ha 10 elettroni π (4n + 2 con n = 2)."},
{id:"CU613",s:"chem",u:6,q:"La clorazione del benzene (Cl₂ con catalizzatore FeCl₃) produce:",o:["clorobenzene per sostituzione elettrofila","1,2-diclorocicloesadiene per addizione","esaclorocicloesano per addizione radicalica","clorobenzene per sostituzione nucleofila","benzilcloruro per sostituzione radicalica"],e:"Il catalizzatore (acido di Lewis) genera l'elettrofilo Cl⁺."},
{id:"CU614",s:"chem",u:6,q:"Nella reazione SN2 di un alogenuro chirale (R), il prodotto ha configurazione:",o:["invertita (di norma S, se le priorità non cambiano)","uguale (R), con ritenzione di configurazione","racemica, per attacco da entrambi i lati","invertita, ma con perdita di attività ottica","meso, per formazione di un piano di simmetria interno"],e:"Il nucleofilo attacca dal lato opposto al gruppo uscente (inversione di Walden)."},
{id:"CU615",s:"chem",u:6,q:"Nella reazione SN1 di un alogenuro chirale, il prodotto è di solito:",o:["una miscela (quasi) racemica, per attacco da entrambi i lati","un solo enantiomero invertito, per attacco dal lato opposto","un solo enantiomero con la stessa configurazione del reagente","un composto meso otticamente inattivo","un solo enantiomero, perché il carbocatione è tetraedrico"],e:"Il carbocatione è sp² e planare."},
{id:"CU616",s:"chem",u:6,q:"Tra i seguenti, il miglior gruppo uscente nelle sostituzioni nucleofile è:",o:["I⁻","F⁻","OH⁻","NH₂⁻","CH₃⁻"],e:"Un buon gruppo uscente è una base debole e stabile: I⁻ > Br⁻ > Cl⁻ ≫ F⁻."},
{id:"CU617",s:"chem",u:6,q:"Il gruppo −NH₂ legato all'anello benzenico (anilina) è:",o:["fortemente attivante e orto/para orientante","fortemente disattivante e meta orientante","debolmente disattivante e orto/para orientante","fortemente attivante e meta orientante","debolmente attivante e solo para orientante"],e:"Il doppietto dell'azoto si delocalizza sull'anello aumentandone la densità elettronica."},
{id:"CU618",s:"chem",u:6,q:"Il polietilene è un polimero ottenuto da:",o:["etilene (etene), per addizione","etilene (etene), per condensazione","glucosio, per condensazione","acetilene (etino), per addizione","etanolo, per condensazione con perdita d'acqua"],e:"I polimeri di addizione si formano per apertura dei doppi legami dei monomeri."},

BANK.push(
// ---- Unità 1: metodi, unità di misura, vettori (+34 MC)
{id:"FU101",s:"fis",u:1,q:"Le sette grandezze fondamentali del SI comprendono:",o:["lunghezza, massa, tempo, corrente, temperatura, quantità di sostanza, intensità luminosa","lunghezza, massa, tempo, forza, temperatura, quantità di sostanza, intensità luminosa","lunghezza, massa, tempo, corrente, temperatura, carica elettrica, intensità luminosa","lunghezza, massa, tempo, corrente, energia, quantità di sostanza, intensità luminosa","lunghezza, peso, tempo, corrente, temperatura, quantità di sostanza, pressione"],e:"Tutte le altre grandezze (forza, energia, pressione…) sono derivate."},
{id:"FU102",s:"fis",u:1,q:"L'unità di misura SI dell'intensità luminosa è:",o:["la candela","il lumen","il lux","il watt","la diottria"],e:"Il lumen (flusso luminoso) e il lux (illuminamento) sono unità derivate."},
{id:"FU103",s:"fis",u:1,q:"Il joule, espresso in unità fondamentali SI, equivale a:",o:["kg·m²/s²","kg·m/s²","kg·m²/s","kg/(m·s²)","kg·m³/s²"],e:"J = N·m = (kg·m/s²)·m."},
{id:"FU104",s:"fis",u:1,q:"Il watt, espresso in unità fondamentali SI, equivale a:",o:["kg·m²/s³","kg·m²/s²","kg·m/s","kg·m/s³","kg/s"],e:"W = J/s."},
{id:"FU105",s:"fis",u:1,q:"Quale coppia di grandezze ha le stesse dimensioni fisiche?",o:["Lavoro ed energia cinetica","Forza e lavoro","Potenza ed energia","Pressione e forza","Impulso ed energia cinetica"],e:"Entrambe si misurano in joule."},
{id:"FU106",s:"fis",u:1,q:"Quale delle seguenti grandezze è adimensionale?",o:["L'indice di rifrazione","La densità","La viscosità","La frequenza","Il periodo di oscillazione"],e:"n = c/v è un rapporto tra velocità. Sono adimensionali anche gli angoli in radianti e il numero di Reynolds."},
{id:"FU107",s:"fis",u:1,q:"Il prefisso 'pico' corrisponde a:",o:["10⁻¹²","10⁻⁹","10⁻¹⁵","10¹²","10⁻⁶"],e:"milli 10⁻³, micro 10⁻⁶, nano 10⁻⁹, pico 10⁻¹², femto 10⁻¹⁵."},
{id:"FU108",s:"fis",u:1,q:"Il prefisso 'giga' corrisponde a:",o:["10⁹","10⁶","10¹²","10³","10⁻⁹"],e:"kilo 10³, mega 10⁶, giga 10⁹, tera 10¹²."},
{id:"FU109",s:"fis",u:1,q:"Un volume di 1 m³ corrisponde a:",o:["10⁶ cm³","10³ cm³","10⁹ cm³","10² cm³","10⁴ cm³"],e:"(100 cm)³ = 10⁶ cm³."},
{id:"FU110",s:"fis",u:1,q:"Una densità di 1 g/cm³ corrisponde a:",o:["1000 kg/m³","1 kg/m³","10 kg/m³","0,001 kg/m³","100 kg/m³"],e:"1 g/cm³ = 10⁻³ kg / 10⁻⁶ m³ = 10³ kg/m³."},
{id:"FU111",s:"fis",u:1,q:"Una velocità di 1 m/s corrisponde a:",o:["3,6 km/h","1 km/h","0,36 km/h","36 km/h","60 km/h"],e:"1 m/s × 3600 s/h / 1000 m/km = 3,6 km/h."},
{id:"FU112",s:"fis",u:1,q:"Una pressione di 1 atm corrisponde a circa:",o:["1,013·10⁵ Pa","1,013·10³ Pa","760 Pa","1,013·10⁴ Pa","1,013·10⁶ Pa"],e:"1 atm = 760 mmHg ≈ 101 325 Pa ≈ 1,013 bar."},
{id:"FU113",s:"fis",u:1,q:"Un'ora corrisponde a:",o:["3600 s","360 s","60 s","36 000 s","6000 s"],e:"60 × 60."},
{id:"FU114",s:"fis",u:1,q:"Una lunghezza d'onda di 600 nm corrisponde a:",o:["6·10⁻⁷ m","6·10⁻⁹ m","6·10⁻⁶ m","6·10⁻⁵ m","6·10⁻¹² m"],e:"600 × 10⁻⁹ m = 6·10⁻⁷ m."},
{id:"FU115",s:"fis",u:1,q:"L'ordine di grandezza del diametro di un atomo è:",o:["10⁻¹⁰ m","10⁻⁶ m","10⁻¹⁵ m","10⁻³ m","10⁻²⁰ m"],e:"Circa 0,1 nm (1 ångström). Il nucleo è circa 100 000 volte più piccolo (10⁻¹⁵ m)."},
{id:"FU116",s:"fis",u:1,q:"L'ordine di grandezza del diametro di una cellula eucariotica tipica è:",o:["10⁻⁵ m (decine di micrometri)","10⁻⁷ m (decimi di micrometro)","10⁻³ m (millimetri)","10⁻⁹ m (nanometri)","10⁻⁶ m (un micrometro)"],e:"Le cellule umane misurano in genere tra 10 e 30 μm."},
{id:"FU117",s:"fis",u:1,q:"Il numero 3,2·10⁴ moltiplicato per 2·10⁻⁶ dà:",o:["6,4·10⁻²","6,4·10⁻¹⁰","6,4·10²","1,6·10¹⁰","3,2·10⁻²"],e:"3,2 × 2 = 6,4; 10⁴ × 10⁻⁶ = 10⁻²."},
{id:"FU118",s:"fis",u:1,q:"Il rapporto (8·10⁶)/(4·10⁻³) vale:",o:["2·10⁹","2·10³","32·10³","2·10⁻⁹","4·10⁹"],e:"8/4 = 2; 10⁶/10⁻³ = 10⁹."},
{id:"FU119",s:"fis",u:1,q:"Le cifre significative del numero 0,00450 sono:",o:["3","2","5","6","4"],e:"Gli zeri iniziali non contano, lo zero finale dopo la virgola sì: 4, 5, 0."},
{id:"FU120",s:"fis",u:1,q:"Una misura con errore casuale piccolo ma errore sistematico grande è:",o:["precisa ma poco accurata","accurata e precisa","accurata ma poco precisa","né accurata né precisa per definizione","perfetta"],e:"La precisione riguarda la ripetibilità; l'accuratezza la vicinanza al valore vero."},
{id:"FU121",s:"fis",u:1,q:"Una grandezza vettoriale è caratterizzata da:",o:["modulo, direzione e verso","solo modulo","solo direzione","modulo e unità di misura soltanto","solo verso"],e:"Esempi: spostamento, velocità, forza, campo elettrico."},
{id:"FU122",s:"fis",u:1,q:"Il vettore opposto di un vettore a:",o:["ha lo stesso modulo e la stessa direzione, ma verso opposto","ha lo stesso modulo e verso opposto, ma direzione perpendicolare","ha modulo opposto, cioè negativo, e la stessa direzione","ha la stessa direzione e lo stesso verso, ma modulo nullo","ha modulo doppio e verso opposto"],e:"a + (−a) = 0."},
{id:"FU123",s:"fis",u:1,q:"Le componenti cartesiane di un vettore di modulo 10 inclinato di 30° rispetto all'asse x sono circa:",o:["(8,7; 5)","(5; 8,7)","(10; 10)","(7,1; 7,1)","(3; 10)"],e:"aₓ = 10·cos 30° ≈ 8,66; a_y = 10·sen 30° = 5."},
{id:"FU124",s:"fis",u:1,q:"Il modulo del vettore di componenti (6, 8) è:",o:["10","14","2","48","100"],e:"√(36 + 64) = 10."},
{id:"FU125",s:"fis",u:1,q:"La somma dei vettori (2, 3) e (4, −1) è:",o:["(6, 2)","(6, 4)","(−2, 4)","(8, −3)","(2, 2)"],e:"Si sommano le componenti corrispondenti."},
{id:"FU126",s:"fis",u:1,q:"Il prodotto vettoriale di due vettori:",o:["un vettore perpendicolare al piano dei due vettori","uno scalare pari a a·b·cos θ","un vettore parallelo al primo vettore","un vettore nullo se i vettori sono perpendicolari","un vettore che giace nel piano dei due vettori"],e:"Il modulo vale a·b·sen θ e il verso si trova con la regola della mano destra; è nullo per vettori paralleli."},
{id:"FU127",s:"fis",u:1,q:"Il prodotto scalare di due vettori di modulo 3 e 5 che formano un angolo di 180° vale:",o:["−15","15","0","8","−8"],e:"a·b·cos 180° = 15 × (−1)."},
{id:"FU128",s:"fis",u:1,q:"Il lavoro di una forza è definito come il prodotto scalare tra forza e spostamento. Per questo il lavoro è:",o:["uno scalare, che può essere positivo, negativo o nullo","un vettore parallelo allo spostamento del corpo","uno scalare, che è sempre positivo o nullo","un vettore parallelo alla forza applicata","uno scalare, sempre negativo se c'è attrito"],e:"Il segno dipende dall'angolo tra forza e spostamento."},
{id:"FU129",s:"fis",u:1,q:"Il radiante è definito come:",o:["l'angolo al centro che sottende un arco lungo quanto il raggio","l'angolo al centro che sottende un arco lungo quanto il diametro","l'angolo al centro che sottende un arco lungo 1 metro","la 360ª parte dell'angolo giro","l'angolo al centro che sottende un arco lungo π volte il raggio"],e:"Un angolo giro vale 2π rad, quindi 1 rad ≈ 57,3°."},
{id:"FU130",s:"fis",u:1,q:"Un angolo di 90° espresso in radianti vale:",o:["π/2","π","2π","π/4","90π"],e:"180° = π rad."},
{id:"FU131",s:"fis",u:1,q:"Nel grafico di una funzione y = k·x (proporzionalità diretta) si ottiene:",o:["una retta passante per l'origine","una retta che non passa per l'origine","un'iperbole equilatera","una parabola con vertice nell'origine","una retta orizzontale"],e:"La proporzionalità inversa y = k/x dà un'iperbole; y = k·x² una parabola."},
{id:"FU132",s:"fis",u:1,q:"La pendenza del grafico posizione-tempo di un corpo in un certo istante rappresenta:",o:["la velocità istantanea","l'accelerazione istantanea","lo spazio percorso fino a quell'istante","la velocità media dall'istante iniziale","la forza agente in quell'istante"],e:"La derivata della velocità rispetto al tempo è invece l'accelerazione."},
{id:"FU133",s:"fis",u:1,q:"L'area sotto il grafico forza-spostamento rappresenta:",o:["il lavoro compiuto dalla forza","la potenza sviluppata dalla forza","l'impulso della forza","la quantità di moto finale","l'energia potenziale iniziale"],e:"Matematicamente è l'integrale della forza nello spostamento. L'area sotto il grafico forza-tempo è invece l'impulso."},
{id:"FU134",s:"fis",u:1,q:"Una grandezza che raddoppia ogni volta che passa una stessa quantità di tempo cresce in modo:",o:["esponenziale","lineare","quadratico","logaritmico","inversamente proporzionale"],e:"Il decadimento radioattivo è l'esempio speculare: decrescita esponenziale."},

// ---- Unità 3: fluidi (+6 MC)
{id:"FU301",s:"fis",u:3,q:"La pressione sul fondo di un recipiente pieno di liquido dipende:",o:["dall'altezza e dalla densità del liquido, non dalla forma","dalla quantità totale di liquido nel recipiente","dalla forma del recipiente e dall'altezza del liquido","dall'area del fondo e dalla massa del liquido","dalla densità del liquido e dall'area del fondo"],e:"È il paradosso idrostatico: P = ρ·g·h."},
{id:"FU302",s:"fis",u:3,q:"Un oggetto immobile che galleggia nel mare è soggetto a:",o:["una spinta di Archimede uguale e opposta al suo peso","una spinta di Archimede maggiore del suo peso","una spinta di Archimede minore del suo peso","solo al proprio peso, senza altre forze","una spinta pari al peso del volume della parte emersa"],e:"Se la risultante non fosse nulla l'oggetto accelererebbe."},
{id:"FU303",s:"fis",u:3,q:"Due vasi comunicanti contengono lo stesso liquido. All'equilibrio:",o:["il liquido raggiunge la stessa altezza nei due vasi","il livello è più alto nel vaso più largo","il livello è più alto nel vaso più stretto","il liquido si sposta tutto nel vaso più basso","il livello dipende dalla quantità di liquido in ciascuno"],e:"Vale per vasi larghi; per tubi capillari intervengono gli effetti di tensione superficiale."},
{id:"FU304",s:"fis",u:3,q:"La densità relativa di una sostanza è:",o:["il rapporto tra la sua densità e quella dell'acqua (adimensionale)","il rapporto tra la sua massa e il suo volume (in kg/m³)","il rapporto tra il suo peso e il suo volume (in N/m³)","il rapporto tra la sua densità e quella dell'aria (adimensionale)","la sua densità misurata a 0 °C (in kg/m³)"],e:"Una sostanza con densità relativa 2 è due volte più densa dell'acqua."},
{id:"FU305",s:"fis",u:3,q:"In un'arteria il sangue scorre in regime laminare. Raddoppiando la lunghezza del tratto considerato, a parità di portata, la caduta di pressione:",o:["raddoppia","si dimezza","resta uguale","quadruplica","si riduce di 16 volte"],e:"Per Poiseuille ΔP = Q·R con R ∝ L."},
