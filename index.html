{id:"B333",s:"bio",u:5,q:"Il fattore di trascrizione NF-κB, in una cellula non stimolata, resta nel citoplasma perché:",o:["è legato a IκB, che ne maschera il segnale NLS","è privo di segnale NLS finché non viene fosforilato","è ancorato alla membrana del RE come SREBP","è legato a IκB, che lo tiene ancorato all'actina","viene continuamente degradato dal proteasoma"],e:"In seguito a uno stimolo (es. TNF) IκB viene fosforilato, ubiquitinato e degradato: NF-κB entra nel nucleo e attiva geni dell'infiammazione."},
{id:"B334",s:"bio",u:5,q:"Gli mRNA maturi escono dal nucleo:",o:["attraverso i pori nucleari, associati a proteine di esportazione","per diffusione attraverso la doppia membrana nucleare","tramite vescicole che gemmano dalla membrana nucleare esterna","attraverso i pori nucleari, ancora con gli introni non rimossi","solo durante la mitosi, quando l'involucro si disgrega"],e:"Solo gli mRNA correttamente processati (con cap, splicing completo e coda di poli(A)) vengono esportati in modo efficiente."},

{id:"B336",s:"bio",u:6,q:"La laminina è:",o:["una glicoproteina della lamina basale che lega integrine e collagene IV","la principale proteina fibrosa del connettivo, organizzata a tripla elica","un filamento intermedio della lamina nucleare","un glicosamminoglicano della matrice, molto idratato","una caderina delle giunzioni aderenti degli epiteli"],e:"La principale proteina fibrosa della matrice è il collagene; le lamine nucleari, nonostante il nome simile, sono filamenti intermedi del nucleo."},
{id:"B337",s:"bio",u:6,q:"Il collagene:",o:["la proteina più abbondante del corpo, a tripla elica ricca di glicina","un polisaccaride a tripla elica ricco di N-acetilglucosammina","una proteina globulare che non subisce modificazioni","una proteina ad α-elica singola presente solo nelle ossa","la proteina più abbondante del corpo, a foglietto β ricco di cisteina"],e:"L'idrossilazione di prolina e lisina richiede vitamina C: la sua carenza (scorbuto) produce collagene fragile."},
{id:"B338",s:"bio",u:6,q:"Le adesioni focali sono:",o:["punti in cui integrine legate alla matrice si connettono all'actina","giunzioni tra due cellule epiteliali basate su caderine e actina","punti in cui integrine si connettono ai filamenti intermedi","canali tra citoplasmi adiacenti formati da connessine","punti in cui le caderine si legano alla lamina basale"],e:"Sono anche centri di segnalazione (es. chinasi FAK) importanti per la meccanotrasduzione."},
{id:"B339",s:"bio",u:6,q:"Nelle giunzioni aderenti, le caderine sono collegate ai filamenti di actina tramite:",o:["le catenine","le connessine","le integrine","le claudine","le cheratine"],e:"La β-catenina è anche un fattore di trascrizione nella via di segnalazione Wnt."},
{id:"B340",s:"bio",u:6,q:"Le CAM della superfamiglia delle immunoglobuline (es. N-CAM):",o:["mediano adesioni cellula-cellula indipendenti dal calcio","mediano adesioni cellula-cellula strettamente calcio-dipendenti","mediano adesioni cellula-matrice legando la fibronectina","formano canali tra i citoplasmi di cellule vicine","sono recettori di membrana per gli ormoni steroidei"],e:"Questa è la differenza principale rispetto alle caderine, che sono calcio-dipendenti."},
{id:"B341",s:"bio",u:6,q:"La meccanotrasduzione è:",o:["la conversione di stimoli meccanici in segnali biochimici","la conversione di segnali chimici in forza meccanica nel sarcomero","la trasmissione meccanica degli impulsi lungo l'assone","il trasporto meccanico di vescicole lungo i microtubuli","la conversione di stimoli luminosi in segnali elettrici"],e:"Coinvolge integrine, adesioni focali, citoscheletro e canali ionici sensibili allo stiramento."},
{id:"B342",s:"bio",u:6,q:"I plasmodesmi delle cellule vegetali sono funzionalmente analoghi:",o:["alle giunzioni comunicanti delle cellule animali","alle giunzioni occludenti degli epiteli intestinali","ai desmosomi che uniscono le cellule epiteliali","agli emidesmosomi che ancorano alla lamina basale","alle adesioni focali che legano la matrice"],e:"Sono canali che attraversano la parete cellulare e mettono in comunicazione i citoplasmi di cellule vicine."},
{id:"B343",s:"bio",u:6,q:"Il recettore nicotinico dell'acetilcolina della giunzione neuromuscolare è:",o:["un canale ionico ligando-dipendente","un recettore accoppiato a proteine G (tipo Gq)","un canale ionico voltaggio-dipendente per il Ca²⁺","un recettore tirosin-chinasico dimerico","un canale per il Cl⁻ attivato dall'acetilcolina"],e:"Il legame dell'acetilcolina apre un canale cationico (Na⁺, K⁺) che depolarizza la fibra muscolare. I recettori muscarinici sono invece GPCR."},
{id:"B344",s:"bio",u:6,q:"In una sinapsi chimica, il rilascio del neurotrasmettitore è innescato da:",o:["ingresso di Ca²⁺ nel terminale presinaptico","ingresso di Na⁺ nel terminale tramite recettori nicotinici","uscita di K⁺ dal terminale attraverso canali voltaggio-dipendenti","ingresso di Ca²⁺ nella cellula postsinaptica","ingresso di Cl⁻ nel terminale presinaptico"],e:"Il Ca²⁺ agisce sui sensori del complesso SNARE (es. sinaptotagmina), provocando la fusione delle vescicole con la membrana."},
{id:"B345",s:"bio",u:6,q:"La segnalazione iuxtacrina (per contatto), come nella via Notch:",o:["ligando e recettore restano sulle membrane di due cellule a contatto","il ligando viene secreto e diffonde fino alle cellule vicine","il ligando viaggia nel sangue fino a cellule lontane","il ligando agisce sulla stessa cellula che lo produce","il segnale passa tra citoplasmi adiacenti tramite giunzioni gap"],e:"Nella via Notch il legame con il ligando Delta provoca il taglio di Notch e il rilascio di un frammento che entra nel nucleo."},
{id:"B346",s:"bio",u:6,q:"L'amplificazione del segnale nelle vie con secondi messaggeri significa che:",o:["un solo ligando porta alla produzione di moltissime molecole a valle","il segnale si riduce a ogni passaggio per evitare eccessi","ogni ligando attiva un solo enzima, che produce un solo messaggero","il numero di recettori in membrana aumenta dopo il legame","il ligando entra nel nucleo e attiva più geni insieme"],e:"Ogni passaggio enzimatico (es. adenilato ciclasi → cAMP → PKA → fosforilazioni) moltiplica il numero di molecole coinvolte."},
{id:"B347",s:"bio",u:6,q:"La tossina del colera provoca una grave diarrea perché:",o:["mantiene Gs sempre attiva, con aumento continuo di cAMP","mantiene Gi sempre attiva, con calo continuo di cAMP","inibisce la pompa Na⁺/K⁺ degli enterociti","degrada le giunzioni occludenti dell'epitelio intestinale","blocca i canali CFTR, impedendo l'uscita di Cl⁻"],e:"L'alto cAMP attiva la PKA, che apre i canali CFTR per il Cl⁻: escono Cl⁻, Na⁺ e grandi quantità d'acqua."},
{id:"B348",s:"bio",u:6,q:"Il recettore dell'insulina, una volta attivato:",o:["fosforila su tirosina gli IRS, che attivano PI3K/Akt e Ras-MAPK","fosforila su serina gli IRS, che attivano la PKA e la glicogenolisi","attiva una proteina Gs, che aumenta il cAMP","apre direttamente un canale per il glucosio (GLUT4)","entra nel nucleo e agisce da fattore di trascrizione"],e:"Tramite la via PI3K/Akt promuove la traslocazione di GLUT4 in membrana e la sintesi di glicogeno."},
{id:"B349",s:"bio",u:6,q:"Quale delle seguenti affermazioni sul gene RAS è corretta?",o:["Codifica una GTPasi; le mutazioni oncogeniche ne riducono l'attività GTPasica","Codifica una GTPasi; le mutazioni oncogeniche ne aumentano l'attività GTPasica","Codifica un recettore tirosin-chinasico mutato in molti tumori","È un oncosoppressore da inattivare su entrambi gli alleli","Codifica una GEF che attiva la via delle MAP chinasi"],e:"RAS mutato è presente in una grande frazione dei tumori di pancreas, colon e polmone."},
{id:"B350",s:"bio",u:6,q:"La PTEN è un oncosoppressore perché:",o:["rimuove il fosfato in 3 del PIP₃, spegnendo PI3K/Akt","aggiunge un fosfato in 3 al PIP₂, attivando PI3K/Akt","rimuove il fosfato da Ras, spegnendo la via MAPK","fosforila p53 stabilizzandola dopo il danno al DNA","degrada la β-catenina nella via di Wnt"],e:"La perdita di PTEN lascia la via di sopravvivenza Akt sempre attiva."},
{id:"B351",s:"bio",u:6,q:"Il DAG prodotto dalla fosfolipasi C:",o:["rimane in membrana e, con il Ca²⁺, attiva la proteina chinasi C","diffonde nel citosol e apre i canali del Ca²⁺ del reticolo endoplasmatico","rimane in membrana e attiva l'adenilato ciclasi","diffonde nel citosol e attiva la proteina chinasi A","rimane in membrana e viene convertito in PIP₃"],e:"È l'IP₃, idrosolubile, a diffondere nel citosol e ad aprire i canali del Ca²⁺ sul reticolo endoplasmatico."},
{id:"B352",s:"bio",u:6,q:"La guanilato ciclasi solubile attivata dall'NO produce:",o:["cGMP","cAMP","IP₃","DAG","PIP₃"],e:"Il sildenafil inibisce la fosfodiesterasi 5, che degrada il cGMP, prolungando l'effetto vasodilatatore."},
{id:"B353",s:"bio",u:6,q:"Quale tra i seguenti è un esempio di segnalazione endocrina?",o:["L'insulina secreta dal pancreas che agisce sul fegato e sui muscoli","Un neurotrasmettitore che agisce sul neurone postsinaptico","L'NO che agisce sulle cellule muscolari lisce adiacenti","Un fattore di crescita che agisce sulla cellula che lo produce","Un ligando di membrana che contatta la cellula vicina"],e:"Nella segnalazione endocrina l'ormone viaggia nel sangue fino a cellule bersaglio lontane."},
{id:"B354",s:"bio",u:6,q:"Gli ormoni steroidei sono trasportati nel sangue legati a proteine perché:",o:["sono poco solubili in acqua","sono troppo grandi","sono carichi positivamente","verrebbero subito fosforilati","devono attraversare la barriera ematoencefalica"],e:"Sono trasportati, ad esempio, dall'albumina o da proteine specifiche come la transcortina per il cortisolo."},

{id:"B355",s:"bio",u:7,q:"Una cellula diploide con 2n = 20, dopo la fase S, contiene:",o:["20 cromosomi formati ciascuno da 2 cromatidi (40 cromatidi)","40 cromosomi formati ciascuno da 1 cromatidio (40 cromatidi)","10 cromosomi formati ciascuno da 2 cromatidi (20 cromatidi)","20 cromosomi formati ciascuno da 1 cromatidio (20 cromatidi)","40 cromosomi formati ciascuno da 2 cromatidi (80 cromatidi)"],e:"La replicazione raddoppia il DNA ma non il numero di cromosomi, perché i cromatidi fratelli restano uniti."},
{id:"B356",s:"bio",u:7,q:"I principali punti di controllo (checkpoint) del ciclo cellulare si trovano:",o:["in G1/S, in G2/M e nella transizione metafase-anafase","in G1/S, in fase S e nella transizione profase-metafase","in G0/G1, in G2/M e durante la citodieresi","in G1/S, in G2/M e nella transizione anafase-telofase","solo in G1/S, l'unico punto di non ritorno"],e:"Verificano rispettivamente l'integrità del DNA e le condizioni per entrare in S, la replicazione completa del DNA e il corretto attacco dei cromosomi al fuso."},
{id:"B357",s:"bio",u:7,q:"Il complesso ciclina B-CDK1 (MPF):",o:["promuove l'ingresso in mitosi, ad esempio fosforilando le lamine","promuove l'ingresso in fase S, ad esempio fosforilando Rb ed E2F","promuove l'uscita dalla mitosi, defosforilando le lamine","promuove l'anafase ubiquitinando direttamente la securina","promuove la duplicazione dei centrioli in fase G1"],e:"La sua attivazione richiede la defosforilazione da parte della fosfatasi Cdc25; l'uscita dalla mitosi richiede la degradazione della ciclina B da parte di APC/C."},
{id:"B358",s:"bio",u:7,q:"Gli inibitori delle CDK come p21 e p16:",o:["bloccano i complessi ciclina-CDK e arrestano il ciclo","attivano i complessi ciclina-CDK e accelerano il ciclo cellulare","degradano le cicline tramite il proteasoma","fosforilano Rb e liberano E2F","sono oncogeni iperespressi in molti tumori"],e:"p16 (inibitore di CDK4/6) e p21 (indotto da p53) sono oncosoppressori; la perdita di p16 è frequente in molti tumori."},
{id:"B359",s:"bio",u:7,q:"La proteina MDM2:",o:["è una ubiquitina-ligasi che marca p53 per la degradazione","è una ubiquitina-ligasi che marca Rb per la degradazione","è un coattivatore che stabilizza p53 dopo il danno","è un inibitore delle CDK indotto da p53","è una chinasi che fosforila p53 dopo il danno al DNA"],e:"In molti tumori MDM2 è amplificato, e p53 viene degradato anche se il suo gene non è mutato."},
{id:"B360",s:"bio",u:7,q:"Durante la prometafase della mitosi:",o:["l'involucro si frammenta e i microtubuli si attaccano ai cinetocori","i cromosomi si allineano sulla piastra equatoriale","i cromatidi fratelli si separano e migrano ai poli","l'involucro si riforma e i cromosomi si decondensano","i cromosomi iniziano a condensarsi e i centrosomi si duplicano"],e:"Profase: condensazione dei cromosomi e formazione del fuso. Prometafase: rottura dell'involucro e attacco ai cinetocori. Metafase: allineamento sulla piastra equatoriale."},
{id:"B361",s:"bio",u:7,q:"Nella telofase:",o:["l'involucro si riforma e i cromosomi si decondensano","l'involucro si frammenta e i cromosomi si condensano","i cromosomi si allineano sulla piastra equatoriale","i cromatidi fratelli si separano verso i poli","i microtubuli del fuso si attaccano ai cinetocori"],e:"La riformazione dell'involucro richiede la defosforilazione delle lamine, una volta inattivata CDK1."},
{id:"B362",s:"bio",u:7,q:"Una divisione asimmetrica produce:",o:["due figlie con destini diversi, per determinanti distribuiti in modo ineguale","due figlie con numero di cromosomi diverso, per una non disgiunzione mitotica","una cellula aploide e una diploide da un'unica divisione","due figlie con lo stesso destino ma con DNA diverso","due cellule tetraploidi per mancata citodieresi"],e:"È tipica delle cellule staminali, che generano una staminale (autorinnovamento) e una cellula destinata a differenziarsi."},
{id:"B363",s:"bio",u:7,q:"Il complesso sinaptonemale:",o:["tiene appaiati i cromosomi omologhi durante la profase I","tiene uniti i cromatidi fratelli fino all'anafase II","tiene appaiati gli omologhi durante tutta la metafase II","separa gli omologhi tagliando le coesine in anafase I","organizza il fuso meiotico a partire dai centrosomi duplicati"],e:"Si forma nello zigotene e si dissolve nel diplotene, quando restano visibili i chiasmi."},
{id:"B364",s:"bio",u:7,q:"La variabilità genetica dei gameti prodotti dalla meiosi deriva:",o:["dall'assortimento indipendente in metafase I e dal crossing over","dalla separazione dei cromatidi fratelli in anafase II soltanto","dal crossing over tra cromatidi fratelli in profase II","dall'assortimento indipendente in metafase II e dalle mutazioni","dalla replicazione semiconservativa che precede la meiosi"],e:"Solo con l'assortimento indipendente l'uomo può produrre 2²³ (circa 8 milioni) combinazioni di cromosomi; il crossing over ne aumenta ancora il numero."},
{id:"B365",s:"bio",u:7,q:"Nella metafase I della meiosi si allineano sulla piastra equatoriale:",o:["le coppie di cromosomi omologhi (bivalenti o tetradi)","i singoli cromosomi a due cromatidi, come nella mitosi","i singoli cromatidi, già separati dai fratelli","solo i cromosomi sessuali, appaiati nella regione PAR","i centrioli duplicati, ai due lati del fuso"],e:"Nella metafase II, invece, si allineano i singoli cromosomi formati da due cromatidi."},
{id:"B366",s:"bio",u:7,q:"Al termine della meiosi II di una cellula umana si ottengono cellule con:",o:["23 cromosomi a un cromatidio ciascuno","46 cromosomi a un cromatidio ciascuno","23 cromosomi a due cromatidi ciascuno","46 cromosomi a due cromatidi ciascuno","23 coppie di omologhi a un cromatidio"],e:"La meiosi II, equazionale, separa i cromatidi fratelli."},
{id:"B367",s:"bio",u:7,q:"Un'ovogenesi completa a partire da un ovocita primario produce:",o:["un ovulo e i globuli polari","quattro ovuli di uguali dimensioni","due ovuli e due globuli polari","quattro globuli polari e nessun ovulo","due ovuli diploidi"],e:"Le divisioni sono asimmetriche: quasi tutto il citoplasma resta all'ovocita, mentre i globuli polari degenerano."},
{id:"B368",s:"bio",u:7,q:"Nella donna la meiosi II dell'ovocita si completa:",o:["solo dopo la fecondazione da parte dello spermatozoo","prima dell'ovulazione, nel follicolo di Graaf maturo","alla pubertà, insieme alla meiosi I","durante la vita fetale, prima del blocco in profase I","subito dopo l'ovulazione, anche senza fecondazione"],e:"L'ovocita secondario ovulato è bloccato in metafase II; l'ingresso dello spermatozoo innesca il completamento della meiosi e l'emissione del secondo globulo polare."},
{id:"B369",s:"bio",u:7,q:"L'acrosoma dello spermatozoo:",o:["una vescicola derivata dal Golgi con enzimi per la zona pellucida","una vescicola derivata dal RE con il DNA paterno condensato","un lisosoma modificato che contiene i mitocondri del collo","un perossisoma modificato con enzimi ossidativi","una vescicola derivata dal Golgi che forma il flagello"],e:"La reazione acrosomiale libera enzimi idrolitici che digeriscono la zona pellucida."},
{id:"B370",s:"bio",u:7,q:"Il sesso cromosomico di un individuo umano viene determinato:",o:["alla fecondazione, dal cromosoma sessuale dello spermatozoo","alla fecondazione, dal cromosoma sessuale dell'ovocita","alla pubertà, con l'attivazione del gene SRY","dall'ambiente uterino nelle prime settimane","alla fecondazione, dal numero di autosomi ereditati"],e:"Ovociti: sempre X. Spermatozoi: X o Y. Il gene SRY sul cromosoma Y avvia lo sviluppo dei testicoli."},
{id:"B371",s:"bio",u:7,q:"I gemelli monozigoti:",o:["derivano da un unico zigote diviso precocemente e hanno lo stesso sesso","derivano da due ovociti fecondati da un unico spermatozoo","derivano da un unico ovocita fecondato da due spermatozoi","derivano da due zigoti distinti e condividono in media il 50% del DNA","derivano da un unico zigote ma possono avere sesso diverso"],e:"I gemelli dizigoti, da due zigoti distinti, sono geneticamente simili quanto due fratelli qualsiasi."},
{id:"B372",s:"bio",u:7,q:"Le cellule staminali embrionali della massa cellulare interna della blastocisti sono:",o:["pluripotenti","totipotenti","unipotenti","già differenziate","aploidi"],e:"Lo zigote e i primi blastomeri sono totipotenti (formano anche gli annessi embrionali); le staminali adulte sono di solito multipotenti."},
{id:"B373",s:"bio",u:7,q:"Le cellule staminali pluripotenti indotte (iPS) si ottengono:",o:["riprogrammando cellule somatiche adulte con pochi fattori di trascrizione","riprogrammando cellule germinali con pochi fattori di trascrizione","prelevandole dalla massa cellulare interna della blastocisti","trasferendo un nucleo somatico in un ovocita enucleato","prelevandole dal midollo osseo di un adulto"],e:"Yamanaka (Nobel 2012) usò quattro fattori: Oct4, Sox2, Klf4 e c-Myc."},
{id:"B374",s:"bio",u:7,q:"Nell'apoptosi, oltre al citocromo c, dallo spazio intermembrana mitocondriale può essere rilasciata la proteina AIF, che:",o:["va nel nucleo e frammenta il DNA senza le caspasi","va nel nucleo e frammenta il DNA attivando la caspasi 3","lega Apaf-1 e forma l'apoptosoma con la caspasi 9","inibisce Bax e Bak impedendo la permeabilizzazione","forma il complesso DISC con FADD e la caspasi 8"],e:"AIF = Apoptosis Inducing Factor."},
{id:"B375",s:"bio",u:7,q:"Durante l'apoptosi la cellula:",o:["si raggrinzisce, condensa la cromatina e forma corpi apoptotici","si rigonfia, perde l'integrità di membrana e libera il contenuto","si raggrinzisce ma rilascia il contenuto attivando l'infiammazione","si rigonfia, condensa la cromatina e forma corpi apoptotici","si divide in due cellule figlie prive di nucleo"],e:"I fagociti riconoscono i corpi apoptotici, ad esempio tramite la fosfatidilserina esposta sul foglietto esterno."},
{id:"B376",s:"bio",u:7,q:"Le proteine BH3-only (es. Bid, Bim, Puma):",o:["sono sensori pro-apoptotici che neutralizzano Bcl-2 o attivano Bax e Bak","sono proteine anti-apoptotiche che inibiscono Bax e Bak sul mitocondrio","sono caspasi iniziatrici attivate nell'apoptosoma","sono effettori che formano pori nella membrana mitocondriale","sono recettori di morte che legano FasL o TNF"],e:"Puma e Noxa sono indotte da p53 dopo un danno al DNA; Bid, tagliato dalla caspasi 8, collega la via estrinseca a quella intrinseca."},
{id:"B377",s:"bio",u:7,q:"L'apoptosi è importante durante lo sviluppo embrionale, ad esempio per:",o:["eliminare le cellule tra le dita, separandole","aumentare il numero di neuroni oltre il necessario","fondere i mioblasti per formare le fibre muscolari","formare il fuso mitotico nelle cellule del blastoderma","replicare il DNA mitocondriale nelle cellule embrionali"],e:"Elimina anche i neuroni in eccesso e i linfociti autoreattivi; il suo difetto contribuisce allo sviluppo dei tumori."},
{id:"B378",s:"bio",u:7,q:"Le caspasi iniziatrici si attivano principalmente:",o:["per avvicinamento in grandi complessi come il DISC o l'apoptosoma","per taglio proteolitico da parte delle caspasi esecutrici 3 e 7","per fosforilazione da parte di chinasi attivate dallo stress","per rilascio dall'inibitore Bcl-2 nel citosol","per legame diretto con il citocromo c nel citosol"],e:"Le esecutrici (3, 6, 7) vengono invece attivate per taglio proteolitico da parte delle iniziatrici."},
{id:"B379",s:"bio",u:7,q:"La causa più frequente di aneuploidia nell'uomo è:",o:["la non disgiunzione meiotica, soprattutto nell'ovogenesi materna","la non disgiunzione mitotica nelle prime divisioni dello zigote","la non disgiunzione meiotica, soprattutto nella spermatogenesi","la traslocazione robertsoniana ereditata da un genitore","il crossing over ineguale tra cromatidi fratelli"],e:"Il lungo blocco in profase I degli ovociti e il deterioramento della coesione con l'età materna aumentano il rischio di errori di segregazione."},
{id:"B380",s:"bio",u:7,q:"Un proto-oncogene diventa oncogene tipicamente per:",o:["una mutazione attivante, un'amplificazione o una traslocazione","la perdita di funzione di entrambi gli alleli per delezione o mutazione","l'inattivazione epigenetica per ipermetilazione del promotore","una mutazione che ne riduce l'attività in un solo allele","un errore di splicing che ne elimina il dominio catalitico"],e:"Esempi: mutazione puntiforme di RAS, amplificazione di HER2, traslocazione BCR-ABL (cromosoma Philadelphia) nella leucemia mieloide cronica."}
);
BANK.push(
{id:"BC101",s:"bio",u:1,q:"Il polisaccaride strutturale che forma l'esoscheletro degli artropodi e la parete cellulare dei funghi è la ……",c:["chitina"],e:"È un polimero di N-acetilglucosammina con legami β(1→4)."},
{id:"BC102",s:"bio",u:1,q:"L'unità di misura dei coefficienti di sedimentazione dei ribosomi (70S, 80S) prende il nome di ……",c:["svedberg","unita svedberg","unità svedberg","s"],e:"I coefficienti di sedimentazione non sono additivi: 50S + 30S = 70S."},
{id:"BC103",s:"bio",u:1,q:"Il trasferimento di DNA da un batterio donatore a un ricevente attraverso un pilo sessuale si chiama ……",c:["coniugazione"],e:"Trasformazione e trasduzione sono gli altri due meccanismi di trasferimento genico orizzontale."},
{id:"BC104",s:"bio",u:1,q:"La regione di un enzima, distinta dal sito attivo, a cui si lega un modulatore che ne cambia l'attività si chiama sito ……",c:["allosterico"],e:"La regolazione allosterica permette il controllo a feedback delle vie metaboliche."},
{id:"BC105",s:"bio",u:1,q:"Le molecole organiche non proteiche necessarie all'attività di alcuni enzimi, come NAD⁺ e coenzima A, si chiamano ……",c:["coenzimi","coenzima","cofattori"],e:"Molti coenzimi derivano da vitamine del gruppo B."},
{id:"BC106",s:"bio",u:2,q:"Il corpo di Barr è il cromosoma …… inattivato nelle cellule femminili.",c:["x"],e:"Il numero di corpi di Barr è pari al numero di X meno uno."},
{id:"BC108",s:"bio",u:2,q:"I cromosomi con il centromero molto vicino a un'estremità si dicono ……",c:["acrocentrici","acrocentrico"],e:"Metacentrici: centromero centrale. Submetacentrici: centromero spostato da un lato."},
{id:"BC109",s:"bio",u:2,q:"L'enzima che permette il movimento dei trasposoni a DNA si chiama ……",c:["trasposasi"],e:"I retrotrasposoni usano invece una trascrittasi inversa."},
{id:"BC111",s:"bio",u:3,q:"Le proteine che stabilizzano il DNA a singolo filamento alla forcella di replicazione si indicano con la sigla ……",c:["ssb","proteine ssb","rpa"],e:"Single-Strand Binding proteins (RPA negli eucarioti)."},
{id:"BC112",s:"bio",u:3,q:"Dopo 2 cicli di replicazione semiconservativa di una molecola di DNA, il numero di molecole che contengono ancora un filamento parentale è ……",c:["2","due"],n:2,e:"Si ottengono 4 molecole, di cui 2 ibride e 2 completamente nuove."},
{id:"BC113",s:"bio",u:3,q:"La sequenza dell'mRNA trascritta dallo stampo 3'-TAC-5' è 5'-……-3'",c:["aug"],e:"Complementare e antiparallela, con U al posto di T."},
{id:"BC114",s:"bio",u:3,q:"Il numero di codoni che codificano amminoacidi nel codice genetico standard è ……",c:["61","sessantuno"],n:61,e:"64 codoni totali meno 3 codoni di stop."},
{id:"BC115",s:"bio",u:3,q:"Il complesso proteico citoplasmatico in cui i miRNA guidano il silenziamento dell'mRNA bersaglio si indica con la sigla ……",c:["risc"],e:"RNA-Induced Silencing Complex, che contiene le proteine Argonaute."},
{id:"BC116",s:"bio",u:3,q:"Più ribosomi che traducono contemporaneamente lo stesso mRNA formano un ……",c:["polisoma","poliribosoma","polisomi","poliribosomi"],e:"Aumentano la resa di proteina per ogni molecola di mRNA."},
{id:"BC117",s:"bio",u:4,q:"Da AaBb × AaBb (geni indipendenti) la probabilità di un figlio AABB è 1/……",c:["16","sedici"],n:16,e:"1/4 × 1/4."},
{id:"BC118",s:"bio",u:4,q:"Un maschio, per i geni localizzati sul cromosoma X, si dice ……",c:["emizigote","emizigoto"],e:"Ha una sola copia di quei geni."},
{id:"BC119",s:"bio",u:4,q:"L'unità di misura della distanza sulle mappe genetiche, pari all'1% di ricombinazione, è il ……",c:["centimorgan","cm","centimorgan (cm)"],e:"Prende il nome da Thomas Hunt Morgan."},
{id:"BC120",s:"bio",u:4,q:"La presenza in una cellula di una miscela di DNA mitocondriale normale e mutato si chiama ……",c:["eteroplasmia"],e:"Se tutte le copie sono uguali si parla di omoplasmia."},
{id:"BC121",s:"bio",u:4,q:"La sindrome causata dalla delezione del braccio corto del cromosoma 5 si chiama sindrome del cri du ……",c:["chat"],e:"Prende il nome dal pianto acuto, simile al miagolio, dei neonati."},
{id:"BC122",s:"bio",u:4,q:"La malattia autosomica recessiva dovuta a mutazioni del canale per il cloro CFTR è la fibrosi ……",c:["cistica"],e:"La variante più frequente, ΔF508, produce una proteina mal ripiegata degradata tramite ERAD."},
{id:"BC123",s:"bio",u:5,q:"Il pH all'interno dei lisosomi è circa …… (valore intero più vicino)",c:["5","4,5","4.5","cinque"],n:5,tol:0.12,e:"Il lume è acidificato da una V-ATPasi protonica."},
{id:"BC124",s:"bio",u:5,q:"La GTPasi che strozza il collo delle vescicole di clatrina per staccarle dalla membrana è la ……",c:["dinamina"],e:"Senza dinamina le vescicole non si separano."},
{id:"BC125",s:"bio",u:5,q:"La sindrome dovuta a difetti della biogenesi dei perossisomi si chiama sindrome di ……",c:["zellweger"],e:"È causata da mutazioni dei geni PEX."},
{id:"BC126",s:"bio",u:5,q:"Il complesso della membrana mitocondriale esterna attraverso cui entrano quasi tutte le proteine importate si indica con la sigla ……",c:["tom"],e:"Translocase of the Outer Membrane."},
{id:"BC127",s:"bio",u:5,q:"L'enzima che sintetizza ATP sfruttando il gradiente protonico mitocondriale è l'ATP ……",c:["sintasi","sintetasi","sintasi f0f1","sintasi fof1"],e:"È un motore rotativo: la parte F₀ è nella membrana interna, la parte F₁ sporge nella matrice."},
{id:"BC128",s:"bio",u:5,q:"Il processo con cui una cellula ingloba grandi particelle o batteri formando un fagosoma si chiama ……",c:["fagocitosi"],e:"È tipica di macrofagi e neutrofili."},
{id:"BC129",s:"bio",u:5,q:"L'unità contrattile della fibra muscolare striata, compresa tra due linee Z, si chiama ……",c:["sarcomero"],e:"Durante la contrazione le linee Z si avvicinano."},
{id:"BC130",s:"bio",u:5,q:"Il passaggio di macromolecole attraverso una cellula epiteliale, dall'endocitosi su un lato all'esocitosi sull'altro, si chiama ……",c:["transcitosi"],e:"Esempio: le IgA secrete nelle mucose."},
{id:"BC131",s:"bio",u:6,q:"Le proteine citoplasmatiche che collegano le caderine all'actina nelle giunzioni aderenti si chiamano ……",c:["catenine","catenina"],e:"Comprendono α-catenina, β-catenina e p120."},
{id:"BC132",s:"bio",u:6,q:"La glicoproteina della lamina basale che lega integrine e collagene IV è la ……",c:["laminina"],e:"Ha una caratteristica forma a croce."},
{id:"BC133",s:"bio",u:6,q:"Le proteine che inattivano le piccole GTPasi stimolando l'idrolisi del GTP si indicano con la sigla ……",c:["gap","gtpase activating protein","gtpase-activating protein"],e:"GTPase Activating Proteins. Le GEF invece le attivano."},
{id:"BC134",s:"bio",u:6,q:"La proteina che collega le integrine ai filamenti di actina nelle adesioni focali, insieme alla vinculina, è la ……",c:["talina"],e:"La talina contribuisce anche all'attivazione delle integrine (segnalazione 'inside-out')."},
{id:"BC135",s:"bio",u:6,q:"Il recettore dell'acetilcolina della giunzione neuromuscolare, che è un canale ionico, si chiama recettore ……",c:["nicotinico"],e:"I recettori muscarinici sono invece accoppiati a proteine G."},
{id:"BC136",s:"bio",u:7,q:"Il complesso ciclina B-CDK1 è noto anche come fattore che promuove la mitosi, con la sigla ……",c:["mpf"],e:"Maturation (o M-phase) Promoting Factor."},
{id:"BC137",s:"bio",u:7,q:"La fase della profase I in cui i cromosomi omologhi si appaiano formando le sinapsi si chiama ……",c:["zigotene"],e:"Leptotene → zigotene → pachitene → diplotene → diacinesi."},
{id:"BC138",s:"bio",u:7,q:"La proteina che inibisce la separasi fino all'anafase si chiama ……",c:["securina"],e:"La securina è ubiquitinata da APC/C-Cdc20 e degradata."},
{id:"BC139",s:"bio",u:7,q:"Il complesso formato da Apaf-1 e citocromo c che attiva la caspasi 9 si chiama ……",c:["apoptosoma"],e:"È la piattaforma di attivazione della via intrinseca."},
{id:"BC140",s:"bio",u:7,q:"Le cellule staminali capaci di generare tutti i tessuti dell'embrione ma non gli annessi extraembrionali si dicono ……",c:["pluripotenti","pluripotente"],e:"Lo zigote è invece totipotente."},
{id:"BC141",s:"bio",u:7,q:"Il gene sul cromosoma Y che avvia la differenziazione dei testicoli si chiama ……",c:["sry"],e:"Sex-determining Region Y."},
{id:"BC142",s:"bio",u:7,q:"L'ubiquitina-ligasi che marca p53 per la degradazione si chiama ……",c:["mdm2","hdm2"],e:"In molti tumori MDM2 è amplificato."},
{id:"BC143",s:"bio",u:7,q:"La traslocazione tra i cromosomi 9 e 22 che produce la proteina di fusione BCR-ABL genera il cromosoma ……",c:["philadelphia","filadelfia","ph"],e:"È tipico della leucemia mieloide cronica; BCR-ABL è una tirosin-chinasi sempre attiva, bersaglio dell'imatinib."}
);

// CHIMICA E PROPEDEUTICA BIOCHIMICA — risposta multipla (parte 1: unità 1-5)
BANK.push(
{id:"C001",s:"chem",u:1,q:"Il numero di massa di un atomo è:",o:["la somma di protoni e neutroni del nucleo","il numero di protoni","il numero di elettroni","la massa atomica media espressa in grammi","il numero di neutroni"],e:"A = Z + N. Il numero atomico Z è il numero di protoni."},
{id:"C002",s:"chem",u:1,q:"Gli isotopi di uno stesso elemento hanno:",o:["lo stesso numero di protoni e un diverso numero di neutroni","lo stesso numero di neutroni e un diverso numero di protoni","lo stesso numero di massa","proprietà chimiche molto diverse","un diverso numero atomico"],e:"Gli isotopi hanno lo stesso Z (quindi stesse proprietà chimiche) ma diverso A. Esempio: ¹²C, ¹³C, ¹⁴C."},
{id:"C003",s:"chem",u:1,q:"Quanti neutroni contiene l'isotopo ¹⁴C (Z = 6)?",o:["8","6","14","20","7"],e:"N = A − Z = 14 − 6 = 8."},
{id:"C004",s:"chem",u:1,q:"Nel decadimento β⁻ un nucleo:",o:["trasforma un neutrone in un protone: Z aumenta di 1, A invariato","trasforma un protone in un neutrone: Z diminuisce di 1, A invariato","trasforma un neutrone in un protone: Z invariato, A aumenta di 1","perde 2 protoni e 2 neutroni: Z diminuisce di 2, A di 4","emette un fotone γ: Z e A restano invariati"],e:"n → p + e⁻ + antineutrino. Esempio: ¹⁴C → ¹⁴N. Nel decadimento β⁺ (emissione di un positrone) un protone diventa neutrone e Z diminuisce di 1."},
{id:"C005",s:"chem",u:1,q:"Un radioisotopo ha un tempo di dimezzamento di 6 ore. Dopo 24 ore resta una frazione dell'attività iniziale pari a:",o:["1/16","1/4","1/8","1/24","1/32"],e:"24 h = 4 emivite: (1/2)⁴ = 1/16. Esempio reale: il ⁹⁹ᵐTc della medicina nucleare ha emivita di circa 6 ore."},
{id:"C006",s:"chem",u:1,q:"La particella α è costituita da:",o:["2 protoni e 2 neutroni (un nucleo di elio)","2 protoni e 2 elettroni (un atomo di elio)","un elettrone emesso dal nucleo","un positrone emesso dal nucleo","1 protone e 1 neutrone (un deutone)"],e:"La particella α è poco penetrante (fermata da un foglio di carta) ma molto ionizzante se il nucleo che la emette viene inalato o ingerito."},
{id:"C007",s:"chem",u:1,q:"Il numero quantico secondario l = 2 identifica orbitali di tipo:",o:["d","s","p","f","g"],e:"l = 0 → s, 1 → p, 2 → d, 3 → f. Per l = 2 m può assumere 5 valori (−2…+2): 5 orbitali d."},
{id:"C008",s:"chem",u:1,q:"Il principio di esclusione di Pauli afferma che:",o:["due elettroni dello stesso atomo non hanno tutti e 4 i numeri quantici uguali","gli elettroni riempiono prima gli orbitali a energia più alta","non si possono conoscere insieme posizione e quantità di moto","gli elettroni occupano spaiati gli orbitali degeneri, con spin parallelo","due elettroni dello stesso orbitale devono avere spin parallelo"],e:"Ne segue che un orbitale contiene al massimo 2 elettroni, con spin opposto. Tra le opzioni sbagliate ci sono il principio di Heisenberg e la regola di Hund."},
{id:"C009",s:"chem",u:1,q:"La configurazione elettronica dello stato fondamentale del sodio (Z = 11) è:",o:["1s² 2s² 2p⁶ 3s¹","1s² 2s² 2p⁷","1s² 2s² 2p⁶ 3p¹","1s² 2s² 2p⁵ 3s²","1s² 2s⁸ 3s¹"],e:"Il sodio ha un solo elettrone di valenza nel 3s, che perde facilmente formando Na⁺."},
{id:"C010",s:"chem",u:1,q:"Lungo un periodo della tavola periodica, da sinistra a destra, l'elettronegatività:",o:["aumenta","diminuisce","resta costante","prima diminuisce poi aumenta","dipende solo dal numero di neutroni"],e:"Aumenta lungo il periodo (cresce la carica nucleare efficace) e diminuisce scendendo nel gruppo. Il fluoro è l'elemento più elettronegativo."},
{id:"C011",s:"chem",u:1,q:"Il raggio atomico, scendendo lungo un gruppo:",o:["aumenta","diminuisce","resta costante","si annulla","dipende dal numero di neutroni"],e:"Scendendo nel gruppo si aggiungono livelli energetici: gli elettroni esterni sono più lontani dal nucleo."},
{id:"C012",s:"chem",u:1,q:"L'energia di prima ionizzazione è:",o:["l'energia per rimuovere un elettrone da un atomo isolato gassoso","l'energia liberata quando un atomo gassoso acquista un elettrone","la tendenza di un atomo ad attrarre gli elettroni di legame","l'energia per rimuovere un elettrone da un atomo nel reticolo solido","l'energia necessaria a rompere un legame covalente omolitico"],e:"L'energia liberata acquistando un elettrone è l'affinità elettronica; l'attrazione degli elettroni di legame è l'elettronegatività."},
{id:"C013",s:"chem",u:1,q:"Tra i seguenti composti, quale è tenuto insieme da un legame prevalentemente ionico?",o:["KCl","HCl","CH₄","Cl₂","CO₂"],e:"La differenza di elettronegatività tra K (0,8) e Cl (3,0) supera 1,9: il legame è ionico. HCl e CO₂ hanno legami covalenti polari, Cl₂ e CH₄ (quasi) apolari."},
{id:"C014",s:"chem",u:1,q:"La formazione dello ione ammonio NH₄⁺ a partire da NH₃ e H⁺ comporta un legame:",o:["covalente dativo","ionico","a idrogeno","metallico","di van der Waals"],e:"Il doppietto solitario dell'azoto viene condiviso con il protone; nello ione formato i quattro legami N-H diventano equivalenti."},
{id:"C015",s:"chem",u:1,q:"Secondo la teoria VSEPR, la molecola dell'acqua ha geometria:",o:["angolare, con angolo di circa 104,5°","lineare, con angolo di 180°","trigonale planare, con angoli di 120°","tetraedrica, con angoli di 109,5° tra gli H","piramidale, con angoli di circa 107°"],e:"Quattro coppie elettroniche attorno all'ossigeno (2 di legame e 2 solitarie) hanno disposizione tetraedrica, ma la forma della molecola è angolare."},
{id:"C016",s:"chem",u:1,q:"L'ibridazione del carbonio nella molecola di CO₂ è:",o:["sp","sp²","sp³","sp³d","non ibridato"],e:"Il carbonio forma due doppi legami: due orbitali sp lineari (σ) e due p non ibridati (π). La molecola è lineare e apolare."},
{id:"C017",s:"chem",u:1,q:"Quale molecola è apolare pur contenendo legami polari?",o:["CCl₄","NH₃","H₂O","HCl","CHCl₃"],e:"In CCl₄ i quattro dipoli C-Cl, disposti tetraedricamente, si annullano. NH₃ (piramidale) e H₂O (angolare) restano polari."},
{id:"C018",s:"chem",u:1,q:"Il legame a idrogeno si forma tra un atomo di H legato a un atomo molto elettronegativo e:",o:["un doppietto solitario di un atomo come N, O o F","un atomo di carbonio con parziale carica negativa","un catione di un metallo alcalino in soluzione","un altro atomo di H legato a un carbonio","un orbitale vuoto di un atomo di boro"],e:"Spiega l'alto punto di ebollizione dell'acqua e stabilizza le strutture di proteine e acidi nucleici."},
{id:"C019",s:"chem",u:1,q:"La formula del carbonato di calcio è:",o:["CaCO₃","CaC₂","Ca(HCO₃)₂","CaCO₂","Ca₂CO₃"],e:"Ca²⁺ e CO₃²⁻ in rapporto 1:1. Ca(HCO₃)₂ è l'idrogenocarbonato (bicarbonato) di calcio."},
{id:"C020",s:"chem",u:1,q:"Il composto NaClO si chiama, in nomenclatura tradizionale:",o:["ipoclorito di sodio","clorito di sodio","clorato di sodio","perclorato di sodio","cloruro di sodio"],e:"Ossiacidi del cloro: HClO ipocloroso, HClO₂ cloroso, HClO₃ clorico, HClO₄ perclorico; i sali corrispondenti sono ipoclorito, clorito, clorato, perclorato."},
{id:"C021",s:"chem",u:1,q:"Il numero di ossidazione dello zolfo in H₂SO₄ è:",o:["+6","+4","−2","+2","+8"],e:"2(+1) + x + 4(−2) = 0 → x = +6."},
{id:"C022",s:"chem",u:1,q:"Un ossido basico si ottiene dalla reazione dell'ossigeno con:",o:["un metallo","un non metallo","un gas nobile","l'idrogeno","un alogeno"],e:"Gli ossidi dei metalli, con l'acqua, danno idrossidi (es. CaO + H₂O → Ca(OH)₂). Gli ossidi dei non metalli (anidridi) danno ossiacidi."},
{id:"C023",s:"chem",u:1,q:"Quante moli di atomi di ossigeno sono contenute in 2 mol di H₂SO₄?",o:["8","4","2","6","16"],e:"Ogni mole di H₂SO₄ contiene 4 mol di O: 2 × 4 = 8."},
{id:"C024",s:"chem",u:1,q:"La massa molare di H₂O è circa 18 g/mol. Quante molecole ci sono in 9 g di acqua?",o:["3,01·10²³","6,02·10²³","1,20·10²⁴","9,0·10²³","1,8·10²⁴"],e:"9 g / 18 g/mol = 0,5 mol; 0,5 × 6,02·10²³ = 3,01·10²³ molecole."},

{id:"C025",s:"chem",u:2,q:"Secondo la legge di Boyle, a temperatura costante, se il volume di un gas ideale si dimezza la pressione:",o:["raddoppia","si dimezza","resta costante","quadruplica","diventa un quarto"],e:"PV = costante a T costante: se V/2, allora 2P."},
{id:"C026",s:"chem",u:2,q:"Una mole di gas ideale in condizioni normali (0 °C, 1 atm) occupa circa:",o:["22,4 L","1 L","24,5 L","8,31 L","0,082 L"],e:"V = nRT/P = 1 × 0,0821 × 273 / 1 ≈ 22,4 L. A 25 °C il volume molare è circa 24,5 L."},
{id:"C027",s:"chem",u:2,q:"Nell'equazione di van der Waals per i gas reali, la costante b tiene conto:",o:["del volume proprio delle molecole (covolume)","delle forze attrattive tra le molecole","degli urti elastici delle molecole contro le pareti","della massa molare del gas considerato","della temperatura critica del gas"],e:"(P + a n²/V²)(V − nb) = nRT: a corregge per le attrazioni intermolecolari, b per il volume occupato dalle molecole."},
{id:"C028",s:"chem",u:2,q:"Un gas reale si avvicina al comportamento ideale:",o:["a bassa pressione e alta temperatura","ad alta pressione e bassa temperatura","solo vicino al punto di liquefazione","solo a 0 K","in nessuna condizione"],e:"A bassa pressione le molecole sono lontane (covolume trascurabile); ad alta temperatura l'energia cinetica supera le attrazioni intermolecolari."},
{id:"C029",s:"chem",u:2,q:"Secondo la teoria cinetica dei gas, l'energia cinetica media delle molecole è proporzionale:",o:["alla temperatura assoluta","alla pressione del gas","alla radice quadrata della temperatura","alla massa molare del gas","al quadrato della temperatura assoluta"],e:"⟨Ec⟩ = (3/2)·k·T. A parità di T, molecole più leggere hanno velocità media maggiore."},
{id:"C030",s:"chem",u:2,q:"La pressione di vapore di un liquido:",o:["aumenta all'aumentare della temperatura","diminuisce all'aumentare della temperatura","dipende dalla quantità di liquido presente","è uguale per tutti i liquidi alla stessa temperatura","non dipende dalle forze intermolecolari"],e:"Un liquido bolle quando la sua pressione di vapore eguaglia la pressione esterna; forze intermolecolari forti significano pressione di vapore bassa."},
{id:"C031",s:"chem",u:2,q:"Nel diagramma di fase dell'acqua, la linea di equilibrio solido-liquido ha pendenza negativa perché:",o:["il ghiaccio è meno denso dell'acqua liquida","il ghiaccio è più denso dell'acqua liquida","l'acqua ha un punto triplo a pressione elevata","il calore di fusione dell'acqua è negativo","l'acqua liquida è meno densa del vapore"],e:"Aumentando la pressione si favorisce la fase più densa (il liquido), quindi il punto di fusione si abbassa. Nella CO₂ la pendenza è positiva."},
{id:"C032",s:"chem",u:2,q:"A pressione atmosferica, la CO₂ solida (ghiaccio secco):",o:["sublima","fonde","resta solida a qualsiasi temperatura","si decompone in C e O₂","si trasforma in un liquido stabile"],e:"Il punto triplo della CO₂ è a circa 5,1 atm: sotto questa pressione la fase liquida non esiste e il solido passa direttamente a gas."},
{id:"C033",s:"chem",u:2,q:"Una reazione è sicuramente spontanea a qualsiasi temperatura se:",o:["ΔH < 0 e ΔS > 0","ΔH > 0 e ΔS < 0","ΔH > 0 e ΔS > 0","ΔH < 0 e ΔS < 0","ΔG > 0"],e:"ΔG = ΔH − TΔS: con ΔH negativo e ΔS positivo, ΔG è negativo a ogni temperatura."},
{id:"C034",s:"chem",u:2,q:"Una reazione endotermica:",o:["assorbe calore dall'ambiente (ΔH > 0)","libera calore nell'ambiente (ΔH < 0)","ha sempre ΔG < 0 ed è spontanea","non può mai essere spontanea (ΔG > 0)","assorbe calore e ha sempre ΔS < 0"],e:"Una reazione endotermica può essere spontanea se l'aumento di entropia è sufficiente (TΔS > ΔH), ad esempio lo scioglimento del NH₄NO₃ in acqua."},
{id:"C035",s:"chem",u:2,q:"Quale delle seguenti grandezze NON è una funzione di stato?",o:["Il lavoro","L'entalpia","L'energia interna","L'entropia","L'energia libera di Gibbs"],e:"Calore e lavoro dipendono dal percorso seguito; le funzioni di stato dipendono solo dagli stati iniziale e finale."},
{id:"C036",s:"chem",u:2,q:"La relazione tra la variazione di energia libera standard e la costante di equilibrio è:",o:["ΔG° = −RT ln K","ΔG° = RT ln K","ΔG° = −(R/T) ln K","ΔG° = −RT/ln K","ΔG° = K/RT"],e:"Se K > 1, ΔG° < 0: all'equilibrio prevalgono i prodotti."},
{id:"C037",s:"chem",u:2,q:"L'evaporazione del sudore contribuisce alla termoregolazione perché:",o:["il passaggio liquido-vapore assorbe calore dalla pelle","il sudore conduce il calore verso l'interno","l'evaporazione è un processo esotermico","il sudore aumenta la pressione di vapore dell'aria","il sale del sudore abbassa la temperatura di congelamento"],e:"Il calore latente di evaporazione dell'acqua è elevato (circa 2,4 kJ/g alla temperatura corporea) e viene sottratto alla superficie cutanea."},
{id:"C038",s:"chem",u:2,q:"Il diamante è un esempio di solido:",o:["covalente (reticolare)","ionico (reticolare)","molecolare (van der Waals)","metallico","amorfo covalente"],e:"Nel diamante ogni carbonio sp³ è legato a quattro altri in un reticolo tridimensionale di legami covalenti: altissima durezza e alto punto di fusione."},

{id:"C039",s:"chem",u:3,q:"La molarità di una soluzione che contiene 0,5 mol di NaCl in 250 mL di soluzione è:",o:["2 M","0,5 M","0,125 M","1 M","4 M"],e:"M = n/V = 0,5 mol / 0,250 L = 2 mol/L."},
{id:"C040",s:"chem",u:3,q:"Quanti grammi di glucosio (M = 180 g/mol) servono per preparare 500 mL di una soluzione 0,2 M?",o:["18 g","36 g","9 g","90 g","180 g"],e:"n = 0,2 × 0,5 = 0,1 mol; massa = 0,1 × 180 = 18 g."},
{id:"C041",s:"chem",u:3,q:"Una soluzione fisiologica allo 0,9% p/v di NaCl contiene:",o:["0,9 g di NaCl in 100 mL di soluzione","0,9 g di NaCl in 100 g di acqua","9 g di NaCl in 100 mL di soluzione","0,9 mol di NaCl in 1 L di soluzione","0,9 g di NaCl in 1 L di soluzione"],e:"p/v = grammi di soluto per 100 mL di soluzione, quindi 9 g/L."},
{id:"C042",s:"chem",u:3,q:"L'osmolarità di una soluzione 0,15 M di NaCl (completamente dissociato) è circa:",o:["0,30 osmol/L","0,15 osmol/L","0,45 osmol/L","0,075 osmol/L","0,60 osmol/L"],e:"NaCl → Na⁺ + Cl⁻: i = 2, quindi 0,15 × 2 = 0,30 osmol/L, vicina all'osmolarità del plasma (circa 290 mOsm/L)."},
{id:"C043",s:"chem",u:3,q:"A parità di molarità, quale soluzione ha la pressione osmotica più alta?",o:["CaCl₂","NaCl","glucosio","urea","saccarosio"],e:"CaCl₂ → Ca²⁺ + 2 Cl⁻ (i = 3) contro i = 2 per NaCl e i = 1 per i non elettroliti."},
{id:"C044",s:"chem",u:3,q:"Un globulo rosso posto in una soluzione ipotonica:",o:["si rigonfia e può andare incontro a emolisi","raggrinzisce per uscita d'acqua (crenazione)","resta invariato perché la membrana è impermeabile","perde acqua e si rigonfia di ioni","si rigonfia per ingresso di soluti, non di acqua"],e:"L'acqua entra nella cellula, dove la concentrazione di soluti è maggiore."},
{id:"C045",s:"chem",u:3,q:"Le proprietà colligative di una soluzione dipendono:",o:["dal numero di particelle di soluto, non dalla loro natura","dalla natura chimica del soluto, non dal loro numero","dalla massa molare del soluto e dalla sua polarità","dal tipo di solvente e dalla sua densità","dalla massa delle particelle di soluto disciolte"],e:"Abbassamento della pressione di vapore, innalzamento ebullioscopico, abbassamento crioscopico e pressione osmotica dipendono dalla concentrazione di particelle."},
{id:"C046",s:"chem",u:3,q:"Secondo la legge di Henry, la solubilità di un gas in un liquido è:",o:["proporzionale alla sua pressione parziale sopra il liquido","inversamente proporzionale alla sua pressione parziale","indipendente dalla pressione e dipendente solo da T","proporzionale alla temperatura del liquido","proporzionale alla pressione totale, non a quella parziale"],e:"C = kH·P. Spiega la malattia da decompressione dei subacquei: risalendo, l'azoto disciolto nel sangue torna gas."},
{id:"C047",s:"chem",u:3,q:"Secondo la legge di Dalton, in una miscela di gas la pressione parziale di un componente è:",o:["la pressione totale moltiplicata per la sua frazione molare","la pressione totale divisa per la sua frazione molare","la pressione totale moltiplicata per la sua frazione in massa","la somma delle pressioni degli altri componenti","uguale alla pressione totale, per qualsiasi componente"],e:"P_i = x_i·P_tot. Per l'O₂ nell'aria al livello del mare: 0,21 × 760 ≈ 160 mmHg."},
{id:"C048",s:"chem",u:3,q:"Secondo la legge di Raoult, la tensione di vapore del solvente in una soluzione ideale è:",o:["proporzionale alla frazione molare del solvente","proporzionale alla frazione molare del soluto","proporzionale alla molarità del soluto non volatile","sempre maggiore di quella del solvente puro","indipendente dalla composizione della soluzione"],e:"P = x_solvente·P°. Aggiungere un soluto non volatile abbassa la tensione di vapore."},
{id:"C049",s:"chem",u:3,q:"Aggiungendo NaCl all'acqua, la temperatura di congelamento della soluzione:",o:["si abbassa","si alza","resta 0 °C","diventa 100 °C","dipende solo dalla pressione"],e:"ΔTc = i·Kc·m. Per questo si sparge sale sulle strade ghiacciate."},
{id:"C050",s:"chem",u:3,q:"La frazione molare dell'etanolo in una miscela di 1 mol di etanolo e 3 mol di acqua è:",o:["0,25","0,33","0,75","1/3 della massa","0,5"],e:"x = 1 / (1 + 3) = 0,25."},
{id:"C051",s:"chem",u:3,q:"Una mole di ioni Ca²⁺ corrisponde a:",o:["2 equivalenti","1 equivalente","0,5 equivalenti","4 equivalenti","6,02·10²³ equivalenti"],e:"Equivalenti = moli × carica. In clinica la concentrazione del calcio si esprime anche in mEq/L."},

{id:"C052",s:"chem",u:4,q:"Dopo aver bilanciato la reazione C₃H₈ + O₂ → CO₂ + H₂O con i minimi coefficienti interi, il coefficiente dell'ossigeno è:",o:["5","3","4","7","10"],e:"C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O. Ossigeni a destra: 6 + 4 = 10, cioè 5 O₂."},
{id:"C053",s:"chem",u:4,q:"Un catalizzatore:",o:["abbassa l'energia di attivazione senza cambiare la costante di equilibrio","abbassa l'energia di attivazione e sposta l'equilibrio verso i prodotti","aumenta la costante di equilibrio e la velocità della sola reazione diretta","viene consumato durante la reazione e rigenerato alla fine","rende spontanea una reazione con ΔG > 0"],e:"Il catalizzatore accelera allo stesso modo la reazione diretta e quella inversa: l'equilibrio si raggiunge prima, ma nella stessa posizione."},
{id:"C054",s:"chem",u:4,q:"Secondo l'equazione di Arrhenius, la costante di velocità di una reazione:",o:["aumenta all'aumentare della temperatura","diminuisce all'aumentare della temperatura","non dipende dalla temperatura","aumenta all'aumentare dell'energia di attivazione","dipende dalla concentrazione dei reagenti"],e:"k = A·e^(−Ea/RT): più alta è T, maggiore è la frazione di urti con energia sufficiente."},
{id:"C055",s:"chem",u:4,q:"Per una reazione del primo ordine, raddoppiando la concentrazione del reagente la velocità:",o:["raddoppia","quadruplica","resta invariata","si dimezza","aumenta di 8 volte"],e:"v = k[A]. Per una reazione di secondo ordine in A la velocità quadruplicherebbe; per una di ordine zero resterebbe costante."},
{id:"C056",s:"chem",u:4,q:"Per la reazione N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g), la costante di equilibrio Kc è:",o:["[NH₃]² / ([N₂][H₂]³)","[N₂][H₂]³ / [NH₃]²","[NH₃] / ([N₂][H₂])","2[NH₃] / ([N₂] + 3[H₂])","[NH₃]² · [N₂][H₂]³"],e:"Prodotti al numeratore, reagenti al denominatore, ciascuna concentrazione elevata al proprio coefficiente stechiometrico."},
{id:"C057",s:"chem",u:4,q:"Per l'equilibrio N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g), un aumento della pressione totale (per riduzione del volume):",o:["sposta l'equilibrio verso destra","sposta l'equilibrio verso sinistra","non ha alcun effetto","modifica il valore di Kc","blocca la reazione"],e:"Per il principio di Le Châtelier l'equilibrio si sposta verso il lato con meno moli di gas (2 contro 4)."},
{id:"C058",s:"chem",u:4,q:"Se il quoziente di reazione Q è minore di K:",o:["la reazione procede verso i prodotti","la reazione procede verso i reagenti","il sistema è all'equilibrio","la reazione non è possibile","K diminuisce"],e:"Con Q < K ci sono troppo pochi prodotti rispetto all'equilibrio: la reazione netta va verso destra."},
{id:"C059",s:"chem",u:4,q:"Per una reazione esotermica, un aumento di temperatura:",o:["diminuisce la costante di equilibrio","aumenta la costante di equilibrio","non modifica la costante di equilibrio","rende la reazione endotermica","aumenta la resa dei prodotti"],e:"La temperatura è l'unico fattore che cambia K. Per una reazione esotermica, scaldare favorisce i reagenti."},
{id:"C060",s:"chem",u:4,q:"Il prodotto di solubilità di AgCl è Ks = 1,8·10⁻¹⁰. La sua solubilità molare in acqua pura è circa:",o:["1,3·10⁻⁵ M","1,8·10⁻¹⁰ M","9·10⁻¹¹ M","1,8·10⁻⁵ M","1,3·10⁻¹⁰ M"],e:"AgCl ⇌ Ag⁺ + Cl⁻: Ks = s², quindi s = √(1,8·10⁻¹⁰) ≈ 1,34·10⁻⁵ M."},
{id:"C061",s:"chem",u:4,q:"Aggiungendo NaCl a una soluzione satura di AgCl, la solubilità di AgCl:",o:["diminuisce per effetto dello ione comune","aumenta per effetto dello ione comune","resta invariata perché Ks non cambia","diminuisce perché Ks diminuisce","aumenta per formazione di complessi con Na⁺"],e:"L'aumento di [Cl⁻] sposta l'equilibrio verso il solido, mentre Ks resta costante."},
{id:"C062",s:"chem",u:4,q:"Uno stato stazionario si differenzia da un equilibrio chimico perché:",o:["è mantenuto da un flusso continuo di materia ed energia","le concentrazioni variano continuamente nel tempo","la velocità delle reazioni diretta e inversa è nulla","si realizza solo nei sistemi chiusi e isolati","non richiede scambi di energia con l'ambiente"],e:"In uno stato stazionario le concentrazioni sono costanti perché velocità di produzione e di consumo si eguagliano in un sistema aperto. Un organismo all'equilibrio chimico sarebbe morto."},

{id:"C063",s:"chem",u:5,q:"Secondo Brønsted-Lowry, una base è una specie che:",o:["accetta un protone","cede un protone","accetta un doppietto elettronico","libera ioni OH⁻ in acqua","cede elettroni"],e:"La definizione basata sul doppietto è di Lewis; quella basata sugli OH⁻ è di Arrhenius."},
{id:"C064",s:"chem",u:5,q:"La base coniugata dell'acido H₂PO₄⁻ è:",o:["HPO₄²⁻","H₃PO₄","PO₄³⁻","H₂PO₃⁻","OH⁻"],e:"Togliendo un H⁺ a H₂PO₄⁻ si ottiene HPO₄²⁻. La coppia H₂PO₄⁻/HPO₄²⁻ (pKa ≈ 6,8) è il tampone fosfato intracellulare."},
{id:"C065",s:"chem",u:5,q:"Il pH di una soluzione 0,01 M di HCl è:",o:["2","1","0,01","12","7"],e:"HCl è un acido forte: [H₃O⁺] = 10⁻² M, quindi pH = 2."},
{id:"C066",s:"chem",u:5,q:"Il pH di una soluzione 0,001 M di NaOH a 25 °C è:",o:["11","3","10","12","7"],e:"[OH⁻] = 10⁻³ → pOH = 3 → pH = 14 − 3 = 11."},
{id:"C067",s:"chem",u:5,q:"Diluendo 10 volte una soluzione di un acido forte a pH 3, il pH diventa:",o:["4","2","30","3,1","0,3"],e:"[H₃O⁺] passa da 10⁻³ a 10⁻⁴ M: pH = 4. Non si può però superare 7 diluendo un acido."},
{id:"C068",s:"chem",u:5,q:"Il pH di una soluzione 0,1 M di un acido debole con Ka = 1·10⁻⁵ è circa:",o:["3","1","5","2,5","4"],e:"[H₃O⁺] ≈ √(Ka·C) = √(10⁻⁶) = 10⁻³ M, quindi pH ≈ 3."},
{id:"C069",s:"chem",u:5,q:"Quale tra i seguenti sali, sciolto in acqua, dà una soluzione basica?",o:["CH₃COONa","NH₄Cl","NaCl","KNO₃","NaHSO₄"],e:"L'acetato è la base coniugata di un acido debole e si idrolizza producendo OH⁻. NH₄Cl e FeCl₃ danno soluzioni acide; NaCl e KNO₃ neutre."},
{id:"C070",s:"chem",u:5,q:"Una soluzione tampone è costituita tipicamente da:",o:["un acido debole e la sua base coniugata in quantità confrontabili","un acido forte e la sua base coniugata in quantità confrontabili","un acido debole e una base forte in eccesso","un acido forte e una base forte in quantità equimolari","un acido debole da solo, molto diluito"],e:"Il tampone resiste alle variazioni di pH quando si aggiungono piccole quantità di acido o di base; è più efficace quando pH ≈ pKa."},
{id:"C071",s:"chem",u:5,q:"Secondo l'equazione di Henderson-Hasselbalch, se in un tampone [A⁻] = 10·[HA], il pH è:",o:["pKa + 1","pKa − 1","pKa","10·pKa","pKa + 10"],e:"pH = pKa + log([A⁻]/[HA]) = pKa + log 10 = pKa + 1."},
{id:"C072",s:"chem",u:5,q:"Il principale sistema tampone del plasma sanguigno è:",o:["acido carbonico/bicarbonato","diidrogenofosfato/idrogenofosfato","acido acetico/acetato","ammoniaca/ammonio","acido lattico/lattato"],e:"Con pKa ≈ 6,1 e rapporto [HCO₃⁻]/[CO₂] ≈ 20, il pH del sangue è 6,1 + log 20 ≈ 7,4. È efficace perché è un sistema aperto: polmoni e reni regolano CO₂ e bicarbonato."},
{id:"C073",s:"chem",u:5,q:"Il pH normale del sangue arterioso è compreso tra:",o:["7,35 e 7,45","6,8 e 7,0","7,0 e 7,2","7,5 e 7,6","7,20 e 7,30"],e:"Sotto 7,35 si parla di acidosi, sopra 7,45 di alcalosi."},
{id:"C074",s:"chem",u:5,q:"In una reazione redox, la specie che si ossida:",o:["cede elettroni e aumenta il proprio numero di ossidazione","acquista elettroni e diminuisce il numero di ossidazione","cede elettroni e diminuisce il proprio numero di ossidazione","acquista elettroni ed è quindi l'agente riducente","è l'agente ossidante della reazione"],e:"Chi si ossida è il riducente; chi si riduce (acquista elettroni) è l'ossidante."},
{id:"C075",s:"chem",u:5,q:"Nella reazione Zn + Cu²⁺ → Zn²⁺ + Cu, l'agente ossidante è:",o:["Cu²⁺","Zn","Zn²⁺","Cu","nessuna specie"],e:"Cu²⁺ acquista 2 elettroni (si riduce a Cu), quindi è l'ossidante. Lo zinco si ossida ed è il riducente."},
{id:"C076",s:"chem",u:5,q:"In una pila (cella galvanica), il catodo è l'elettrodo dove avviene:",o:["la riduzione","l'ossidazione","la neutralizzazione","la precipitazione","nessuna reazione"],e:"In ogni cella elettrochimica l'ossidazione avviene all'anodo e la riduzione al catodo. Nella pila il catodo è il polo positivo."},
{id:"C077",s:"chem",u:5,q:"In una pila Daniell (Zn/Zn²⁺ ‖ Cu²⁺/Cu) gli elettroni nel circuito esterno fluiscono:",o:["dall'elettrodo di zinco a quello di rame","dall'elettrodo di rame a quello di zinco","attraverso il ponte salino","in entrambe le direzioni alternativamente","non fluiscono"],e:"Lo zinco (E° più basso) si ossida e cede elettroni, che attraverso il filo raggiungono il rame dove Cu²⁺ si riduce. Nel ponte salino si muovono ioni, non elettroni."},
{id:"C078",s:"chem",u:5,q:"Una reazione redox con ΔE > 0 ha:",o:["ΔG < 0 ed è spontanea","ΔG > 0 e non è spontanea","ΔG = 0","K < 1","bisogno di un catalizzatore per essere spontanea"],e:"ΔG = −nFΔE: un potenziale positivo corrisponde a una variazione di energia libera negativa."},
{id:"C079",s:"chem",u:5,q:"Una pila a concentrazione produce una differenza di potenziale perché:",o:["i due semielementi hanno lo stesso ione a concentrazioni diverse","i due elettrodi sono di metalli diversi in soluzioni uguali","il ponte salino genera una corrente di ioni propria","i due semielementi sono a temperature diverse","i due semielementi hanno ioni diversi alla stessa concentrazione"],e:"Dall'equazione di Nernst: E = (0,059/n)·log(C_maggiore/C_minore) a 25 °C. È lo stesso principio del potenziale di membrana."}
);
