<script>
(function(){
"use strict";
/* ------------------------------------------------------------------ config */
const EXAM={mc:21,fill:10,minutes:50,right:1,wrong:-0.1,pass:18,max:31};
const SUBJ={
  bio:{name:"Biologia",cls:"chip-bio",units:{1:"Basi dell'organizzazione biologica",2:"Genoma, cromatina e cromosomi",3:"Flusso dell'informazione genetica",4:"Mutazioni ed ereditarietà",5:"Strutture cellulari e trasporti",6:"Matrice, giunzioni e segnalazione",7:"Ciclo cellulare, meiosi e morte cellulare"}},
  chem:{name:"Chimica e Propedeutica Biochimica",short:"Chimica",cls:"chip-chem",units:{1:"Atomo, tavola periodica e legami",2:"Stati della materia e termodinamica",3:"Soluzioni e proprietà colligative",4:"Reazioni, cinetica ed equilibrio",5:"Acidi, basi, tamponi ed elettrochimica",6:"Idrocarburi e reattività organica",7:"Gruppi funzionali e isomeria",8:"Biomolecole"}},
  fis:{name:"Fisica",cls:"chip-fis",units:{1:"Metodi, unità di misura e vettori",2:"Meccanica",3:"Meccanica dei fluidi",4:"Onde meccaniche e acustica",5:"Termodinamica",6:"Elettricità e magnetismo",7:"Radiazioni elettromagnetiche e ottica"}}
};
const ORDER=["chem","fis","bio"];
const ICON={
 bio:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M20 6c0 13 24 13 24 26S20 45 20 58"/><path d="M44 6c0 13-24 13-24 26s24 13 24 26"/><path d="M24 12h16M22 20h20M24 44h16M22 52h20" stroke-width="2.4" opacity=".75"/></svg>',
 chem:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M25 6h14M27 6v18L12 52a4 4 0 0 0 3.6 6h32.8a4 4 0 0 0 3.6-6L37 24V6"/><path d="M18 42h28" stroke-width="2.4"/><circle cx="28" cy="49" r="2.4" fill="currentColor" stroke="none"/><circle cx="37" cy="51" r="1.8" fill="currentColor" stroke="none"/></svg>',
 fis:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><ellipse cx="32" cy="32" rx="27" ry="10"/><ellipse cx="32" cy="32" rx="27" ry="10" transform="rotate(60 32 32)"/><ellipse cx="32" cy="32" rx="27" ry="10" transform="rotate(120 32 32)"/><circle cx="32" cy="32" r="4.5" fill="currentColor" stroke="none"/></svg>'};
const sname=s=>SUBJ[s].short||SUBJ[s].name;
const BY={bio:[],chem:[],fis:[]};const QI={};
BANK.forEach(q=>{q.t=q.c?"fill":"mc";BY[q.s].push(q);QI[q.id]=q;});
/* sotto-argomenti: ogni domanda viene associata all'argomento le cui parole chiave compaiono di più */
const TP={};
Object.keys(TOPICS).forEach(s=>Object.keys(TOPICS[s]).forEach(u=>TOPICS[s][u].forEach(t=>{t.s=s;t.u=+u;t.g=new RegExp(t.re.source,"gi");TP[t.id]=t;})));
function classify(q){const L=(TOPICS[q.s]||{})[q.u]||[];const main=q.q+" "+(q.c?q.c[0]:q.o[0]),ex=q.e||"";let best=null,bs=0;
  L.forEach(t=>{const sc=2*(main.match(t.g)||[]).length+(ex.match(t.g)||[]).length;if(sc>bs){bs=sc;best=t;}});
  if(best)return best.id;
  const gid=q.s+q.u+"_g";if(!TP[gid])TP[gid]={id:gid,s:q.s,u:+q.u,n:"Altri concetti di "+SUBJ[q.s].units[q.u].toLowerCase(),t:"conc",r:["Rileggi la spiegazione di ogni domanda sbagliata qui sotto","Ritrova il paragrafo corrispondente sul libro e rifai le domande dell'unità"]};
  return gid;}
BANK.forEach(q=>{q.tp=classify(q);});

/* ------------------------------------------------------------------ storage */
const LKEY="sf-sim-v1",DKEY="sf-sim-draft-v1";
let P={attempts:[],qs:{},v:1};      // progress
let db=null,uid=null,cloud=false,saveTimer=null;
function lsGet(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function lsSet(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function mergeP(a,b){ // union of attempts by id; qs: keep max seen
  const out={attempts:[],qs:{},v:1};const seen=new Set();
  [...(a.attempts||[]),...(b.attempts||[])].forEach(x=>{if(x&&!seen.has(x.id)){seen.add(x.id);out.attempts.push(x)}});
  out.attempts.sort((x,y)=>x.date-y.date);out.attempts=out.attempts.slice(-300);
  out.pr=Object.assign({},b.pr||{},a.pr||{});
  const keys=new Set([...Object.keys(a.qs||{}),...Object.keys(b.qs||{})]);
  keys.forEach(k=>{const x=(a.qs||{})[k]||[0,0,0,0],y=(b.qs||{})[k]||[0,0,0,0];
    out.qs[k]=(x[0]>=y[0])?x:y;});
  return out;
}
const local=lsGet(LKEY);if(local&&local.attempts)P=mergeP(P,local);P.pr=P.pr||{};

/* ------------------------------------------------------------------ PROFILI E CODICI */
// il nome resta solo su questo dispositivo; in graduatoria compare soltanto il codice
const CKEY="sf-sim-me-v1";let ME=lsGet(CKEY);
function setMe(c){ME=c;lsSet(CKEY,c);}
function newCode(){const A="ACDEFHJKLMNPRTUVWXY3479";let c;do{c="AF-";for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];}while(P.pr[c]);return c;}
function whoCreate(){const i=$("#who-n");const n=(i&&i.value||"").trim().replace(/\s+/g," ").slice(0,40);if(!n){if(i){i.focus();i.classList.add("bad");}return;}
  const ok=!!($("#who-ok")&&$("#who-ok").checked);const c=newCode();P.pr[c]={n,t:Date.now(),ok};setMe(c);save();view.who.step="code";view.who.code=c;renderWho();}
function whoHTML(){const w=view.who;if(!w)return "";const S=w.s?esc(SUBJ[w.s].name)+(w.next==="examHard"?" · difficile":""):"";let b;
  if(w.step==="confirm"){const p=P.pr[ME];b=`<p>Stai per iniziare la simulazione come:</p><div class="who-me"><b>${esc(p.n)}</b><span class="code">${esc(ME)}</span></div>
    ${ONLINE?`<label class="consent"><input type="checkbox" data-act="whoConsent" ${p.ok?"checked":""}><span>Invia i miei risultati all'associazione ALFARMA e partecipa alla graduatoria generale (<button class="linkish" data-act="whoPrivacy">informativa</button>)</span></label>`:""}
    <div class="row"><button class="btn primary" data-act="whoGo">Sì, inizia</button><button class="btn" data-act="whoOther">Sono un'altra persona</button></div>`;}
  else if(w.step==="pick"){b=`<p>Chi sta facendo la simulazione?</p><div class="who-list">${Object.keys(P.pr).sort((x,y)=>P.pr[y].t-P.pr[x].t).map(c=>`<button class="btn who-opt" data-act="whoPick" data-code="${esc(c)}"><b>${esc(P.pr[c].n)}</b><span class="code">${esc(c)}</span></button>`).join("")}</div>
    <div class="row"><button class="btn primary" data-act="whoNew">Sono una persona nuova</button></div>`;}
  else if(w.step==="privacy"){return `<div class="overlay" data-act="whoClose"><div class="dialog stack privacy" role="dialog" aria-modal="true" aria-labelledby="who-h"><div class="row" style="justify-content:space-between"><h3 id="who-h">Informativa privacy</h3><button class="btn ghost small" data-act="whoClose" aria-label="Chiudi">✕</button></div>${PRIVACY}<div class="row"><button class="btn primary" data-act="whoClose">Ho capito</button></div></div></div>`;}
  else if(w.step==="new"){b=`<label class="field">Come ti chiami?<input id="who-n" type="text" autocomplete="name" maxlength="40" placeholder="Nome e cognome"></label>
    ${ONLINE?`<label class="consent"><input type="checkbox" id="who-ok"><span>Acconsento all'invio di nome, codice e risultati delle simulazioni all'associazione ALFARMA, come descritto nell'<button class="linkish" data-act="whoInfo">informativa privacy</button>. Facoltativo: senza consenso il simulatore funziona lo stesso.</span></label>
    ${w.info?`<div class="privacy small">${PRIVACY}</div>`:""}
    <p class="muted small">Ti assegneremo un codice personale: in graduatoria compare solo quello, mai il nome.</p>`:`<p class="muted small">Il nome resta solo su questo dispositivo. Ti assegneremo un codice personale: in graduatoria compare solo quello.</p>`}
    <div class="row"><button class="btn primary" data-act="whoCreate">Crea il mio codice</button></div>`;}
  else b=`<p>Ciao <b>${esc(P.pr[w.code].n)}</b>, questo è il tuo codice personale:</p><div class="code big">${esc(w.code)}</div>
    <p class="muted small">Annotalo: in graduatoria vedrai i tuoi punteggi accanto a questo codice.</p><div class="row"><button class="btn primary" data-act="whoGo">Inizia la simulazione</button></div>`;
  return `<div class="overlay" data-act="whoClose"><div class="dialog stack" role="dialog" aria-modal="true" aria-labelledby="who-h"><div class="row" style="justify-content:space-between"><div><p class="eyebrow">${S}</p><h3 id="who-h">Prima di iniziare</h3></div><button class="btn ghost small" data-act="whoClose" aria-label="Chiudi">✕</button></div>${b}</div></div>`;}
function renderWho(){let el=document.getElementById("who-root");if(!el){el=document.createElement("div");el.id="who-root";document.body.appendChild(el);}
  const keep={n:$("#who-n")&&$("#who-n").value,ok:$("#who-ok")&&$("#who-ok").checked};el.innerHTML=whoHTML();
  const i=$("#who-n");if(i){if(keep.n)i.value=keep.n;i.focus();}const c=$("#who-ok");if(c&&keep.ok)c.checked=true;if(!view.who&&view.name==="home")render();}

/* ------------------------------------------------------------------ GRADUATORIA */
function board(s){const g={};P.attempts.forEach(a=>{if(a.s!==s||a.mode!=="exam"||!a.pid)return;const r=g[a.pid]=g[a.pid]||{code:a.pid,best:-99,sum:0,n:0,pass:0,last:0};r.best=Math.max(r.best,a.score);r.sum+=a.score;r.n++;if(a.score>=EXAM.pass)r.pass++;r.last=Math.max(r.last,a.date);});
  return Object.values(g).sort((x,y)=>y.best-x.best||y.sum/y.n-x.sum/x.n||x.last-y.last);}
/* ------------------------------------------------------------------ INVIO DEI RISULTATI ALL'ASSOCIAZIONE */
const QKEY="sf-sim-queue-v1";
const ONLINE=!!SHEET_URL&&(location.hostname.endsWith("github.io")||(SITE_URL&&location.href.startsWith(SITE_URL))||["localhost","127.0.0.1",""].includes(location.hostname));
const PRIVACY=`<p><b>Chi tratta i dati.</b> L'associazione studentesca ALFARMA (Università della Calabria), contattabile su Instagram <a href="https://www.instagram.com/alfarmaunical/" target="_blank" rel="noopener">@alfarmaunical</a> o ai numeri indicati in fondo alla pagina.</p>
<p><b>Quali dati.</b> Solo se dai il consenso: il nome che inserisci, il tuo codice personale e i risultati delle simulazioni d'esame (materia, data, durata, punteggio, risposte esatte, errate e omesse, argomenti da rivedere). Le esercitazioni non vengono inviate.</p>
<p><b>Perché.</b> Per la graduatoria generale, dove compare soltanto il codice e mai il nome, e per permettere all'associazione di seguire l'andamento degli studenti e organizzare attività di ripasso sugli argomenti più difficili.</p>
<p><b>Base giuridica.</b> Il tuo consenso (art. 6, par. 1, lett. a del Regolamento UE 2016/679). È facoltativo: senza consenso il simulatore funziona allo stesso modo e i tuoi dati restano solo su questo dispositivo.</p>
<p><b>Dove e per quanto.</b> In un foglio di calcolo Google dell'associazione, accessibile solo ai suoi referenti. I dati sono cancellati entro il 31 marzo 2027.</p>
<p><b>I tuoi diritti.</b> Puoi revocare il consenso in ogni momento dalla finestra che compare prima di ogni simulazione; per vedere, correggere o cancellare i dati già inviati scrivi all'associazione indicando il tuo codice. Puoi anche presentare reclamo al Garante per la protezione dei dati personali.</p>`;
function enqueue(a,ex){if(!ONLINE||!a.pid)return;const p=P.pr[a.pid];if(!p||!p.ok)return;
  const weak=[];ex.items.forEach(it=>{if(it.ok!==true){const n=TP[QI[it.id].tp].n;if(!weak.includes(n))weak.push(n);}});
  const Q=lsGet(QKEY)||[];Q.push({id:a.id,code:a.pid,name:p.n,s:a.s,hard:a.hard,date:a.date,score:a.score,correct:a.correct,wrong:a.wrong,omitted:a.omitted,dur:a.dur,weak});lsSet(QKEY,Q.slice(-50));flush();}
let flushing=false;
async function flush(){if(!ONLINE||flushing)return;flushing=true;try{let Q=lsGet(QKEY)||[];
  while(Q.length){const r=Q[0];try{await fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(r)});}catch(e){break;}
    Q=(lsGet(QKEY)||[]).filter(x=>x.id!==r.id);lsSet(QKEY,Q);GBT=0;}}finally{flushing=false;}}
let GB=null,GBT=0,GBERR=false;
function loadGB(){if(!ONLINE||Date.now()-GBT<30000)return;GBT=Date.now();
  fetch(SHEET_URL+"?lb=1").then(r=>r.json()).then(j=>{GB=j;GBERR=false;if(view.name==="home"&&!view.who)render();}).catch(()=>{GBERR=true;if(view.name==="home"&&!view.who)render();});}
function boardHTML(){const s=view.lb||"chem";const all=!!ONLINE&&view.lbScope!=="dev";
  const rows=all?((GB&&GB[s])||[]):board(s).map(r=>({code:r.code,best:r.best,avg:Math.round(r.sum/r.n*100)/100,n:r.n,pass:r.pass}));
  let h=`<section class="panel stack lb ${SUBJ[s].cls}"><div class="row" style="justify-content:space-between"><div><h2>Graduatoria</h2><p class="muted small" style="margin:0">${all?"Miglior punteggio di tutti gli studenti nelle simulazioni d'esame.":"Miglior punteggio nelle simulazioni d'esame fatte su questo dispositivo."} Al posto dei nomi compare il codice personale.</p></div>
    <div class="stack" style="gap:8px;justify-items:end">${ONLINE?`<div class="seg" role="group" aria-label="Chi"><button data-act="lbScope" data-v="all" aria-pressed="${all}">Tutti</button><button data-act="lbScope" data-v="dev" aria-pressed="${!all}">Questo dispositivo</button></div>`:""}
    <div class="seg" role="group" aria-label="Materia">${ORDER.map(x=>`<button data-act="lb" data-s="${x}" aria-pressed="${x===s}">${esc(sname(x))}</button>`).join("")}</div></div></div>`;
  const siteNote=(!ONLINE&&SITE_URL)?`<p class="muted small" style="margin:0">La graduatoria di <b>tutti gli studenti</b> è sul sito ufficiale: <a href="${SITE_URL}" target="_blank" rel="noopener">${esc(SITE_URL.replace(/^https?:\/\//,"").replace(/\/$/,""))}</a>. Le simulazioni fatte lì vengono inviate all'associazione e contano per la classifica.</p>`:"";
  h+=siteNote;
  if(all&&!GB)return h+`<p class="muted">${GBERR?"Classifica generale non raggiungibile in questo momento. Riprova più tardi o guarda quella di questo dispositivo.":"Caricamento della classifica…"}</p></section>`;
  if(!rows.length)return h+`<p class="muted">Ancora nessuna simulazione di ${esc(SUBJ[s].name)}. Fai la prima: al primo avvio ti verrà chiesto il nome e assegnato un codice.</p></section>`;
  h+=`<div class="tbl-wrap"><table class="hist lb-t"><thead><tr><th>#</th><th>Codice</th><th>Migliore</th><th>Media</th><th>Prove</th><th>Superate</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{h+=`<tr class="${r.code===ME?"me":""}"><td><span class="pos p${i+1}">${i+1}</span></td><td class="mono"><b>${esc(r.code)}</b>${r.code===ME?` <span class="pill neutral">tu</span>`:""}</td><td class="mono"><b>${fmt(r.best)}</b>/31</td><td class="mono">${fmt(r.avg)}</td><td class="mono">${r.n}</td><td class="mono">${r.pass}/${r.n}</td></tr>`;});
  return h+`</tbody></table></div></section>`;}
function save(){lsSet(LKEY,P);if(!cloud)return;clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{
  try{await db.doc("data/users/"+uid+"/progress").set(JSON.parse(JSON.stringify(P)));}catch(e){if(e&&(e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted")){cloud=false;renderSyncBadge();}}},1200);}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u)return; const id=await u.id(); if(!id)return;
    db=d;uid=id;
    const snap=await db.doc("data/users/"+uid+"/progress").get();
    if(snap.exists){P=mergeP(P,snap.data());lsSet(LKEY,P);}
    cloud=true;renderSyncBadge();
    if(view.name==="home")render();
    save();
  }catch(e){cloud=false;renderSyncBadge();}
}
function renderSyncBadge(){const el=document.getElementById("sync");if(el)el.innerHTML=syncHTML();}
function syncHTML(){return cloud?'<span class="dot on"></span>Progressi salvati sul tuo account (anche da telefono)':'<span class="dot"></span>Progressi salvati in questo browser';}

/* ------------------------------------------------------------------ utils */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const fmt=n=>(Math.round(n*100)/100).toLocaleString("it-IT",{minimumFractionDigits:n%1?1:0,maximumFractionDigits:2});
const LET="ABCDE";
const pinRe=/^(tutte|nessuna|entramb)/i;
function optOrder(q){const idx=[0,1,2,3,4].slice(0,q.o.length);const pinned=idx.filter(i=>pinRe.test(q.o[i]));const free=idx.filter(i=>!pinRe.test(q.o[i]));return shuffle(free).concat(pinned);}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[²]/g,"2").replace(/[³]/g,"3").replace(/[’‘`]/g,"'").replace(/−/g,"-").replace(/^(?:(?:il|lo|la|i|gli|le|un|uno|una)\s+|(?:l|un)')/,"").replace(/[.;:!?]+$/,"").replace(/\s+/g," ").trim();}
function parseNum(s){let t=String(s).trim().replace(/−/g,"-").replace(/\s+/g,"").replace(/[×x*·]10\^?/gi,"e").replace(/,/g,".");
  if(/^[+-]?\d+(\.\d+)?$/.test(t)||/^[+-]?\d*(\.\d+)?e[+-]?\d+$/i.test(t)){const v=Number(t);return isFinite(v)?v:null;}
  if(/^[+-]?\d+(\.\d+)?%$/.test(t))return Number(t.slice(0,-1));
  return null;}
/* --- correzione del completamento: sinonimi, forme flesse, errori di battitura --- */
const NUMW={zero:0,uno:1,una:1,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,dieci:10,undici:11,dodici:12,venti:20,trenta:30,cento:100,mille:1000,meta:0.5};
function loose(s){return norm(s).replace(/(?<=[a-z0-9])[\-‐–](?=[a-z0-9])/g," ").replace(/['_\/()]/g," ").replace(/\b(?:di|del|della|dello|dei|degli|delle|dell|d)\b/g," ").replace(/[a-z]{3,}/g,w=>w.replace(/k(?=[ei])/g,"ch").replace(/k/g,"c").replace(/y/g,"i")).replace(/\s+/g," ").trim();}
const cmp=s=>loose(s).replace(/ /g,"");
const stem=t=>{const r=t.replace(/[aeiou]+$/,"").replace(/([cg])h$/,"$1");return r.length<5?t:r;};
const formKey=s=>loose(s).split(" ").map(stem).join("");
// gruppi di termini equivalenti (valgono per tutte le domande)
const SYN=[["dna","acido desossiribonucleico"],["rna","acido ribonucleico"],["mrna","rna messaggero"],["trna","rna transfer","rna di trasporto"],["rrna","rna ribosomiale"],
 ["atp","adenosina trifosfato","adenosintrifosfato","adenosina 5 trifosfato"],["adp","adenosina difosfato","adenosindifosfato"],["camp","amp ciclico","adenosina monofosfato ciclico"],["nad","nad+","nicotinammide adenina dinucleotide"],
 ["co2","anidride carbonica","diossido di carbonio","biossido di carbonio"],["h2o","acqua"],["nacl","cloruro di sodio"],["hcl","acido cloridrico"],["naoh","idrossido di sodio","soda caustica"],["nh3","ammoniaca"],["ch4","metano"],["h2so4","acido solforico"],
 ["etino","acetilene","c2h2"],["etene","etilene","c2h4"],["metanolo","alcol metilico","alcool metilico"],["etanolo","alcol etilico","alcool etilico"],["propanone","acetone","dimetilchetone"],["metanale","formaldeide","aldeide formica"],["etanale","acetaldeide","aldeide acetica"],["toluene","metilbenzene"],["fenolo","idrossibenzene"],["acetico","etanoico"],["formico","metanoico"],["alcol","alcool"],["alcoli","alcooli"],
 ["citodieresi","citocinesi","citochinesi"],["reticolo endoplasmatico","reticolo endoplasmico"],["golgi","apparato del golgi","apparato di golgi","complesso del golgi"],["apoptosi","morte cellulare programmata"],["sinapsi","giunzione sinaptica"],
 ["emivita","tempo di dimezzamento","periodo di dimezzamento","dimezzamento","semivita"],["glucosio","destrosio"],["fruttosio","levulosio"],["eucariote","eucariota"],["procariote","procariota"],["cromosoma x","x"],["cromosoma y","y"],
 ["krebs","ciclo di krebs","ciclo dell'acido citrico","ciclo degli acidi tricarbossilici"],["pompa sodio potassio","pompa na k","na k atpasi","atpasi na k"],
 ["pascal","pa"],["hertz","hz"],["candela","cd"],["mole","mol"],["kilogrammo","chilogrammo","kg"]];

function fillMatch(q,ans){

    if(v===null){const m=String(ans).trim().match(/^([+\-−]?\d[\d.,]*(?:\s*[×x*·]\s*10\^?\s*[+\-−]?\d+)?)\s*[a-zA-Zµμ°%\/²³·⁻¹ ]*$/);if(m)v=parseNum(m[1]);}

function pick(pool,n){
  // favour least-seen questions, spread across units
  const groups={};shuffle(pool).sort((a,b)=>qstat(a.id)[0]-qstat(b.id)[0]).forEach(q=>{(groups[q.u]=groups[q.u]||[]).push(q);});
  const units=shuffle(Object.keys(groups));const out=[];let k=0;
  while(out.length<n&&units.some(u=>groups[u].length)){const u=units[k%units.length];if(groups[u].length)out.push(groups[u].shift());k++;}
  return out;}
function buildExam(s,hard){
  const pool=BY[s];
  function take(type,n){
    if(!hard)return pick(pool.filter(q=>q.t===type),n);
    const h=pick(pool.filter(q=>q.t===type&&q.d),n);
    if(h.length>=n)return h;
    const ids=new Set(h.map(q=>q.id));
    // complete with calculation questions first, then any other
    const calc=pool.filter(q=>q.t===type&&!ids.has(q.id)&&(type==="fill"?typeof q.n==="number":/\d/.test(q.q)));
    let more=pick(calc,n-h.length);more.forEach(q=>ids.add(q.id));
    if(h.length+more.length<n)more=more.concat(pick(pool.filter(q=>q.t===type&&!ids.has(q.id)),n-h.length-more.length));
    return h.concat(more);}
  const mc=take("mc",EXAM.mc).sort((a,b)=>a.u-b.u);
  const fi=take("fill",EXAM.fill).sort((a,b)=>a.u-b.u);
  return mc.concat(fi);}

  const a={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),pid:ex.mode==="exam"?(ex.pid||null):null,s:ex.s,mode:ex.mode==="exam"?"exam":"practice",hard:!!(ex.opts&&ex.opts.hard),date:Date.now(),score:Math.round(scoreOf(c,w)*100)/100,correct:c,wrong:w,omitted:o,n:ex.items.length,dur:Date.now()-ex.start,units};
  if(isPractice&&c+w===0){lsSet(DKEY,null);go({name:"home"});return;}
  P.attempts.push(a);P.attempts=P.attempts.slice(-300);save();if(a.mode==="exam")enqueue(a,ex);if(ex.mode==="exam")lsSet(DKEY,null);
  go({name:"result",ex,a,filter:"all"});}

/* ------------------------------------------------------------------ RESULT */
function ringHTML(score,max,isExam){const R=64,C=2*Math.PI*R;const f=Math.max(0,Math.min(1,score/max));const thr=EXAM.pass/EXAM.max;
  return `<div class="ring"><svg viewBox="0 0 150 150"><circle class="track" cx="75" cy="75" r="${R}" stroke-width="14" fill="none"/><circle class="val" cx="75" cy="75" r="${R}" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}"/>${isExam?`<line class="thr" x1="${75+R-11}" y1="75" x2="${75+R+11}" y2="75" stroke-width="3" transform="rotate(${thr*360} 75 75)"/>`:""}</svg><div class="ring-txt"><div class="bigscore">${fmt(score)}<small>su ${max}</small></div></div></div>`;}

  ${isExam&&a.pid?(()=>{const B=board(s);const i=B.findIndex(r=>r.code===a.pid);return `<p class="rankline">Codice <b class="mono">${esc(a.pid)}</b> · ${i+1}° su ${B.length} in graduatoria di ${esc(sname(s))}</p>`;})():""}
  <div class="counts"><div><b style="color:var(--ok)">${a.correct}</b><span>esatte</span></div><div><b style="color:var(--bad)">${a.wrong}</b><span>errate</span></div><div><b>${a.omitted}</b><span>omesse</span></div></div></section>`;
  h+=`<section class="panel stack"><h3>Per argomento</h3><div class="bars">`;
  Object.keys(a.units).sort((x,y)=>x-y).forEach(u=>{const [c,t]=a.units[u];h+=`<div class="bar-row"><span class="lab">${esc(SUBJ[s].units[u])}</span><span class="mono" style="text-align:right">${c}/${t}</span><div class="bar-track"><div class="bar-fill" style="width:${t?c/t*100:0}%"></div></div></div>`;});
  const weakest=Object.keys(a.units).filter(u=>a.units[u][1]>=2).sort((x,y)=>a.units[x][0]/a.units[x][1]-a.units[y][0]/a.units[y][1])[0];
  h+=`</div>${weakest&&a.units[weakest][0]<a.units[weakest][1]?`<div class="row"><button class="btn" data-act="practiceUnit" data-s="${s}" data-u="${weakest}">Esercitati su: ${esc(SUBJ[s].units[weakest])}</button></div>`:""}</section>`;
  h+=planHTML(ex,a);
  const f=view.filter;
  h+=`<section class="stack"><div class="row" style="justify-content:space-between"><h3>Correzione</h3><div class="seg" role="group" aria-label="Filtro">
    <button data-act="filter" data-f="all" aria-pressed="${f==="all"}">Tutte</button><button data-act="filter" data-f="bad" aria-pressed="${f==="bad"}">Errate</button><button data-act="filter" data-f="om" aria-pressed="${f==="om"}">Omesse</button></div></div>`;
  ex.items.forEach((it,i)=>{const q=QI[it.id];const st=it.ok===true?"ok":it.ok===false?"bad":"om";if(f==="bad"&&st!=="bad")return;if(f==="om"&&st!=="om")return;
    if(ex.mode!=="exam"&&!it.checked&&it.ok===null&&f!=="om")return;

/* ------------------------------------------------------------------ PIANO DI RIPASSO */
function topicHist(id){let r=0,w=0,n=0;BY[TP[id].s].forEach(q=>{if(q.tp!==id)return;n++;const st=qstat(q.id);r+=st[2];w+=st[1];});return {r,w,n};}
const pct=(a,b)=>b?Math.round(a/b*100):0;
function planHTML(ex,a){
  const s=ex.s,isExam=a.mode==="exam";
  const T={};const typ={mc:[0,0],fill:[0,0]};let calcBad=0,allBad=0;
  ex.items.forEach((it,i)=>{const q=QI[it.id];const answered=it.ok!==null;
    if(!isExam&&!answered&&!it.checked)return;
    const t=T[q.tp]=T[q.tp]||{id:q.tp,ok:0,bad:0,om:0,nums:[]};
    if(it.ok===true)t.ok++;else{if(it.ok===false)t.bad++;else t.om++;t.nums.push(i+1);allBad++;if(TP[q.tp].t==="calc")calcBad++;}
    if(answered){typ[q.t][1]++;if(it.ok)typ[q.t][0]++;}});
  const weak=Object.values(T).filter(t=>t.bad+t.om>0).sort((x,y)=>(y.bad+y.om*0.8)-(x.bad+x.om*0.8)||x.ok-y.ok);
  // consigli di strategia
  const tips=[];
  const omMc=ex.items.filter(it=>it.ok===null&&QI[it.id].t==="mc").length,omF=ex.items.filter(it=>it.ok===null&&QI[it.id].t==="fill").length;
  if(isExam&&omMc>=2)tips.push(["Non lasciare in bianco la multipla",`Hai lasciato ${omMc} domande a risposta multipla senza risposta. Con 5 alternative e penalità di −0,1, anche una risposta del tutto casuale vale in media <b>+0,12 punti</b>; se riesci a escludere un'alternativa sale a +0,175. Rispondi sempre, partendo dall'eliminare le opzioni sicuramente false.`]);
  if(isExam&&omF>=3)tips.push(["Completamento: scrivi comunque un'ipotesi",`${omF} domande a completamento sono rimaste vuote. Un errore costa solo 0,1: se hai un'idea del termine o dell'ordine di grandezza del risultato, scrivilo.`]);
  if(isExam){const used=a.dur/60000;
    if(used>=EXAM.minutes-0.5&&a.omitted>0)tips.push(["Gestione del tempo",`Il tempo è finito prima che rispondessi a tutto. Hai circa <b>1 minuto e 37 secondi</b> per domanda: fai un primo giro rispondendo solo a ciò che sai subito, segna con la bandierina le domande lunghe o di calcolo e torna su quelle alla fine.`]);
    else if(used<EXAM.minutes*0.6&&a.score<EXAM.pass)tips.push(["Usa tutto il tempo",`Hai consegnato dopo ${Math.max(1,Math.round(used))} minut${Math.max(1,Math.round(used))>1?"i":"o"} su ${EXAM.minutes}. Il tempo avanzato serve a rileggere le domande con «NON», «ECCETTO» o «FALSA», ricontrollare i calcoli e le unità di misura.`]);}
  if(typ.mc[1]>=4&&typ.fill[1]>=3){const pm=pct(...typ.mc),pf=pct(...typ.fill);
    if(pm-pf>=20)tips.push(["Il completamento è il tuo punto debole",`Esatte: ${pm}% nella multipla contro ${pf}% nel completamento. Senza alternative davanti devi richiamare il termine a memoria: allenati con il <b>richiamo attivo</b> (copri la risposta e scrivila) e fai esercitazioni «solo completamento». Attenzione anche al formato: numero senza unità, virgola decimale, termine al singolare.`]);
    else if(pf-pm>=20)tips.push(["Attenzione ai distrattori",`Nel completamento vai meglio (${pf}%) che nella multipla (${pm}%): le alternative ti stanno ingannando. Leggi tutte e 5 le opzioni prima di scegliere e diffida di quelle «quasi giuste», che cambiano un solo dettaglio.`]);}
  if(allBad>=3&&calcBad/allBad>=0.5)tips.push(["Più esercizi di calcolo",`${calcBad} errori su ${allBad} sono in argomenti di calcolo. Il problema spesso non è la teoria ma l'esecuzione: scrivi dati e formula prima di fare i conti, porta tutto in unità SI e controlla che l'ordine di grandezza del risultato abbia senso.`]);
  if(isExam&&a.score>=EXAM.pass+6&&!weak.length)tips.push(["Ottimo lavoro","Nessun argomento da segnalare. Prova la simulazione difficile per metterti alla prova."]);

  let h=`<section class="panel stack plan"><div><p class="eyebrow">Feedback personalizzato</p><h3>Piano di ripasso</h3></div>`;
  if(tips.length)h+=`<div class="tips">${tips.map(t=>`<div class="tip"><b>${t[0]}</b><p>${t[1]}</p></div>`).join("")}</div>`;
  if(weak.length){
    h+=`<p class="muted">Gli argomenti dove hai perso punti, in ordine di priorità. Per ognuno: cosa rivedere e il metodo di studio più adatto a quel tipo di contenuto.</p><div class="topic-list">`;
    weak.slice(0,5).forEach((t,k)=>{const tp=TP[t.id],te=TECH[tp.t],hi=topicHist(t.id);const hs=hi.r+hi.w;
      h+=`<article class="topic-card${k===0?" first":""}"><header><span class="rank">${k+1}</span><div><b>${esc(tp.n)}</b><small>${esc(SUBJ[s].units[tp.u])}</small></div></header>
      <p class="tstat">${t.bad?`<span class="pill bad">${t.bad} ${t.bad>1?"errate":"errata"}</span>`:""}${t.om?`<span class="pill neutral">${t.om} ${t.om>1?"omesse":"omessa"}</span>`:""}${t.ok?`<span class="pill ok">${t.ok} ${t.ok>1?"esatte":"esatta"}</span>`:""}<span class="muted small">domand${t.nums.length>1?"e":"a"} ${t.nums.join(", ")}${hs>=4?` · nel complesso ${pct(hi.r,hs)}% esatte`:""}</span></p>
      <div class="tcols"><div><h4>Cosa rivedere</h4><ul>${tp.r.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="tech"><h4>Come studiarlo · ${esc(te.n)}</h4><p>${esc(te.d)}</p></div></div>
      <div class="row"><button class="btn small" data-act="practiceTopic" data-s="${s}" data-tp="${t.id}">Esercitati su questo argomento (${Math.min(15,BY[s].filter(q=>q.tp===t.id).length)} domande)</button></div></article>`;});
    h+=`</div>`;
    if(weak.length>5)h+=`<p class="muted small">Altri argomenti con errori: ${weak.slice(5,13).map(t=>esc(TP[t.id].n)).join(" · ")}${weak.length>13?` e altri ${weak.length-13}`:""}.</p>`;}
  else if(!tips.length)h+=`<p class="muted">Nessun errore in questa prova: niente da ripassare.</p>`;
  // argomenti deboli ricorrenti nello storico
  const shown=new Set(weak.slice(0,5).map(t=>t.id));
  const rec=Object.values(TP).filter(t=>t.s===s&&!shown.has(t.id)).map(t=>({t,h:topicHist(t.id)})).filter(x=>x.h.r+x.h.w>=5&&x.h.r/(x.h.r+x.h.w)<0.6).sort((x,y)=>x.h.r/(x.h.r+x.h.w)-y.h.r/(y.h.r+y.h.w)).slice(0,4);
  if(rec.length)h+=`<div class="stack" style="gap:8px"><h4>Punti deboli ricorrenti nelle prove precedenti</h4>${rec.map(x=>`<div class="rec-row"><span><b>${esc(x.t.n)}</b> <small class="muted">${pct(x.h.r,x.h.r+x.h.w)}% esatte su ${x.h.r+x.h.w} risposte · metodo: ${esc(TECH[x.t.t].n)}</small></span><button class="btn ghost small" data-act="practiceTopic" data-s="${s}" data-tp="${x.t.id}">Esercitati</button></div>`).join("")}</div>`;
  return h+`</section>`;}
/* ------------------------------------------------------------------ PRACTICE SETUP */
function practiceHTML(){
  const s=view.s;const sel=view.units;
  let h=`<div class="wrap stack ${SUBJ[s].cls}"><div><button class="btn ghost back" data-act="home">← Torna alle materie</button></div>
  <header class="page-head stack" style="gap:6px"><p class="eyebrow">Esercitazione · senza timer · correzione immediata</p><h1>${esc(SUBJ[s].name)}</h1></header>
  <section class="panel stack"><div class="row" style="justify-content:space-between"><h3>Argomenti</h3><div class="row"><button class="btn ghost small" data-act="uall">Tutti</button><button class="btn ghost small" data-act="unone">Nessuno</button></div></div><div class="units">`;
  Object.keys(SUBJ[s].units).forEach(u=>{const qs=BY[s].filter(q=>String(q.u)===u);const seen=qs.filter(q=>qstat(q.id)[0]>0).length;const r=qs.reduce((a,q)=>a+qstat(q.id)[2],0),w=qs.reduce((a,q)=>a+qstat(q.id)[1],0);
    h+=`<label class="unit-opt"><input type="checkbox" data-act="utoggle" data-u="${u}" ${sel.includes(u)?"checked":""}><span><b>${u}. ${esc(SUBJ[s].units[u])}</b><br><small>${qs.length} domande · viste ${seen}${r+w?` · ${Math.round(r/(r+w)*100)}% esatte`:""}</small></span></label>`;});
  h+=`</div></section><section class="panel stack"><div class="row" style="gap:16px;align-items:flex-end">
    <label class="field">Tipo di domande<select id="ptype"><option value="all">Multipla e completamento</option><option value="mc">Solo risposta multipla</option><option value="fill">Solo completamento</option></select></label>
    <label class="field">Numero di domande<select id="pnum"><option>10</option><option selected>15</option><option>20</option><option>31</option></select></label></div>
    <div class="row"><button class="btn primary" data-act="startPractice" ${sel.length?"":"disabled"}>Inizia</button></div></section></div>`;

/* ------------------------------------------------------------------ RENDER + EVENTS */
function render(){const app=$("#app");if(view.name==="home")loadGB();
  if(view.name==="home")app.innerHTML=homeHTML();
  else if(view.name==="exam"){app.innerHTML=examHTML();if(view.ex.timed&&!view.ex.submitted){clearInterval(tick);tick=setInterval(()=>{const left=examLeft(view.ex);const t=$("#timer");if(t){t.textContent=fmtTime(left);t.classList.toggle("low",left<5*60000);}if(left<=0){clearInterval(tick);submitExam();}},500);}
    const inp=document.querySelector(".fill input:not([disabled])");if(inp){inp.addEventListener("input",()=>{readFill();persistDraft();updateCounter();});inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();act(view.ex.mode==="exam"||view.ex.items[view.ex.cur].checked?"next":"check");}});}}
  else if(view.name==="result")app.innerHTML=resultHTML();
  else if(view.name==="practice")app.innerHTML=practiceHTML();}
function updateCounter(){const ex=view.ex;const el=document.querySelector(".progress-txt");if(!el)return;const n=ex.items.length,answered=ex.items.filter(x=>x.ans!=null&&x.ans!=="").length;el.textContent=el.textContent.replace(/\d+\/\d+ risposte/,answered+"/"+n+" risposte");const cell=document.querySelector(`.nav-cell[data-i="${ex.cur}"]`);if(cell&&ex.mode==="exam")cell.classList.toggle("ans",ex.items[ex.cur].ans!=null);}

function act(a,d){d=d||{};
  const ex=view.ex;
  switch(a){
  case "home":go({name:"home"});break;
  case "exam":case "examHard":view.who={next:a,s:d.s,step:ME&&P.pr[ME]?"confirm":(Object.keys(P.pr).length?"pick":"new")};renderWho();break;
  case "whoGo":{const w=view.who;if(!w)break;view.who=null;renderWho();lsSet(DKEY,null);if(w.next==="examHard")startExam(w.s,buildExam(w.s,true),"exam",{hard:true});else startExam(w.s,buildExam(w.s),"exam");break;}
  case "whoPick":setMe(d.code);view.who.step="confirm";renderWho();break;
  case "whoNew":view.who.step="new";renderWho();break;
  case "whoOther":view.who.step=Object.keys(P.pr).length>1?"pick":"new";renderWho();break;
  case "whoCreate":whoCreate();break;
  case "whoClose":view.who=view.who&&view.who.back?view.who.back:null;renderWho();break;
  case "whoInfo":view.who.info=!view.who.info;renderWho();break;
  case "whoPrivacy":view.who={step:"privacy",back:view.who};renderWho();break;
  case "privacy":view.who={step:"privacy"};renderWho();break;
  case "whoConsent":if(ME&&P.pr[ME]){P.pr[ME].ok=!P.pr[ME].ok;save();}break;
  case "lbScope":view.lbScope=d.v;render();break;
  case "lb":view.lb=d.s;render();break;
  case "resume":{const dr=lsGet(DKEY);if(dr){go({name:"exam",ex:dr});}break;}
  case "discard":lsSet(DKEY,null);render();break;
  case "practice":go({name:"practice",s:d.s,units:Object.keys(SUBJ[d.s].units)});break;
  case "practiceUnit":go({name:"practice",s:d.s,units:[String(d.u)]});break;
  case "practiceTopic":{const items=pick(BY[d.s].filter(q=>q.tp===d.tp),15).sort((x,y)=>x.t===y.t?0:(x.t==="mc"?-1:1));if(items.length)startExam(d.s,items,"practice");break;}
  case "errors":{const pool=shuffle(errorPool(d.s)).slice(0,20);if(pool.length)startExam(d.s,pool,"errors");break;}
  case "utoggle":{const u=d.u;const i=view.units.indexOf(u);if(i>=0)view.units.splice(i,1);else view.units.push(u);render();break;}
  case "uall":view.units=Object.keys(SUBJ[view.s].units);render();break;
  case "unone":view.units=[];render();break;
  case "startPractice":{const type=$("#ptype").value,num=+$("#pnum").value;let pool=BY[view.s].filter(q=>view.units.includes(String(q.u))&&(type==="all"||q.t===type));const items=pick(pool,num).sort((x,y)=>(x.t===y.t?x.u-y.u:(x.t==="mc"?-1:1)));if(items.length)startExam(view.s,items,"practice");break;}
  case "choose":{const it=ex.items[ex.cur];const o=+d.o;it.ans=(ex.mode==="exam"&&it.ans===o)?null:o;persistDraft();render();break;}
  case "clear":ex.items[ex.cur].ans=null;persistDraft();render();break;
  case "flag":ex.items[ex.cur].flag=!ex.items[ex.cur].flag;persistDraft();render();break;
  case "check":{readFill();const it=ex.items[ex.cur];checkItem(it);it.checked=true;render();break;}
  case "prev":readFill();if(ex.cur>0){ex.cur--;persistDraft();render();}break;
  case "next":readFill();if(ex.mode!=="exam"&&!ex.items[ex.cur].checked&&ex.items[ex.cur].ans!=null){const it=ex.items[ex.cur];checkItem(it);it.checked=true;render();break;}
    if(ex.cur<ex.items.length-1){ex.cur++;persistDraft();render();window.scrollTo({top:0});}else{ex.confirm=true;render();window.scrollTo({top:0});}break;
  case "goto":readFill();ex.cur=+d.i;persistDraft();render();window.scrollTo({top:0});break;
  case "askSubmit":readFill();ex.confirm=true;render();window.scrollTo({top:0});break;
  case "cancelSubmit":ex.confirm=false;render();break;
  case "submit":submitExam();break;
  case "quit":if(ex.mode==="exam"){if(!ex.quitAsk){ex.quitAsk=true;ex.confirm=false;render();showQuit();break;}}lsSet(DKEY,null);go({name:"home"});break;
  case "quitYes":lsSet(DKEY,null);go({name:"home"});break;
  case "filter":view.filter=d.f;render();break;
  case "askreset":view.confirmReset=true;render();break;
  case "noreset":view.confirmReset=false;render();break;
  case "reset":P={attempts:[],qs:{},v:1,pr:P.pr||{}};lsSet(DKEY,null);save();view.confirmReset=false;render();break;
  }}
function showQuit(){const wrap=document.querySelector(".wrap");const box=document.createElement("div");box.className="confirm";box.innerHTML=`<b>Abbandonare la simulazione?</b><p>Le risposte date finora non verranno salvate.</p><div class="row"><button class="btn danger" data-act="quitYes">Abbandona</button><button class="btn ghost" data-act="quitNo">Continua la prova</button></div>`;wrap.prepend(box);window.scrollTo({top:0});}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;if(b.classList.contains("overlay")&&e.target!==b)return;if(b.tagName==="INPUT")return;if(b.dataset.act==="quitNo"){view.ex.quitAsk=false;render();return;}e.preventDefault();act(b.dataset.act,b.dataset);});
