{id:"FC22",s:"fis",u:3,q:"La sostanza che riduce la tensione superficiale negli alveoli polmonari si chiama ……",c:["surfattante","surfactante","tensioattivo","surfattante polmonare"],e:"Senza surfattante gli alveoli più piccoli tenderebbero a collassare (legge di Laplace), come nella sindrome da distress respiratorio del neonato prematuro."},
{id:"FC23",s:"fis",u:4,q:"La frequenza si misura in hertz, cioè in s^……",c:["-1","−1"],n:-1,e:"1 Hz = 1 oscillazione al secondo."},
{id:"FC24",s:"fis",u:4,q:"Un suono la cui intensità è uguale alla soglia di udibilità (10⁻¹² W/m²) ha un livello sonoro di …… dB",c:["0","zero"],n:0,e:"β = 10·log(I/I₀) = 10·log 1 = 0 dB."},
{id:"FC25",s:"fis",u:4,q:"Un livello sonoro di 70 dB corrisponde a un'intensità superiore alla soglia di udibilità di un fattore 10^……",c:["7","sette"],n:7,e:"70 dB = 10·log(10⁷)."},
{id:"FC26",s:"fis",u:4,q:"Le onde sonore con frequenza superiore a 20 kHz si chiamano ……",c:["ultrasuoni","ultrasuono"],e:"In ecografia si usano ultrasuoni tra circa 2 e 15 MHz."},
{id:"FC27",s:"fis",u:4,q:"Un'onda con periodo 0,02 s ha frequenza …… Hz",c:["50","cinquanta"],n:50,e:"f = 1/T = 1/0,02 = 50 Hz."},
{id:"FC28",s:"fis",u:4,q:"Nelle onde stazionarie, i punti che restano sempre fermi si chiamano ……",c:["nodi","nodo"],e:"I punti di oscillazione massima si chiamano ventri."},
{id:"FC29",s:"fis",u:5,q:"La temperatura di 0 K corrisponde a …… °C",c:["-273","-273,15","-273.15","−273,15","−273"],n:-273.15,tol:0.002,e:"T(°C) = T(K) − 273,15."},
{id:"FC30",s:"fis",u:5,q:"La quantità di calore necessaria per aumentare di 1 K la temperatura di 1 kg di una sostanza si chiama calore ……",c:["specifico"],e:"Per l'acqua vale circa 4186 J/(kg·K), cioè 1 kcal/(kg·K)."},
{id:"FC31",s:"fis",u:5,q:"Una caloria equivale a circa …… J",c:["4,186","4.186","4,18","4.18","4,19","4.19","4,2","4.2"],n:4.186,tol:0.03,e:"1 cal = 4,186 J (equivalente meccanico del calore)."},
{id:"FC32",s:"fis",u:5,q:"Una trasformazione termodinamica che avviene a pressione costante si chiama ……",c:["isobara","isobarica"],e:"Isocora: volume costante. Isoterma: temperatura costante. Adiabatica: senza scambio di calore."},
{id:"FC33",s:"fis",u:5,q:"In un ciclo termodinamico completo la variazione di energia interna del sistema è ……",c:["nulla","zero","0"],n:0,e:"L'energia interna è una funzione di stato e alla fine del ciclo il sistema torna allo stato iniziale."},
{id:"FC34",s:"fis",u:5,q:"Una macchina termica che assorbe 1000 J e compie 250 J di lavoro ha un rendimento del …… %",c:["25"],n:25,e:"η = L/Qass = 250/1000 = 0,25."},
{id:"FC35",s:"fis",u:5,q:"La trasmissione del calore dovuta al movimento macroscopico di un fluido si chiama ……",c:["convezione"],e:"Esempio: la circolazione del sangue distribuisce il calore nel corpo."},
{id:"FC36",s:"fis",u:6,q:"La carica elementare dell'elettrone vale in modulo 1,6 · 10^…… C",c:["-19","−19"],n:-19,e:"e ≈ 1,602·10⁻¹⁹ C."},
{id:"FC37",s:"fis",u:6,q:"Un elettrone accelerato da una differenza di potenziale di 5000 V acquista un'energia di …… keV",c:["5","cinque"],n:5,e:"E = e·ΔV = 5000 eV = 5 keV."},
{id:"FC38",s:"fis",u:6,q:"L'unità di misura della capacità elettrica nel SI è il ……",c:["farad","f"],e:"1 F = 1 C/V; nella pratica si usano μF, nF e pF."},
{id:"FC39",s:"fis",u:6,q:"Due resistori da 4 Ω e 6 Ω collegati in serie hanno una resistenza equivalente di …… Ω",c:["10","dieci"],n:10,e:"In serie le resistenze si sommano."},
{id:"FC40",s:"fis",u:6,q:"Una corrente di 2 A che scorre per 10 s trasporta una carica di …… C",c:["20","venti"],n:20,e:"Q = I·t = 2 × 10 = 20 C."},
{id:"FC41",s:"fis",u:6,q:"L'unità di misura del campo magnetico nel SI è il ……",c:["tesla","t"],e:"1 T = 1 N/(A·m). Le macchine per risonanza magnetica usano tipicamente 1,5 o 3 T."},
{id:"FC42",s:"fis",u:6,q:"Le linee di forza del campo magnetico sono sempre ……",c:["chiuse","linee chiuse"],e:"Non esistono monopoli magnetici: il flusso di B attraverso una superficie chiusa è nullo."},
{id:"FC43",s:"fis",u:6,q:"Il fenomeno per cui una variazione di flusso magnetico genera una corrente in un circuito si chiama induzione ……",c:["elettromagnetica","magnetica"],e:"Legge di Faraday-Neumann-Lenz."},
{id:"FC44",s:"fis",u:7,q:"La luce visibile ha lunghezze d'onda comprese approssimativamente tra 400 e …… nm",c:["700","750","780","800"],n:700,tol:0.15,e:"Dal violetto (circa 400 nm) al rosso (circa 700-750 nm)."},
{id:"FC45",s:"fis",u:7,q:"L'indice di rifrazione assoluto del vuoto vale ……",c:["1","uno"],n:1,e:"n = c/v; nel vuoto v = c."},
{id:"FC46",s:"fis",u:7,q:"Il quanto di energia della radiazione elettromagnetica si chiama ……",c:["fotone","fotoni"],e:"E = h·f."},
{id:"FC47",s:"fis",u:7,q:"Una lente con potere di −2 diottrie ha una distanza focale di …… m",c:["-0,5","-0.5","−0,5","0,5","0.5"],n:-0.5,e:"f = 1/D = −0,5 m: è una lente divergente. (Viene accettato anche 0,5 in valore assoluto.)",abs:true},
{id:"FC48",s:"fis",u:7,q:"Il fenomeno che permette di guidare la luce nelle fibre ottiche è la riflessione ……",c:["totale","interna totale","totale interna"],e:"Avviene quando l'angolo di incidenza supera l'angolo limite."},
{id:"FC49",s:"fis",u:7,q:"Dopo 3 tempi di dimezzamento, la frazione di nuclei radioattivi non ancora decaduti è 1/……",c:["8","otto"],n:8,e:"(1/2)³ = 1/8."},
{id:"FC50",s:"fis",u:7,q:"Le radiazioni con energia sufficiente a strappare elettroni dagli atomi si dicono ……",c:["ionizzanti","ionizzante"],e:"Raggi X e γ sono ionizzanti; onde radio, microonde e infrarosso no."}
);

// FISICA — espansione 1 (metodi, meccanica, fluidi) — domande originali
BANK.push(
{id:"F201",s:"fis",u:1,q:"Per un antibiotico è prescritta una dose di 20 mg per kg di peso corporeo al giorno, divisa in due somministrazioni. Per un paziente di 60 kg ogni somministrazione deve essere di:",o:["600 mg","1200 mg","300 mg","40 mg","120 mg"],e:"Dose giornaliera = 20 × 60 = 1200 mg; divisa in 2 somministrazioni = 600 mg ciascuna."},
{id:"F202",s:"fis",u:1,q:"Quale delle seguenti unità di misura NON appartiene al Sistema Internazionale?",o:["La caloria","Il joule","Il pascal","Il tesla","Il kelvin"],e:"La caloria (1 cal = 4,186 J) è un'unità pratica non SI; joule, pascal, tesla e weber sono unità derivate del SI."},
{id:"F203",s:"fis",u:1,q:"Quali delle seguenti equivalenze sono corrette? I) 3,5·10⁻³ g = 3,5 mg; II) 2·10⁻⁶ m = 2 nm; III) 450 mL = 0,45 dm³",o:["Solo I e III","Solo I e II","Solo II e III","Solo II","Tutte"],e:"I è corretta (10⁻³ g = 1 mg). II è errata: 10⁻⁶ m = 1 μm, quindi 2 μm. III è corretta: 1 dm³ = 1 L = 1000 mL."},
{id:"F204",s:"fis",u:1,q:"Quale delle seguenti formule è dimensionalmente corretta (s spazio, v velocità, a accelerazione, t tempo)?",o:["v² = 2·a·s","v = a·s","s = v·a·t","v² = a·t","s = 2·a·t"],e:"[v²] = m²/s² e [a·s] = (m/s²)·m = m²/s²: le dimensioni coincidono. Nelle altre i due membri hanno dimensioni diverse."},
{id:"F205",s:"fis",u:1,q:"Una distanza di 80 km è misurata con un errore assoluto di 2 km. L'errore relativo percentuale è:",o:["2,5%","2%","4%","0,025%","40%"],e:"Errore relativo = 2/80 = 0,025 = 2,5%."},
{id:"F206",s:"fis",u:1,q:"Un globulo rosso ha diametro di circa 7,5·10⁻⁶ m. Questa misura equivale a:",o:["7,5 μm","7,5 nm","75 μm","0,75 mm","7,5 mm"],e:"10⁻⁶ m = 1 μm."},
{id:"F207",s:"fis",u:1,q:"Una barca si sposta di 6 km verso Nord, poi di 8 km verso Est. Il modulo dello spostamento totale è:",o:["10 km","14 km","2 km","48 km","7 km"],e:"Spostamenti perpendicolari: √(6² + 8²) = √100 = 10 km. La strada percorsa è invece 14 km."},
{id:"F208",s:"fis",u:1,q:"La somma di due vettori di modulo a e b è un vettore di modulo c tale che c² = a² + b². Si può affermare che i due vettori:",o:["sono perpendicolari","sono paralleli e concordi","sono paralleli e discordi","formano un angolo acuto","formano un angolo ottuso"],e:"c² = a² + b² + 2ab·cos θ: il termine con il coseno si annulla solo per θ = 90°."},
{id:"F209",s:"fis",u:1,q:"La somma di due vettori di modulo 3 e 4 ha modulo 6. L'angolo tra i due vettori è:",o:["acuto","retto","ottuso","nullo","piatto"],e:"Se fossero perpendicolari la somma avrebbe modulo 5. Poiché 6 > 5, cos θ > 0 e l'angolo è acuto."},
{id:"F210",s:"fis",u:1,q:"Tre vettori di modulo 1, a due a due perpendicolari (come gli assi x, y, z), hanno somma di modulo:",o:["√3","3","1","√2","0"],e:"La somma ha componenti (1, 1, 1): modulo √(1+1+1) = √3."},
{id:"F211",s:"fis",u:1,q:"Il vettore a ha componenti (3, 4) e il vettore b ha componenti (1, −2). Il prodotto scalare a·b vale:",o:["−5","11","5","−11","0"],e:"a·b = aₓbₓ + a_yb_y = 3·1 + 4·(−2) = 3 − 8 = −5."},
{id:"F212",s:"fis",u:1,q:"L'anno luce è un'unità di misura di:",o:["lunghezza","tempo","velocità","energia","luminosità"],e:"È la distanza percorsa dalla luce nel vuoto in un anno, circa 9,46·10¹⁵ m."},

{id:"F213",s:"fis",u:2,q:"Un corpo lanciato verticalmente verso l'alto torna al punto di lancio dopo 4 s (g = 10 m/s², senza attrito). La sua velocità iniziale era:",o:["20 m/s","40 m/s","10 m/s","80 m/s","5 m/s"],e:"La salita dura metà del tempo totale, cioè 2 s: v₀ = g·t = 10 × 2 = 20 m/s."},
{id:"F214",s:"fis",u:2,q:"Due sassi cadono da fermi da due edifici alti 45 m e 5 m (senza attrito). Il rapporto tra le loro velocità all'arrivo al suolo è:",o:["3","9","√3","1","1/3"],e:"v = √(2gh): il rapporto è √(45/5) = √9 = 3."},
{id:"F215",s:"fis",u:2,q:"Un'auto che viaggia a 72 km/h frena e si ferma in 4 s con decelerazione costante. La decelerazione vale:",o:["5 m/s²","18 m/s²","2,5 m/s²","20 m/s²","10 m/s²"],e:"72 km/h = 20 m/s; a = Δv/Δt = 20/4 = 5 m/s²."},
{id:"F216",s:"fis",u:2,q:"Un corpo con velocità iniziale di 10 m/s si ferma dopo 25 m con decelerazione costante. Quanto vale la decelerazione?",o:["2 m/s²","4 m/s²","0,4 m/s²","2,5 m/s²","1 m/s²"],e:"v₀² = 2·a·s → a = 100/50 = 2 m/s²."},
{id:"F217",s:"fis",u:2,q:"Due auto viaggiano sulla stessa strada nello stesso verso a 90 km/h e 60 km/h. La velocità della prima rispetto alla seconda è:",o:["30 km/h","150 km/h","75 km/h","1,5 km/h","0 km/h"],e:"Velocità relativa nello stesso verso: differenza delle velocità."},
{id:"F218",s:"fis",u:2,q:"Una barca risale un fiume a 12 km/h rispetto all'acqua, mentre la corrente scorre a 4 km/h. La velocità della barca rispetto alla riva è:",o:["8 km/h","16 km/h","12 km/h","3 km/h","4 km/h"],e:"Controcorrente le velocità si sottraggono: 12 − 4 = 8 km/h."},
{id:"F219",s:"fis",u:2,q:"Un corpo compie 120 giri al minuto di moto circolare uniforme. La sua frequenza è:",o:["2 Hz","120 Hz","0,5 Hz","60 Hz","4π Hz"],e:"120 giri / 60 s = 2 giri al secondo = 2 Hz (periodo 0,5 s)."},
{id:"F220",s:"fis",u:2,q:"Una ruota gira con velocità angolare di 314 rad/s. La sua frequenza è circa:",o:["50 Hz","314 Hz","100 Hz","0,02 Hz","3,14 Hz"],e:"f = ω/(2π) = 314/6,28 ≈ 50 Hz."},
{id:"F221",s:"fis",u:2,q:"Due corpi percorrono circonferenze di raggio r e 4r con la stessa velocità angolare. Il rapporto tra le accelerazioni centripete (secondo/primo) è:",o:["4","16","2","1/4","1"],e:"a = ω²·r: a parità di ω, l'accelerazione è proporzionale al raggio."},
{id:"F222",s:"fis",u:2,q:"Nel moto armonico semplice:",o:["l'accelerazione è massima agli estremi e nulla al centro","l'accelerazione è nulla agli estremi e massima al centro","la velocità è massima agli estremi e nulla al centro","la velocità e l'accelerazione sono massime insieme al centro","l'accelerazione è proporzionale alla velocità istantanea"],e:"a = −ω²·x: è massima in modulo dove lo spostamento è massimo (estremi). La velocità è invece massima al centro e nulla agli estremi."},
{id:"F223",s:"fis",u:2,q:"Un oscillatore armonico ha ampiezza 2 m e frequenza 1 Hz. La velocità massima è circa:",o:["12,6 m/s","2 m/s","6,28 m/s","4 m/s","1 m/s"],e:"v_max = ω·A = 2π·f·A = 2π × 1 × 2 ≈ 12,6 m/s."},
{id:"F224",s:"fis",u:2,q:"Un aereo che vola orizzontalmente a velocità costante lascia cadere un pacco. Trascurando l'aria, rispetto all'aereo il pacco:",o:["cade verticalmente, restando sempre sotto l'aereo","resta indietro, descrivendo una parabola rispetto all'aereo","precede l'aereo, perché accelera cadendo","cade verticalmente rispetto al suolo, restando indietro","descrive un arco di circonferenza rispetto all'aereo"],e:"Il pacco conserva la velocità orizzontale dell'aereo: rispetto al suolo descrive una parabola, rispetto all'aereo cade lungo la verticale."},
{id:"F225",s:"fis",u:2,q:"Una persona di 70 kg è in un ascensore che sale accelerando a 2 m/s² (g = 10 m/s²). La bilancia su cui si trova segna un peso apparente di:",o:["840 N","700 N","560 N","140 N","720 N"],e:"N − mg = ma → N = m(g + a) = 70 × 12 = 840 N."},
{id:"F226",s:"fis",u:2,q:"In quale delle seguenti situazioni una persona in ascensore pesa (apparentemente) meno del normale?",o:["L'ascensore sale rallentando","L'ascensore sale accelerando","L'ascensore scende rallentando","L'ascensore è fermo","L'ascensore sale a velocità costante"],e:"Il peso apparente è minore quando l'accelerazione è diretta verso il basso: sale rallentando oppure scende accelerando."},
{id:"F227",s:"fis",u:2,q:"Se l'ascensore precipitasse in caduta libera, una bilancia sotto i piedi di un passeggero segnerebbe:",o:["zero","il peso normale","il doppio del peso","metà del peso","un valore negativo"],e:"Con accelerazione g verso il basso N = m(g − g) = 0: è la condizione di 'assenza di peso' degli astronauti in orbita."},
{id:"F228",s:"fis",u:2,q:"Un corpo scivola senza attrito lungo un piano inclinato di 30° (g = 10 m/s²). La sua accelerazione lungo il piano è:",o:["5 m/s²","10 m/s²","8,7 m/s²","2,5 m/s²","0 m/s²"],e:"a = g·sen 30° = 10 × 0,5 = 5 m/s², indipendente dalla massa."},
{id:"F229",s:"fis",u:2,q:"Un corpo è fermo su un piano inclinato ruvido. Aumentando l'inclinazione, il corpo comincia a scivolare quando:",o:["la tangente dell'angolo supera il coefficiente di attrito statico","il seno dell'angolo supera il coefficiente di attrito statico","la tangente dell'angolo supera il coefficiente di attrito dinamico","la massa del corpo supera un valore critico per quell'angolo","il coseno dell'angolo supera il coefficiente di attrito statico"],e:"Il corpo scivola quando mg·sen θ > μs·mg·cos θ, cioè tg θ > μs, indipendentemente dalla massa."},
{id:"F230",s:"fis",u:2,q:"Una cassa di 10 kg è trascinata a velocità costante su un pavimento orizzontale da una forza orizzontale di 30 N (g = 10 m/s²). Il coefficiente di attrito dinamico è:",o:["0,3","3","0,03","0,1","0,33"],e:"A velocità costante la forza applicata eguaglia l'attrito: μ = F/(m·g) = 30/100 = 0,3."},
{id:"F231",s:"fis",u:2,q:"Quali delle seguenti proprietà sono tipiche dell'attrito radente dinamico? I) È parallelo alla superficie e opposto al moto; II) È proporzionale alla forza normale; III) È proporzionale al quadrato della velocità",o:["Solo I e II","Solo I","Solo II e III","Solo III","Tutte"],e:"L'attrito radente dinamico vale μd·N e, in buona approssimazione, non dipende dalla velocità; la dipendenza dalla velocità è tipica dell'attrito viscoso nei fluidi."},
{id:"F232",s:"fis",u:2,q:"Un fucile di 4 kg spara un proiettile di 10 g a 400 m/s. La velocità di rinculo del fucile è:",o:["1 m/s","4 m/s","0,1 m/s","10 m/s","40 m/s"],e:"Conservazione della quantità di moto: 4·V = 0,01 × 400 = 4 → V = 1 m/s, in verso opposto."},
{id:"F233",s:"fis",u:2,q:"Se il raggio della Terra raddoppiasse mantenendo la stessa massa, l'accelerazione di gravità sulla superficie:",o:["diventerebbe un quarto","si dimezzerebbe","raddoppierebbe","resterebbe uguale","diventerebbe un ottavo"],e:"g = G·M/R²: a parità di massa, con 2R g diventa 1/4."},
{id:"F234",s:"fis",u:2,q:"A un'altezza dal suolo pari al raggio terrestre (quindi a distanza 2R dal centro), il peso di un corpo è:",o:["un quarto di quello in superficie","la metà di quello in superficie","uguale a quello in superficie","un ottavo di quello in superficie","un sedicesimo di quello in superficie"],e:"La forza di gravità varia come 1/r²: (R/2R)² = 1/4."},
{id:"F235",s:"fis",u:2,q:"Un astronauta in orbita sulla Stazione Spaziale si sente senza peso perché:",o:["lui e la stazione cadono insieme verso la Terra con la stessa accelerazione","a quell'altezza la gravità terrestre è quasi del tutto nulla","l'atmosfera rarefatta lo sostiene come una spinta di Archimede","la forza centrifuga annulla la sua massa inerziale","la Luna lo attrae con una forza uguale e opposta a quella della Terra"],e:"A 400 km di quota g vale ancora circa il 90% di quella in superficie: l'imponderabilità deriva dal fatto che tutto è in caduta libera."},
{id:"F236",s:"fis",u:2,q:"Un corpo di 2 kg si muove a 3 m/s. Per fermarlo in 0,5 s serve una forza media di:",o:["12 N","3 N","6 N","1,5 N","24 N"],e:"F = Δp/Δt = (2 × 3)/0,5 = 12 N."},
{id:"F237",s:"fis",u:2,q:"Una palla di 0,5 kg arriva su un muro a 10 m/s e rimbalza indietro alla stessa velocità. La variazione della sua quantità di moto ha modulo:",o:["10 kg·m/s","5 kg·m/s","0","20 kg·m/s","2,5 kg·m/s"],e:"La velocità cambia da +10 a −10 m/s: Δp = 0,5 × 20 = 10 kg·m/s."},
{id:"F238",s:"fis",u:2,q:"Un corpo di 1 kg cade da 20 m e rimbalza fino a 15 m. La frazione di energia meccanica dissipata nell'urto è:",o:["25%","75%","33%","15%","5%"],e:"L'energia è proporzionale all'altezza raggiunta: (20 − 15)/20 = 0,25."},
{id:"F239",s:"fis",u:2,q:"Una persona di 60 kg sale una scala alta 5 m in 10 s (g = 10 m/s²). La potenza media sviluppata è:",o:["300 W","3000 W","30 W","600 W","120 W"],e:"P = m·g·h/t = 60 × 10 × 5/10 = 300 W."},
{id:"F240",s:"fis",u:2,q:"Una lampadina da 60 W resta accesa per 10 ore. L'energia consumata è:",o:["0,6 kWh","6 kWh","600 kWh","60 kWh","0,06 kWh"],e:"E = P·t = 0,060 kW × 10 h = 0,6 kWh (pari a 2,16 MJ)."},
{id:"F241",s:"fis",u:2,q:"Un motore con rendimento del 40% assorbe 500 W. La potenza utile è:",o:["200 W","300 W","1250 W","460 W","540 W"],e:"P_utile = η·P_assorbita = 0,40 × 500 = 200 W; i restanti 300 W sono dissipati."},
{id:"F242",s:"fis",u:2,q:"Una persona tiene fermo un pacco di 10 kg a un metro da terra per 5 minuti. Il lavoro meccanico compiuto sul pacco è:",o:["nullo","100 J","3000 J","30 000 J","5000 J"],e:"Senza spostamento il lavoro meccanico è zero; la fatica percepita è dovuta al consumo energetico dei muscoli, che si contraggono senza spostare il carico."},
{id:"F243",s:"fis",u:2,q:"Si usa un piano inclinato per caricare un oggetto pesante su un camion perché, trascurando gli attriti:",o:["il lavoro è lo stesso, ma serve una forza minore su un percorso più lungo","si compie meno lavoro perché la forza è minore","serve una forza maggiore, ma per un tempo minore","il lavoro è lo stesso, ma serve una forza maggiore su un percorso più corto","l'energia potenziale finale dell'oggetto risulta minore"],e:"Il lavoro totale è sempre m·g·h; il piano inclinato riduce la forza (m·g·sen θ) aumentando lo spostamento."},
{id:"F244",s:"fis",u:2,q:"Una leva di primo genere ha il braccio della forza motrice lungo 1,2 m e il braccio della resistenza lungo 0,3 m. Per equilibrare un peso di 400 N serve una forza di:",o:["100 N","1600 N","400 N","300 N","120 N"],e:"Fm·bm = Fr·br → Fm = 400 × 0,3/1,2 = 100 N."},
{id:"F245",s:"fis",u:2,q:"Il bicipite si inserisce sull'avambraccio a 4 cm dal gomito, mentre un peso di 20 N è tenuto nella mano a 32 cm dal gomito. Trascurando il peso dell'avambraccio, la forza del bicipite per l'equilibrio è:",o:["160 N","20 N","2,5 N","80 N","640 N"],e:"Fb × 4 = 20 × 32 → Fb = 160 N. È una leva di terzo genere: sempre svantaggiosa, ma favorisce rapidità e ampiezza del movimento."},
{id:"F246",s:"fis",u:2,q:"Tre masse uguali si trovano sull'asse x nei punti x = −2, x = 1 e x = 4. Il centro di massa si trova in:",o:["x = 1","x = 0","x = 3","x = 1,5","x = 2"],e:"x_cm = (−2 + 1 + 4)/3 = 3/3 = 1."},
{id:"F247",s:"fis",u:2,q:"Una massa di 1 kg è in x = 0 e una di 3 kg è in x = 4 m. Il centro di massa si trova in:",o:["x = 3 m","x = 2 m","x = 1 m","x = 4 m","x = 1,33 m"],e:"x_cm = (1·0 + 3·4)/(1 + 3) = 12/4 = 3 m: è più vicino alla massa maggiore."},
{id:"F248",s:"fis",u:2,q:"Un corpo appoggiato su una base resta in equilibrio stabile finché:",o:["la verticale del baricentro cade dentro la base di appoggio","il baricentro si trova sopra la base, a qualsiasi altezza","la verticale del baricentro cade fuori dalla base di appoggio","la massa del corpo è distribuita in modo uniforme","il baricentro coincide con il centro geometrico della base"],e:"Se la verticale del baricentro esce dalla base di appoggio, il momento del peso fa ribaltare il corpo (vale anche per la postura del corpo umano)."},
{id:"F249",s:"fis",u:2,q:"Un cavo d'acciaio di lunghezza L si allunga di 1 mm sotto una certa forza. Un cavo dello stesso acciaio e stessa sezione ma lungo 2L, sotto la stessa forza, si allunga di:",o:["2 mm","1 mm","0,5 mm","4 mm","0,25 mm"],e:"ΔL = F·L/(Y·A): a parità di forza, sezione e materiale l'allungamento è proporzionale alla lunghezza."},
{id:"F250",s:"fis",u:2,q:"Raddoppiando l'area della sezione di un filo, a parità di forza applicata, lunghezza e materiale, l'allungamento:",o:["si dimezza","raddoppia","resta invariato","quadruplica","si riduce a un quarto"],e:"ΔL = F·L/(Y·A) è inversamente proporzionale all'area della sezione."},
{id:"F251",s:"fis",u:2,q:"Il carico di rottura di un materiale rappresenta:",o:["lo sforzo massimo che il materiale sopporta prima di rompersi","l'allungamento massimo che il materiale subisce prima di rompersi","lo sforzo oltre il quale la deformazione diventa permanente","la forza elastica di richiamo per unità di allungamento","il rapporto tra sforzo e deformazione nel tratto elastico"],e:"Si misura in N/m² (Pa). Oltre il limite di elasticità il materiale si deforma in modo permanente, poi si rompe."},
{id:"F252",s:"fis",u:2,q:"Una massa appesa a una molla oscilla con frequenza f. Se la massa viene quadruplicata, la frequenza diventa:",o:["f/2","f/4","2f","4f","f"],e:"f = (1/2π)·√(k/m): con 4m la frequenza si dimezza."},
{id:"F253",s:"fis",u:2,q:"Il periodo di un pendolo semplice (piccole oscillazioni):",o:["dipende dalla lunghezza del filo e da g, non dalla massa","dipende dalla massa appesa e da g, non dalla lunghezza","dipende dalla lunghezza, dalla massa e da g","è proporzionale all'ampiezza delle oscillazioni","dipende solo dalla lunghezza, non da g"],e:"T = 2π·√(L/g). Quadruplicando la lunghezza il periodo raddoppia."},
{id:"F254",s:"fis",u:2,q:"Una sfera piena e un cilindro pieno, partendo da fermi dalla stessa altezza, rotolano senza strisciare lungo lo stesso piano inclinato. Si può affermare che:",o:["parte dell'energia va in rotazione, quindi arrivano più lenti di un corpo che scivola","arrivano con la velocità di un corpo in caduta libera dalla stessa altezza","l'attrito statico dissipa energia, quindi arrivano più lenti di un corpo che scivola","arrivano con la stessa velocità, che dipende però dalla loro massa","parte dell'energia va in rotazione, quindi arrivano più veloci di un corpo che scivola"],e:"Nel rotolamento puro l'attrito statico non dissipa energia, ma una parte di m·g·h va in ½·I·ω², quindi v < √(2gh). La sfera arriva prima del cilindro perché ha un momento d'inerzia relativamente minore."},

{id:"F255",s:"fis",u:3,q:"Un corpo di 10 kg immerso completamente in acqua ha un peso apparente di 60 N (g = 10 m/s²). Il suo volume è:",o:["4 dm³","6 dm³","10 dm³","1,6 dm³","40 dm³"],e:"Spinta = 100 − 60 = 40 N = ρ·V·g → V = 40/(1000 × 10) = 4·10⁻³ m³ = 4 dm³."},
{id:"F256",s:"fis",u:3,q:"Un oggetto galleggia in acqua con 3/4 del volume immerso. La sua densità è:",o:["750 kg/m³","250 kg/m³","1333 kg/m³","1000 kg/m³","75 kg/m³"],e:"All'equilibrio ρ_corpo/ρ_acqua = V_immerso/V = 3/4."},
{id:"F257",s:"fis",u:3,q:"Lo stesso cubo di legno galleggia prima in acqua dolce e poi in acqua di mare (più densa). In acqua di mare:",o:["la parte immersa è minore, e la spinta resta uguale al peso","la parte immersa è maggiore, e la spinta resta uguale al peso","la parte immersa è minore, e la spinta supera il peso","la parte immersa è uguale, e la spinta supera il peso","la parte immersa è maggiore, e la spinta è minore del peso"],e:"In galleggiamento la spinta è sempre uguale al peso; con un fluido più denso basta un volume immerso minore."},
{id:"F258",s:"fis",u:3,q:"Sul fondo di una piscina profonda 3 m la pressione assoluta è circa (P_atm ≈ 1,0·10⁵ Pa, g = 10 m/s²):",o:["1,3·10⁵ Pa","3·10⁴ Pa","1,03·10⁵ Pa","4·10⁵ Pa","3·10⁵ Pa"],e:"P = P_atm + ρ·g·h = 1,0·10⁵ + 1000 × 10 × 3 = 1,3·10⁵ Pa."},
{id:"F259",s:"fis",u:3,q:"Un subacqueo scende da 10 m a 30 m di profondità in mare. La pressione assoluta che subisce circa:",o:["raddoppia (da 2 a 4 atm)","triplica (da 1 a 3 atm)","triplica (da 2 a 6 atm)","resta uguale (circa 1 atm)","aumenta di 1,5 volte (da 2 a 3 atm)"],e:"Ogni 10 m d'acqua aggiungono circa 1 atm: a 10 m P ≈ 2 atm, a 30 m P ≈ 4 atm."},
{id:"F260",s:"fis",u:3,q:"La pressione arteriosa media misurata al braccio è 100 mmHg. Nei piedi di una persona in piedi, 1,3 m più in basso del cuore (ρ_sangue ≈ 1050 kg/m³), la pressione è:",o:["maggiore, per il contributo idrostatico della colonna di sangue","uguale, perché il cuore pompa con la stessa pressione ovunque","minore, perché la gravità sottrae pressione alla colonna di sangue","maggiore, perché nei piedi i vasi sono più larghi","minore, perché il sangue nei piedi scorre più lentamente"],e:"Il contributo idrostatico ρ·g·h ≈ 1050 × 9,8 × 1,3 ≈ 13 400 Pa ≈ 100 mmHg si somma: la pressione nei piedi è circa doppia. Per questo la pressione si misura all'altezza del cuore."},
{id:"F261",s:"fis",u:3,q:"In un manometro a U con mercurio, un ramo è collegato a un gas e l'altro aperto all'aria. Se il mercurio nel ramo aperto è 76 mm più alto, la pressione del gas è:",o:["circa 1,1 atm (P_atm + 76 mmHg)","circa 0,9 atm (P_atm − 76 mmHg)","1 atm, uguale alla pressione atmosferica","circa 1,2 atm (P_atm + 2·76 mmHg)","circa 0,1 atm (solo i 76 mmHg)"],e:"Il gas spinge il mercurio verso il ramo aperto: P_gas = P_atm + 76 mmHg = 836 mmHg ≈ 1,1 atm."},
{id:"F262",s:"fis",u:3,q:"Si inietta un farmaco con una siringa: il pistone ha sezione 2 cm² e la pressione nel liquido deve superare quella atmosferica di 20 kPa. La forza minima sul pistone (oltre a quella atmosferica) è:",o:["4 N","40 N","0,4 N","10 N","400 N"],e:"F = ΔP·A = 2·10⁴ Pa × 2·10⁻⁴ m² = 4 N."},
{id:"F263",s:"fis",u:3,q:"In un torchio idraulico il diametro del pistone grande è 10 volte quello del piccolo. La forza viene moltiplicata di un fattore:",o:["100","10","1000","√10","20"],e:"Le forze stanno nel rapporto delle aree, che sono proporzionali al quadrato dei diametri: 10² = 100."},
{id:"F264",s:"fis",u:3,q:"Se l'esperimento di Torricelli si eseguisse con l'acqua invece del mercurio (densità 13,6 volte minore), la colonna sarebbe alta circa:",o:["10,3 m","76 cm","1,36 m","13,6 cm","103 m"],e:"A parità di pressione l'altezza è inversamente proporzionale alla densità: 0,76 m × 13,6 ≈ 10,3 m."},
{id:"F265",s:"fis",u:3,q:"Il sangue attraversa l'aorta (sezione circa 3 cm²) a 30 cm/s. La portata è circa:",o:["90 cm³/s","10 cm³/s","33 cm³/s","900 cm³/s","9 cm³/s"],e:"Q = A·v = 3 cm² × 30 cm/s = 90 cm³/s, cioè circa 5,4 L/min."},
{id:"F266",s:"fis",u:3,q:"Nei capillari la velocità del sangue è molto più bassa che nell'aorta perché:",o:["l'area totale dei capillari in parallelo è molto maggiore di quella dell'aorta","ogni singolo capillare ha una sezione maggiore di quella dell'aorta","la portata totale nei capillari è molto minore di quella cardiaca","i capillari sono disposti in serie e sommano le loro resistenze","la viscosità del sangue nei capillari è molto più alta che nell'aorta, per l'ematocrito"],e:"Per l'equazione di continuità la portata totale è la stessa: con un'area complessiva centinaia di volte maggiore, la velocità è molto più bassa (circa 0,05 cm/s), il che favorisce gli scambi."},
{id:"F267",s:"fis",u:3,q:"La differenza di pressione tra le estremità di un vaso è 4000 Pa e la sua resistenza idraulica è 2·10⁸ Pa·s/m³. La portata è:",o:["2·10⁻⁵ m³/s","8·10¹¹ m³/s","5·10⁴ m³/s","2·10⁻⁴ m³/s","5·10⁻⁵ m³/s"],e:"Q = ΔP/R = 4000/(2·10⁸) = 2·10⁻⁵ m³/s, cioè 20 mL/s."},
{id:"F268",s:"fis",u:3,q:"Un vaso sanguigno subisce una vasocostrizione che riduce il raggio del 50%. Per mantenere la stessa portata, la differenza di pressione deve diventare:",o:["16 volte maggiore","2 volte maggiore","4 volte maggiore","8 volte maggiore","32 volte maggiore"],e:"R ∝ 1/r⁴: dimezzando il raggio la resistenza aumenta di 16 volte, e così il ΔP necessario."},
{id:"F269",s:"fis",u:3,q:"Secondo la legge di Stokes, la velocità limite di sedimentazione di una piccola sfera in un liquido viscoso è proporzionale:",o:["al quadrato del raggio della sfera","al raggio della sfera","alla viscosità del liquido","all'inverso del quadrato del raggio","al cubo del raggio"],e:"v = 2r²(ρ_s − ρ_l)·g/(9η). Su questo principio si basano la VES (velocità di eritrosedimentazione) e la centrifugazione, che aumenta l'accelerazione efficace."},
{id:"F270",s:"fis",u:3,q:"Una particella sedimenta a 2 cm/h. Una particella dello stesso materiale ma con raggio doppio, nello stesso liquido, sedimenta a:",o:["8 cm/h","4 cm/h","2 cm/h","16 cm/h","1 cm/h"],e:"v ∝ r²: con 2r la velocità diventa 4 volte maggiore."},
{id:"F271",s:"fis",u:3,q:"Secondo il teorema di Bernoulli per un fluido ideale in un condotto orizzontale, si mantiene costante:",o:["P + ½ρv²","P·v","P + ρv","P/v²","ρ·v·A soltanto"],e:"In un condotto non orizzontale si aggiunge il termine ρ·g·h: P + ½ρv² + ρgh = costante."},
{id:"F272",s:"fis",u:3,q:"Da un foro sul fondo di un serbatoio aperto esce acqua. Se il livello dell'acqua sopra il foro passa da 5 m a 20 m, la velocità di efflusso:",o:["raddoppia","quadruplica","resta uguale","si dimezza","aumenta di 15 volte"],e:"v = √(2gh): un'altezza 4 volte maggiore dà una velocità 2 volte maggiore."},
{id:"F273",s:"fis",u:3,q:"Il numero di Reynolds è una grandezza:",o:["adimensionale","che si misura in Pa·s","che si misura in m/s","che si misura in N/m","che si misura in kg/m³"],e:"Re = ρ·v·d/η: le unità si semplificano completamente."},
{id:"F274",s:"fis",u:3,q:"Due bolle di sapone di raggi diversi vengono collegate con un tubicino. Che cosa succede?",o:["La bolla piccola si svuota in quella grande","La bolla grande si svuota in quella piccola","Le due bolle raggiungono lo stesso raggio","Non succede nulla","Entrambe scoppiano subito"],e:"Per la legge di Laplace la pressione interna è maggiore nella bolla di raggio minore, che spinge l'aria in quella più grande: è il problema degli alveoli in assenza di surfattante."},
{id:"F275",s:"fis",u:3,q:"Se il raggio di un tubo capillare si dimezza, l'altezza di risalita dell'acqua (legge di Jurin):",o:["raddoppia","si dimezza","quadruplica","resta uguale","si riduce a un quarto"],e:"h = 2τ·cos θ/(ρ·g·r): l'altezza è inversamente proporzionale al raggio."},
{id:"F276",s:"fis",u:3,q:"Un ago d'acciaio appoggiato delicatamente può galleggiare sull'acqua grazie:",o:["alla tensione superficiale","alla spinta di Archimede soltanto","alla viscosità","alla capillarità","all'effetto Venturi"],e:"La superficie dell'acqua si comporta come una membrana elastica che sostiene piccoli oggetti, anche se più densi."},
{id:"F277",s:"fis",u:3,q:"Un fluido si definisce ideale se:",o:["è incomprimibile e privo di viscosità","è comprimibile e privo di viscosità","è incomprimibile e molto viscoso","scorre sempre in regime turbolento","ha densità trascurabile e viscosità costante"],e:"Il teorema di Bernoulli e la sola equazione di continuità valgono a rigore per fluidi ideali in moto stazionario."},
{id:"F278",s:"fis",u:3,q:"Due resistenze idrauliche di 3·10⁷ e 6·10⁷ Pa·s/m³ in serie hanno una resistenza equivalente di:",o:["9·10⁷ Pa·s/m³","2·10⁷ Pa·s/m³","4,5·10⁷ Pa·s/m³","18·10¹⁴ Pa·s/m³","3·10⁷ Pa·s/m³"],e:"In serie le resistenze si sommano (in parallelo si sommano i loro inversi, e si otterrebbe 2·10⁷)."}
);

// FISICA — espansione 2 (onde, termodinamica, elettromagnetismo, radiazioni) + completamento
BANK.push(
{id:"F301",s:"fis",u:4,q:"Due suoni hanno livelli sonori di 40 dB e 80 dB. Il rapporto tra le loro intensità è:",o:["10⁴","2","40","10²","10⁸"],e:"Δβ = 40 dB = 10·log(I₂/I₁) → I₂/I₁ = 10⁴."},
{id:"F302",s:"fis",u:4,q:"Due suoni hanno intensità 10⁻⁵ W/m² e 10⁻⁸ W/m². La differenza tra i loro livelli sonori è:",o:["30 dB","3 dB","1000 dB","13 dB","300 dB"],e:"10·log(10⁻⁵/10⁻⁸) = 10·log(10³) = 30 dB."},
{id:"F303",s:"fis",u:4,q:"Due sorgenti uguali e indipendenti producono ciascuna un livello sonoro di 60 dB. Insieme producono circa:",o:["63 dB","120 dB","60 dB","66 dB","80 dB"],e:"Le intensità si sommano: 2I → +10·log 2 ≈ +3 dB."},
{id:"F304",s:"fis",u:4,q:"Perché un suono sia udibile dall'orecchio umano deve avere:",o:["frequenza tra 20 Hz e 20 kHz e intensità sopra la soglia di udibilità","qualsiasi frequenza, purché l'intensità superi 10⁻¹² W/m²","frequenza tra 20 Hz e 20 kHz, qualunque sia l'intensità","frequenza superiore a 20 kHz e intensità sopra la soglia","frequenza tra 20 Hz e 20 kHz e intensità sopra la soglia del dolore"],e:"Servono entrambe le condizioni; la soglia di udibilità dipende dalla frequenza ed è minima intorno a 2-4 kHz."},
{id:"F305",s:"fis",u:4,q:"In un ecografo si usa un gel tra sonda e pelle perché:",o:["senza gel gli ultrasuoni verrebbero riflessi all'interfaccia aria-pelle","il gel aumenta la frequenza degli ultrasuoni emessi dalla sonda","il gel assorbe gli ultrasuoni riflessi che disturbano l'immagine","il gel rende sterile il contatto tra la sonda e la pelle","il gel trasforma gli ultrasuoni in onde elettromagnetiche"],e:"Aria e tessuti hanno impedenze acustiche molto diverse: oltre il 99% dell'energia sarebbe riflessa. Il gel elimina lo strato d'aria."},
{id:"F306",s:"fis",u:4,q:"Le sonde ecografiche producono ultrasuoni sfruttando:",o:["l'effetto piezoelettrico","l'effetto fotoelettrico","l'effetto Joule","l'effetto Doppler","l'emissione termoionica"],e:"Un cristallo piezoelettrico, sottoposto a una tensione alternata, vibra ed emette ultrasuoni; ricevendo l'eco genera a sua volta un segnale elettrico."},
{id:"F307",s:"fis",u:4,q:"In quale mezzo il suono si propaga più velocemente?",o:["Nell'acciaio","Nell'aria","Nell'elio","Nell'acqua","Nel vuoto"],e:"Velocità tipiche: aria circa 340 m/s, acqua circa 1500 m/s, acciaio circa 5000-6000 m/s. Nel vuoto il suono non si propaga."},
{id:"F308",s:"fis",u:4,q:"Una sorgente sonora si allontana da un osservatore fermo. L'osservatore percepisce:",o:["una frequenza minore di quella emessa","una frequenza maggiore","la stessa frequenza ma intensità maggiore","una velocità del suono maggiore","una lunghezza d'onda minore"],e:"Allontanandosi la sorgente 'allunga' le lunghezze d'onda verso l'osservatore: la frequenza percepita diminuisce (effetto Doppler)."},
{id:"F309",s:"fis",u:4,q:"La funzione della catena degli ossicini dell'orecchio medio è:",o:["adattare l'impedenza aria-liquido, amplificando la pressione","trasformare la vibrazione sonora in impulso nervoso","percepire l'equilibrio e l'accelerazione della testa","adattare l'impedenza aria-liquido, riducendo la pressione","amplificare la frequenza dei suoni gravi"],e:"La leva degli ossicini e il rapporto tra l'area del timpano e quella della finestra ovale aumentano la pressione di circa 20 volte, limitando le perdite per riflessione."},
{id:"F310",s:"fis",u:4,q:"Un'onda sonora passa dall'aria (v = 340 m/s) all'acqua (v = 1500 m/s). La sua lunghezza d'onda:",o:["aumenta di circa 4,4 volte","diminuisce di circa 4,4 volte","resta uguale","si annulla","raddoppia esattamente"],e:"La frequenza resta costante, quindi λ = v/f cresce come la velocità: 1500/340 ≈ 4,4."},
{id:"F311",s:"fis",u:4,q:"Le onde trasversali:",o:["fanno oscillare le particelle perpendicolarmente alla propagazione","fanno oscillare le particelle nella stessa direzione della propagazione","si propagano solo nei gas e non nei solidi","non trasportano energia ma solo quantità di moto","esistono solo nel vuoto, come le onde elettromagnetiche"],e:"Esempi: onde su una corda e onde elettromagnetiche. Il suono nei fluidi è invece un'onda longitudinale."},

{id:"F312",s:"fis",u:5,q:"Per fondere 100 g di ghiaccio a 0 °C (calore latente di fusione ≈ 334 J/g) servono circa:",o:["33,4 kJ","334 J","3,34 kJ","334 kJ","41,9 kJ"],e:"Q = m·λ = 100 × 334 = 33 400 J. La temperatura resta 0 °C finché tutto il ghiaccio non è fuso."},
{id:"F313",s:"fis",u:5,q:"Si mescolano 1 kg d'acqua a 80 °C e 3 kg d'acqua a 20 °C in un recipiente isolato. La temperatura di equilibrio è:",o:["35 °C","50 °C","40 °C","60 °C","30 °C"],e:"Media pesata sulle masse: (1 × 80 + 3 × 20)/4 = 140/4 = 35 °C."},
{id:"F314",s:"fis",u:5,q:"A parità di massa e di calore assorbito, la sostanza che si riscalda di più è quella con:",o:["calore specifico minore","calore specifico maggiore","densità maggiore","temperatura iniziale maggiore","volume maggiore"],e:"ΔT = Q/(m·c). L'acqua, con il suo alto calore specifico, si scalda lentamente e stabilizza la temperatura corporea e del clima."},
{id:"F315",s:"fis",u:5,q:"La capacità termica di un corpo si misura in:",o:["J/K","J/(kg·K)","J/kg","W/m²","K/J"],e:"C = Q/ΔT = m·c. Il calore specifico c si misura invece in J/(kg·K)."},
{id:"F316",s:"fis",u:5,q:"Secondo la legge di Fourier, il calore che passa per conduzione attraverso una parete nell'unità di tempo è:",o:["proporzionale all'area e a ΔT, inversamente proporzionale allo spessore","proporzionale allo spessore e a ΔT, inversamente proporzionale all'area","proporzionale all'area, a ΔT e allo spessore","proporzionale alla quarta potenza della temperatura","indipendente dal materiale della parete"],e:"Φ = k·A·ΔT/d, dove k è la conducibilità termica del materiale. Il grasso sottocutaneo, con k bassa, fa da isolante."},
{id:"F317",s:"fis",u:5,q:"Un gas ideale a 27 °C viene scaldato a volume costante finché la pressione raddoppia. La temperatura finale è:",o:["327 °C","54 °C","600 °C","300 °C","127 °C"],e:"A volume costante P/T = costante con T in kelvin: 300 K → 600 K = 327 °C."},
{id:"F318",s:"fis",u:5,q:"Un gas ideale si espande a temperatura costante da 2 L a 6 L. La pressione:",o:["diventa un terzo","triplica","resta uguale","si dimezza","diventa un sesto"],e:"Legge di Boyle: P·V = costante, quindi P si riduce di 3 volte."},
{id:"F319",s:"fis",u:5,q:"Un gas assorbe 500 J di calore e compie 200 J di lavoro sull'ambiente. La variazione della sua energia interna è:",o:["+300 J","+700 J","−300 J","−700 J","0 J"],e:"ΔU = Q − L = 500 − 200 = 300 J."},
{id:"F320",s:"fis",u:5,q:"In un'espansione adiabatica, un gas ideale:",o:["si raffredda, perché compie lavoro a spese dell'energia interna","si riscalda, perché compie lavoro a spese dell'energia interna","mantiene costante la temperatura, perché Q = 0","si raffredda, perché cede calore all'ambiente","si riscalda, perché assorbe calore dall'ambiente"],e:"Q = 0 → ΔU = −L < 0. È il motivo per cui l'aria si raffredda salendo di quota o uscendo da una bomboletta spray."},
{id:"F321",s:"fis",u:5,q:"Nel piano P-V, il lavoro compiuto da un gas in una trasformazione è rappresentato:",o:["dall'area sotto la curva della trasformazione","dalla pendenza della curva","dalla lunghezza della curva","dal prodotto delle coordinate finali","dalla differenza tra le pressioni finale e iniziale"],e:"In un ciclo il lavoro netto è l'area racchiusa dal ciclo."},
{id:"F322",s:"fis",u:5,q:"Una macchina termica assorbe 1000 J da una sorgente calda e cede 700 J a quella fredda. Il suo rendimento è:",o:["30%","70%","43%","100%","17%"],e:"L = 1000 − 700 = 300 J; η = 300/1000 = 0,30."},
{id:"F323",s:"fis",u:5,q:"Il rendimento massimo teorico di una macchina termica che opera tra 400 K e 300 K è:",o:["25%","75%","33%","100%","133%"],e:"Carnot: η = 1 − 300/400 = 0,25."},
{id:"F324",s:"fis",u:5,q:"Per aumentare il rendimento di una macchina di Carnot conviene:",o:["aumentare Tc o diminuire Tf","aumentare Tf o diminuire Tc","usare un gas con massa molare maggiore","aumentare il volume del cilindro","ridurre la differenza tra Tc e Tf"],e:"η = 1 − Tf/Tc dipende solo dal rapporto tra le temperature assolute."},
{id:"F325",s:"fis",u:5,q:"Il calore passa spontaneamente da un corpo freddo a uno caldo:",o:["mai, senza un lavoro esterno (Clausius)","sempre, se il contatto è prolungato","sì, purché la differenza di temperatura sia piccola","solo nei processi adiabatici","solo se i corpi sono metallici"],e:"Un frigorifero sposta calore dal freddo al caldo solo consumando lavoro."},
{id:"F326",s:"fis",u:5,q:"Il corpo umano a riposo perde calore principalmente per:",o:["irraggiamento","conduzione verso l'aria","convezione forzata","evaporazione del sudore in un ambiente freddo","conduzione verso il pavimento"],e:"In un ambiente temperato a riposo l'irraggiamento infrarosso rappresenta circa il 50-60% delle perdite; con il caldo o lo sforzo prevale l'evaporazione."},
{id:"F327",s:"fis",u:5,q:"La temperatura assoluta di un corpo raddoppia. La potenza che irraggia (legge di Stefan-Boltzmann):",o:["aumenta di 16 volte","raddoppia","quadruplica","aumenta di 8 volte","aumenta di 32 volte"],e:"P ∝ T⁴: 2⁴ = 16."},
{id:"F328",s:"fis",u:5,q:"La termografia a infrarossi misura la temperatura cutanea sfruttando:",o:["l'irraggiamento termico emesso dalla pelle","la conduzione termica tra la pelle e il sensore","la convezione dell'aria a contatto con la pelle","la riflessione degli ultravioletti da parte della pelle","l'emissione di microonde da parte dei vasi sanguigni"],e:"Ogni corpo emette radiazione termica; per la legge di Wien la pelle (circa 307 K) emette soprattutto intorno a 9-10 μm."},
{id:"F329",s:"fis",u:5,q:"L'energia interna di un gas ideale monoatomico dipende:",o:["solo dalla temperatura (e dal numero di moli)","solo dalla pressione (e dal numero di moli)","solo dal volume (e dal numero di moli)","dalla temperatura e dal volume occupato","dalla pressione e dalla temperatura insieme"],e:"U = (3/2)·n·R·T: per un gas ideale le molecole non interagiscono, quindi conta solo l'energia cinetica."},
{id:"F330",s:"fis",u:5,q:"Il calore specifico a pressione costante di un gas ideale è maggiore di quello a volume costante perché:",o:["a P costante parte del calore va nel lavoro di espansione","a V costante parte del calore va nel lavoro di espansione","a P costante l'energia interna del gas non varia","a V costante il gas si raffredda cedendo calore","a P costante il gas compie lavoro negativo sull'ambiente"],e:"Relazione di Mayer: cp − cv = R (per mole)."},

{id:"F331",s:"fis",u:6,q:"Due cariche identiche si respingono con una forza di 9 N. Se una delle due cariche raddoppia e la distanza triplica, la forza diventa:",o:["2 N","6 N","18 N","4,5 N","1 N"],e:"F' = F·2/3² = 9 × 2/9 = 2 N."},
{id:"F332",s:"fis",u:6,q:"Una sfera metallica con carica Q tocca successivamente tre sfere identiche scariche, una alla volta. Alla fine la prima sfera ha carica:",o:["Q/8","Q/4","Q/3","Q/6","Q/16"],e:"A ogni contatto tra sfere identiche la carica si divide a metà: Q/2, Q/4, Q/8."},
{id:"F333",s:"fis",u:6,q:"Due cariche positive Q e 4Q sono distanti 90 cm. Il punto tra le due in cui una terza carica resta in equilibrio si trova a:",o:["30 cm da Q","45 cm da Q","60 cm da Q","18 cm da Q","22,5 cm da Q"],e:"k·Q/x² = k·4Q/(0,9 − x)² → 0,9 − x = 2x → x = 0,3 m."},
{id:"F334",s:"fis",u:6,q:"Tra due piastre parallele distanti 4 cm c'è una differenza di potenziale di 200 V. Il campo elettrico uniforme tra le piastre vale:",o:["5000 V/m","50 V/m","8 V/m","800 V/m","500 V/m"],e:"E = ΔV/d = 200/0,04 = 5000 V/m."},
{id:"F335",s:"fis",u:6,q:"Il campo elettrico si può esprimere, oltre che in N/C, anche in:",o:["V/m","V·m","C/m²","J/C","W/A"],e:"1 N/C = 1 V/m. (J/C è il volt, unità di potenziale.)"},
{id:"F336",s:"fis",u:6,q:"Le linee di forza del campo elettrostatico e le superfici equipotenziali sono:",o:["sempre perpendicolari tra loro","sempre parallele tra loro","coincidenti in ogni punto","perpendicolari solo vicino alle cariche","parallele solo in un campo uniforme"],e:"Spostandosi lungo una superficie equipotenziale il campo non compie lavoro, quindi deve essere perpendicolare a essa."},
{id:"F337",s:"fis",u:6,q:"Due sfere conduttrici isolate di raggi R e 2R hanno la stessa carica Q. Il potenziale della sfera più grande, rispetto a quello della più piccola, è:",o:["la metà","il doppio","uguale","un quarto","quattro volte"],e:"Per una sfera conduttrice V = k·Q/R: a parità di carica il potenziale è inversamente proporzionale al raggio."},
{id:"F338",s:"fis",u:6,q:"Il prodotto coulomb × volt corrisponde a:",o:["un'energia (joule)","una potenza (watt)","una capacità (farad)","una corrente (ampere)","una resistenza (ohm)"],e:"L = q·ΔV: 1 C·V = 1 J."},
{id:"F339",s:"fis",u:6,q:"In un mezzo con costante dielettrica relativa εr = 80 (come l'acqua), la forza tra due cariche, rispetto al vuoto:",o:["diventa 80 volte più piccola","diventa 80 volte più grande","resta uguale","diventa 6400 volte più piccola","si annulla"],e:"F = k·q₁q₂/(εr·r²). È il motivo per cui l'acqua scioglie bene i composti ionici."},
{id:"F340",s:"fis",u:6,q:"Inserendo tra le armature di un condensatore piano un dielettrico con εr = 4, a parità di dimensioni la capacità:",o:["quadruplica","si riduce a un quarto","raddoppia","resta uguale","si annulla"],e:"C = εr·ε₀·A/d."},
{id:"F341",s:"fis",u:6,q:"Per raddoppiare la capacità di un condensatore piano si può:",o:["dimezzare la distanza tra le armature","raddoppiare la distanza tra le armature","raddoppiare la tensione applicata","dimezzare l'area delle armature","raddoppiare la carica"],e:"C = ε·A/d dipende solo dalla geometria e dal dielettrico, non da carica o tensione."},
{id:"F342",s:"fis",u:6,q:"Due resistenze uguali R sono in serie, e la coppia è collegata in parallelo con una terza resistenza R. La resistenza equivalente è:",o:["2R/3","3R","R/3","3R/2","R"],e:"Serie: 2R. Parallelo con R: (2R·R)/(2R + R) = 2R/3."},
{id:"F343",s:"fis",u:6,q:"Due resistenze da 100 Ω in parallelo sono collegate in serie a una resistenza da 50 Ω. La resistenza totale è:",o:["100 Ω","250 Ω","150 Ω","50 Ω","200 Ω"],e:"Parallelo: 50 Ω; più 50 Ω in serie: 100 Ω."},
{id:"F344",s:"fis",u:6,q:"Due resistenze uguali in parallelo sono attraversate complessivamente da 3 A quando ai loro capi ci sono 12 V. Ciascuna resistenza vale:",o:["8 Ω","4 Ω","2 Ω","36 Ω","16 Ω"],e:"Req = 12/3 = 4 Ω; due resistenze uguali in parallelo danno R/2, quindi R = 8 Ω."},
{id:"F345",s:"fis",u:6,q:"Tre lampadine da 20 W, 60 W e 100 W sono alimentate alla stessa tensione di 230 V. Quella con la resistenza maggiore è:",o:["quella da 20 W","quella da 100 W","quella da 60 W","hanno tutte la stessa resistenza","non si può stabilire"],e:"A tensione fissata P = V²/R, quindi R = V²/P: potenza minore significa resistenza maggiore."},
{id:"F346",s:"fis",u:6,q:"Un filo di rame e uno di ferro, con stessa lunghezza e sezione, sono collegati in parallelo alla stessa batteria. Si può affermare che:",o:["hanno la stessa ddp ai capi, ma correnti diverse","sono attraversati dalla stessa corrente, ma con ddp diverse","hanno la stessa ddp e la stessa corrente","hanno la stessa resistenza perché hanno uguali dimensioni","hanno la stessa ddp, ma la corrente è maggiore nel ferro"],e:"In parallelo la ddp è la stessa. Il rame ha resistività minore, quindi resistenza minore e corrente maggiore."},
{id:"F347",s:"fis",u:6,q:"Tre pile da 1,5 V collegate in serie (polo positivo di una con il negativo della successiva) forniscono una tensione di:",o:["4,5 V","1,5 V","0,5 V","3 V","6 V"],e:"In serie le forze elettromotrici si sommano."},
{id:"F348",s:"fis",u:6,q:"Una persona che tocca un solo filo dell'alta tensione restando appesa senza toccare altro:",o:["non è attraversata da corrente significativa: non c'è ddp tra due punti del corpo","è attraversata dalla corrente della linea perché il filo è ad alta tensione","è attraversata da corrente perché il suo corpo è un buon conduttore","non è attraversata da corrente perché il corpo umano è un isolante perfetto","è attraversata da corrente solo se la linea è a corrente alternata"],e:"La corrente richiede una ddp tra due punti di contatto. Il pericolo nasce se si tocca contemporaneamente terra o un altro conduttore (come gli uccelli che si posano su un solo filo)."},
{id:"F349",s:"fis",u:6,q:"Il condensatore di un defibrillatore da 100 μF viene caricato a 2000 V. L'energia immagazzinata è:",o:["200 J","0,2 J","100 J","400 J","2000 J"],e:"U = ½·C·V² = ½ × 10⁻⁴ × 4·10⁶ = 200 J."},
{id:"F350",s:"fis",u:6,q:"Un protone entra con velocità v perpendicolare a un campo magnetico uniforme B e descrive una circonferenza di raggio r. Se la velocità raddoppia, il raggio diventa:",o:["2r","r/2","4r","r","r/4"],e:"r = m·v/(q·B): il raggio è proporzionale alla velocità."},
{id:"F351",s:"fis",u:6,q:"Una carica di 2 μC si muove a 300 m/s perpendicolarmente a un campo magnetico di 0,5 T. La forza di Lorentz vale:",o:["3·10⁻⁴ N","3·10² N","1,2·10⁻³ N","6·10⁻⁴ N","0"],e:"F = q·v·B = 2·10⁻⁶ × 300 × 0,5 = 3·10⁻⁴ N."},
{id:"F352",s:"fis",u:6,q:"Una carica attraversa senza deviare una regione con campo elettrico E e campo magnetico B perpendicolari tra loro e alla velocità. La sua velocità è:",o:["v = E/B","v = B/E","v = E·B","v = E/B²","qualsiasi valore"],e:"Le due forze si equilibrano: q·E = q·v·B → v = E/B (selettore di velocità, usato nello spettrometro di massa)."},
{id:"F353",s:"fis",u:6,q:"Il flusso magnetico nel SI si misura in:",o:["weber (T·m²)","tesla","henry","gauss","ampere/metro"],e:"Φ = B·A·cos θ; 1 Wb = 1 T·m² = 1 V·s."},
{id:"F354",s:"fis",u:6,q:"Una spira di area 100 cm² è immersa in un campo magnetico perpendicolare di 1 T e viene estratta dal campo in 1 ms. La f.e.m. media indotta è:",o:["10 V","0,01 V","100 V","1 V","1000 V"],e:"ΔΦ = 1 T × 10⁻² m² = 10⁻² Wb; f.e.m. = ΔΦ/Δt = 10⁻²/10⁻³ = 10 V."},
{id:"F355",s:"fis",u:6,q:"In un circuito fermo immerso in un campo magnetico costante nel tempo:",o:["non si genera alcuna f.e.m. indotta","si genera una f.e.m. costante","si genera una f.e.m. proporzionale a B","circola sempre una corrente","si genera una f.e.m. alternata"],e:"Serve una variazione del flusso concatenato (di B, dell'area o dell'orientazione) per avere induzione."},
{id:"F356",s:"fis",u:6,q:"A riposo, nel neurone le concentrazioni ioniche sono tali che:",o:["[K⁺] interno > [K⁺] esterno e [Na⁺] interno < [Na⁺] esterno","[K⁺] interno < [K⁺] esterno e [Na⁺] interno > [Na⁺] esterno","Na⁺ e K⁺ hanno le stesse concentrazioni dentro e fuori","[Cl⁻] interno > [Cl⁻] esterno","non ci sono gradienti ionici"],e:"Il K⁺ è circa 140 mM dentro e 5 mM fuori; il Na⁺ circa 15 mM dentro e 145 mM fuori. Il potenziale di Nernst del K⁺ (circa −90 mV) è vicino al potenziale di riposo."},
{id:"F357",s:"fis",u:6,q:"Il potenziale di equilibrio di Nernst di uno ione è:",o:["il potenziale di membrana a cui il flusso netto dello ione è nullo","il potenziale di membrana a cui il flusso dello ione è massimo","il valore di picco raggiunto durante il potenziale d'azione","il potenziale generato dalla sola pompa Na⁺/K⁺","il potenziale a cui le concentrazioni dello ione si eguagliano"],e:"A quel potenziale la forza elettrica bilancia esattamente il gradiente di concentrazione: E = (RT/zF)·ln(C_est/C_int)."},
{id:"F358",s:"fis",u:6,q:"La corrente alternata di rete a 50 Hz attraversa il corpo umano. La corrente tollerata senza conseguenze è dell'ordine di:",o:["1 mA","1 A","10 A","1 kA","100 A"],e:"Già pochi mA sono percepiti, oltre 10-20 mA si ha tetanizzazione muscolare e intorno a 100 mA il rischio di fibrillazione ventricolare è elevato."},

{id:"F359",s:"fis",u:7,q:"Un fascio di raggi X attraversa 10,5 cm di un tessuto con spessore di dimezzamento (SEV) di 3,5 cm. L'intensità emergente è:",o:["1/8 di quella incidente","1/3 di quella incidente","1/4 di quella incidente","1/16 di quella incidente","1/2 di quella incidente"],e:"10,5/3,5 = 3 spessori di dimezzamento: (1/2)³ = 1/8."},
{id:"F360",s:"fis",u:7,q:"Un fascio di raggi X, dopo aver attraversato 18 cm di un materiale, emerge con intensità pari a 1/8 di quella incidente. Lo spessore di dimezzamento del materiale è:",o:["6 cm","2,25 cm","9 cm","3 cm","8 cm"],e:"1/8 = (1/2)³: 18 cm corrispondono a 3 SEV, quindi SEV = 6 cm."},
{id:"F361",s:"fis",u:7,q:"L'intensità di un fascio di raggi X che attraversa la materia diminuisce con lo spessore attraversato in modo:",o:["esponenziale","lineare","proporzionale all'inverso dello spessore","a gradini","proporzionale al quadrato dello spessore"],e:"I = I₀·e^(−μx), dove μ è il coefficiente di attenuazione; il SEV vale ln2/μ."},
{id:"F362",s:"fis",u:7,q:"Lo iodio-131 ha emivita fisica di 8 giorni ed emivita biologica nella tiroide di 24 giorni. L'emivita effettiva è:",o:["6 giorni","32 giorni","16 giorni","8 giorni","3 giorni"],e:"1/T_eff = 1/T_fis + 1/T_biol = 1/8 + 1/24 = 4/24 → T_eff = 6 giorni. L'emivita effettiva è sempre minore di entrambe."},
{id:"F363",s:"fis",u:7,q:"Il fosforo-32 ha un'emivita di 2 settimane. L'attività di un campione si riduce a un quarto dopo:",o:["4 settimane","2 settimane","8 settimane","1 settimana","6 settimane"],e:"1/4 = (1/2)²: servono due emivite."},
{id:"F364",s:"fis",u:7,q:"Un campione ha un'attività di 64 mCi. Dopo 5 emivite l'attività è:",o:["2 mCi","12,8 mCi","4 mCi","1 mCi","32 mCi"],e:"64/2⁵ = 64/32 = 2 mCi."},
{id:"F365",s:"fis",u:7,q:"L'unità SI dell'attività di una sorgente radioattiva è:",o:["il becquerel (Bq)","il gray (Gy)","il sievert (Sv)","il curie (Ci)","il coulomb/kg (C/kg)"],e:"Il curie è un'unità storica: 1 Ci = 3,7·10¹⁰ Bq."},
{id:"F366",s:"fis",u:7,q:"La dose assorbita (energia ceduta per unità di massa) si misura in:",o:["gray (Gy = J/kg)","sievert (Sv = J/kg)","becquerel (Bq = s⁻¹)","coulomb/kg (C/kg)","curie (Ci)"],e:"La dose equivalente, che tiene conto del tipo di radiazione tramite un fattore di ponderazione, si misura in sievert (anch'esso J/kg)."},
{id:"F367",s:"fis",u:7,q:"A parità di dose assorbita, il danno biologico è maggiore per:",o:["le particelle α","i raggi γ","i raggi X","gli elettroni β","è uguale per tutte"],e:"Le particelle α hanno un fattore di ponderazione 20 (contro 1 per fotoni ed elettroni) perché depositano l'energia in tracce molto dense."},
{id:"F368",s:"fis",u:7,q:"Tra le seguenti radiazioni, la meno penetrante nella materia è:",o:["la radiazione α","la radiazione β","la radiazione γ","i raggi X","i neutroni veloci"],e:"Le particelle α sono fermate da un foglio di carta o dallo strato superficiale della pelle; le β da pochi mm di alluminio; i γ richiedono spessori di piombo."},
{id:"F369",s:"fis",u:7,q:"Il nucleo ²³⁸U emette una particella α e poi il nucleo figlio emette una particella β⁻. Il nucleo finale ha:",o:["A = 234 e Z = 91","A = 234 e Z = 90","A = 236 e Z = 91","A = 238 e Z = 89","A = 234 e Z = 88"],e:"α: A − 4, Z − 2 → ²³⁴Th (Z = 90). β⁻: A invariato, Z + 1 → ²³⁴Pa (Z = 91)."},
{id:"F370",s:"fis",u:7,q:"Nel decadimento β⁺ del ¹⁸F (Z = 9), usato nella PET, si forma:",o:["¹⁸O (Z = 8)","¹⁸Ne (Z = 10)","¹⁷F","¹⁴N","¹⁸F in uno stato eccitato"],e:"Nel β⁺ un protone diventa neutrone: Z diminuisce di 1 e A resta 18. Il positrone emesso si annichila con un elettrone producendo due fotoni da 511 keV."},
{id:"F371",s:"fis",u:7,q:"Nella PET (tomografia a emissione di positroni) si rilevano:",o:["due fotoni γ da 511 keV emessi in direzioni opposte","un solo fotone γ da 1022 keV emesso dal positrone","i positroni direttamente, che escono dal corpo","due fotoni γ da 511 keV emessi nella stessa direzione","raggi X prodotti da un tubo che ruota attorno al paziente"],e:"I rivelatori registrano in coincidenza le coppie di fotoni, ricostruendo la retta lungo cui è avvenuta l'annichilazione."},
{id:"F372",s:"fis",u:7,q:"Un decadimento γ:",o:["non cambia né A né Z del nucleo","diminuisce Z di 1","diminuisce A di 4","aumenta Z di 1","trasforma un neutrone in protone"],e:"Il nucleo passa da uno stato eccitato a uno meno energetico emettendo un fotone."},
{id:"F373",s:"fis",u:7,q:"I raggi X in un tubo radiogeno si producono quando:",o:["elettroni veloci vengono bruscamente frenati da un anodo metallico","protoni veloci vengono bruscamente frenati da un anodo metallico","un nucleo instabile dell'anodo decade emettendo particelle α","elettroni di valenza dell'anodo vengono eccitati dalla luce visibile","una corrente alternata attraversa un solenoide ad alta frequenza"],e:"Si ottengono uno spettro continuo di frenamento (bremsstrahlung) e righe caratteristiche dovute alle transizioni degli elettroni interni del metallo dell'anodo."},
{id:"F374",s:"fis",u:7,q:"Ordinate per lunghezza d'onda decrescente: luce visibile, microonde, raggi X.",o:["microonde, luce visibile, raggi X","raggi X, luce visibile, microonde","luce visibile, microonde, raggi X","microonde, raggi X, luce visibile","raggi X, microonde, luce visibile"],e:"Le microonde hanno λ dell'ordine dei cm, il visibile circa 400-700 nm, i raggi X circa 0,01-10 nm."},
{id:"F375",s:"fis",u:7,q:"Una radiazione elettromagnetica con λ = 2 cm appartiene:",o:["alle microonde","all'infrarosso","alla luce visibile","all'ultravioletto","ai raggi X"],e:"Le microonde vanno da circa 1 mm a 1 m."},
{id:"F376",s:"fis",u:7,q:"Due onde elettromagnetiche nel vuoto hanno λ₁ = 2·λ₂. Le loro frequenze stanno nel rapporto f₁/f₂ =",o:["1/2","2","4","1/4","1"],e:"Nel vuoto f = c/λ: la frequenza è inversamente proporzionale alla lunghezza d'onda."},
{id:"F377",s:"fis",u:7,q:"La luce rossa con λ = 600 nm nel vuoto entra in un vetro con n = 1,5. Nel vetro la sua lunghezza d'onda è:",o:["400 nm","900 nm","600 nm","300 nm","1,5 nm"],e:"La frequenza non cambia; λ e v si riducono di n: 600/1,5 = 400 nm (il colore percepito non cambia)."},
{id:"F378",s:"fis",u:7,q:"Un oggetto è posto a 30 cm da una lente convergente di focale 10 cm. L'immagine si forma a:",o:["15 cm dalla lente, reale e capovolta","15 cm dalla lente, virtuale e diritta","30 cm dalla lente, reale e capovolta","7,5 cm dalla lente, reale e capovolta","20 cm dalla lente, virtuale e ingrandita"],e:"1/p + 1/q = 1/f → 1/q = 1/10 − 1/30 = 2/30 → q = 15 cm. Immagine reale, capovolta, rimpicciolita (ingrandimento −0,5)."},
{id:"F379",s:"fis",u:7,q:"Un oggetto è posto a 10 cm da una lente convergente di focale 20 cm. L'immagine è:",o:["virtuale, diritta, a 20 cm dalla parte dell'oggetto","reale, capovolta, a 20 cm dalla parte opposta","virtuale, capovolta, a 20 cm dalla parte dell'oggetto","reale, diritta, a 6,7 cm dalla parte opposta","virtuale, diritta, a 6,7 cm dalla parte dell'oggetto"],e:"1/q = 1/20 − 1/10 = −1/20 → q = −20 cm: immagine virtuale e diritta, ingrandita 2 volte (lente d'ingrandimento)."},
{id:"F380",s:"fis",u:7,q:"Due lenti sottili a contatto hanno poteri di +5 D e −2 D. Il sistema ha potere:",o:["+3 D","+7 D","−10 D","+2,5 D","−3 D"],e:"Per lenti sottili a contatto i poteri diottrici si sommano."},
{id:"F381",s:"fis",u:7,q:"Un ipermetrope ha il punto prossimo a 1 m invece che a 25 cm. Per leggere a 25 cm gli serve una lente di potere circa:",o:["+3 D","−3 D","+4 D","+1 D","−1 D"],e:"La lente deve formare a 1 m (virtuale) l'immagine di un oggetto posto a 25 cm: D = 1/0,25 − 1/1 = 4 − 1 = +3 D (lente convergente)."},
{id:"F382",s:"fis",u:7,q:"Nell'occhio miope:",o:["l'immagine di un oggetto lontano si forma davanti alla retina","l'immagine di un oggetto lontano si forma dietro la retina","l'immagine di un oggetto vicino si forma davanti alla retina","il cristallino ha perso la capacità di accomodare","la cornea ha curvature diverse in direzioni diverse"],e:"Il sistema ottico è troppo convergente (o il bulbo troppo lungo): si corregge con lenti divergenti. Nell'ipermetropia l'immagine si forma dietro la retina."},
{id:"F383",s:"fis",u:7,q:"L'astigmatismo è dovuto principalmente:",o:["a una curvatura corneale diversa in direzioni diverse","alla perdita di elasticità del cristallino con l'età","a un bulbo oculare troppo corto rispetto al potere ottico","a un bulbo oculare troppo lungo rispetto al potere ottico","all'opacizzazione progressiva del cristallino"],e:"Si corregge con lenti cilindriche. La perdita di elasticità del cristallino con l'età è la presbiopia; l'opacità è la cataratta."},
{id:"F384",s:"fis",u:7,q:"Aprendo gli occhi sott'acqua senza maschera si vede sfocato perché:",o:["l'acqua ha indice simile alla cornea, che perde gran parte del potere convergente","l'acqua ha indice molto maggiore della cornea, che diventa troppo convergente","l'acqua assorbe quasi tutta la luce visibile prima che arrivi alla retina","il cristallino si irrigidisce in acqua e non riesce più ad accomodare","la luce in acqua è polarizzata e la retina non la percepisce"],e:"La cornea fornisce circa due terzi del potere diottrico dell'occhio grazie al salto di indice aria-cornea; in acqua questo salto quasi scompare."},
{id:"F385",s:"fis",u:7,q:"Nel microscopio ottico, tra obiettivo e preparato si mette talvolta una goccia di olio (immersione) per:",o:["aumentare l'apertura numerica e quindi il potere risolutivo","aumentare l'ingrandimento senza cambiare il potere risolutivo","ridurre l'apertura numerica per avere più profondità di campo","raffreddare il preparato durante l'osservazione","ridurre la diffrazione della luce colorando il campione"],e:"L'olio ha indice simile al vetro: raccoglie raggi più inclinati che altrimenti andrebbero persi per rifrazione o riflessione totale."},
{id:"F386",s:"fis",u:7,q:"L'ingrandimento totale di un microscopio composto è:",o:["il prodotto degli ingrandimenti di obiettivo e oculare","la somma degli ingrandimenti di obiettivo e oculare","il rapporto tra ingrandimento dell'obiettivo e dell'oculare","l'ingrandimento dell'obiettivo soltanto","la differenza tra gli ingrandimenti delle due lenti"],e:"Esempio: obiettivo 40× e oculare 10× danno 400×."},
{id:"F387",s:"fis",u:7,q:"La luce non polarizzata di intensità I₀ attraversa un polarizzatore ideale. L'intensità trasmessa è:",o:["I₀/2","I₀","I₀/4","0","2I₀"],e:"Un polarizzatore ideale trasmette in media metà dell'intensità della luce naturale; la polarizzazione dimostra che la luce è un'onda trasversale."},
{id:"F389",s:"fis",u:7,q:"Perché si osservi interferenza stabile tra due onde luminose, le sorgenti devono essere:",o:["coerenti: stessa frequenza e differenza di fase costante","di intensità uguale, anche con frequenze diverse tra loro","di frequenza diversa, ma con fase iniziale uguale","incoerenti, con fase che varia in modo casuale","polarizzate in direzioni perpendicolari tra loro"],e:"Due lampadine ordinarie non producono figure di interferenza perché la loro fase relativa cambia continuamente."},
{id:"F390",s:"fis",u:7,q:"Il laser emette luce:",o:["monocromatica, coerente e collimata, per emissione stimolata","monocromatica, coerente e collimata, per emissione spontanea","policromatica, coerente e collimata, per emissione stimolata","monocromatica, incoerente e diffusa, per emissione stimolata","con spettro continuo, come una lampadina a incandescenza"],e:"LASER = Light Amplification by Stimulated Emission of Radiation; richiede un'inversione di popolazione nel mezzo attivo."}
);
BANK.push(
{id:"FC101",s:"fis",u:1,q:"Una dose di 15 mg/kg per un paziente di 80 kg corrisponde a …… mg",c:["1200","1.200"],n:1200,e:"15 × 80 = 1200 mg."},
{id:"FC102",s:"fis",u:1,q:"Un'accelerazione di 250 cm/s² corrisponde a …… m/s²",c:["2,5","2.5"],n:2.5,e:"250 cm = 2,5 m."},
{id:"FC103",s:"fis",u:1,q:"Un volume di 5 cm³ corrisponde a …… mL",c:["5","cinque"],n:5,e:"1 cm³ = 1 mL."},
{id:"FC104",s:"fis",u:1,q:"Il prefisso 'nano' corrisponde a un fattore 10^……",c:["-9","−9"],n:-9,e:"nano = 10⁻⁹, pico = 10⁻¹²."},
{id:"FC105",s:"fis",u:2,q:"Una persona di 50 kg in un ascensore che scende accelerando a 2 m/s² (g = 10 m/s²) ha un peso apparente di …… N",c:["400"],n:400,e:"N = m(g − a) = 50 × 8 = 400 N."},
{id:"FC106",s:"fis",u:2,q:"Un'auto passa da 0 a 108 km/h in 10 s. La sua accelerazione media è …… m/s²",c:["3","tre"],n:3,e:"108 km/h = 30 m/s; a = 30/10 = 3 m/s²."},
{id:"FC107",s:"fis",u:2,q:"Una forza di 10 N applicata con un angolo di 60° rispetto allo spostamento ha una componente parallela allo spostamento di …… N",c:["5","cinque"],n:5,e:"F·cos 60° = 10 × 0,5 = 5 N."},
{id:"FC108",s:"fis",u:2,q:"Il momento della forza si misura nel SI in newton per ……",c:["metro","m"],e:"M = F·b, in N·m (non va confuso con il joule, anche se dimensionalmente coincide)."},
{id:"FC109",s:"fis",u:2,q:"Due masse di 2 kg e 6 kg si trovano in x = 0 e x = 8 m. Il centro di massa è in x = …… m",c:["6","sei"],n:6,e:"(2·0 + 6·8)/8 = 48/8 = 6 m."},
{id:"FC110",s:"fis",u:2,q:"Il modulo di Young di un materiale è il rapporto tra lo sforzo e la ……",c:["deformazione","deformazione relativa","allungamento relativo","allungamento percentuale"],e:"Y = (F/A)/(ΔL/L)."},
{id:"FC111",s:"fis",u:2,q:"Quadruplicando la lunghezza di un pendolo semplice, il suo periodo diventa …… volte maggiore.",c:["2","due"],n:2,e:"T ∝ √L: √4 = 2."},
{id:"FC112",s:"fis",u:2,q:"Un corpo di 4 kg che si muove a 5 m/s si ferma in 2 s. La forza media frenante è …… N",c:["10","dieci"],n:10,e:"F = Δp/Δt = 20/2 = 10 N."},
{id:"FC113",s:"fis",u:2,q:"Un atleta che sviluppa una potenza di 75 W per 1 minuto compie un lavoro di …… J",c:["4500","4.500"],n:4500,e:"L = P·t = 75 × 60 = 4500 J."},
{id:"FC114",s:"fis",u:3,q:"Un oggetto con densità 600 kg/m³ galleggia in acqua con il …… % del volume immerso.",c:["60","sessanta"],n:60,e:"V_imm/V = 600/1000."},
{id:"FC115",s:"fis",u:3,q:"Ogni 10 m di profondità in acqua la pressione aumenta di circa …… atm",c:["1","una","uno"],n:1,e:"ρ·g·h = 1000 × 9,8 × 10 ≈ 9,8·10⁴ Pa ≈ 1 atm."},
{id:"FC116",s:"fis",u:3,q:"La legge che descrive la velocità di sedimentazione di piccole sfere in un fluido viscoso è la legge di ……",c:["stokes"],e:"La forza viscosa su una sfera è F = 6π·η·r·v."},
{id:"FC117",s:"fis",u:3,q:"Lo strumento che misura la pressione di un gas confrontandola con quella atmosferica tramite un tubo a U si chiama ……",c:["manometro","manometro a u"],e:"Il barometro misura invece la pressione atmosferica assoluta."},
{id:"FC118",s:"fis",u:3,q:"Dimezzando il raggio di un vaso, la sua resistenza idraulica aumenta di …… volte.",c:["16","sedici"],n:16,e:"R ∝ 1/r⁴."},
{id:"FC119",s:"fis",u:3,q:"L'effetto per cui in una strozzatura di un condotto la pressione diminuisce mentre la velocità aumenta prende il nome di effetto ……",c:["venturi"],e:"È una conseguenza del teorema di Bernoulli."},
{id:"FC120",s:"fis",u:4,q:"Se il rapporto tra le intensità di due suoni è 1000, la differenza tra i loro livelli sonori è …… dB",c:["30","trenta"],n:30,e:"10·log 1000 = 30 dB."},
{id:"FC121",s:"fis",u:4,q:"Un'onda di frequenza 2 MHz si propaga nei tessuti molli a 1540 m/s. La sua lunghezza d'onda è circa …… mm",c:["0,77","0.77","0,8","0.8"],n:0.77,tol:0.05,e:"λ = v/f = 1540/(2·10⁶) = 7,7·10⁻⁴ m = 0,77 mm."},
{id:"FC122",s:"fis",u:4,q:"La proprietà dei cristalli di generare una tensione quando vengono deformati, sfruttata nelle sonde ecografiche, è detta effetto ……",c:["piezoelettrico"],e:"Funziona anche al contrario: una tensione alternata fa vibrare il cristallo."},
{id:"FC123",s:"fis",u:4,q:"La distanza tra due nodi consecutivi di un'onda stazionaria è pari a mezza ……",c:["lunghezza d'onda","lunghezza donda","lambda"],e:"I nodi distano λ/2."},
{id:"FC124",s:"fis",u:5,q:"Mescolando 2 kg d'acqua a 10 °C con 2 kg d'acqua a 50 °C si ottiene acqua a …… °C",c:["30","trenta"],n:30,e:"Masse uguali: media semplice."},
{id:"FC125",s:"fis",u:5,q:"Una temperatura di 300 K corrisponde a circa …… °C",c:["27","26,85","26.85"],n:27,tol:0.02,e:"300 − 273,15 = 26,85 ≈ 27 °C."},
{id:"FC126",s:"fis",u:5,q:"Il rendimento di una macchina di Carnot tra 500 K e 400 K è del …… %",c:["20","venti"],n:20,e:"1 − 400/500 = 0,2."},
{id:"FC127",s:"fis",u:5,q:"Un gas compie 200 J di lavoro in un'espansione adiabatica. La sua energia interna varia di …… J",c:["-200","−200"],n:-200,e:"Q = 0 → ΔU = −L."},
{id:"FC128",s:"fis",u:5,q:"Il calore necessario per trasformare un'unità di massa di sostanza da liquido a vapore, a temperatura costante, si chiama calore latente di ……",c:["evaporazione","vaporizzazione","ebollizione"],e:"Per l'acqua circa 2260 J/g a 100 °C."},
{id:"FC129",s:"fis",u:5,q:"Secondo la teoria cinetica, l'energia cinetica media di traslazione di una molecola di gas ideale è (3/2)·k·T, dove k è la costante di ……",c:["boltzmann"],e:"k = R/Nₐ ≈ 1,38·10⁻²³ J/K."},
{id:"FC130",s:"fis",u:6,q:"Una sfera carica con Q tocca una sfera identica scarica. Dopo il contatto ciascuna ha carica Q/……",c:["2","due"],n:2,e:"La carica si distribuisce in parti uguali tra conduttori identici."},
{id:"FC131",s:"fis",u:6,q:"Tra due punti di un campo uniforme di 2000 V/m, distanti 5 cm lungo le linee di forza, la differenza di potenziale è …… V",c:["100","cento"],n:100,e:"ΔV = E·d = 2000 × 0,05 = 100 V."},
{id:"FC132",s:"fis",u:6,q:"Una lampadina da 100 W alimentata a 200 V è attraversata da una corrente di …… A",c:["0,5","0.5"],n:0.5,e:"I = P/V = 100/200."},
{id:"FC133",s:"fis",u:6,q:"Un condensatore da 0,4 μF caricato a 1000 V immagazzina un'energia di …… J",c:["0,2","0.2"],n:0.2,e:"½ × 4·10⁻⁷ × 10⁶ = 0,2 J."},
{id:"FC134",s:"fis",u:6,q:"Il tracciato dell'attività elettrica del cuore registrato con elettrodi sulla pelle si chiama ……",c:["elettrocardiogramma","ecg","elettrocardiografia"],e:"L'elettroencefalogramma (EEG) registra invece l'attività elettrica cerebrale."},
{id:"FC135",s:"fis",u:6,q:"Due conduttori in serie sono attraversati dalla stessa ……",c:["corrente","intensita di corrente","intensità di corrente"],e:"In parallelo hanno invece la stessa differenza di potenziale."},
{id:"FC136",s:"fis",u:7,q:"Un fascio di raggi X attraversa 15 cm di un materiale con spessore di dimezzamento di 3 cm. L'intensità si riduce di un fattore ……",c:["32","trentadue"],n:32,e:"15/3 = 5 dimezzamenti: 2⁵ = 32."},
{id:"FC137",s:"fis",u:7,q:"Un radionuclide con emivita fisica di 6 ore e biologica di 12 ore ha un'emivita effettiva di …… ore",c:["4","quattro"],n:4,e:"1/T = 1/6 + 1/12 = 3/12 → T = 4 h."},
{id:"FC138",s:"fis",u:7,q:"La dose equivalente, che tiene conto del tipo di radiazione, si misura in ……",c:["sievert","sv"],e:"La dose assorbita si misura in gray."},
{id:"FC139",s:"fis",u:7,q:"Una lente divergente di focale −20 cm ha un potere di …… diottrie",c:["-5","−5"],n:-5,e:"D = 1/f = 1/(−0,20 m) = −5 D."},
{id:"FC140",s:"fis",u:7,q:"Un oggetto è a 0,5 m da uno specchio piano. La sua immagine si forma a …… m dall'oggetto.",c:["1","uno"],n:1,e:"L'immagine è virtuale, a 0,5 m dietro lo specchio, quindi a 1 m dall'oggetto."},
{id:"FC141",s:"fis",u:7,q:"Il difetto visivo dovuto alla perdita di elasticità del cristallino con l'età si chiama ……",c:["presbiopia","presbitismo"],e:"Si corregge con lenti convergenti per la visione da vicino."},
{id:"FC142",s:"fis",u:7,q:"Nella TC, la scala che assegna 0 all'acqua e −1000 all'aria si chiama scala di ……",c:["hounsfield"],e:"L'osso compatto ha valori di circa +1000 HU."},
{id:"FC143",s:"fis",u:7,q:"Nel decadimento α il numero di massa del nucleo diminuisce di ……",c:["4","quattro"],n:4,e:"Viene emesso un nucleo di ⁴He."},
{id:"FC144",s:"fis",u:7,q:"La particella di antimateria emessa nel decadimento β⁺ si chiama ……",c:["positrone","positone","antielettrone"],e:"Ha la massa dell'elettrone e carica +e."},
{id:"FC145",s:"fis",u:7,q:"Il fenomeno per cui un'onda aggira un ostacolo di dimensioni paragonabili alla sua lunghezza d'onda si chiama ……",c:["diffrazione"],e:"Limita il potere risolutivo degli strumenti ottici."}
);

// BIOLOGIA — rinforzo unità 5 (strutture cellulari) e domande difficili (d:1)
BANK.push(
{id:"B501",s:"bio",u:5,d:1,q:"Una proteina ha una sequenza segnale N-terminale per il RE, una sequenza di stop del trasferimento e nessun altro segnale. Dopo la sintesi si troverà:",o:["nella membrana plasmatica, come proteina a singolo passaggio","nel lume del RE, come proteina solubile residente","nella membrana interna mitocondriale, come proteina a più passaggi","nel lume del lisosoma, come idrolasi solubile","secreta all'esterno della cellula come proteina solubile"],e:"La sequenza segnale porta la catena nel traslocone; la sequenza di stop la àncora nella membrana del RE. Senza segnali di ritenzione o di smistamento, la proteina segue la via di default fino alla membrana plasmatica."},
{id:"B502",s:"bio",u:5,d:1,q:"Una proteina solubile entra nel lume del RE e possiede all'estremità C-terminale la sequenza KDEL. Se il recettore KDEL fosse mutato e non funzionante, la proteina:",o:["verrebbe secreta all'esterno della cellula","resterebbe comunque nel RE grazie alle chaperon","verrebbe retrotraslocata e degradata nel proteasoma","verrebbe inviata ai lisosomi tramite il recettore M6P","resterebbe nel cis-Golgi senza proseguire"],e:"Le proteine residenti del RE che sfuggono al Golgi non verrebbero più recuperate e seguirebbero la via secretoria costitutiva."},
{id:"B503",s:"bio",u:5,d:1,q:"Un farmaco che inibisce la V-ATPasi (pompa protonica) degli endosomi e dei lisosomi provocherebbe soprattutto:",o:["il blocco del distacco dei carichi dai recettori e della degradazione","l'aumento della sintesi di ATP per accumulo di protoni nel citosol","l'attivazione delle idrolasi acide già negli endosomi precoci","il blocco della gemmazione delle vescicole di clatrina","l'arresto della traduzione dei ribosomi legati al RE"],e:"L'acidificazione serve sia a staccare i carichi dai recettori negli endosomi (es. M6P, LDL) sia ad attivare le idrolasi acide."},
{id:"B504",s:"bio",u:5,d:1,q:"Una cellula viene trattata con un disaccoppiante che rende la membrana mitocondriale interna permeabile ai protoni. Che cosa succede?",o:["Aumenta il consumo di O₂, ma l'ATP crolla e si produce calore","Si azzera il consumo di O₂ e la sintesi di ATP crolla","Aumenta la sintesi di ATP perché i protoni rientrano più in fretta","Si arresta subito la glicolisi per mancanza di NAD⁺","La catena respiratoria si inverte e pompa protoni nella matrice"],e:"Il trasporto di elettroni continua (anzi accelera) senza produrre gradiente utile. È il principio della termogenesi del tessuto adiposo bruno (proteina UCP1)."},
{id:"B505",s:"bio",u:5,d:1,q:"Si inietta in una cellula una proteina citosolica a cui è stato aggiunto un segnale NLS e anche un segnale NES. Il risultato più probabile è che la proteina:",o:["faccia la spola tra nucleo e citoplasma","resti bloccata nel poro nucleare, legata alle nucleoporine","entri nel nucleo e vi resti definitivamente","resti nel citoplasma perché il NES prevale sempre sul NLS","venga degradata perché i due segnali sono incompatibili"],e:"Molte proteine regolatrici (es. alcuni fattori di trascrizione) si comportano proprio così; la loro localizzazione è regolata mascherando l'uno o l'altro segnale."},
{id:"B506",s:"bio",u:5,d:1,q:"La glicoproteina P (MDR1) iperespressa in una cellula tumorale causa resistenza a molti chemioterapici diversi perché:",o:["espelle attivamente numerosi farmaci idrofobici, consumando ATP","espelle i farmaci sfruttando il gradiente di Na⁺, senza ATP","degrada i farmaci nei lisosomi dopo averli legati in membrana","ripara il DNA danneggiato da farmaci di classi diverse","importa i farmaci nel RE dove vengono detossificati dai P450"],e:"È un trasportatore ABC a bassa specificità: riduce la concentrazione intracellulare di farmaci strutturalmente diversi (multi-drug resistance)."},
{id:"B507",s:"bio",u:5,d:1,q:"In una cellula in cui la dinamina è inattiva per una mutazione termosensibile, alla temperatura restrittiva si osserva:",o:["accumulo di fossette di clatrina col collo allungato, non staccate","assenza totale di fossette rivestite di clatrina in membrana","accumulo di vescicole libere che non perdono il rivestimento di clatrina","blocco della secrezione costitutiva dal trans-Golgi","degradazione accelerata delle LDL nei lisosomi"],e:"Senza dinamina la gemmazione procede ma non c'è la scissione finale: l'endocitosi mediata da clatrina si blocca."},
{id:"B508",s:"bio",u:5,d:1,q:"Nelle cellule polarizzate (es. epitelio intestinale) le proteine di membrana apicali e basolaterali restano separate grazie a:",o:["smistamento nel trans-Golgi e giunzioni occludenti che fanno da recinto","due membrane plasmatiche distinte separate da un desmosoma","giunzioni comunicanti che bloccano la diffusione laterale","il solo citoscheletro di cheratina che ancora le proteine","smistamento nel cis-Golgi e desmosomi che impediscono la diffusione laterale"],e:"Le tight junction fungono anche da 'recinto' (funzione di fence) per lipidi e proteine nel foglietto esterno."},
{id:"B509",s:"bio",u:5,q:"Il potenziale di membrana mitocondriale (interno negativo) contribuisce all'importazione delle proteine nella matrice perché:",o:["attira le presequenze cariche positivamente attraverso la membrana interna","attira le presequenze cariche negativamente attraverso la membrana interna","respinge le presequenze positive, che entrano per diffusione","fornisce direttamente l'energia per sintetizzare le proteine","apre il complesso TOM della membrana esterna senza ATP"],e:"Dissipando il potenziale (es. con disaccoppianti) l'importazione tramite TIM23 si blocca."},
{id:"B510",s:"bio",u:5,q:"Le proteine destinate ai perossisomi, a differenza di quelle destinate al RE e ai mitocondri:",o:["possono essere importate già ripiegate e perfino come oligomeri","devono essere completamente srotolate per attraversare la membrana","entrano durante la traduzione grazie a SRP e al traslocone","passano prima dal Golgi, dove ricevono il segnale PTS1","entrano solo dopo essere state ubiquitinate nel citosol"],e:"È una peculiarità del sistema di importazione perossisomiale (recettori Pex5 per PTS1 e Pex7 per PTS2)."},
{id:"B511",s:"bio",u:5,q:"La calnexina riconosce le glicoproteine non ancora ripiegate perché:",o:["conservano un glucosio terminale, riaggiunto se la proteina è mal ripiegata","conservano un mannosio-6-fosfato, aggiunto se la proteina è mal ripiegata","sono prive di oligosaccaridi finché non si ripiegano","espongono catene di ubiquitina riconosciute dalla calnexina","conservano un fosfato terminale aggiunto da una chinasi del RE"],e:"Il ciclo deglucosilazione/riglucosilazione trattiene la proteina nel RE finché non è ripiegata correttamente."},
{id:"B512",s:"bio",u:5,q:"Le proteine della membrana mitocondriale esterna con struttura a barile β (come le porine) sono inserite dal complesso:",o:["SAM","TIM23","OXA","SRP","COPII"],e:"Le porine rendono la membrana esterna permeabile a molecole fino a circa 5 kDa."},
{id:"B513",s:"bio",u:5,q:"Quale delle seguenti affermazioni sui lisosomi NON è corretta?",o:["Le loro idrolasi sono più attive a pH neutro, come quello del citosol","Contengono idrolasi acide sintetizzate nel RE rugoso","Il loro lume è acidificato da una pompa protonica V-ATPasi","Ricevono materiale da endocitosi, fagocitosi e autofagia","Le proteine di membrana molto glicosilate le proteggono dalla digestione"],e:"Le idrolasi lisosomiali hanno attività ottimale a pH acido; se fuoriescono nel citosol (pH 7,2) lavorano poco."},
{id:"B514",s:"bio",u:5,q:"Nell'endocitosi in fase fluida (pinocitosi), a differenza di quella mediata da recettori:",o:["la cellula internalizza in modo non selettivo liquido e soluti","vengono internalizzate solo molecole legate a recettori specifici","vengono inglobate grandi particelle come batteri e detriti","il materiale viene espulso dalla cellula per esocitosi","il liquido entra attraverso le acquaporine, senza vescicole"],e:"L'endocitosi mediata da recettori concentra invece selettivamente i ligandi (fino a 1000 volte più efficiente)."},
{id:"B515",s:"bio",u:5,q:"Gli endosomi precoci hanno come funzione principale:",o:["smistare il materiale internalizzato tra riciclo e lisosomi","degradare completamente il materiale internalizzato con idrolasi attive","sintetizzare le proteine di membrana e inviarle al Golgi","glicosilare le proteine internalizzate prima del riciclo","accumulare Ca²⁺ e rilasciarlo in risposta all'IP₃"],e:"Il pH leggermente acido (circa 6) favorisce il distacco dei ligandi dai recettori."},
