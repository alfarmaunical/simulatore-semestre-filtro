{id:"B117",s:"bio",u:6,q:"Le integrine:",o:["recettori transmembrana che collegano matrice e citoscheletro","recettori transmembrana che uniscono due cellule in modo omofilico","proteine periferiche del glicocalice prive di dominio citosolico","enzimi secreti che degradano il collagene della matrice","proteine che formano i canali delle giunzioni comunicanti"],e:"Le integrine (eterodimeri α/β) legano proteine come la fibronectina all'esterno e, tramite talina e vinculina, l'actina all'interno: sono essenziali per adesione e meccanotrasduzione."},
{id:"B118",s:"bio",u:6,q:"Le metalloproteinasi della matrice (MMP):",o:["degradano la matrice extracellulare, favorendo rimodellamento e metastasi","sintetizzano e assemblano le fibre di collagene nella matrice extracellulare","inibiscono le proteasi della matrice, impedendo l'invasione tumorale","sono recettori per i fattori di crescita con attività chinasica","formano i desmosomi legando le cheratine delle cellule vicine"],e:"Le MMP sono endopeptidasi dipendenti dallo zinco, secrete dalle cellule; la loro attività è bilanciata dagli inibitori TIMP."},
{id:"B119",s:"bio",u:6,q:"Le giunzioni occludenti (tight junctions):",o:["sigillano lo spazio intercellulare, limitando il passaggio paracellulare","permettono il passaggio di ioni e piccole molecole tra citoplasmi adiacenti","ancorano le cellule epiteliali alla lamina basale tramite integrine","uniscono i filamenti intermedi di cellule vicine tramite caderine","sono formate da connessine e regolano il passaggio transcellulare"],e:"Sono formate da claudine e occludina; mantengono anche la polarità separando i domini apicale e basolaterale."},
{id:"B120",s:"bio",u:6,q:"Le giunzioni comunicanti (gap junctions) sono costituite da:",o:["connessoni formati da sei connessine","connessoni formati da sei claudine","caderine legate all'actina corticale","integrine legate ai filamenti intermedi","occludine organizzate in fasci lineari"],e:"Due connessoni allineati formano un canale che lascia passare ioni e piccole molecole (< 1 kDa), ad esempio per l'accoppiamento elettrico delle cellule cardiache."},
{id:"B121",s:"bio",u:6,q:"Gli emidesmosomi ancorano:",o:["la cellula alla lamina basale tramite integrine e filamenti intermedi","due cellule adiacenti tramite caderine e filamenti intermedi di cheratina","la cellula alla lamina basale tramite integrine e actina","due cellule adiacenti tramite caderine e actina","la cellula alla matrice tramite proteoglicani e microtubuli"],e:"I desmosomi uniscono cellule vicine (caderine desmosomiali + cheratine); gli emidesmosomi uniscono la cellula alla lamina basale (integrina α6β4 + cheratine)."},
{id:"B122",s:"bio",u:6,q:"Le caderine mediano adesioni cellula-cellula:",o:["omofiliche e calcio-dipendenti","eterofiliche e calcio-dipendenti","omofiliche e indipendenti dal calcio","eterofiliche e indipendenti dal calcio","omofiliche e dipendenti dal magnesio"],e:"Le caderine legano caderine dello stesso tipo sulla cellula vicina in presenza di Ca²⁺; la E-caderina è tipica degli epiteli e la sua perdita favorisce l'invasività tumorale."},
{id:"B123",s:"bio",u:6,q:"Una molecola segnale che agisce sulla stessa cellula che l'ha secreta realizza una segnalazione:",o:["autocrina","paracrina","endocrina","sinaptica","iuxtacrina"],e:"Autocrina: la cellula risponde al proprio segnale. Paracrina: cellule vicine. Endocrina: cellule lontane tramite il sangue. Iuxtacrina: per contatto diretto."},
{id:"B124",s:"bio",u:6,q:"Il monossido di azoto (NO) agisce come segnale perché:",o:["diffonde nelle membrane e attiva la guanilato ciclasi solubile","diffonde nelle membrane e attiva l'adenilato ciclasi","si lega a un recettore di membrana accoppiato a proteine G","viene immagazzinato in vescicole e liberato per esocitosi","attiva una guanilato ciclasi di membrana, come il peptide natriuretico"],e:"L'NO prodotto dall'endotelio diffonde nel muscolo liscio, attiva la guanilato ciclasi e aumenta il cGMP, causando vasodilatazione. Ha emivita brevissima."},
{id:"B125",s:"bio",u:6,q:"Nell'attivazione di una proteina G trimerica da parte di un recettore GPCR:",o:["la subunità α scambia GDP con GTP e si separa dal dimero βγ","la subunità α scambia GTP con GDP e si lega al dimero βγ","la subunità β scambia GDP con GTP e si separa da αγ","la subunità α idrolizza GTP e si separa dal dimero βγ","il recettore fosforila la subunità α e ne stacca il GDP"],e:"Il recettore attivato agisce da GEF. Gα-GTP e Gβγ regolano gli effettori; l'attività GTPasica intrinseca di Gα, accelerata dalle proteine RGS, chiude il segnale."},
{id:"B126",s:"bio",u:6,q:"La proteina Gs attivata stimola:",o:["l'adenilato ciclasi, con aumento del cAMP e attivazione della PKA","la fosfolipasi Cβ, con produzione di IP₃ e DAG","la fosfodiesterasi, con calo del cAMP e inibizione della PKA","la guanilato ciclasi, con aumento del cGMP e attivazione della PKG","l'adenilato ciclasi, con aumento del cAMP e attivazione della PKC"],e:"Gs → adenilato ciclasi → cAMP → PKA. Gi inibisce l'adenilato ciclasi; Gq attiva la fosfolipasi Cβ."},
{id:"B127",s:"bio",u:6,q:"La fosfolipasi C scinde il PIP₂ in:",o:["IP₃, che libera Ca²⁺ dal RE, e DAG, che attiva la PKC","IP₃, che attiva la PKC, e DAG, che libera Ca²⁺ dal RE","PIP₃, che recluta Akt in membrana, e fosfato inorganico","acido arachidonico e lisofosfolipidi di membrana","IP₃, che libera Ca²⁺ dai mitocondri, e acido fosfatidico"],e:"IP₃ apre i canali del Ca²⁺ sul reticolo endoplasmatico; il DAG resta in membrana e, con il Ca²⁺, attiva la proteina chinasi C."},
{id:"B127b",s:"bio",u:6,q:"I fattori GEF e GAP regolano le piccole GTPasi (es. Ras) nel modo seguente:",o:["le GEF le attivano (scambio GDP→GTP), le GAP le inattivano","le GEF le inattivano (idrolisi del GTP), le GAP le attivano","le GEF le attivano fosforilandole, le GAP le defosforilano","entrambe le attivano favorendo il legame del GTP","le GAP le attivano impedendo l'idrolisi del GTP"],e:"GEF = guanine nucleotide exchange factor (es. SOS per Ras). GAP = GTPase activating protein. Le mutazioni oncogeniche di Ras ne riducono l'attività GTPasica, lasciandola sempre attiva."},
{id:"B128",s:"bio",u:6,q:"Nella via di segnalazione dell'EGF, il legame del ligando al recettore porta a:",o:["dimerizzazione, autofosforilazione su tirosine e attivazione di Ras-MAPK","dimerizzazione, autofosforilazione su serine e attivazione dell'adenilato ciclasi","attivazione di una proteina Gs e aumento del cAMP intracellulare","ingresso del recettore nel nucleo, dove agisce da fattore di trascrizione","apertura del recettore come canale e ingresso di Na⁺"],e:"Via RTK → Grb2 → SOS → Ras-GTP → Raf → MEK → ERK, che entra nel nucleo e attiva geni della proliferazione."},
{id:"B129",s:"bio",u:6,q:"Il recettore dell'insulina appartiene alla famiglia dei:",o:["recettori tirosin-chinasici","recettori accoppiati a proteine G","recettori intracellulari","canali ionici ligando-dipendenti","recettori con attività guanilato ciclasica"],e:"Il recettore è un eterotetramero α₂β₂; fosforila i substrati IRS, che attivano PI3K/Akt (es. traslocazione di GLUT4 in membrana) e la via Ras-MAPK."},
{id:"B130",s:"bio",u:6,q:"La fosfatidilinositolo 3-chinasi (PI3K) produce:",o:["PIP₃, che recluta in membrana chinasi come Akt","IP₃ e DAG, che liberano Ca²⁺ e attivano la PKC","PIP₂, che viene poi scisso dalla fosfolipasi C","PIP₃, che recluta in membrana la fosfatasi PTEN","cAMP, che attiva la proteina chinasi A"],e:"PI3K fosforila il PIP₂ in posizione 3; PIP₃ recluta Akt (PKB), che promuove sopravvivenza e crescita. La fosfatasi PTEN, un oncosoppressore, rimuove quel fosfato."},
{id:"B131",s:"bio",u:6,q:"Nella fototrasduzione, la desensitizzazione della rodopsina attivata avviene tramite:",o:["fosforilazione da parte della rodopsina chinasi e legame dell'arrestina","defosforilazione da parte di una fosfatasi e rilascio della trasducina","fosforilazione da parte della PKA e legame della trasducina","aumento del cGMP e riapertura dei canali cationici","idrolisi del GTP da parte della rodopsina stessa"],e:"La rodopsina attivata è fosforilata da una chinasi GRK e poi legata dall'arrestina, che impedisce l'attivazione della trasducina: un modello generale di desensitizzazione dei GPCR."},
{id:"B132",s:"bio",u:6,q:"Gli ormoni steroidei agiscono di norma tramite recettori intracellulari perché:",o:["sono lipofili e attraversano la membrana plasmatica","sono idrofili e non possono legare recettori di membrana","sono troppo grandi per legare recettori di membrana","entrano per endocitosi mediata da recettore e clatrina","sono carichi e attraversano la membrana tramite canali"],e:"Cortisolo, estrogeni, testosterone e simili diffondono nella cellula e legano recettori citosolici o nucleari che agiscono da fattori di trascrizione."},

{id:"B133",s:"bio",u:7,q:"L'ordine corretto delle fasi del ciclo cellulare è:",o:["G1 → S → G2 → M","G1 → G2 → S → M","S → G1 → G2 → M","M → S → G1 → G2","G0 → M → S → G2"],e:"Interfase (G1, S, G2) seguita dalla mitosi M. G0 è uno stato di quiescenza fuori dal ciclo."},
{id:"B134",s:"bio",u:7,q:"Le chinasi dipendenti da ciclina (CDK):",o:["sono attive solo se legate a cicline, i cui livelli oscillano","hanno livelli che oscillano, mentre le cicline restano costanti","sono attive senza cicline, che fungono invece da inibitori","sono fosfatasi che rimuovono fosfati dalle proteine del ciclo","sono attive solo in G0 e si inattivano all'ingresso in G1"],e:"I livelli delle CDK sono costanti; a oscillare sono le cicline, sintetizzate e degradate (via ubiquitina-proteasoma) in fasi precise. L'attività dipende anche da fosforilazioni attivanti o inibitorie e dagli inibitori CKI."},
{id:"B135",s:"bio",u:7,q:"Nel passaggio G1/S, il complesso ciclina D-CDK4/6:",o:["fosforila Rb, che libera E2F e attiva i geni della fase S","defosforila Rb, che libera E2F e permette l'ingresso in fase S","fosforila E2F, che si stacca da Rb e blocca la fase S","fosforila p53, che induce p21 e blocca la transizione G1/S","attiva l'APC/C, che degrada la securina e avvia la fase S"],e:"Rb ipofosforilato sequestra E2F. La fosforilazione da parte di ciclina D-CDK4/6 (e poi ciclina E-CDK2) libera E2F. La perdita di Rb è alla base del retinoblastoma."},
{id:"B136",s:"bio",u:7,q:"In risposta al danno al DNA, p53:",o:["si stabilizza e induce p21 (arresto del ciclo) o, se il danno è grave, l'apoptosi","viene ubiquitinata da MDM2 e degradata più rapidamente del solito","fosforila Rb liberando E2F per accelerare la fase S","si stabilizza e attiva la telomerasi per riparare il danno","inibisce p21, così le CDK restano attive durante il riparo del DNA"],e:"Normalmente MDM2 ubiquitina p53. Il danno attiva ATM/ATR, che stabilizzano p53; p21 inibisce le CDK. p53 è mutato in circa metà dei tumori umani."},
{id:"B137",s:"bio",u:7,q:"I geni oncosoppressori:",o:["favoriscono il tumore se inattivati, di solito su entrambi gli alleli","favoriscono il tumore se iperattivati, basta un solo allele mutato","sono dominanti a livello cellulare come gli oncogeni","derivano da geni virali inseriti nel genoma ospite","codificano soprattutto fattori di crescita e loro recettori"],e:"Secondo l'ipotesi dei 'due colpi' di Knudson servono due mutazioni (es. RB1, TP53). I proto-oncogeni diventano invece oncogeni per mutazioni attivanti di un solo allele."},
{id:"B138",s:"bio",u:7,q:"Il complesso APC/C (ciclosoma) all'anafase:",o:["ubiquitina securina e ciclina B, avviando anafase e uscita dalla mitosi","fosforila securina e ciclina B, avviando anafase e uscita dalla mitosi","ubiquitina la separasi e la coesina, bloccando l'anafase","ubiquitina la ciclina D e attiva E2F per la fase S","fosforila le lamine e condensa i cromosomi"],e:"APC/C-Cdc20 marca la securina: la separasi liberata taglia la coesina che teneva uniti i cromatidi fratelli. La degradazione della ciclina B inattiva CDK1."},
{id:"B139",s:"bio",u:7,q:"Il checkpoint del fuso (SAC) impedisce l'inizio dell'anafase finché:",o:["tutti i cinetocori non sono attaccati correttamente al fuso","il DNA non è stato completamente replicato e riparato","la ciclina B non è stata completamente degradata","i cromatidi fratelli non hanno perso tutte le coesine dei bracci","la cellula non ha raggiunto la dimensione minima richiesta"],e:"I cinetocori non attaccati generano un segnale (Mad2 e altre proteine) che inibisce APC/C-Cdc20."},
{id:"B140",s:"bio",u:7,q:"Il complesso NDC80 si trova:",o:["nel cinetocore, dove lega le estremità + dei microtubuli","nel centrosoma, dove nuclea le estremità − dei microtubuli","nel cinetocore, dove lega le estremità − dei microtubuli","nella lamina nucleare, dove ancora la cromatina","nel centromero, dove tiene uniti i cromatidi fratelli"],e:"NDC80 è il principale sito di aggancio dei microtubuli del cinetocore; la sua fosforilazione da Aurora B regola la correzione degli attacchi errati."},
{id:"B141",s:"bio",u:7,q:"Nel fuso mitotico, i microtubuli che si sovrappongono all'equatore e spingono i poli l'uno lontano dall'altro sono:",o:["i microtubuli interpolari","i microtubuli del cinetocore","i microtubuli astrali","i microtubuli dell'assonema","i microtubuli corticali"],e:"I microtubuli interpolari, con chinesine bipolari, separano i poli (anafase B); quelli astrali posizionano il fuso contro la corteccia; quelli del cinetocore muovono i cromosomi."},
{id:"B142",s:"bio",u:7,q:"La citodieresi nelle cellule animali avviene tramite:",o:["un anello contrattile di actina e miosina II","un anello contrattile di microtubuli e dineina","una piastra cellulare da vescicole del Golgi","un anello di filamenti intermedi di vimentina","un anello di actina e miosina regolato da Ran-GTP"],e:"L'anello contrattile, regolato da RhoA, strozza la cellula. La piastra cellulare è tipica delle cellule vegetali."},
{id:"B143",s:"bio",u:7,q:"Il crossing over avviene:",o:["in profase I, tra cromatidi non fratelli di omologhi","in profase I, tra cromatidi fratelli dello stesso cromosoma","in metafase I, tra cromatidi non fratelli di omologhi","in profase II, tra cromatidi non fratelli di omologhi","in anafase I, tra cromosomi non omologhi"],e:"Durante il pachitene, i cromosomi omologhi appaiati (sinapsi tramite il complesso sinaptonemale) si scambiano segmenti; i chiasmi ne sono la manifestazione visibile."},
{id:"B144",s:"bio",u:7,q:"Al termine della meiosi I una cellula umana contiene:",o:["23 cromosomi, ciascuno formato da due cromatidi","46 cromosomi, ciascuno formato da un cromatidio","23 cromosomi, ciascuno formato da un cromatidio","46 cromosomi, ciascuno formato da due cromatidi","23 coppie di omologhi a due cromatidi"],e:"La meiosi I è riduzionale: separa gli omologhi. La meiosi II separa i cromatidi fratelli, come una mitosi."},
{id:"B145",s:"bio",u:7,q:"Una non disgiunzione durante la meiosi I produce:",o:["tutti e quattro i gameti aneuploidi (due n+1 e due n−1)","due gameti normali, uno n+1 e uno n−1 (come in meiosi II)","due gameti n+1 e due gameti normali","quattro gameti diploidi normali","tutti e quattro i gameti n+1"],e:"Se gli omologhi non si separano in meiosi I, entrambe le cellule figlie sono anomale. Una non disgiunzione in meiosi II produce invece 2 gameti normali, 1 n+1 e 1 n−1."},
{id:"B146",s:"bio",u:7,q:"Nella donna, l'ovocita primario rimane bloccato fino alla pubertà in:",o:["profase I (diplotene)","metafase II","metafase I (bivalenti allineati)","interfase G1","profase II (dopo la meiosi I)"],e:"Gli ovociti primari si arrestano in profase I già durante la vita fetale; a ogni ciclo un ovocita completa la meiosi I e si blocca in metafase II, che viene completata solo dopo la fecondazione."},
{id:"B147",s:"bio",u:7,q:"Dalla spermatogenesi, a partire da uno spermatocita primario, si ottengono:",o:["4 spermatidi aploidi","1 spermatide e 3 globuli polari","2 spermatidi diploidi","4 spermatogoni","8 spermatidi"],e:"Nel maschio le due divisioni meiotiche sono simmetriche e danno 4 cellule funzionali; nell'oogenesi si ottiene un solo ovocita e i globuli polari."},
{id:"B148",s:"bio",u:7,q:"Una cellula staminale è caratterizzata da:",o:["autorinnovamento e capacità di dare cellule specializzate","differenziamento terminale e perdita della capacità di dividersi","autorinnovamento ma incapacità di differenziarsi","presenza esclusiva nell'embrione durante le prime divisioni","divisione sempre simmetrica in due cellule differenziate"],e:"Le staminali embrionali sono pluripotenti; quelle adulte (es. ematopoietiche) sono di norma multipotenti. La divisione asimmetrica genera una staminale e una cellula destinata a differenziarsi."},
{id:"B149",s:"bio",u:7,q:"La necrosi, rispetto all'apoptosi:",o:["comporta rigonfiamento, rottura della membrana e infiammazione","è un processo programmato che richiede l'attivazione delle caspasi","produce corpi apoptotici fagocitati senza infiammazione","comporta condensazione della cromatina con membrana integra","avviene soltanto durante lo sviluppo embrionale"],e:"La necrosi è una morte 'accidentale' con perdita dell'integrità di membrana e risposta infiammatoria; l'apoptosi è ordinata e 'silenziosa'."},
{id:"B150",s:"bio",u:7,q:"Nella via apoptotica intrinseca, il rilascio del citocromo c dai mitocondri porta alla formazione di:",o:["l'apoptosoma (Apaf-1 + citocromo c), che attiva la caspasi 9","l'apoptosoma (Apaf-1 + citocromo c), che attiva la caspasi 8","il DISC (Fas + FADD), che attiva la caspasi 8","il DISC (Fas + FADD), che attiva la caspasi 9","il complesso Bcl-2/Bax, che attiva la caspasi 3"],e:"La MOMP, promossa da Bax e Bak, libera il citocromo c; l'apoptosoma attiva la caspasi 9 iniziatrice, che attiva le esecutrici 3 e 7."},
{id:"B151",s:"bio",u:7,q:"La via estrinseca dell'apoptosi viene innescata da:",o:["legame di FasL o TNF a recettori di morte, con attivazione della caspasi 8","rilascio di citocromo c e formazione dell'apoptosoma con caspasi 9","danno al DNA rilevato da p53, con induzione di Bax e Puma","legame di FasL a recettori di morte, con attivazione della caspasi 9","accumulo di proteine mal ripiegate nel RE e attivazione dell'UPR"],e:"I recettori di morte reclutano FADD e procaspasi 8 nel complesso DISC; la caspasi 8 attiva direttamente le caspasi esecutrici (e Bid, collegando la via intrinseca)."},
{id:"B152",s:"bio",u:7,q:"Bcl-2 è una proteina:",o:["anti-apoptotica che impedisce la permeabilizzazione mitocondriale","pro-apoptotica che forma pori nella membrana mitocondriale esterna","anti-apoptotica che inibisce direttamente la caspasi 8 nel DISC","pro-apoptotica BH3-only che attiva Bax e Bak","caspasi iniziatrice attivata dal rilascio di citocromo c"],e:"Nella famiglia Bcl-2 ci sono anti-apoptotici (Bcl-2, Bcl-xL), effettori pro-apoptotici (Bax, Bak) e sensori BH3-only (Bid, Bim, Puma, Noxa). Bcl-2 è iperespresso nel linfoma follicolare."},
{id:"B153",s:"bio",u:7,q:"Una cellula con 2n = 8 cromosomi, in metafase mitotica, contiene:",o:["8 cromosomi e 16 cromatidi","4 cromosomi e 8 cromatidi","8 cromosomi e 8 cromatidi","16 cromosomi e 16 cromatidi","16 cromosomi e 32 cromatidi"],e:"Dopo la fase S ogni cromosoma è formato da due cromatidi fratelli uniti; il numero di cromosomi (contati come centromeri) resta 2n = 8."},

/* ---------- COMPLETAMENTO ---------- */
{id:"BC01",s:"bio",u:1,q:"L'involucro proteico che racchiude l'acido nucleico di un virus si chiama ……",c:["capside","capsidi"],e:"Il capside è formato da subunità proteiche (capsomeri); in alcuni virus è circondato da un envelope lipidico."},
{id:"BC02",s:"bio",u:1,q:"Il polimero che costituisce la parete cellulare dei batteri e che è bersaglio della penicillina è il ……",c:["peptidoglicano","mureina","peptidoglicani"],e:"La penicillina inibisce le transpeptidasi che formano i legami crociati del peptidoglicano."},
{id:"BC03",s:"bio",u:1,q:"Nell'RNA, al posto della timina, si trova la base ……",c:["uracile","uracil","u"],e:"L'uracile si appaia con l'adenina; l'RNA contiene inoltre ribosio invece di desossiribosio."},
{id:"BC04",s:"bio",u:1,q:"I nucleotidi di un filamento di acido nucleico sono uniti da legami ……",c:["fosfodiesterici","fosfodiestere","fosfodiesterico","fosfodiesteri"],e:"Il legame fosfodiesterico unisce il 3'-OH di un nucleotide al fosfato in 5' del successivo."},
{id:"BC05",s:"bio",u:1,q:"Una molecola che possiede una regione idrofila e una idrofoba, come un fosfolipide, si dice ……",c:["anfipatica","anfifilica","anfipatico","anfifilico","anfipatiche"],e:"Le molecole anfipatiche in acqua formano spontaneamente micelle o doppi strati."},
{id:"BC06",s:"bio",u:1,q:"Il ciclo con cui un fago si moltiplica e provoca la rottura della cellula batterica ospite si chiama ciclo ……",c:["litico"],e:"Ciclo litico: replicazione del virus e lisi della cellula. Ciclo lisogenico: integrazione come profago."},
{id:"BC07",s:"bio",u:2,q:"La regione del cromosoma dove si assembla il cinetocore è il ……",c:["centromero","centromeri"],e:"Il centromero contiene DNA satellite α e la variante istonica CENP-A."},
{id:"BC08",s:"bio",u:2,q:"La fibra di cromatina di circa 30 nm si forma grazie all'istone ……",c:["h1"],e:"H1 è l'istone linker: lega il DNA tra un nucleosoma e l'altro e compatta la fibra da 11 nm."},
{id:"BC09",s:"bio",u:2,q:"Le modificazioni ereditabili dell'espressione genica che non alterano la sequenza del DNA sono dette ……",c:["epigenetiche","epigenetica","epigenetici","modificazioni epigenetiche"],e:"Ne sono esempi la metilazione del DNA e le modificazioni degli istoni."},
{id:"BC10",s:"bio",u:2,q:"Il numero di autosomi presenti in una cellula somatica umana normale è ……",c:["44","quarantaquattro"],e:"46 cromosomi totali = 44 autosomi + 2 cromosomi sessuali.",n:44},
{id:"BC11",s:"bio",u:3,q:"L'enzima che sintetizza il breve innesco di RNA necessario alla DNA polimerasi è la ……",c:["primasi","dna primasi","rna primasi"],e:"La primasi è una RNA polimerasi che non richiede innesco."},
{id:"BC12",s:"bio",u:3,q:"L'enzima che unisce i frammenti di Okazaki formando un legame fosfodiesterico è la DNA ……",c:["ligasi"],e:"La DNA ligasi sigilla le interruzioni (nick) dopo la rimozione dei primer e il riempimento dei vuoti."},
{id:"BC13",s:"bio",u:3,q:"La sequenza di tre nucleotidi del tRNA complementare al codone dell'mRNA si chiama ……",c:["anticodone","anticodon"],e:"L'appaiamento codone-anticodone è antiparallelo; la terza posizione del codone tollera appaiamenti non canonici (wobble)."},
{id:"BC14",s:"bio",u:3,q:"Il complesso ribonucleoproteico che rimuove gli introni dal pre-mRNA è lo ……",c:["spliceosoma","spliceosome","spliceosomi"],e:"È formato da snRNP (U1, U2, U4, U5, U6) e numerose proteine."},
{id:"BC15",s:"bio",u:3,q:"Gli enzimi che legano ogni amminoacido al tRNA corretto sono le amminoacil-tRNA ……",c:["sintetasi","sintasi","sintetasi specifiche"],e:"Le amminoacil-tRNA sintetasi usano ATP e garantiscono la fedeltà della traduzione."},
{id:"BC16",s:"bio",u:3,q:"Il codone di inizio della traduzione è ……",c:["aug"],e:"AUG codifica la metionina (formilmetionina nei batteri)."},
{id:"BC17",s:"bio",u:3,q:"Nei procarioti, un insieme di geni trascritti insieme sotto il controllo di un unico promotore e operatore si chiama ……",c:["operone","operon"],e:"Esempio: l'operone lac (geni lacZ, lacY, lacA)."},
{id:"BC18",s:"bio",u:3,q:"Una molecola di RNA dotata di attività catalitica si chiama ……",c:["ribozima","ribozimi","ribozyme"],e:"Esempi: l'rRNA della subunità maggiore (peptidil-transferasi) e gli snRNA dello spliceosoma."},
{id:"BC19",s:"bio",u:3,q:"Il complesso proteolitico che degrada le proteine marcate con poliubiquitina è il ……",c:["proteasoma","proteasoma 26s","proteasome"],e:"Il proteasoma 26S è formato dalla particella catalitica 20S e da quelle regolatorie 19S."},
{id:"BC20",s:"bio",u:4,q:"Un individuo che possiede due alleli diversi per lo stesso gene si dice ……",c:["eterozigote","eterozigoto","eterozigoti"],e:"Omozigote: due alleli uguali. Eterozigote composto: due alleli mutati diversi dello stesso gene."},
{id:"BC21",s:"bio",u:4,q:"Quando entrambi gli alleli di un eterozigote si esprimono pienamente nel fenotipo, come nel gruppo sanguigno AB, si parla di ……",c:["codominanza"],e:"Nella dominanza incompleta il fenotipo è invece intermedio."},
{id:"BC22",s:"bio",u:4,q:"La presenza di un numero di cromosomi non multiplo esatto del corredo aploide si chiama ……",c:["aneuploidia","aneuploidie"],e:"Esempi: trisomie (2n+1) e monosomie (2n−1). La poliploidia è invece un multiplo esatto (3n, 4n)."},
{id:"BC23",s:"bio",u:4,q:"In un incrocio Aa × aa, la probabilità di ottenere un figlio aa è del …… %",c:["50"],n:50,e:"Metà dei gameti del genitore Aa porta a; il genitore aa dà sempre a."},
{id:"BC24",s:"bio",u:4,q:"Il fenotipo dei maschi con cariotipo 47,XXY è noto come sindrome di ……",c:["klinefelter"],e:"La sindrome di Klinefelter comporta di solito ipogonadismo e infertilità."},
{id:"BC25",s:"bio",u:4,q:"La percentuale di individui con un dato genotipo che manifestano il fenotipo corrispondente si chiama ……",c:["penetranza"],e:"L'espressività descrive invece l'intensità del fenotipo."},
{id:"BC26",s:"bio",u:5,q:"Il movimento dell'acqua attraverso una membrana semipermeabile da una soluzione meno concentrata a una più concentrata si chiama ……",c:["osmosi"],e:"Le acquaporine accelerano il passaggio dell'acqua attraverso molte membrane biologiche."},
{id:"BC27",s:"bio",u:5,q:"Una cellula animale posta in una soluzione …… perde acqua e raggrinzisce.",c:["ipertonica","iperosmotica","ipertonico"],e:"In una soluzione ipotonica invece si rigonfia e può andare incontro a lisi."},
{id:"BC28",s:"bio",u:5,q:"Il complesso proteico della membrana del RE attraverso cui la catena polipeptidica nascente entra nel lume è il ……",c:["traslocone","sec61","translocone"],e:"Il canale del traslocone è formato da Sec61."},
{id:"BC29",s:"bio",u:5,q:"La proteina che riveste le vescicole formate durante l'endocitosi mediata da recettore è la ……",c:["clatrina"],e:"La clatrina forma una struttura a triskelion; la dinamina strozza il collo della vescicola."},
{id:"BC30",s:"bio",u:5,q:"L'enzima perossisomiale che scinde il perossido di idrogeno in acqua e ossigeno è la ……",c:["catalasi"],e:"2 H₂O₂ → 2 H₂O + O₂."},
{id:"BC31",s:"bio",u:5,q:"L'organello in cui avvengono il ciclo di Krebs e la β-ossidazione degli acidi grassi è il ……",c:["mitocondrio","mitocondri"],e:"Entrambi i processi avvengono nella matrice mitocondriale."},
{id:"BC32",s:"bio",u:5,q:"La degradazione selettiva dei mitocondri danneggiati tramite autofagia si chiama ……",c:["mitofagia"],e:"È regolata da PINK1 e Parkin, mutati in alcune forme familiari di Parkinson."},
{id:"BC33",s:"bio",u:5,q:"Le proteine motrici che si muovono lungo i filamenti di actina sono le ……",c:["miosine","miosina"],e:"La miosina II forma i filamenti spessi del sarcomero; altre miosine (I, V) trasportano vescicole."},
{id:"BC34",s:"bio",u:5,q:"Le proteine che formano il poro nucleare si chiamano ……",c:["nucleoporine","nucleoporina"],e:"Alcune nucleoporine contengono ripetizioni FG che formano la barriera selettiva del poro."},
{id:"BC35",s:"bio",u:5,q:"I filamenti intermedi tipici delle cellule epiteliali sono formati da ……",c:["cheratine","cheratina","citocheratine","citocheratina"],e:"Altri esempi di filamenti intermedi: vimentina, desmina, neurofilamenti, lamine."},
{id:"BC36",s:"bio",u:5,q:"Il processo di secrezione in cui le vescicole si fondono con la membrana solo in risposta a un segnale (es. aumento di Ca²⁺) è detto secrezione ……",c:["regolata","stimolata"],e:"La secrezione costitutiva avviene invece continuamente, senza segnale."},
{id:"BC37",s:"bio",u:6,q:"La glicoproteina della matrice extracellulare che lega le integrine tramite la sequenza RGD è la ……",c:["fibronectina"],e:"La sequenza Arg-Gly-Asp è riconosciuta da molte integrine."},
{id:"BC38",s:"bio",u:6,q:"Molecole come cAMP, IP₃, DAG e Ca²⁺ che amplificano un segnale all'interno della cellula sono dette secondi ……",c:["messaggeri","messaggero"],e:"Il primo messaggero è il ligando extracellulare."},
{id:"BC39",s:"bio",u:6,q:"Il gene RAS mutato in modo da rimanere sempre attivo è un esempio di ……",c:["oncogene","oncogeni"],e:"Un proto-oncogene diventa oncogene per una mutazione attivante."},
{id:"BC40",s:"bio",u:6,q:"La proteina chinasi attivata dal cAMP si indica con la sigla ……",c:["pka","proteina chinasi a","chinasi a"],e:"Il cAMP si lega alle subunità regolatorie della PKA liberando quelle catalitiche."},
{id:"BC41",s:"bio",u:7,q:"La fase della mitosi in cui i cromatidi fratelli si separano e migrano verso poli opposti si chiama ……",c:["anafase"],e:"Profase → prometafase → metafase → anafase → telofase."},
{id:"BC42",s:"bio",u:7,q:"Le proteasi a cisteina che eseguono l'apoptosi tagliando dopo un residuo di aspartato sono le ……",c:["caspasi","caspasi esecutrici"],e:"Iniziatrici: 8, 9 (e 10). Esecutrici: 3, 6, 7."},
{id:"BC43",s:"bio",u:7,q:"Il complesso proteico che tiene uniti i cromatidi fratelli fino all'anafase è la ……",c:["coesina","coesine"],e:"La coesina viene tagliata dalla separasi dopo la degradazione della securina."},
{id:"BC44",s:"bio",u:7,q:"Lo stato di quiescenza in cui le cellule escono dal ciclo cellulare si indica come fase ……",c:["g0"],e:"Esempi di cellule in G0: neuroni maturi, epatociti (che però possono rientrare nel ciclo)."},
{id:"BC45",s:"bio",u:7,q:"Il punto di contatto visibile tra cromatidi di omologhi dove è avvenuto il crossing over si chiama ……",c:["chiasma","chiasmi"],e:"I chiasmi tengono uniti gli omologhi fino all'anafase I."},
{id:"BC46",s:"bio",u:7,q:"Il gene oncosoppressore la cui perdita causa il retinoblastoma codifica la proteina ……",c:["rb","prb","rb1","proteina del retinoblastoma"],e:"Rb ipofosforilato blocca E2F e quindi l'ingresso in fase S."},
{id:"BC47",s:"bio",u:7,q:"La divisione cellulare che dimezza il numero di cromosomi e produce gameti aploidi è la ……",c:["meiosi"],e:"La meiosi comprende due divisioni successive con una sola replicazione del DNA."},
{id:"BC48",s:"bio",u:7,q:"Una cellula umana diploide, dopo la fase S e prima della mitosi, contiene …… cromatidi.",c:["92"],n:92,e:"46 cromosomi × 2 cromatidi fratelli = 92."},
{id:"BC49",s:"bio",u:3,q:"Durante la trascrizione, il filamento di DNA che viene letto dalla RNA polimerasi è detto filamento …… (o antisenso).",c:["stampo","templato","template","antisenso","non codificante"],e:"L'RNA prodotto ha la stessa sequenza del filamento codificante (senso), con U al posto di T."},
{id:"BC50",s:"bio",u:1,q:"Il modello della doppia elica del DNA fu proposto nel 1953 da Watson e ……",c:["crick"],e:"Fondamentali anche i dati di diffrazione ai raggi X di Rosalind Franklin e Maurice Wilkins."}
);

BANK.push(
{id:"B201",s:"bio",u:1,q:"Quale delle seguenti affermazioni sui virus è corretta?",o:["Il genoma è a DNA o a RNA, mai entrambi nello stesso virione","Il genoma è sempre a DNA a doppio filamento, come nelle cellule","Il virione contiene sia DNA sia RNA, in rapporto variabile","Tutti i virus possiedono un capside e un envelope lipidico","I virus possiedono ribosomi 70S simili a quelli batterici"],e:"Un virione contiene un solo tipo di acido nucleico. La classificazione di Baltimore divide i virus in classi proprio in base al tipo di genoma e alla strategia con cui producono mRNA."},
{id:"B202",s:"bio",u:1,q:"Le dimensioni tipiche dei virus sono comprese all'incirca tra:",o:["20 e 300 nm","1 e 10 μm","10 e 100 μm","0,1 e 1 nm","1 e 10 mm"],e:"I virus sono più piccoli dei batteri (circa 1-5 μm) e sono visibili solo al microscopio elettronico."},
{id:"B203",s:"bio",u:1,q:"Un virus con envelope abbandona di solito la cellula ospite:",o:["per gemmazione dalla membrana plasmatica, da cui acquista l'envelope","solo per lisi della cellula, dopo aver formato l'envelope nel citosol","per gemmazione dalla membrana nucleare interna, perdendo l'envelope","per esocitosi in vescicole di clatrina, senza acquisire membrana","per scissione binaria del virione maturo"],e:"Durante la gemmazione il capside si riveste di una porzione di membrana cellulare in cui sono inserite le glicoproteine virali."},
{id:"B204",s:"bio",u:1,q:"Il virus del papilloma umano (HPV) è un virus oncogeno a DNA perché:",o:["le sue proteine E6 ed E7 inattivano rispettivamente p53 e Rb","le sue proteine E6 ed E7 inattivano rispettivamente Rb e p53","le sue proteine E6 ed E7 attivano rispettivamente p53 e Rb","codifica una trascrittasi inversa che integra il genoma","integra un oncogene di origine cellulare, come i retrovirus trasformanti"],e:"Neutralizzando due oncosoppressori chiave, HPV spinge la cellula a proliferare: è la causa principale del carcinoma della cervice uterina."},
{id:"B205",s:"bio",u:1,q:"La capsula batterica:",o:["uno strato polisaccaridico esterno che protegge dalla fagocitosi","uno strato di peptidoglicano esterno che protegge dalla lisi osmotica","uno strato lipopolisaccaridico che contiene l'endotossina","una struttura proteica interna che contiene il DNA plasmidico","uno strato proteico (S-layer) presente solo negli archei"],e:"La capsula è un importante fattore di virulenza, ad esempio in Streptococcus pneumoniae."},
{id:"B206",s:"bio",u:1,q:"Quale delle seguenti strutture è presente sia nei procarioti sia negli eucarioti?",o:["Ribosomi","Nucleo delimitato da membrana","Mitocondri","Reticolo endoplasmatico","Apparato di Golgi"],e:"Tutte le cellule hanno ribosomi: 70S nei procarioti (subunità 50S + 30S) e 80S nel citosol degli eucarioti (60S + 40S)."},
{id:"B207",s:"bio",u:1,q:"I plasmidi batterici sono:",o:["piccole molecole di DNA circolare extracromosomico","piccole molecole di RNA circolare che regolano la traduzione","frammenti di DNA cromosomico integrati da un fago","virus a DNA circolare che infettano i batteri","organelli delimitati da membrana con DNA proprio"],e:"I plasmidi si replicano in modo autonomo e possono passare tra batteri per coniugazione, diffondendo l'antibiotico-resistenza."},
{id:"B208",s:"bio",u:1,q:"Quale delle seguenti è una proprietà dell'acqua importante per la vita?",o:["L'elevato calore specifico, che stabilizza la temperatura","La densità massima allo stato solido, per cui il ghiaccio affonda","Il basso calore di evaporazione, che favorisce il raffreddamento","La natura apolare, che le permette di sciogliere i lipidi","La bassa tensione superficiale dovuta ai legami a idrogeno"],e:"L'acqua è polare, forma legami a idrogeno, ha alto calore specifico e alto calore di evaporazione, ed è più densa da liquida (massimo a 4 °C) che da solida."},
{id:"B209",s:"bio",u:1,q:"Quale dei seguenti NON è un polisaccaride?",o:["Saccarosio","Amido","Glicogeno","Cellulosa","Chitina"],e:"Il saccarosio è un disaccaride (glucosio + fruttosio). La chitina è un polisaccaride strutturale di N-acetilglucosammina (esoscheletro degli artropodi, parete dei funghi)."},
{id:"B210",s:"bio",u:1,q:"Le cere sono:",o:["esteri tra acidi grassi a lunga catena e alcoli a lunga catena","esteri del glicerolo con tre acidi grassi a lunga catena","esteri tra acidi grassi e colesterolo nelle lipoproteine","esteri del glicerolo con due acidi grassi e un fosfato","ammidi tra acidi grassi e sfingosina"],e:"Sono molto idrofobiche e svolgono funzioni protettive e impermeabilizzanti (cuticola delle foglie, cerume, piume)."},
{id:"B211",s:"bio",u:1,q:"I lunghi RNA non codificanti (lncRNA):",o:["RNA di oltre 200 nucleotidi che non codificano e regolano l'espressione","RNA di oltre 200 nucleotidi tradotti sempre in piccoli peptidi funzionali","RNA di meno di 30 nucleotidi caricati sul complesso RISC","precursori lunghi dei tRNA, processati nel nucleolo","mRNA maturi privi di cap e di coda di poli(A)"],e:"Un esempio è XIST, che riveste il cromosoma X da inattivare nelle femmine dei mammiferi."},
{id:"B212",s:"bio",u:1,q:"La N-glicosilazione delle proteine avviene sul gruppo amidico di:",o:["asparagina","serina","treonina","lisina","cisteina"],e:"La N-glicosilazione inizia nel RE sull'asparagina della sequenza Asn-X-Ser/Thr; la O-glicosilazione avviene su serina o treonina, soprattutto nel Golgi."},
{id:"B213",s:"bio",u:1,q:"L'aggiunta covalente di un lipide (es. un gruppo prenile o palmitoile) a una proteina serve soprattutto a:",o:["ancorarla a una membrana","indirizzarla al nucleo","marcarla per il proteasoma","renderla solubile nel citosol","aumentarne la carica positiva"],e:"Ad esempio Ras è farnesilata e così ancorata al foglietto interno della membrana plasmatica."},
{id:"B214",s:"bio",u:1,q:"In un enzima, il sito attivo:",o:["è la regione che lega il substrato e in cui avviene la catalisi","è la regione che lega un regolatore e modifica la conformazione","è sempre costituito da un cofattore metallico o da un coenzima","è la regione che lega il substrato, ma la catalisi avviene altrove","coincide con il sito allosterico negli enzimi michaeliani"],e:"Il sito allosterico è un sito distinto in cui un regolatore modifica la conformazione e l'attività dell'enzima."},
{id:"B215",s:"bio",u:1,q:"Un inibitore competitivo di un enzima:",o:["lega il sito attivo e il suo effetto si supera aumentando il substrato","lega un sito diverso dal sito attivo e riduce la Vmax lasciando la Km","lega il sito attivo e riduce la Vmax lasciando invariata la Km","si lega solo al complesso enzima-substrato riducendo Km e Vmax","si lega in modo covalente e irreversibile al sito attivo"],e:"Con un inibitore competitivo la Km apparente aumenta e la Vmax resta invariata."},
{id:"B216",s:"bio",u:1,q:"Il catabolismo:",o:["comprende le reazioni di demolizione che liberano energia","comprende le reazioni di sintesi che consumano energia","avviene solo nei mitocondri","non produce mai ATP","è sinonimo di anabolismo"],e:"Anabolismo: sintesi di molecole complesse con consumo di energia (ATP, NADPH)."},
{id:"B217",s:"bio",u:1,q:"Il passaggio evolutivo dagli organismi unicellulari a quelli pluricellulari ha comportato soprattutto:",o:["specializzazione cellulare e comunicazione tra cellule","la perdita del nucleo nelle cellule specializzate","l'abbandono della riproduzione sessuata in favore della mitosi","la riduzione dell'adesione e della comunicazione tra cellule","la scomparsa dei mitocondri nelle cellule differenziate"],e:"Nei pluricellulari le cellule si differenziano e cooperano tramite adesione, giunzioni e segnali."},
{id:"B218",s:"bio",u:1,q:"Secondo la teoria di Darwin, la selezione naturale agisce:",o:["sul fenotipo, favorendo le varianti ereditabili più vantaggiose","direttamente sul DNA, inducendo le mutazioni vantaggiose","sui caratteri acquisiti durante la vita e poi trasmessi ai figli","sul fenotipo, favorendo i caratteri acquisiti più vantaggiosi","sulle specie intere, eliminando quelle meno adattate"],e:"Le varianti nascono a caso (mutazione, ricombinazione); l'ambiente seleziona quelle che aumentano la sopravvivenza e la riproduzione."},
{id:"B219",s:"bio",u:1,q:"Nella classificazione dei viventi, i tre domini sono:",o:["Bacteria, Archaea, Eukarya","Animali, Piante, Funghi","Procarioti, Virus, Eucarioti","Monere, Protisti, Funghi","Batteri, Virus, Protozoi"],e:"I virus non sono classificati tra i domini perché non sono organismi cellulari."},
{id:"B220",s:"bio",u:1,q:"I fosfolipidi in acqua formano spontaneamente un doppio strato perché:",o:["le code idrofobiche si raccolgono all'interno, lontano dall'acqua","le teste polari si raccolgono all'interno, lontano dall'acqua","le code idrofobiche formano legami covalenti tra i due strati","il doppio strato è stabilizzato da legami a idrogeno tra le code","sono molecole del tutto idrofobiche che evitano l'acqua"],e:"È l'effetto idrofobico: la struttura minimizza il contatto delle code apolari con l'acqua. I liposomi usati per veicolare farmaci sfruttano lo stesso principio."},

{id:"B223",s:"bio",u:2,q:"I complessi di rimodellamento della cromatina (es. SWI/SNF):",o:["usano ATP per far scorrere o riposizionare i nucleosomi","acetilano gli istoni usando acetil-CoA senza consumare ATP","usano ATP per metilare le citosine nei dinucleotidi CpG","usano ATP per sintetizzare istoni e assemblare nuovi nucleosomi","tagliano il DNA linker tra un nucleosoma e l'altro"],e:"Rendono accessibili (o inaccessibili) regioni di DNA a fattori di trascrizione e altri complessi."},
{id:"B224",s:"bio",u:2,q:"L'ordine corretto dei livelli di compattazione del DNA, dal meno al più compatto, è (11 nm = collana di perle; 30 nm = fibra di 30 nm):",o:["doppia elica → 11 nm → 30 nm → anse su scaffold → cromosoma metafasico","doppia elica → 30 nm → 11 nm → anse su scaffold → cromosoma metafasico","11 nm → doppia elica → 30 nm → anse su scaffold → cromosoma metafasico","doppia elica → 11 nm → anse su scaffold → 30 nm → cromosoma metafasico","doppia elica → 30 nm → anse su scaffold → 11 nm → cromosoma metafasico"],e:"Il cromosoma metafasico è il massimo livello di condensazione, raggiunto grazie anche a condensine e topoisomerasi II."},
{id:"B225",s:"bio",u:2,q:"Le condensine:",o:["complessi SMC che compattano i cromosomi all'inizio della mitosi","complessi SMC che tengono uniti i cromatidi fratelli fino all'anafase","proteasi che separano i cromatidi tagliando la coesina","istoni del core nucleosomico tipici della mitosi","componenti della lamina nucleare che ancorano la cromatina"],e:"Condensine e coesine appartengono entrambe alla famiglia SMC, ma la coesione tra cromatidi fratelli è compito della coesina."},
{id:"B226",s:"bio",u:2,q:"L'inattivazione di uno dei due cromosomi X nelle cellule femminili dei mammiferi:",o:["avviene a caso in ogni cellula all'inizio dello sviluppo","riguarda sempre l'X paterno in tutti i tessuti (corpo di Barr)","avviene a caso in ogni cellula, ma solo nei gameti femminili","consiste nella perdita fisica di un X nelle cellule somatiche","rende eucromatico l'X attivo e ne raddoppia la trascrizione"],e:"L'X inattivo diventa eterocromatina facoltativa (lncRNA XIST, metilazione). Le femmine eterozigoti per geni dell'X sono quindi mosaici funzionali."},
{id:"B227",s:"bio",u:2,q:"La trasposasi è l'enzima che:",o:["taglia e inserisce i trasposoni a DNA in nuove posizioni","retrotrascrive i retrotrasposoni LINE in nuove posizioni","aggiunge ripetizioni TTAGGG alle estremità dei cromosomi","ripara le rotture a doppio filamento senza stampo (NHEJ)","rimuove gli introni autocatalitici dai pre-mRNA"],e:"I trasposoni a DNA si spostano con un meccanismo 'taglia e incolla'; i retrotrasposoni (LINE, SINE) passano invece da un intermedio a RNA e da una trascrittasi inversa."},
{id:"B228",s:"bio",u:2,q:"I retrovirus endogeni sono:",o:["retrovirus integrati nella linea germinale di antenati, ora ereditari","retrovirus integrati nelle sole cellule somatiche e quindi non ereditabili","retrotrasposoni SINE privi di geni virali, come le Alu","virus a DNA mantenuti come episomi nel nucleo","plasmidi batterici trasferiti all'uomo per coniugazione"],e:"Costituiscono circa l'8% del genoma umano e, come LINE e SINE, appartengono agli elementi mobili (o un tempo mobili) del DNA."},
{id:"B229",s:"bio",u:2,q:"La maggior parte del genoma umano è costituita da:",o:["sequenze non codificanti, incluse ripetizioni e introni","esoni codificanti proteine e relative regioni regolatrici","geni per gli rRNA e i tRNA ripetuti in tandem","DNA mitocondriale presente in migliaia di copie","geni codificanti proteine, quasi tutti in singola copia"],e:"Gli esoni codificanti rappresentano circa l'1,5-2% del genoma; quasi metà del genoma deriva da elementi trasponibili."},
{id:"B230",s:"bio",u:2,q:"Le proteine non istoniche dello scaffold cromosomico:",o:["formano un'impalcatura a cui si ancorano le anse di cromatina","formano il core proteico attorno a cui si avvolge il DNA","formano la fibra di 11 nm legando il DNA linker","formano le subunità del complesso del poro nucleare","sono gli enzimi che replicano il DNA delle anse"],e:"Lo scaffold, ricco di topoisomerasi II e condensine, è visibile nei cromosomi metafasici privati degli istoni."},
{id:"B231",s:"bio",u:2,q:"Nel cariotipo umano, i cromosomi si classificano in base a:",o:["dimensioni, posizione del centromero e bandeggio","dimensioni, numero di geni attivi e bandeggio","posizione dei telomeri e quantità di istone H1","dimensioni, posizione dei telomeri e contenuto in GC","numero di origini di replicazione e dimensioni"],e:"In base alla posizione del centromero si distinguono cromosomi metacentrici, submetacentrici e acrocentrici; il bandeggio G permette di identificarli univocamente."},
{id:"B232",s:"bio",u:2,q:"I cromosomi acrocentrici umani (13, 14, 15, 21, 22) portano sui bracci corti:",o:["i geni per gli rRNA, nelle regioni organizzatrici del nucleolo","i geni per gli istoni, organizzati in cluster ripetuti in tandem","i geni per l'rRNA 5S, trascritti dalla RNA polimerasi III","i geni per i tRNA, nelle regioni centromeriche","i geni delle globine, organizzati in famiglie"],e:"Le NOR (regioni organizzatrici del nucleolo) contengono molte copie in tandem dei geni per l'rRNA 45S."},

{id:"B233",s:"bio",u:3,q:"Un filamento di DNA ha sequenza 5'-ATGCCA-3'. Il filamento complementare, scritto in direzione 5'→3', è:",o:["5'-TGGCAT-3'","5'-TACGGT-3'","5'-ATGCCA-3'","5'-UACGGU-3'","5'-ACCGTA-3'"],e:"Il complementare letto 3'→5' è TACGGT; scritto 5'→3' (cioè rovesciato) diventa TGGCAT."},
{id:"B234",s:"bio",u:3,q:"Il filamento stampo di un gene ha sequenza 3'-TACGGA-5'. L'mRNA trascritto è:",o:["5'-AUGCCU-3'","5'-UACGGA-3'","3'-AUGCCU-5'","5'-ATGCCT-3'","5'-AGGCAU-3'"],e:"L'RNA è complementare e antiparallelo allo stampo, con U al posto di T: AUG CCU (Met-Pro)."},
{id:"B235",s:"bio",u:3,q:"Una molecola di DNA marcata con ¹⁵N su entrambi i filamenti replica per tre generazioni in un terreno con solo ¹⁴N. Delle 8 molecole ottenute, quante sono ibride ¹⁵N/¹⁴N?",o:["2","4","8","1","0"],e:"I due filamenti 'pesanti' originali si conservano sempre, ciascuno in una molecola diversa: 2 ibride e 6 completamente leggere (replicazione semiconservativa)."},
{id:"B238",s:"bio",u:3,q:"Le DNA elicasi:",o:["separano i filamenti rompendo i legami a idrogeno, con ATP","rompono legami fosfodiesterici per rilasciare il superavvolgimento","separano i filamenti rompendo i legami fosfodiesterici, con ATP","stabilizzano il DNA a singolo filamento senza consumare ATP","sintetizzano il primer di RNA su cui lavora la polimerasi"],e:"Il superavvolgimento generato davanti alla forcella è rilasciato dalle topoisomerasi; le proteine SSB stabilizzano i filamenti singoli."},
{id:"B239",s:"bio",u:3,q:"Negli eucarioti la replicazione di un cromosoma:",o:["parte da molte origini di replicazione, con forcelle bidirezionali","parte da una sola origine, con forcelle bidirezionali","parte da molte origini, con forcelle unidirezionali","avviene in fase G2 a partire da molte origini","parte da molte origini, attivate più volte nella stessa fase S"],e:"I cromosomi eucariotici sono molto lunghi: con migliaia di origini la fase S dura solo alcune ore. Il cromosoma batterico ha di solito un'unica origine (oriC)."},
{id:"B240",s:"bio",u:3,q:"Quale delle seguenti affermazioni sui telomeri e sulla senescenza replicativa è corretta?",o:["Senza telomerasi i telomeri si accorciano a ogni divisione fino all'arresto","Senza telomerasi i telomeri si allungano a ogni divisione fino all'arresto","La telomerasi è molto attiva in tutte le cellule somatiche adulte","La senescenza replicativa è causata da un eccesso di telomerasi","I telomeri si accorciano solo nelle cellule germinali e staminali"],e:"Il problema della replicazione delle estremità accorcia i telomeri; quando sono troppo corti si attiva una risposta al danno che arresta la proliferazione (limite di Hayflick)."},
{id:"B241",s:"bio",u:3,q:"Quale delle seguenti affermazioni sullo splicing NON è corretta?",o:["Avviene nel citoplasma, dopo l'esportazione dell'mRNA","Rimuove gli introni dal pre-mRNA e unisce gli esoni","È catalizzato dallo spliceosoma, formato da snRNP","Può produrre isoforme proteiche diverse dallo stesso gene","Riconosce sequenze conservate ai confini esone-introne (GU...AG)"],e:"Lo splicing degli mRNA eucariotici avviene nel nucleo, in gran parte durante la trascrizione stessa."},
{id:"B242",s:"bio",u:3,q:"Le sequenze silencer:",o:["legano repressori e riducono la trascrizione, anche a distanza","legano attivatori e aumentano la trascrizione, anche a distanza","legano repressori ma agiscono solo se adiacenti alla TATA box","sono trascritte in miRNA che silenziano l'mRNA bersaglio","sono sequenze dell'mRNA che ne bloccano la traduzione al 3'"],e:"Come gli enhancer, i silencer sono elementi regolativi in cis che agiscono indipendentemente dalla distanza e dall'orientamento."},
{id:"B243",s:"bio",u:3,q:"La deadenilazione dell'mRNA nel citoplasma:",o:["accorcia la coda di poli(A) e avvia di solito la degradazione","allunga la coda di poli(A) e stabilizza l'mRNA nel citoplasma","rimuove il cap al 5' e avvia la degradazione 3'→5'","accorcia la coda di poli(A) e aumenta sempre la traduzione","rimuove le adenine metilate presenti all'interno dell'mRNA"],e:"Dopo la deadenilazione segue di solito il decapping e la degradazione 5'→3' da parte dell'esonucleasi XRN1."},
{id:"B244",s:"bio",u:3,q:"Nella maturazione dei tRNA eucariotici avvengono:",o:["taglio delle estremità, aggiunta di CCA al 3' e modifica di basi","aggiunta del cap al 5', poliadenilazione e modifica di basi","taglio delle estremità, aggiunta di CCA al 5' e splicing","aggiunta di CCA al 3' e traduzione dell'anticodone","aggiunta della coda di poli(A) e rimozione delle basi modificate"],e:"I tRNA contengono molte basi modificate (es. pseudouridina, inosina) e terminano con CCA, a cui si lega l'amminoacido."},
{id:"B245",s:"bio",u:3,q:"L'inosina nella prima posizione dell'anticodone di un tRNA permette:",o:["di appaiarsi con più codoni diversi (vacillamento o wobble)","di riconoscere i codoni di stop al posto dei fattori di rilascio","di appaiarsi solo con la guanina nella terza posizione","di caricare due amminoacidi diversi sullo stesso tRNA","di leggere il codone AUG durante l'inizio della traduzione"],e:"L'inosina si appaia con U, C o A nella terza posizione del codone: per questo bastano meno di 61 tRNA diversi."},
{id:"B246",s:"bio",u:3,q:"Durante l'allungamento della traduzione, il fattore EF-Tu (eEF1A negli eucarioti):",o:["porta l'amminoacil-tRNA al sito A del ribosoma, legato a GTP","porta l'amminoacil-tRNA al sito P del ribosoma, legato a GTP","promuove la traslocazione del ribosoma di un codone, con GTP","porta l'amminoacil-tRNA al sito A, legato ad ATP","catalizza la formazione del legame peptidico nel sito A"],e:"La traslocazione del ribosoma di un codone è invece promossa da EF-G (eEF2), anch'esso con consumo di GTP."},
{id:"B247",s:"bio",u:3,q:"Quando un codone di stop entra nel sito A del ribosoma:",o:["si lega un fattore di rilascio e la catena viene staccata dall'ultimo tRNA","si lega un fattore di rilascio e la catena passa su un nuovo tRNA","entra un tRNA soppressore che porta la metionina","il ribosoma salta il codone e prosegue sul successivo","si forma un legame peptidico con l'acqua senza bisogno di alcun fattore proteico"],e:"Il fattore di rilascio mima la forma di un tRNA; la peptidil-transferasi trasferisce la catena all'acqua, liberando la proteina."},
{id:"B248",s:"bio",u:3,q:"I poliribosomi (polisomi) sono:",o:["più ribosomi che traducono contemporaneamente lo stesso mRNA","più ribosomi che traducono contemporaneamente mRNA diversi","ribosomi legati alla membrana mitocondriale esterna","aggregati di subunità ribosomiali non ancora assemblate","ribosomi presenti solo nei batteri e nei mitocondri"],e:"Aumentano la quantità di proteina prodotta da ogni mRNA. Nei batteri la traduzione inizia mentre l'mRNA è ancora in trascrizione."},
{id:"B249",s:"bio",u:3,q:"Il dogma centrale della biologia molecolare, nella sua forma estesa, prevede che l'informazione passi da RNA a DNA tramite:",o:["la trascrittasi inversa","la RNA polimerasi II","la primasi","la DNA ligasi","la peptidil-transferasi"],e:"Retrovirus, retrotrasposoni e telomerasi usano questo passaggio; il trasferimento da proteina ad acido nucleico non è invece possibile."},
{id:"B250",s:"bio",u:3,q:"Nell'operone lac, la trascrizione è massima quando:",o:["il lattosio è presente e il glucosio è assente","il glucosio è presente e il lattosio è assente","entrambi sono presenti in grandi quantità","il lattosio è assente e il cAMP è elevato","il lattosio è presente e il cAMP è basso"],e:"Il lattosio (come allolattosio) rimuove il repressore; l'assenza di glucosio fa salire il cAMP, che lega CAP e attiva il promotore."},
{id:"B251",s:"bio",u:3,q:"Un'unità trascrizionale procariotica che codifica tre enzimi di una stessa via metabolica produce:",o:["un unico mRNA policistronico","tre mRNA monocistronici con cap","un unico mRNA per una proteina di fusione","tre pre-mRNA con introni da rimuovere","un mRNA per ogni enzima, da tre promotori distinti"],e:"Ogni cistrone ha il suo sito di inizio della traduzione (Shine-Dalgarno + AUG) sullo stesso mRNA."},
{id:"B252",s:"bio",u:3,q:"Il controllo dell'espressione genica negli eucarioti può avvenire a livello:",o:["trascrizionale, post-trascrizionale, traduzionale e post-traduzionale","trascrizionale e traduzionale, ma non post-trascrizionale né post-traduzionale","trascrizionale soltanto, perché l'mRNA non è regolabile","post-traduzionale soltanto, tramite la degradazione proteica","trascrizionale, post-trascrizionale e di replicazione del DNA"],e:"Esempi: fattori di trascrizione, splicing alternativo, miRNA, regolazione dell'inizio della traduzione, fosforilazione e degradazione delle proteine."},
{id:"B253",s:"bio",u:3,q:"I fattori generali di trascrizione (TFIID, TFIIB, TFIIH...) negli eucarioti:",o:["servono alla Pol II per iniziare la trascrizione a tutti i promotori","sono specifici di un singolo gene e legano i suoi enhancer distali a monte","servono alla Pol I per trascrivere i geni degli rRNA","servono alla Pol II solo per terminare la trascrizione","sono componenti dello spliceosoma che legano il pre-mRNA"],e:"TFIIH ha attività elicasica (apre il DNA) e chinasica (fosforila la coda CTD della Pol II, permettendo l'avvio dell'allungamento)."},
{id:"B254",s:"bio",u:3,q:"Una proteina mal ripiegata che si accumula formando aggregati amiloidi è tipica di:",o:["malattie neurodegenerative come l'Alzheimer","malattie da accumulo lisosomiale come la Tay-Sachs","emofilia A, per carenza del fattore VIII","fibrosi cistica, per accumulo di CFTR nel RE","distrofia di Duchenne, per assenza di distrofina"],e:"Nell'Alzheimer si accumulano placche di β-amiloide e grovigli di proteina tau; nelle malattie da prioni gli aggregati sono di PrP."},

{id:"B255",s:"bio",u:4,q:"Una mutazione che sostituisce un amminoacido con un altro di proprietà chimiche simili (es. leucina con isoleucina) è detta:",o:["missenso conservativa","non senso","frameshift","silente","missenso non conservativa"],e:"Le missenso conservative hanno spesso effetti lievi; una missenso non conservativa (es. Glu→Val nell'anemia falciforme) può alterare gravemente la proteina."},
{id:"B256",s:"bio",u:4,q:"Una mutazione nella terza base di un codone che non cambia l'amminoacido codificato è detta:",o:["silente (sinonima)","non senso","missenso","frameshift","per perdita di funzione"],e:"È possibile grazie alla degenerazione del codice: ad esempio GGU, GGC, GGA e GGG codificano tutti la glicina."},
{id:"B257",s:"bio",u:4,q:"La riparazione per escissione di nucleotidi (NER) rimuove soprattutto:",o:["lesioni voluminose che distorcono l'elica, come i dimeri di timina","singole basi deaminate o alchilate, riconosciute da glicosilasi","appaiamenti errati sfuggiti al proofreading dopo la replicazione","rotture a doppio filamento causate dalle radiazioni ionizzanti","ripetizioni telomeriche accorciate a ogni divisione"],e:"Difetti della NER causano lo xeroderma pigmentoso, con estrema sensibilità ai raggi UV e tumori cutanei."},
{id:"B258",s:"bio",u:4,q:"La riparazione dei mismatch (MMR) corregge:",o:["gli errori di appaiamento sfuggiti al proofreading della polimerasi","i dimeri di timina e le altre lesioni voluminose da raggi UV","le rotture a doppio filamento tramite ricombinazione omologa","le basi alchilate tramite fotoriattivazione da parte della fotoliasi","le traslocazioni cromosomiche reciproche"],e:"Difetti dei geni MMR causano instabilità dei microsatelliti e la sindrome di Lynch (tumore del colon ereditario non poliposico)."},
{id:"B259",s:"bio",u:4,q:"Le mutazioni dei geni BRCA1 e BRCA2 aumentano il rischio di tumore della mammella e dell'ovaio perché questi geni intervengono:",o:["nella riparazione delle rotture a doppio filamento per ricombinazione","nella riparazione dei mismatch dopo la replicazione del DNA","nella riparazione per escissione di nucleotidi dei dimeri di timina","nel controllo del checkpoint del fuso durante la mitosi","nella sintesi degli ormoni steroidei mammari e ovarici"],e:"Sono oncosoppressori: la perdita di entrambe le copie in una cellula ne compromette la capacità di riparare correttamente il DNA."},
{id:"B260",s:"bio",u:4,q:"Un individuo che possiede due alleli mutati diversi dello stesso gene (uno da ciascun genitore) è detto:",o:["eterozigote composto","omozigote","emizigote","eterozigote semplice","aploide"],e:"È frequente nelle malattie recessive come la fibrosi cistica, dove esistono centinaia di varianti diverse di CFTR."},
{id:"B261",s:"bio",u:4,q:"Un maschio, per i geni del cromosoma X, è:",o:["emizigote","omozigote","eterozigote","eterozigote composto","diploide"],e:"Ha un solo cromosoma X, quindi una sola copia di quei geni: un allele recessivo sull'X si manifesta sempre."},
{id:"B262",s:"bio",u:4,q:"Dall'incrocio AaBb × aabb (geni indipendenti, dominanza completa) il rapporto fenotipico atteso è:",o:["1:1:1:1","9:3:3:1","3:1","1:2:1","tutti uguali"],e:"Il doppio eterozigote produce 4 tipi di gameti in uguale proporzione (AB, Ab, aB, ab); il genitore aabb produce solo ab. È un reincrocio (test cross)."},
{id:"B263",s:"bio",u:4,q:"Da un incrocio AaBb × AaBb (geni indipendenti), la probabilità di un figlio aabb è:",o:["1/16","1/4","1/8","9/16","3/16"],e:"P(aa) = 1/4 e P(bb) = 1/4; per geni indipendenti le probabilità si moltiplicano: 1/16."},
{id:"B264",s:"bio",u:4,q:"Il reincrocio (test cross) serve a:",o:["capire se un dominante è omozigote o eterozigote, incrociandolo con aa","capire se un recessivo è omozigote o eterozigote, incrociandolo con AA","ottenere linee pure incrociando tra loro due eterozigoti","stimare la penetranza incrociando due omozigoti dominanti","determinare il cariotipo incrociando individui di sesso diverso"],e:"Se compare prole a fenotipo recessivo, l'individuo testato è eterozigote."},
{id:"B265",s:"bio",u:4,q:"Nella dominanza incompleta (es. bocca di leone: rosso × bianco = rosa), dalla F1 × F1 si ottiene una F2 con rapporto fenotipico:",o:["1 rosso : 2 rosa : 1 bianco","3 rossi : 1 bianco","tutti rosa","1 rosso : 2 bianchi : 1 rosa","3 rosa : 1 bianco"],e:"Con la dominanza incompleta il rapporto fenotipico coincide con quello genotipico."},
{id:"B266",s:"bio",u:4,q:"Una coppia ha già un figlio affetto da una malattia autosomica recessiva. La probabilità che il secondo figlio sia affetto è:",o:["1/4","1/2","0","1","3/4"],e:"Entrambi i genitori sono eterozigoti; ogni gravidanza è un evento indipendente con probabilità 1/4."},
{id:"B267",s:"bio",u:4,q:"Una donna portatrice di emofilia A (recessiva legata all'X) ha figli con un uomo sano. La probabilità che un figlio maschio sia emofilico è:",o:["1/2","1/4","0","1","3/4"],e:"Il figlio maschio riceve una delle due X materne: con probabilità 1/2 quella mutata. (La probabilità che un figlio qualsiasi, senza sapere il sesso, sia un maschio malato è 1/4.)"},
{id:"B268",s:"bio",u:4,q:"In un albero genealogico, un carattere presente in ogni generazione, che colpisce sia maschi sia femmine e che può essere trasmesso da padre a figlio maschio, suggerisce un'eredità:",o:["autosomica dominante","recessiva legata all'X","dominante legata all'X","mitocondriale","legata all'Y"],e:"La trasmissione padre-figlio esclude l'X (il padre dà al figlio la Y); la presenza in ogni generazione e in entrambi i sessi indica un allele autosomico dominante."},
{id:"B269",s:"bio",u:4,q:"Un padre affetto da una malattia dominante legata all'X e una madre sana avranno:",o:["tutte le figlie affette e tutti i figli maschi sani","tutti i figli maschi affetti e tutte le figlie sane","il 50% dei figli affetti, indipendentemente dal sesso","tutti i figli, maschi e femmine, affetti","metà delle figlie affette e tutti i figli maschi sani"],e:"Il padre trasmette la sua unica X a tutte le figlie e la Y a tutti i figli maschi."},
{id:"B270",s:"bio",u:4,q:"Due geni distano 10 cM sulla mappa genetica. La frequenza di gameti ricombinanti attesa è circa:",o:["10%","50%","1%","90%","0%"],e:"1 cM corrisponde all'1% di ricombinazione. Per geni molto distanti la frequenza tende al 50%, come per geni indipendenti."},
{id:"B271",s:"bio",u:4,q:"Nell'epistasi recessiva classica (es. colore del mantello nei labrador), la F2 di un diibrido mostra il rapporto:",o:["9:3:4","9:3:3:1","15:1","3:1","1:2:1"],e:"L'omozigosi ee impedisce il deposito del pigmento qualunque sia il genotipo per l'altro gene: 9 neri : 3 marroni : 4 gialli."},
{id:"B272",s:"bio",u:4,q:"L'espressività variabile indica che:",o:["individui con lo stesso genotipo mostrano gravità diverse","non tutti i portatori del genotipo mostrano il fenotipo","il fenotipo dipende dal sesso del genitore che trasmette l'allele","l'allele è letale negli omozigoti","l'eterozigote ha un fenotipo intermedio"],e:"La neurofibromatosi di tipo 1 è un esempio classico: alcuni hanno solo macchie cutanee, altri molti neurofibromi."},
{id:"B273",s:"bio",u:4,q:"Un allele letale recessivo, in un incrocio Aa × Aa, modifica il rapporto fenotipico tra i nati vivi in:",o:["2:1","3:1","1:2:1","1:1","9:7"],e:"I genotipi aa muoiono: restano 1 AA e 2 Aa. Se Aa ha un fenotipo distinguibile (come nei topi gialli), il rapporto tra i nati è 2:1."},
{id:"B274",s:"bio",u:4,q:"La sindrome di Prader-Willi e quella di Angelman, dovute a una delezione della stessa regione del cromosoma 15, differiscono perché:",o:["dipendono dal genitore che trasmette la delezione (imprinting)","dipendono dal sesso del figlio che eredita la delezione","riguardano geni diversi su cromosomi diversi","una è dovuta a trisomia e l'altra a monosomia del 15","una deriva da delezione e l'altra da duplicazione del 15"],e:"Delezione sul cromosoma paterno → Prader-Willi; sul materno → Angelman. In quella regione alcuni geni sono espressi solo dall'allele paterno, altri solo da quello materno."},
{id:"B275",s:"bio",u:4,q:"Una delezione cromosomica è:",o:["la perdita di un segmento di cromosoma","lo scambio di segmenti tra cromosomi non omologhi","il ribaltamento di un segmento di 180°","la presenza di un cromosoma in più","la duplicazione dell'intero corredo"],e:"Esempio: la sindrome del cri du chat è dovuta alla delezione del braccio corto del cromosoma 5 (5p−)."},
{id:"B276",s:"bio",u:4,q:"Un'inversione pericentrica:",o:["è il ribaltamento di un segmento che comprende il centromero","è il ribaltamento di un segmento che non comprende il centromero","è la fusione centrica di due cromosomi acrocentrici","è lo spostamento del centromero su un altro cromosoma","è lo scambio di segmenti tra cromatidi fratelli"],e:"Se il segmento non comprende il centromero si parla di inversione paracentrica."},
{id:"B277",s:"bio",u:4,q:"Un individuo triploide ha:",o:["tre copie di ogni cromosoma (3n = 69 nell'uomo)","tre copie di un solo cromosoma (2n+1 = 47)","tre cromosomi sessuali (47,XXY o 47,XXX)","tre copie di ogni cromosoma solo nei gameti","un cromosoma in meno (2n−1 = 45)"],e:"La triploidia è una poliploidia, incompatibile con la vita nell'uomo; la trisomia (2n+1) è invece un'aneuploidia."},
{id:"B278",s:"bio",u:4,q:"Il bandeggio G dei cromosomi si ottiene con:",o:["trattamento con tripsina e colorazione con Giemsa","trattamento con tripsina e colorazione di Gram","trattamento con DNasi e colorazione con ematossilina","marcatura con ¹⁵N e autoradiografia","ibridazione con sonde fluorescenti (FISH)"],e:"Le bande scure corrispondono a regioni ricche in AT, povere di geni e a replicazione tardiva."},
{id:"B279",s:"bio",u:4,q:"Le malattie mitocondriali mostrano spesso gravità variabile anche tra fratelli perché:",o:["ogni cellula ha proporzioni diverse di mtDNA normale e mutato","ogni figlio riceve una quota diversa di mitocondri dal padre","il mtDNA va incontro a un crossing over diverso in ogni figlio","tutte le cellule contengono solo mtDNA mutato (omoplasmia)","i geni mitocondriali hanno penetranza dipendente dal sesso"],e:"La proporzione di mtDNA mutato varia tra ovociti e tessuti; il fenotipo compare oltre una soglia."}
);

// BIOLOGIA — espansione 2 (unità 5-7) + completamento — domande originali
BANK.push(
{id:"B302",s:"bio",u:5,q:"La membrana plasmatica ha uno spessore di circa:",o:["7-10 nm","0,7-1 μm","70-100 nm","1 mm","0,1 nm"],e:"Il doppio strato fosfolipidico con le proteine associate misura pochi nanometri."},
{id:"B303",s:"bio",u:5,q:"Il colesterolo nelle membrane delle cellule animali:",o:["modula la fluidità: la riduce ad alta T e impedisce l'irrigidimento a bassa T","aumenta la fluidità a tutte le temperature legandosi alle teste polari","riduce la fluidità solo a bassa temperatura, irrigidendo la membrana","forma canali per l'acqua tra le code dei fosfolipidi","è presente solo nella membrana mitocondriale interna"],e:"Le molecole rigide di colesterolo si inseriscono tra le code dei fosfolipidi e fanno da 'tampone' della fluidità."},
{id:"B304",s:"bio",u:5,q:"Le scramblasi e le flippasi:",o:["spostano i fosfolipidi tra i due foglietti, regolando l'asimmetria","spostano i fosfolipidi lateralmente nello stesso foglietto","spostano le proteine di membrana tra i due foglietti","idrolizzano i fosfolipidi liberando acido arachidonico","trasportano fosfolipidi dal RE ai mitocondri tramite vescicole"],e:"Le flippasi, ATP-dipendenti, mantengono la fosfatidilserina sul foglietto interno; le scramblasi, attivate ad esempio nell'apoptosi, rimescolano i lipidi tra i foglietti."},
{id:"B305",s:"bio",u:5,q:"I canali ionici possono essere:",o:["controllati dal voltaggio, da ligandi o da stimoli meccanici","controllati dal voltaggio o da ligandi, ma mai da stimoli meccanici","attivati soltanto dall'idrolisi di ATP sul lato citosolico","sempre accoppiati a proteine G per potersi aprire","capaci di trasportare ioni contro il loro gradiente"],e:"I canali permettono un flusso passivo, secondo gradiente elettrochimico, molto più rapido di quello dei trasportatori."},
{id:"B306",s:"bio",u:5,q:"Le acquaporine:",o:["canali che permettono un rapido passaggio di acqua","pompe che spostano acqua contro gradiente consumando ATP","canali per l'acqua presenti soltanto nelle cellule vegetali","trasportatori che portano acqua insieme al glucosio","enzimi che idrolizzano l'acqua nei tubuli renali"],e:"Sono molto abbondanti nei tubuli renali; la loro inserzione in membrana nel dotto collettore è regolata dall'ADH (vasopressina)."},
{id:"B307",s:"bio",u:5,q:"I trasportatori GLUT del glucosio mediano:",o:["una diffusione facilitata, secondo gradiente","un trasporto attivo secondario con il Na⁺","un trasporto attivo primario dipendente da ATP","una diffusione facilitata, contro gradiente","un'endocitosi mediata da recettore"],e:"GLUT4, nel muscolo e nel tessuto adiposo, viene inserito in membrana in risposta all'insulina."},
{id:"B308",s:"bio",u:5,q:"Nel reticolo endoplasmatico liscio avvengono:",o:["sintesi di lipidi e steroidi, detossificazione e accumulo di Ca²⁺","sintesi delle proteine di secrezione e loro N-glicosilazione","sintesi di lipidi, glicolisi e accumulo di Ca²⁺","sintesi di steroidi, maturazione degli rRNA e detossificazione","degradazione degli acidi grassi a catena molto lunga"],e:"Nel muscolo il REL specializzato (reticolo sarcoplasmatico) rilascia il Ca²⁺ per la contrazione; negli epatociti è sviluppato per la detossificazione dei farmaci (citocromi P450)."},
{id:"B309",s:"bio",u:5,q:"L'apparato di Golgi ha una polarità: le proteine entrano dal lato cis e:",o:["escono dal lato trans, dove vengono smistate verso le varie destinazioni","escono dal lato cis, dopo aver percorso le cisterne in senso inverso","escono dal lato trans, dove vengono tradotte e ripiegate","escono dal lato trans e tornano tutte al RE con vescicole COPII","vengono degradate nel lato trans se mal ripiegate"],e:"Lungo le cisterne le proteine subiscono modifiche successive (es. rifinitura degli oligosaccaridi, O-glicosilazione)."},
{id:"B310",s:"bio",u:5,q:"Il pH interno dei lisosomi è circa:",o:["4,5-5","7,2","8,5","2","9"],e:"Una pompa protonica V-ATPasi acidifica il lume; le idrolasi acide lavorano a questo pH e sono quasi inattive nel citosol, il che protegge la cellula."},
{id:"B311",s:"bio",u:5,q:"Nella malattia a cellule I (mucolipidosi II) gli enzimi lisosomiali vengono secreti all'esterno invece che giungere ai lisosomi perché:",o:["manca l'enzima che aggiunge il mannosio-6-fosfato","manca la pompa protonica V-ATPasi dei lisosomi","il recettore KDEL non trattiene gli enzimi nel RE","SRP non riconosce la sequenza segnale degli enzimi","le idrolasi non vengono N-glicosilate nel RE"],e:"Senza la marcatura M6P gli enzimi seguono la via secretoria di default."},
{id:"B312",s:"bio",u:5,q:"Le proteine di rivestimento (coat) delle vescicole servono a:",o:["deformare la membrana in una gemma e selezionare il carico","fondere la vescicola con la membrana bersaglio tramite SNARE","staccare la vescicola strozzandone il collo con GTP","acidificare il lume della vescicola tramite pompe protoniche","trasportare la vescicola lungo i microtubuli"],e:"Clatrina, COPI e COPII si assemblano sulla membrana grazie a piccole GTPasi (Arf, Sar1) e ad adattatori che legano i recettori del carico."},
{id:"B313",s:"bio",u:5,q:"Le proteine Rab:",o:["piccole GTPasi che regolano l'attracco delle vescicole al bersaglio","piccole GTPasi che formano il rivestimento COPII delle vescicole","proteine SNARE che fondono le vescicole sinaptiche","ATPasi che separano i complessi SNARE dopo la fusione","chinasi che fosforilano i fosfoinositidi degli endosomi"],e:"Ogni compartimento ha la sua 'identità' Rab, insieme a fosfoinositidi specifici (es. PI(3)P negli endosomi precoci)."},
{id:"B314",s:"bio",u:5,q:"NSF e SNAP intervengono nel traffico vescicolare per:",o:["separare i complessi SNARE dopo la fusione, consumando ATP","assemblare i complessi SNARE prima della fusione, consumando GTP","formare il rivestimento COPII sulle membrane del RE","strozzare il collo delle vescicole rivestite di clatrina","riconoscere la membrana bersaglio come le proteine Rab"],e:"Dopo la fusione v-SNARE e t-SNARE restano avvolte in un complesso stabile; NSF, un'ATPasi, con i cofattori SNAP le separa."},
{id:"B315",s:"bio",u:5,q:"La dinamina:",o:["una GTPasi che stacca dalla membrana le vescicole di clatrina","una ATPasi che separa i complessi SNARE dopo la fusione","una proteina motrice che trasporta vescicole sui microtubuli","una GTPasi che recluta il rivestimento COPI sul Golgi","l'adattatore che lega la clatrina ai recettori del carico"],e:"Senza dinamina le fossette rivestite si formano ma non si separano dalla membrana plasmatica."},
{id:"B316",s:"bio",u:5,q:"Il recettore dell'EGF, dopo endocitosi con il suo ligando, viene in gran parte:",o:["inviato ai lisosomi e degradato (down-regulation)","riciclato subito in membrana, come il recettore delle LDL","trasportato nel nucleo, dove attiva la trascrizione","inviato al RE e da lì degradato tramite ERAD","secreto all'esterno in forma solubile"],e:"Il recettore ubiquitinato viene incluso nelle vescicole interne dei corpi multivescicolari e degradato nei lisosomi."},
{id:"B317",s:"bio",u:5,q:"Nella sindrome di Zellweger:",o:["i perossisomi non si formano e si accumulano acidi grassi molto lunghi","manca un'idrolasi lisosomiale e si accumulano gangliosidi","i mitocondri non importano proteine e la catena respiratoria si blocca","i perossisomi mancano della sola catalasi e accumulano H₂O₂","manca il recettore delle LDL e aumenta il colesterolo"],e:"È causata da mutazioni dei geni PEX, necessari all'importazione delle proteine nella matrice perossisomiale."},
{id:"B318",s:"bio",u:5,q:"Le proteine destinate allo spazio intermembrana o alla membrana interna dei mitocondri:",o:["usano traslocatori diversi (TOM, TIM22, TIM23, MIA/OXA) secondo la meta","usano SRP e il traslocone Sec61 come le proteine del RE","sono tutte codificate dal genoma mitocondriale e sintetizzate nella matrice","entrano per diffusione attraverso le porine","usano importine e il gradiente di Ran-GTP"],e:"OXA inserisce nella membrana interna, dal lato della matrice, sia proteine codificate dal mtDNA sia alcune importate."},
{id:"B319",s:"bio",u:5,q:"Il genoma mitocondriale umano:",o:["DNA circolare di ~16,5 kb: 13 proteine, 2 rRNA e 22 tRNA","DNA circolare di ~16,5 kb che codifica tutte le proteine mitocondriali","DNA lineare di ~16,5 kb associato a istoni, con molti introni","DNA circolare di ~165 kb: 130 proteine, 2 rRNA e 22 tRNA","DNA circolare di ~16,5 kb ereditato da entrambi i genitori"],e:"La grande maggioranza delle proteine mitocondriali (oltre 1000) è codificata dal nucleo e importata."},
{id:"B320",s:"bio",u:5,q:"La fusione e la fissione mitocondriale sono regolate rispettivamente da:",o:["mitofusine/OPA1 e Drp1","dineina e chinesina","Rab e SNARE","clatrina e dinamina","Ran-GEF e Ran-GAP"],e:"Il bilancio tra fusione e fissione mantiene la rete mitocondriale e permette di isolare le porzioni danneggiate da eliminare con la mitofagia."},
{id:"B321",s:"bio",u:5,q:"Dall'ossidazione completa di una molecola di glucosio una cellula ottiene circa:",o:["30-32 molecole di ATP","2 molecole di ATP","100 molecole di ATP","8 molecole di ATP","4 molecole di ATP"],e:"2 ATP dalla glicolisi, 2 (GTP/ATP) dal ciclo di Krebs e il resto dalla fosforilazione ossidativa, che usa NADH e FADH₂. La stima moderna è circa 30-32."},
{id:"B322",s:"bio",u:5,q:"In assenza di ossigeno, nel muscolo il piruvato viene ridotto a lattato per:",o:["rigenerare il NAD⁺ necessario a far proseguire la glicolisi","produrre altro ATP oltre a quello ottenuto con la glicolisi","rigenerare il NADH necessario alla gluconeogenesi epatica","produrre acetil-CoA da inviare al ciclo di Krebs","eliminare il piruvato sotto forma di CO₂"],e:"Questa fermentazione lattica produce solo i 2 ATP della glicolisi; il lattato può essere riconvertito in glucosio dal fegato (ciclo di Cori)."},
{id:"B323",s:"bio",u:5,q:"L'ATP sintasi mitocondriale produce ATP sfruttando:",o:["il flusso di protoni dallo spazio intermembrana alla matrice","il flusso di protoni dalla matrice allo spazio intermembrana","il trasferimento diretto di elettroni dal NADH all'ADP","il flusso di Na⁺ secondo gradiente attraverso F₀","l'idrolisi del GTP prodotto dal ciclo di Krebs"],e:"È la teoria chemiosmotica di Mitchell: la forza protonmotrice fa ruotare la parte F₀ dell'enzima, e la rotazione guida la sintesi di ATP in F₁."},
{id:"B324",s:"bio",u:5,q:"Il centrosoma delle cellule animali:",o:["è il principale centro organizzatore dei microtubuli, con due centrioli","è il principale centro organizzatore dell'actina, con due centrioli","è una struttura nucleare che organizza le fibre del fuso","è un centro organizzatore dei microtubuli che non si duplica mai","è una struttura a 9+2 microtubuli alla base delle ciglia"],e:"Il centrosoma si duplica una volta per ciclo (a partire dalla fase S); i due centrosomi diventano i poli del fuso."},
{id:"B325",s:"bio",u:5,q:"La colchicina e i farmaci simili bloccano la mitosi perché:",o:["impediscono la polimerizzazione dei microtubuli del fuso","stabilizzano i microtubuli impedendone la depolimerizzazione","stabilizzano i filamenti di actina dell'anello contrattile","inibiscono la DNA polimerasi durante la fase S","degradano la ciclina B impedendo l'ingresso in mitosi"],e:"Il taxolo, al contrario, stabilizza i microtubuli; entrambi interferiscono con la dinamica del fuso e sono usati in chemioterapia o in citogenetica."},
{id:"B326",s:"bio",u:5,q:"La sindrome di Kartagener (discinesia ciliare primaria) è dovuta a difetti:",o:["della dineina assonemale di ciglia e flagelli","della chinesina che muove gli organelli nelle ciglia","della distrofina che collega actina e matrice","della tubulina dei microtubuli del fuso mitotico","dei filamenti di actina dei microvilli"],e:"Le ciglia non battono: infezioni respiratorie croniche, infertilità maschile (spermatozoi immobili) e spesso inversione dei visceri (situs inversus)."},
{id:"B327",s:"bio",u:5,q:"Nel sarcomero, durante la contrazione muscolare:",o:["la banda I e la zona H si accorciano, la banda A resta costante","la banda A e la zona H si accorciano, la banda I resta costante","i filamenti di actina e di miosina si accorciano","la banda I si allunga e le linee Z si allontanano","tutte le bande si accorciano in proporzione"],e:"È il modello dei filamenti scorrevoli: le teste di miosina si legano all'actina e la tirano verso il centro del sarcomero consumando ATP."},
{id:"B328",s:"bio",u:5,q:"Il rigor mortis è dovuto a:",o:["mancanza di ATP, per cui la miosina resta legata all'actina","eccesso di ATP, che mantiene le teste di miosina attive","mancanza di Ca²⁺, per cui la tropomiosina copre i siti dell'actina","degradazione della miosina da parte delle proteasi","depolimerizzazione dei filamenti sottili di actina"],e:"L'ATP serve al distacco della miosina dall'actina; dopo la morte, esaurito l'ATP, i ponti trasversali restano bloccati."},
{id:"B329",s:"bio",u:5,q:"La polimerizzazione dell'actina:",o:["è più rapida all'estremità + con monomeri legati ad ATP","è più rapida all'estremità − con monomeri legati ad ATP","è più rapida all'estremità + con monomeri legati a GTP","è indipendente dai nucleotidi e uguale alle due estremità","è più rapida all'estremità + con monomeri legati ad ADP"],e:"I monomeri di actina-ATP si aggiungono all'estremità +; l'idrolisi dell'ATP nel filamento favorisce il distacco all'estremità − (treadmilling)."},
{id:"B330",s:"bio",u:5,q:"La migrazione cellulare di un neutrofilo verso un sito d'infezione (chemiotassi) richiede:",o:["actina che polimerizza sul fronte e actomiosina che contrae il retro","actina che polimerizza sul retro e microtubuli che spingono il fronte","il battito coordinato di un flagello con struttura 9+2","la depolimerizzazione dei filamenti intermedi sul fronte","la sola dineina che tira la cellula lungo i microtubuli"],e:"Rac e Cdc42 sono attive sul fronte (lamellipodi e filopodi), Rho sul retro (contrazione)."},
{id:"B331",s:"bio",u:5,q:"I filamenti intermedi, rispetto a microtubuli e microfilamenti:",o:["non sono polarizzati, non hanno motori e danno resistenza meccanica","sono polarizzati e su di essi si muovono chinesine e dineine","polimerizzano consumando GTP e sono i più dinamici","non sono polarizzati e su di essi si muove la miosina","sono formati da actina e conferiscono resistenza alla trazione"],e:"Mutazioni delle cheratine causano l'epidermolisi bollosa semplice: la pelle si lacera per traumi minimi."},
{id:"B332",s:"bio",u:5,q:"I complessi LINC (con proteine SUN e nesprine):",o:["collegano la lamina nucleare al citoscheletro attraverso l'involucro","collegano la lamina nucleare alla cromatina dei centromeri","formano l'anello citoplasmatico dei pori nucleari","collegano il RE rugoso ai ribosomi in traduzione","collegano il citoscheletro di cellule vicine come i desmosomi"],e:"Permettono di trasmettere forze meccaniche dal citoscheletro al nucleo e di posizionare il nucleo nella cellula."},
